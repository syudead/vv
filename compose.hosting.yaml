# ソースのない Docker ホスト（NAS など）向け。公開イメージを pull して起動し、ビルドはしない
# （docs/how-to/hosting-vv.md）。開発時の task up は compose.yaml を使う。
# NAS のコンテナ管理画面にそのまま貼れるよう、値は直接書く。「変える」の行を環境に合わせる。

services:
  mdm:
    image: ghcr.io/syudead/vv:latest
    ports:
      # 変える: 左がブラウザで開くポート。NAS の管理画面が 8080 を使うなら 18080 などにする。
      - "8080:8080"
    environment:
      MDM_ADDR: ":8080"
      MDM_DATA_DIR: "/data"
      MDM_LOG_LEVEL: "info"
    volumes:
      # 変える: 左が動画のあるフォルダ。設定画面では /media 以下を選ぶ。
      - "/share/Multimedia:/media:ro"
      # 変える: 左がデータベースとサムネイルを置くフォルダ。バックアップするのはここ。
      - "/share/Container/vv/data:/data"
    stop_grace_period: 15s
    restart: unless-stopped
