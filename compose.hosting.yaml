# Run the published image on hosts without source; see docs/how-to/hosting-vv.md. Edit the marked host values before pasting into a NAS container manager.

services:
  mdm:
    image: ghcr.io/syudead/vv:latest
    ports:
      # Change the host port on the left, e.g. 18080 if the NAS already uses 8080.
      - "8080:8080"
    environment:
      MDM_ADDR: ":8080"
      MDM_DATA_DIR: "/data"
      MDM_LOG_LEVEL: "info"
    volumes:
      # Change the host media folder on the left; select a path under /media in settings.
      - "/share/Multimedia:/media:ro"
      # Change the host data folder on the left; back up this database and thumbnail directory.
      - "/share/Container/vv/data:/data"
    stop_grace_period: 15s
    restart: unless-stopped
