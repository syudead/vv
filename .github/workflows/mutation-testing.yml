# Mutation scores are informational; preserve raw reports for inspection.
# Web testing awaits stryker-mutator/stryker-js#6210.
name: Mutation testing

on:
  schedule:
    # First day of each month at 09:00 JST.
    - cron: "0 0 1 * *"
  workflow_dispatch: {}
  # Validate workflow changes without running mutation tests on ordinary code changes.
  pull_request:
    paths:
      - .github/workflows/mutation-testing.yml

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (gremlins)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "task"

      - name: 変異テストを流す
        run: task mutation-go

      - name: レポートを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-go
          path: reports/mutation/go/gremlins.json
          retention-days: 90
