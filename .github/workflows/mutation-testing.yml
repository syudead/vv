# 変異テスト（mutation testing）を月に 1 回流し、テストが壊れたコードを見つけられるかを測る。
# いまは Go だけで、gremlins が internal/domain を変異させる（task mutation-go）。
# gremlins の出力（変異ごとの場所と結果）を集計せずに artifact に残す。参考の出力なので、
# 結果が悪くても失敗にしない。手元では task mutation-go で同じものを流す。
# Web（StrykerJS）は、vitest-runner が Vitest 5 で検査を 1 件も流さない不具合
# （stryker-mutator/stryker-js#6210）の修正版が出てから足す。
name: Mutation testing

on:
  schedule:
    # 毎月 1 日 09:00（日本時間）。
    - cron: "0 0 1 * *"
  workflow_dispatch: {}
  # 測る仕組みそのもの（このワークフロー）を変えた PR では流して確かめる。
  # コードやテストの変更では流さない。
  pull_request:
    paths:
      - .github/workflows/mutation-testing.yml

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # リポジトリのコード（テスト）を実行するので、読み取りだけにする。
  go:
    name: Go (gremlins)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: 変異テストを流す
        run: task mutation-go

      - name: レポートを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-go
          path: reports/mutation/go/gremlins.json
          retention-days: 90
