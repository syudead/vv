# 循環複雑度（全関数）と重複コードを main への push ごとに測り、各ツールの出力を
# artifact に残す（task quality-metrics）。集計も比較もしない。
# カバレッジとテストごとの所要時間は Codecov が追う（ci.yml）。
# 運用は docs/design-docs/test-quality-monitoring.md。
name: Quality metrics

on:
  # 文書だけの push はコードの指標を変えないので測らない（ci.yml の変更判定と同じ区分）。
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
  workflow_dispatch: {}
  # 測る仕組みそのものか、それが使う道具（task、gocyclo、jscpd、eslint とその設定）を
  # 変えた PR では流して確かめる。依存の更新で計測が壊れるのを PR で止める。
  pull_request:
    paths:
      - .github/workflows/quality-metrics.yml
      - Taskfile.yml
      - mise.toml
      - tools/go.mod
      - tools/package.json
      - tools/package-lock.json
      - web/package.json
      - web/package-lock.json
      - web/eslint.config.js

permissions:
  contents: read

jobs:
  # 計測は npm の依存のスクリプトと、PR が変えたコードを実行するので、読み取りだけにする。
  measure:
    name: Measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        run: npm --prefix web ci

      - name: Node開発ツールを取得する
        working-directory: tools
        run: npm ci

      - name: 測る
        run: task quality-metrics

      - name: 計測の結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-metrics
          path: reports/quality/
          retention-days: 90
