# Temporary: translates a few real documents on this pull request with the
# production pipeline (docs-site/translate, model.json), so the Japanese can be
# read before the translation workflow reaches main. Removed before merge.
name: Docs translation preview

on:
  pull_request:
    paths:
      - "docs-site/translate/**"
      - ".github/workflows/docs-translate-preview.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview:
    name: Preview ${{ matrix.doc }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        doc:
          - docs/design-docs/writing-quality.md
          - docs/design-docs/japanese-translation.md
          - docs/design-docs/sidecar-subtitles.md
          - docs/how-to/docs-site.md
          - specs/031-tentative-tags/research.md
          - specs/033-video-dates/data-model.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm --prefix docs-site ci

      - id: model
        name: Read the model pin
        run: |
          node -e '
            const m = require("./docs-site/translate/model.json")
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" })
            for (const k of ["repo", "revision", "file", "sha256", "llamaCpp"]) out.write(`${k}=${m[k]}\n`)
          '

      - name: Cache llama.cpp and the model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            llama
            model.gguf
          key: translate-${{ steps.model.outputs.llamaCpp }}-${{ steps.model.outputs.file }}-${{ steps.model.outputs.sha256 }}

      - name: Install llama.cpp and the model
        env:
          TAG: ${{ steps.model.outputs.llamaCpp }}
          REPO: ${{ steps.model.outputs.repo }}
          REVISION: ${{ steps.model.outputs.revision }}
          FILE: ${{ steps.model.outputs.file }}
          SHA256: ${{ steps.model.outputs.sha256 }}
        run: |
          if [ ! -x llama/llama-server ]; then
            curl -sSfL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$TAG/llama-$TAG-bin-ubuntu-x64.tar.gz"
            mkdir -p llama-extract llama
            tar -xzf llama.tar.gz -C llama-extract
            cp -r "$(dirname "$(find llama-extract -name llama-server -type f | head -1)")"/. llama/
          fi
          if [ ! -f model.gguf ]; then
            curl -sSfL -o model.gguf "https://huggingface.co/$REPO/resolve/$REVISION/$FILE"
          fi
          echo "$SHA256  model.gguf" | sha256sum -c -

      - name: Start llama-server
        run: |
          LD_LIBRARY_PATH=$PWD/llama nohup ./llama/llama-server -m model.gguf -c 4096 -np 1 \
            -t "$(nproc)" --port 8080 --jinja > server.log 2>&1 &
          for i in $(seq 1 300); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Translate
        run: |
          start=$(date +%s)
          node docs-site/translate/translate.mjs --out out --only "${{ matrix.doc }}" --summary "$GITHUB_STEP_SUMMARY"
          echo "Elapsed: $(( $(date +%s) - start )) s"

      - name: Show the translation
        if: always()
        env:
          DOC: ${{ matrix.doc }}
        run: |
          echo "===== BEGIN $DOC ====="
          cat "out/$DOC" || true
          echo "===== END $DOC ====="

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preview-${{ strategy.job-index }}
          path: out/
          include-hidden-files: true
          if-no-files-found: ignore
