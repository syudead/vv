# 和訳に使う翻訳特化モデルの候補を、本番と同じ GitHub-hosted runner で試す。
# 一時的な検証用で、モデルを決めたら消す。
name: Translate trial

on:
  pull_request:
    paths:
      - ".github/translate-trial/**"
      - ".github/workflows/translate-trial.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trial:
    name: Trial ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: TranslateGemma-4B, family: gemma, query: translategemma-4b, author: google, quants: "Q8_0,Q4_K_M" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: llama.cpp を用意する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # リリースを新しい順に見て、Linux x64 の CPU 版の配布物を選ぶ。
          # GPU 向け（vulkan、cuda など）と arm は除く。
          url=$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=30' --jq '.[].assets[].browser_download_url' \
            | grep -i 'ubuntu' | grep -iE 'x64|x86_64' \
            | grep -viE 'vulkan|cuda|rocm|hip|sycl|openvino|kompute|arm|aarch64|s390' | head -1 || true)
          echo "llama.cpp: ${url:-none, building from source}"
          mkdir -p llama
          if [ -n "$url" ]; then
            curl -sSfL -o llama.pkg "$url"
            mkdir -p llama-extract
            case "$url" in
              *.zip) unzip -q llama.pkg -d llama-extract ;;
              *) tar -xzf llama.pkg -C llama-extract ;;
            esac
            server=$(find llama-extract -name llama-server -type f | head -1)
            cp -r "$(dirname "$server")"/. llama/
          else
            git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
            cmake -S llama-src -B llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=ON
            cmake --build llama-build --target llama-server -j "$(nproc)"
            cp -r llama-build/bin/. llama/
          fi
          chmod +x llama/llama-server
          LD_LIBRARY_PATH=$PWD/llama ./llama/llama-server --version || true

      - name: 試す
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/llama
        run: python3 .github/translate-trial/trial.py "${{ matrix.name }}" "${{ matrix.family }}" "${{ matrix.query }}" "${{ matrix.author }}" "${{ matrix.quants }}"

      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trial-${{ matrix.name }}
          path: |
            report.md
            server.log
          if-no-files-found: ignore
