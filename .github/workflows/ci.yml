# 自動検証。最初に変更パスを判定し、コード変更には通常検査とビルド、
# 文書だけの変更には文書検査を実行する。各検査は同じ Task タスクで手元から再現できる。
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push が複数 commit を含む場合も before..after を正しく比較する。
          fetch-depth: 0

      - name: コード変更かを調べる
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "比較元がない push なのでコード変更として扱う"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BEFORE"
          fi

          # 一覧にないパスはコード扱いにする。--no-renames により、コードを
          # 文書ディレクトリへ移した場合も削除側を検出できる。
          # NUL 区切りで読み、日本語、空白、改行を含む名前も生のパスで判定する。
          # git diff が失敗した場合は step 自体を失敗させ、検査を誤って飛ばさない。
          changed_file=$(mktemp)
          trap 'rm -f "$changed_file"' EXIT
          git diff --no-renames --name-only -z "$base" HEAD > "$changed_file"

          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|specs/*) ;;
              *)
                printf 'コード変更: %s\n' "$path"
                code=true
                ;;
            esac
          done < "$changed_file"

          if [ "$code" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "文書だけの変更なのでコード検査を飛ばす"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # task check を 1 台で順に流すと 4 分かかるので、互いに依らない組に分けて並べて
  # 流す。各組は task check の部分タスクを呼ぶので、手元の task check と同じ検査に
  # なる。task check に検査を足したら、どれかの組にも足す。
  # vitest は最も長いので、ファイルを 3 組に分けて流す（--shard）。分けるのは
  # ファイル単位なので、1 つのファイルが長くなりすぎたら話題ごとに分ける
  # （src/tags/TagsPage*.test.tsx）。SPA のビルド検査は web lint の組で 1 回だけ流す。
  #
  # Go のビルドキャッシュは Go を使う組（go: に名前）だけが復元し、main への push で
  # その組自身が保存する。setup-go の cache: true では全組が同じキーを奪い合い、
  # 最初に終わる Go を使わない組が空のキャッシュを保存して、go.sum が変わるたびに
  # 以後の全実行が golangci-lint のビルドからやり直しになっていた。
  check-group:
    name: Checks (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # generate-check は shadcn（web）と openapi-typescript（tools）を使う。
          - group: go lint
            tasks: fmt-check-go lint-go generate-check migrations-check build-windows-check
            web: true
            tools: true
            golangci: true
            go: lint
          - group: go test
            tasks: test-go
            go: test
          - group: web lint
            tasks: fmt-check-web lint-web build-check-web
            web: true
          - group: web test 1
            tasks: test-web-unit -- --shard=1/3
            web: true
          - group: web test 2
            tasks: test-web-unit -- --shard=2/3
            web: true
          - group: web test 3
            tasks: test-web-unit -- --shard=3/3
            web: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: matrix.go
        with:
          # 版は go.mod に合わせる。
          go-version-file: go.mod
          cache: false

      # 組ごとに作るものが違う（lint は golangci-lint 本体と go build、test は
      # テストの binary）ので、キャッシュも組ごとに分ける。キーには Go の版も
      # 入れる。go.sum が同じまま版だけ上がると、古い compiler の分に完全一致して
      # 保存が飛ばされ、以後ずっと冷えたままになるため。
      - name: Goのビルドキャッシュを復元する
        id: go-cache
        if: matrix.go
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.web || matrix.tools
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        if: matrix.web
        run: npm --prefix web ci

      - name: Node開発ツールを取得する
        if: matrix.tools
        working-directory: tools
        run: npm ci

      # golangci-lint の解析結果のキャッシュ。無いと lint-go が毎回 1 分以上かかる
      # （温まっていれば数秒）。中身は入力の hash で引くので古い内容を戻しても
      # 結果は変わらない。main への push でだけ保存し、PR は main の分を読む。
      - name: golangci-lintのキャッシュを復元する
        if: matrix.golangci
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-

      # migrations-check が base branch と比べるので取り寄せる。比較先の選択は
      # スクリプトが GITHUB_BASE_REF から行う（引数は渡さない）。
      - name: base branch を取得する
        if: matrix.golangci && github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE:refs/remotes/origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

      - name: 検査する
        env:
          TASKS: ${{ matrix.tasks }}
        run: task $TASKS

      - name: golangci-lintのキャッシュを保存する
        if: matrix.golangci && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}

      - name: Goのビルドキャッシュを保存する
        if: matrix.go && github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

  # ブランチ保護が求める「Checks」。コード変更では組に分けた検査のまとめを出し、
  # 文書だけの変更では文書検査をここで流す。
  check:
    name: Checks
    needs: [changes, check-group]
    # 必須チェックなので変更判定が失敗しても起動し、自身も失敗として返す。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 変更パスの判定結果と組ごとの結果を確かめる
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.changes.result }}
          GROUPS: ${{ needs.check-group.result }}
        run: |
          if [ "$RESULT" != "success" ] || { [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; }; then
            echo "変更パスを判定できませんでした"
            exit 1
          fi
          echo "checks: $GROUPS"
          if [ "$CODE" = "true" ]; then
            test "$GROUPS" = success
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: needs.changes.outputs.code == 'false'
        with:
          go-version-file: go.mod
          cache: false

      # 文書検査は Go のテストなので、go test の組が保存した分を読むだけにする。
      - name: Goのビルドキャッシュを復元する
        if: needs.changes.outputs.code == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: needs.changes.outputs.code == 'false'
        with:
          install_args: "task"

      - name: 文書を検査する
        if: needs.changes.outputs.code == 'false'
        run: task check-docs

  # e2e はコード変更を含む main への push（PR のマージ）でだけ回す。PR では回さない。
  # 1 台で全部を順に流すと 10 分かかるので、ファイルを 4 組に分けて並べて流す。
  # ファイルで絞っても、依存の準備（未設定のサーバーとログイン）は各組で先に走る。
  # e2e のファイルを足したら、どれかの組に入れる。
  e2e:
    name: Browser E2E (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: playback
            files: e2e/playback.e2e.ts
          - group: tags
            files: e2e/tags.e2e.ts
          - group: library
            files: e2e/card-scrub.e2e.ts e2e/folders.e2e.ts e2e/guest.e2e.ts e2e/hover-preview.e2e.ts
          - group: scan and search
            files: e2e/auth.e2e.ts e2e/scan-issues.e2e.ts e2e/scan-progress.e2e.ts e2e/search.e2e.ts e2e/settings.e2e.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      # サーバーの go build は go lint の組と同じ物を作るので、以前の実行で
      # その組が保存した分を読む（同じ実行の組は並行なので間に合わない）。
      # 保存はしない。
      - name: Goのビルドキャッシュを復元する
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # run-e2e.mjs は GOCACHE が決まっていればそこを使う。復元した場所を渡し、
      # ビルドをゼロからやり直さないようにする。
      - name: Goのビルドキャッシュの場所を渡す
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        run: npm --prefix web ci

      # ffmpeg は apt の索引の更新と取得に時間がかかるので、.deb を runner の
      # イメージ版ごとに取っておく。同じイメージなら入る版も依存も変わらない。
      - name: runnerのイメージ版を調べる
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: メディア処理コマンドのパッケージを復元する
        id: ffmpeg-debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: メディア処理コマンドを取得する
        env:
          CACHE_HIT: ${{ steps.ffmpeg-debs.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/ffmpeg-debs"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install --yes --download-only --no-install-recommends \
              -o Dir::Cache::archives="$debs" ffmpeg
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$USER" "$debs"
          fi
          # イメージに初めから入っていれば取るものが無い。
          if compgen -G "$debs/*.deb" > /dev/null; then sudo dpkg -i "$debs"/*.deb; fi
          ffmpeg -version | head -n 1

      # ubuntu-latest には Chrome とその依存ライブラリが入っているので、
      # --with-deps（apt の更新と導入）は付けず、ブラウザ本体だけを版ごとに取っておく。
      - name: Playwrightの版を調べる
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Chromiumを復元する
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromiumを取得する
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: 実ブラウザE2E
        env:
          E2E_FILES: ${{ matrix.files }}
        run: task test-e2e -- $E2E_FILES

      - name: 失敗時のPlaywright artefact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # ブランチ保護が求める「Browser E2E」は、組に分けた e2e のまとめとしてここで出す。
  # PR と文書だけの変更で e2e を飛ばしたときも通す。
  e2e-result:
    name: Browser E2E
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 組ごとの結果を確かめる
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e: $RESULT"
          test "$RESULT" = success || test "$RESULT" = skipped

  # イメージはコード変更を含む main への push（PR のマージ）でだけ作り、
  # ghcr.io/syudead/vv へ公開する（docs/how-to/hosting-vv.md）。
  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 の NAS 向け。実行環境の段の apk だけがエミュレーションで動く。
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # type=gha が持ち越すのは層だけで、RUN --mount=type=cache の中身（Go の
      # モジュールとビルドキャッシュ、npm のキャッシュ）は runner ごとに空になる。
      # そのため Go のコードが変わるたびに go build が依存の取得とコンパイルを
      # ゼロからやり直していた。中身を actions/cache に取っておき、ビルドの前に
      # キャッシュマウントへ戻し、後で取り出す。キーは依存と Dockerfile から作り、
      # 一致しない時だけ取り出して保存する。自分のコードの分は古くなるが、時間の
      # 大半を占める依存のコンパイルは使い回せる。go build は VERSION が commit
      # ごとに変わるので層が当たらず毎回走り、保存する中身は必ず埋まる。
      - name: キャッシュマウントの中身を復元する
        id: mount-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docker-mount-cache
          key: docker-mount-${{ runner.os }}-${{ hashFiles('Dockerfile', 'go.sum', 'web/package-lock.json') }}
          restore-keys: docker-mount-${{ runner.os }}-

      # 対応は Dockerfile のキャッシュマウントの target と揃える。context に
      # 入らないのは .dockerignore が許可リスト方式だからである。
      - name: キャッシュマウントへ戻す
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "docker-mount-cache/go-mod": "/go/pkg/mod",
              "docker-mount-cache/go-build": "/root/.cache/go-build",
              "docker-mount-cache/npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest は main の最新、sha-<commit> は版を固定したいときに使う。
      - name: タグを決める
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:sha-${SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
