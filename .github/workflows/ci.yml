# FR-012 の自動検証。task check を構成するタスクと、追加runtimeを要するtest-e2eを呼ぶ。
# どの検査も同じTaskタスクで手元から再現できる。ジョブはGoとWebで分けて並行させ、重いイメージビルドは別ジョブにする
# （research.md R-012 / SC-004: 10 分以内）。
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # 版は go.mod に合わせる（research.md R-002）。
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Taskを取得する
        run: |
          go install "github.com/go-task/task/v3/cmd/task@v$(jq -r .task scripts/tool-versions.json)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Web依存を取得する
        run: npm --prefix web ci

      # migrations-check が base branch と比べるので取り寄せる。比較先の選択は
      # スクリプトが GITHUB_BASE_REF から行う（引数は渡さない）。
      - name: base branch を取得する
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE:refs/remotes/origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

      - name: 追加runtimeの要らない検査
        run: task check

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Taskを取得する
        run: |
          go install "github.com/go-task/task/v3/cmd/task@v$(jq -r .task scripts/tool-versions.json)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Web依存を取得する
        run: npm --prefix web ci

      - name: メディア処理コマンドを取得する
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Chromiumを取得する
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: 実ブラウザE2E
        run: task test-e2e

      - name: 失敗時のPlaywright artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  windows:
    name: Local dev scripts (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows でしか確かめられない。Linux 側は task check が含んでいる。
      - name: PowerShell regression tests
        shell: pwsh
        run: ./scripts/local-dev.tests.ps1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # task up が使うイメージの確認。公開はしない。
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
