# 自動検証。最初に変更パスを判定し、コード変更には通常検査とビルド、
# 文書だけの変更には文書検査を実行する。各検査は同じ Task タスクで手元から再現できる。
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push が複数 commit を含む場合も before..after を正しく比較する。
          fetch-depth: 0

      - name: コード変更かを調べる
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "比較元がない push なのでコード変更として扱う"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BEFORE"
          fi

          # 一覧にないパスはコード扱いにする。--no-renames により、コードを
          # 文書ディレクトリへ移した場合も削除側を検出できる。
          # NUL 区切りで読み、日本語、空白、改行を含む名前も生のパスで判定する。
          # git diff が失敗した場合は step 自体を失敗させ、検査を誤って飛ばさない。
          changed_file=$(mktemp)
          trap 'rm -f "$changed_file"' EXIT
          git diff --no-renames --name-only -z "$base" HEAD > "$changed_file"

          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|specs/*) ;;
              *)
                printf 'コード変更: %s\n' "$path"
                code=true
                ;;
            esac
          done < "$changed_file"

          if [ "$code" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "文書だけの変更なのでコード検査を飛ばす"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Checks
    needs: changes
    # 必須チェックなので変更判定が失敗しても起動し、自身も失敗として返す。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 変更パスの判定結果を確認する
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != "success" ] || { [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; }; then
            echo "変更パスを判定できませんでした"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 版は go.mod に合わせる。
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        if: needs.changes.outputs.code == 'true'
        run: npm --prefix web ci

      - name: Node開発ツールを取得する
        if: needs.changes.outputs.code == 'true'
        working-directory: tools
        run: npm ci

      # migrations-check が base branch と比べるので取り寄せる。比較先の選択は
      # スクリプトが GITHUB_BASE_REF から行う（引数は渡さない）。
      - name: base branch を取得する
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE:refs/remotes/origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

      - name: 追加runtimeの要らない検査
        if: needs.changes.outputs.code == 'true'
        run: task check

      - name: 文書を検査する
        if: needs.changes.outputs.code == 'false'
        run: task check-docs

  # e2e はコード変更を含む main 向け PR と main への push でだけ回す。
  e2e:
    name: Browser E2E
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Checks ジョブと同じキーにして、以前の実行の task check が保存した
          # ビルドキャッシュを使う（同じ実行の Checks は並行なので間に合わない）。
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # run-e2e.mjs は GOCACHE が決まっていればそこを使う。setup-go が復元した
      # 場所を渡し、ビルドをゼロからやり直さないようにする。
      - name: Goのビルドキャッシュの場所を渡す
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        run: npm --prefix web ci

      # ffmpeg は apt の索引の更新と取得に時間がかかるので、.deb を runner の
      # イメージ版ごとに取っておく。同じイメージなら入る版も依存も変わらない。
      - name: runnerのイメージ版を調べる
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: メディア処理コマンドのパッケージを復元する
        id: ffmpeg-debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: メディア処理コマンドを取得する
        env:
          CACHE_HIT: ${{ steps.ffmpeg-debs.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/ffmpeg-debs"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install --yes --download-only --no-install-recommends \
              -o Dir::Cache::archives="$debs" ffmpeg
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$USER" "$debs"
          fi
          # イメージに初めから入っていれば取るものが無い。
          if compgen -G "$debs/*.deb" > /dev/null; then sudo dpkg -i "$debs"/*.deb; fi
          ffmpeg -version | head -n 1

      # ubuntu-latest には Chrome とその依存ライブラリが入っているので、
      # --with-deps（apt の更新と導入）は付けず、ブラウザ本体だけを版ごとに取っておく。
      - name: Playwrightの版を調べる
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Chromiumを復元する
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromiumを取得する
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: 実ブラウザE2E
        run: task test-e2e

      - name: 失敗時のPlaywright artefact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # イメージはコード変更を含む main 向け PR と main への push でだけ作る。
  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # task up が使うイメージの確認。公開はしない。
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
