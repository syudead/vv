name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  # Manual runs include E2E but do not build a Docker image.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; keep every main commit for Codecov baselines.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include every commit in a multi-commit push.
          fetch-depth: 0

      - name: コード変更かを調べる
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "手動実行なのでコード変更として扱う"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "比較元がない push なのでコード変更として扱う"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="$BEFORE"
          fi

          # Treat unknown paths as code; detect deletions on renames and preserve arbitrary filenames.
          # A failed diff must fail the step instead of skipping checks.
          changed_file=$(mktemp)
          trap 'rm -f "$changed_file"' EXIT
          git diff --no-renames --name-only -z "$base" HEAD > "$changed_file"

          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|specs/*) ;;
              *)
                printf 'コード変更: %s\n' "$path"
                code=true
                ;;
            esac
          done < "$changed_file"

          if [ "$code" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "文書だけの変更なのでコード検査を飛ばす"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Run full local and CI-only tasks in independent groups; keep both represented here.
  # Shard Vitest by file and build the SPA once. Only Go groups restore and save Go caches.
  check-group:
    name: Checks (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generation needs shadcn from web/ and openapi-typescript from tools/.
          - group: go lint
            tasks: fmt-check-go lint-go lint-go-windows-desktop generate-check migrations-check e2e-groups-check build-windows-check static-binary-check
            web: true
            tools: true
            golangci: true
            go: lint
          # Install FFmpeg before tests; cache keys separate runs that might have skipped media tests.
          # Go test caching does not track exec.LookPath results.
          - group: go test
            tasks: test-go-report
            go: test-media
            report: go
            ffmpeg: true
          - group: web lint
            tasks: fmt-check-web lint-web build-check-web
            web: true
          - group: web test 1
            tasks: test-web-report -- --shard=1/3
            web: true
            report: web
          - group: web test 2
            tasks: test-web-report -- --shard=2/3
            web: true
            report: web
          - group: web test 3
            tasks: test-web-report -- --shard=3/3
            web: true
            report: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: matrix.go
        with:
          go-version-file: go.mod
          cache: false

      # Separate compiler versions and job outputs so a cache hit cannot keep an obsolete cache cold.
      - name: Goのビルドキャッシュを復元する
        id: go-cache
        if: matrix.go
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.web || matrix.tools
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "task"

      - name: Web依存を取得する
        if: matrix.web
        run: npm --prefix web ci

      - name: Node開発ツールを取得する
        if: matrix.tools
        working-directory: tools
        run: npm ci

      # PRs restore main caches; input hashes validate the cached analysis.
      - name: golangci-lintのキャッシュを復元する
        if: matrix.golangci
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-

      # Compare migrations against main, including for feature-branch PRs.
      # Main pushes already have origin/main at HEAD; see scripts/migrations-immutable.sh.
      - name: main を取得する
        if: matrix.golangci && github.event_name != 'push'
        run: git fetch --no-tags --unshallow origin main:refs/remotes/origin/main

      - name: runnerのイメージ版を調べる
        id: image
        if: matrix.ffmpeg
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: メディア処理コマンドのパッケージを復元する
        id: ffmpeg-debs
        if: matrix.ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: メディア処理コマンドを取得する
        if: matrix.ffmpeg
        env:
          CACHE_HIT: ${{ steps.ffmpeg-debs.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/ffmpeg-debs"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install --yes --download-only --no-install-recommends \
              -o Dir::Cache::archives="$debs" ffmpeg
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$USER" "$debs"
          fi
          if compgen -G "$debs/*.deb" > /dev/null; then sudo dpkg -i "$debs"/*.deb; fi
          ffmpeg -version | head -n 1

      - name: 検査する
        env:
          TASKS: ${{ matrix.tasks }}
        run: task $TASKS

      # Upload failed-test evidence too; Codecov or OIDC failures must not fail checks.
      - name: テスト結果をCodecovへ送る
        if: ${{ !cancelled() && matrix.report }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: reports/${{ matrix.report }}-junit.xml
          disable_search: true
          flags: ${{ matrix.report }}
          fail_ci_if_error: false

      - name: カバレッジをCodecovへ送る
        if: ${{ !cancelled() && matrix.report }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ matrix.report == 'go' && 'reports/go-coverage.out' || 'reports/web-coverage/lcov.info' }}
          disable_search: true
          flags: ${{ matrix.report }}
          fail_ci_if_error: false

      - name: golangci-lintのキャッシュを保存する
        if: matrix.golangci && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}

      - name: Goのビルドキャッシュを保存する
        if: matrix.go && github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.go }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

  # Quality reports are informational and excluded from the required Checks result.
  quality:
    name: Quality (${{ matrix.metric }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - metric: complexity-go
            go: true
          - metric: complexity-web
            web: true
          - metric: duplication
            tools: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.web || matrix.tools
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.web && 'web/package-lock.json' || 'tools/package-lock.json' }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "task"

      - name: Web依存を取得する
        if: matrix.web
        run: npm --prefix web ci

      - name: Node開発ツールを取得する
        if: matrix.tools
        working-directory: tools
        run: npm ci

      - name: 測る
        env:
          METRIC: ${{ matrix.metric }}
        run: task $METRIC

      - name: 結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.metric }}
          path: reports/quality/${{ matrix.metric }}/
          retention-days: 90

  # Aggregate code checks, or run document checks for documentation-only changes.
  check:
    name: Checks
    needs: [changes, check-group]
    # Path detection failures must fail the required check.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 変更パスの判定結果と組ごとの結果を確かめる
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.changes.result }}
          GROUPS: ${{ needs.check-group.result }}
        run: |
          if [ "$RESULT" != "success" ] || { [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; }; then
            echo "変更パスを判定できませんでした"
            exit 1
          fi
          echo "checks: $GROUPS"
          if [ "$CODE" = "true" ]; then
            test "$GROUPS" = success
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: needs.changes.outputs.code == 'false'
        with:
          go-version-file: go.mod
          cache: false

      # Reuse the test job cache without saving a document-only cache.
      - name: Goのビルドキャッシュを復元する
        if: needs.changes.outputs.code == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-media-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-test-media-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: needs.changes.outputs.code == 'false'
        with:
          install_args: "task"

      - name: 文書を検査する
        if: needs.changes.outputs.code == 'false'
        run: task check-docs

  # Run E2E on main, manual runs and Renovate PRs (which may merge unattended).
  # Every E2E file must belong to one group; e2e-groups-check enforces this.
  e2e:
    name: Browser E2E (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: playback
            files: e2e/playback.e2e.ts
          - group: home
            files: e2e/home.e2e.ts e2e/onboarding.e2e.ts
          - group: library
            files: e2e/folders.e2e.ts e2e/search.e2e.ts e2e/tags.e2e.ts
          - group: peer
            files: e2e/peer-library.e2e.ts
          - group: pages
            files: e2e/auth.e2e.ts e2e/drag-organize.e2e.ts e2e/history.e2e.ts e2e/scan-progress.e2e.ts e2e/video-tabs.e2e.ts e2e/work-info.e2e.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      # Reuse a previous lint job cache for the server build; this job does not save it.
      - name: Goのビルドキャッシュを復元する
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # Point the E2E runner at the restored Go build cache.
      - name: Goのビルドキャッシュの場所を渡す
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "task"

      - name: Web依存を取得する
        run: npm --prefix web ci

      # Cache FFmpeg packages by runner image, which pins their versions and dependencies.
      - name: runnerのイメージ版を調べる
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: メディア処理コマンドのパッケージを復元する
        id: ffmpeg-debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.version }}

      - name: メディア処理コマンドを取得する
        env:
          CACHE_HIT: ${{ steps.ffmpeg-debs.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/ffmpeg-debs"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install --yes --download-only --no-install-recommends \
              -o Dir::Cache::archives="$debs" ffmpeg
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$USER" "$debs"
          fi
          if compgen -G "$debs/*.deb" > /dev/null; then sudo dpkg -i "$debs"/*.deb; fi
          ffmpeg -version | head -n 1

      # The runner already has browser system dependencies; cache only Chromium.
      - name: Playwrightの版を調べる
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Chromiumを復元する
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromiumを取得する
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      # Reuse generated media only when generator code and the runner image match.
      - name: テストの動画を復元する
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/e2e-fixtures
          key: e2e-fixtures-${{ steps.image.outputs.version }}-${{ hashFiles('web/e2e/media-fixtures.mjs', 'web/e2e/run-e2e.mjs') }}

      - name: 実ブラウザE2E
        env:
          E2E_FILES: ${{ matrix.files }}
        run: task test-e2e -- $E2E_FILES

      # Omit coverage flags for E2E: it uploads test results, not coverage.
      - name: テスト結果をCodecovへ送る
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: reports/e2e-junit.xml
          disable_search: true
          fail_ci_if_error: false

      - name: 失敗時のPlaywright artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Manual runs require E2E success; other events may legitimately skip it.
  e2e-result:
    name: Browser E2E
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 組ごとの結果を確かめる
        env:
          RESULT: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "e2e: $RESULT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            test "$RESULT" = success
          else
            test "$RESULT" = success || test "$RESULT" = skipped
          fi

  # Publish main builds; Renovate PRs validate dependency images without publishing.
  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU handles the runtime-stage apk commands for arm64 NAS images.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      # GHA layer caching excludes cache mounts. Restore compiled dependencies separately
      # to avoid rebuilding them on each source change.
      - name: キャッシュマウントの中身を復元する
        id: mount-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docker-mount-cache
          key: docker-mount-${{ runner.os }}-${{ hashFiles('Dockerfile', 'go.sum', 'web/package-lock.json') }}
          restore-keys: docker-mount-${{ runner.os }}-

      # Keep targets aligned with Dockerfile cache mounts; .dockerignore excludes these files.
      - name: キャッシュマウントへ戻す
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "docker-mount-cache/go-mod": "/go/pkg/mod",
              "docker-mount-cache/go-build": "/root/.cache/go-build",
              "docker-mount-cache/npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグを決める
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:sha-${SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Use the commit timestamp, matching task build, for /api/health builtAt.
      - name: コミットの時刻を求める
        id: commit-time
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.commit-time.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
