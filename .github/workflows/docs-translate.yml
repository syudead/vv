# Translates the published English documents into Japanese with a
# translation-specialised model (docs-site/translate/model.json) run by
# llama.cpp on the runner, stores the result on the docs-ja branch, and
# redeploys the documentation site. Only changed segments reach the model.
# See docs/how-to/docs-site.md.
name: Docs translation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "specs/**"
      - "ARCHITECTURE.md"
      - "docs-site/translate/**"
      - "scripts/sddguard/japanese-pending.txt"
      - ".github/workflows/docs-translate.yml"
  schedule:
    # Nightly, to continue a backlog that a time budget cut short.
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One translation at a time. A run that waits is replaced by the newest one,
# which translates everything out of date at that point.
concurrency:
  group: docs-translate
  cancel-in-progress: false

env:
  SHARDS: 6

jobs:
  plan:
    name: Find out-of-date translations
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out docs-ja
        run: git fetch --depth=1 origin docs-ja && git worktree add --detach .docs-ja FETCH_HEAD || mkdir -p .docs-ja

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm --prefix docs-site ci

      - id: plan
        name: Count out-of-date sources
        run: |
          node docs-site/translate/translate.mjs --out .docs-ja --dry-run | tee pending.txt
          echo "work=$(wc -l < pending.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

  translate:
    name: Translate shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.work != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out docs-ja
        run: git fetch --depth=1 origin docs-ja && git worktree add --detach .docs-ja FETCH_HEAD || mkdir -p .docs-ja

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm --prefix docs-site ci

      - id: work
        name: Check this shard's work
        run: |
          n=$(node docs-site/translate/translate.mjs --out .docs-ja --dry-run --shard ${{ matrix.shard }} --shards "$SHARDS" | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - id: model
        if: steps.work.outputs.count != '0'
        name: Read the model pin
        run: |
          node -e '
            const m = require("./docs-site/translate/model.json")
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" })
            for (const k of ["repo", "revision", "file", "sha256", "llamaCpp"]) out.write(`${k}=${m[k]}\n`)
          '

      - name: Cache llama.cpp and the model
        if: steps.work.outputs.count != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            llama
            model.gguf
          key: translate-${{ steps.model.outputs.llamaCpp }}-${{ steps.model.outputs.file }}-${{ steps.model.outputs.sha256 }}

      - name: Install llama.cpp and the model
        if: steps.work.outputs.count != '0'
        env:
          TAG: ${{ steps.model.outputs.llamaCpp }}
          REPO: ${{ steps.model.outputs.repo }}
          REVISION: ${{ steps.model.outputs.revision }}
          FILE: ${{ steps.model.outputs.file }}
          SHA256: ${{ steps.model.outputs.sha256 }}
        run: |
          if [ ! -x llama/llama-server ]; then
            curl -sSfL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$TAG/llama-$TAG-bin-ubuntu-x64.tar.gz"
            mkdir -p llama-extract llama
            tar -xzf llama.tar.gz -C llama-extract
            cp -r "$(dirname "$(find llama-extract -name llama-server -type f | head -1)")"/. llama/
          fi
          if [ ! -f model.gguf ]; then
            curl -sSfL -o model.gguf "https://huggingface.co/$REPO/resolve/$REVISION/$FILE"
          fi
          if [ -n "$SHA256" ]; then
            echo "$SHA256  model.gguf" | sha256sum -c -
          else
            echo "::warning::model.json has no sha256; the model file is not verified"
            sha256sum model.gguf
          fi

      - name: Start llama-server
        if: steps.work.outputs.count != '0'
        run: |
          LD_LIBRARY_PATH=$PWD/llama nohup ./llama/llama-server -m model.gguf -c 4096 -np 1 \
            -t "$(nproc)" --port 8080 --jinja > server.log 2>&1 &
          for i in $(seq 1 300); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Translate
        if: steps.work.outputs.count != '0'
        run: |
          node docs-site/translate/translate.mjs --out .docs-ja \
            --shard ${{ matrix.shard }} --shards "$SHARDS" \
            --budget-seconds 18000 --summary "$GITHUB_STEP_SUMMARY"

      # Only the files this shard wrote: every shard starts from the same
      # docs-ja, so uploading the whole tree would let one shard's old copies
      # overwrite another shard's new translations when they are merged.
      - name: Collect this shard's translations
        if: always() && steps.work.outputs.count != '0'
        run: |
          mkdir -p upload
          if [ -e .docs-ja/.git ]; then
            git -C .docs-ja ls-files -z -m -o --exclude-standard
          else
            (cd .docs-ja && find . -type f -print0)
          fi | (cd .docs-ja && xargs -0 -r cp --parents -t ../upload)

      - name: Keep this shard's translations
        if: always() && steps.work.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-ja-${{ matrix.shard }}
          path: upload/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  commit:
    name: Commit to docs-ja and redeploy
    needs: [plan, translate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.work != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm --prefix docs-site ci

      - name: Check out docs-ja
        run: |
          if git fetch origin docs-ja; then
            git worktree add -B docs-ja .docs-ja FETCH_HEAD
          else
            git worktree add --orphan -b docs-ja .docs-ja
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-ja-*
          path: shards

      - name: Merge the shards and remove orphaned translations
        run: |
          for dir in shards/*/; do
            [ -d "$dir" ] && cp -a "$dir". .docs-ja/
          done
          node docs-site/translate/translate.mjs --out .docs-ja --prune-only
          if [ ! -f .docs-ja/README.md ]; then
            printf '%s\n' '# docs-ja' '' \
              'Japanese translations of the published English documents, written by the' \
              '`Docs translation` workflow. Do not edit them: fix the English source on' \
              '`main` and the next run retranslates it. See docs/how-to/docs-site.md.' > .docs-ja/README.md
          fi

      - name: Commit and push
        working-directory: .docs-ja
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No translation changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Translate documents from ${GITHUB_SHA::7}"
          git push origin HEAD:docs-ja

      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
