# Build release zips with task build-windows-app; validate bundled FFmpeg on Windows.
name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded main builds, but preserve tagged releases.
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build zip
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "task"

      - name: Web依存を取得する
        run: npm --prefix web ci

      # Cache the pinned FFmpeg archive to tolerate upstream outages; verify its hash on every use.
      - name: FFmpeg の zip を復元する
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/cache
          key: windows-ffmpeg-${{ hashFiles('scripts/build/windows_app.go') }}

      # Manual runs use sha-<12 digits>, even when the selected ref is a tag.
      - name: zip を組む
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: task build-windows-app

      - name: zip の名前を調べる
        id: zip
        run: |
          shopt -s nullglob
          zips=(dist/VVMDM-*-windows-amd64.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "dist/ に zip がちょうど 1 つではありません: ${zips[*]}"
            exit 1
          fi
          echo "name=$(basename "${zips[0]}")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error
          # ZIP files are already compressed.
          compression-level: 0

  # The runner has no GPU; verify compiled-in NVENC and QSV support only.
  verify:
    name: Verify bundled FFmpeg
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app

      - name: zip の中身とエンコーダを確かめる
        shell: pwsh
        env:
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path $env:ZIP -DestinationPath extracted
          $root = Join-Path extracted ([IO.Path]::GetFileNameWithoutExtension($env:ZIP))
          foreach ($file in 'VVMDM.exe', 'README.txt', 'ffmpeg\ffmpeg.exe', 'ffmpeg\ffprobe.exe', 'ffmpeg\LICENSE.txt', 'ffmpeg\README.txt') {
            if (-not (Test-Path (Join-Path $root $file))) { throw "zip に $file がありません" }
          }
          # Capture output before selecting a line; early pipeline termination changes the exit code.
          $version = & (Join-Path $root 'ffmpeg\ffprobe.exe') -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe が動きません" }
          $version | Select-Object -First 1
          $encoders = & (Join-Path $root 'ffmpeg\ffmpeg.exe') -hide_banner -encoders
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -encoders が失敗しました" }
          foreach ($encoder in 'h264_nvenc', 'h264_qsv') {
            if (-not ($encoders | Select-String -SimpleMatch " $encoder ")) { throw "同梱の ffmpeg に $encoder がありません" }
            Write-Host "found $encoder"
          }

  release:
    name: Attach to release
    needs: [build, verify]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app

      # Replace tagged release assets on reruns. Publish the new nightly zip before
      # removing the previous one so downloads remain available.
      - name: GitHub Release に添付する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            if gh release view "$REF_NAME" > /dev/null 2>&1; then
              gh release upload "$REF_NAME" "$ZIP" --clobber
            else
              gh release create "$REF_NAME" "$ZIP" --verify-tag --title "VVMDM ${REF_NAME#v}" --generate-notes
            fi
            exit 0
          fi

          TAG=nightly
          SHORT="${GITHUB_SHA::12}"
          TITLE="VVMDM nightly (${SHORT})"
          NOTES="main の最新のコミット ${GITHUB_SHA} から組んだ Windows 版です。正式版ではありません。main に push するたびに差し替わります。"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            # Avoid --clobber on an existing identical asset: it deletes before uploading.
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fqx "$ZIP"; then
              gh release upload "$TAG" "$ZIP"
            fi
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              if [ "$asset" != "$ZIP" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi

          # Remove legacy per-commit nightly releases and tags.
          gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("main-"))' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
