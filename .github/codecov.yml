# Codecov results are informational; see docs/design-docs/test-quality-monitoring.md.
# The Developer plan fixes comment layout and reports patch status only.

codecov:
  notify:
    # Wait for Go and all three Web shards before comparing coverage.
    after_n_builds: 4

coverage:
  status:
    patch:
      default:
        informational: true

# Match flags to CI uploads and report each language separately.
flag_management:
  default_rules:
    # Retain previous coverage when an upload is missing.
    carryforward: true
  # Set statuses only for flags that upload coverage, not test-result-only flags.
  individual_flags:
    - name: go
      paths:
        - cmd/**
        - internal/**
      statuses:
        - type: patch
          informational: true
    - name: web
      paths:
        - web/src/**
      statuses:
        - type: patch
          informational: true

# Components follow ARCHITECTURE.md and Web directories; they do not set statuses.
component_management:
  individual_components:
    - component_id: go-domain
      name: Go domain
      paths:
        - internal/domain/**
    - component_id: go-app
      name: Go application
      paths:
        - internal/app/**
    - component_id: go-httpapi
      name: Go HTTP API
      paths:
        - internal/httpapi/**
    - component_id: go-store
      name: Go store
      paths:
        - internal/store/**
    - component_id: go-media
      name: Go media
      paths:
        - internal/media/**
        - internal/mediafs/**
        - internal/artifacts/**
    - component_id: go-import
      name: Go import pipeline
      paths:
        - internal/scanner/**
        - internal/watcher/**
        - internal/jobs/**
    - component_id: go-other
      name: Go other adapters and entry point
      paths:
        - cmd/**
        - internal/eventbus/**
        - internal/desktop/**
        - internal/opener/**
        - internal/password/**
        - internal/ollama/**
        - internal/comfyui/**
    - component_id: web-api
      name: Web API client
      paths:
        - web/src/api/**
    - component_id: web-shell
      name: Web shell and routes
      paths:
        - web/src/app/**
        - web/src/shell/**
        - web/src/auth/**
    - component_id: web-flows
      name: Web product flows
      paths:
        - web/src/library/**
        - web/src/folders/**
        - web/src/groups/**
        - web/src/playlists/**
        - web/src/credits/**
        - web/src/settings/**
        - web/src/tags/**
        - web/src/player/**
        - web/src/versions/**
        - web/src/videoList/**
        - web/src/history/**
        - web/src/preferences/**
    - component_id: web-shared
      name: Web shared UI and helpers
      paths:
        - web/src/ui/**
        - web/src/designSystem/**
        - web/src/hooks/**
        - web/src/lib/**
        - web/src/theme/**
        - web/src/i18n/**

comment:
  # Comment upload gating is separate from status gating.
  after_n_builds: 4

test_analytics:
  flake_detection: true

# Normalize Vitest-relative and Go import paths to repository paths.
fixes:
  - "src/::web/src/"
  - "github.com/syudead/vv/::"

# Exclude generated sources, development-only examples and test helpers.
ignore:
  - "internal/httpapi/gen/**"
  - "internal/httpapi/extgen/**"
  - "web/src/api/gen/**"
  - "web/src/designSystem/**"
  - "internal/store/storetest.go"
  - "scripts/**"
  - "tools/**"
