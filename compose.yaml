# Pin the project name so the data volume is vv_data.

name: vv

services:
  mdm:
    build:
      context: .
      args:
        VERSION: ${VV_VERSION:-dev}
        # task up supplies Git metadata; absent values are omitted from /api/health.
        COMMIT: ${VV_COMMIT:-}
        BUILT_AT: ${VV_BUILT_AT:-}
    ports:
      # Change only the host port; the container still listens on 8080.
      - "${MDM_HOST_PORT:-8080}:8080"
    environment:
      MDM_ADDR: ":8080"
      MDM_DATA_DIR: "/data"
      MDM_LOG_LEVEL: "${MDM_LOG_LEVEL:-info}"
      # Trusted forwarding proxies; empty trusts loopback and private addresses. See Network exposure in docs/how-to/running-vv.md.
      MDM_TRUSTED_PROXIES: "${MDM_TRUSTED_PROXIES:-}"
      # Optional replacement diffusion model; see Try a derived model in docs/how-to/comfyui-thumbnails.md.
      MDM_COMFYUI_DIFFUSION_MODEL: "${MDM_COMFYUI_DIFFUSION_MODEL:-}"
    volumes:
      # Container paths selectable in settings; host paths are configurable.
      - "${MDM_MEDIA_HOST_DIR:-./media}:/media:ro"
      # Deleting this volume loses user data; see Data and recovery in docs/how-to/running-vv.md.
      - "data:/data"
    # Allow the ten-second graceful shutdown to complete.
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  data:
