# task up の実体。
# プロジェクト名を固定するので、データ用ボリュームの名前は vv_data になる

name: vv

services:
  mdm:
    build:
      context: .
      args:
        VERSION: ${VV_VERSION:-dev}
    ports:
      # ホスト側の公開ポートだけを差し替えられる。コンテナ内は 8080 のまま。
      - "${MDM_HOST_PORT:-8080}:8080"
    environment:
      MDM_ADDR: ":8080"
      MDM_DATA_DIR: "/data"
      MDM_LOG_LEVEL: "${MDM_LOG_LEVEL:-info}"
      # HTTPS の逆プロキシの後ろで公開するときに、そのプロキシのアドレスを書く
      # （docs/how-to/running-vv.md「Network exposure」）。既定は空で転送ヘッダーを読まない。
      MDM_TRUSTED_PROXIES: "${MDM_TRUSTED_PROXIES:-}"
    volumes:
      # 設定画面で選べるコンテナ内の候補。ホスト側は差し替えられる。
      - "${MDM_MEDIA_HOST_DIR:-./media}:/media:ro"
      # データベースは名前付きボリュームに置く。消しても次の起動で作り直される。
      - "data:/data"
    # 猶予 10 秒の停止処理が終わるまで待つ。
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  data:
