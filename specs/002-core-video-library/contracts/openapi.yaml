# 本機能を終えた時点の API 契約（api/openapi.yaml の次の姿）。
# このファイルが唯一の真実であり、Go（oapi-codegen）と TypeScript
# （openapi-typescript）の双方をここから生成する。生成物は手編集しない。
openapi: 3.1.0

info:
  title: MDM API
  version: 0.2.0
  summary: セルフホストの動画管理システム API
  description: |
    取り込み（スキャン）・一覧・再生・題名検索までを公開する。
    認証は掛けていない（Phase 3 の範囲）。信頼できるネットワークの内側で使う前提。

servers:
  - url: /
    description: アプリケーション自身が配信する

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 稼働状態とビルド情報を返す
      description: |
        認証を必要としない。外形監視とコンテナのヘルスチェックから参照される。
        データベースへ疎通できない場合も応答自体は返し、`status` で区別する。
      responses:
        "200":
          description: 稼働中。依存する保存層にも疎通できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 起動はしているが保存層に疎通できていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/videos:
    get:
      operationId: listVideos
      summary: 動画の一覧を返す
      description: |
        カーソル方式でページングする。`query` を与えると題名の部分一致で絞り込む。
        `total` は絞り込み後の総件数で、ページングとは独立に返る。
      parameters:
        - name: query
          in: query
          description: 題名の部分一致。1文字から指定できる
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/{id}:
    get:
      operationId: getVideo
      summary: 動画1件の詳細を返す
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/stream:
    get:
      operationId: streamVideo
      summary: 動画本体を配信する
      description: |
        `Range` 要求に対応し、`206 Partial Content` と `Content-Range` を返す。
        詳細は [http-routes.md](./http-routes.md) を参照。再生できない形式
        （`playable = false`）でもファイルはそのまま配信する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 指定された範囲
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      summary: サムネイル画像を返す
      description: |
        `v` は内容由来の識別子で、画像が変われば URL も変わる。長期キャッシュを
        前提にしてよい（[http-routes.md](./http-routes.md)）。未生成の場合は 404。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した URL に含まれる版
          schema:
            type: string
      responses:
        "200":
          description: 画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: 動画が存在しないか、サムネイルが未生成

  /api/videos/{id}/progress:
    put:
      operationId: putVideoProgress
      summary: 再生位置を記録する
      description: |
        視聴済みの判定はサーバー側で行う。クライアントは位置だけを送る。
        記録は動画の内容に紐づくため、ファイルを移動・改名しても引き継がれる。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: 記録後の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans:
    post:
      operationId: startScan
      summary: 取り込みを開始する
      description: |
        すでに実行中の場合は、新しく始めずに実行中のスキャンを返す。
        応答は即座に返り、取り込みは背後で進む。
      responses:
        "202":
          description: 開始した、または実行中のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /api/scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: スキャンの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: 一度もスキャンしていない

components:
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      description: 動画の識別子
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 要求の形式が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok = 保存層まで疎通、degraded = プロセスのみ生存
        version:
          type: string
          description: リリース名。ビルド時に指定されなければ dev
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: ビルド元のコミット。取得できない場合は省略される
        builtAt:
          type: string
          format: date-time
          description: ビルド時刻。取得できない場合は省略される

    VideoSort:
      type: string
      enum: [addedDesc, titleAsc]
      default: addedDesc
      description: addedDesc = 追加が新しい順、titleAsc = 題名順

    VideoPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
          description: 絞り込み後の総件数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。これ以上無い場合は省略される

    Video:
      type: object
      required: [id, title, sizeBytes, addedAt, playable, probeState, thumbnailState]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 拡張子を除いたファイル名
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: 尺。解析前・取得不能の場合は省略される
        width:
          type: integer
        height:
          type: integer
        container:
          type: string
          examples: [mp4, webm, mkv]
        videoCodec:
          type: string
          examples: [h264, vp9]
        audioCodec:
          type: string
          examples: [aac, opus]
        playable:
          type: boolean
          description: ブラウザでそのまま再生できると判定されたか
        unplayableReason:
          type: string
          enum: [container, video_codec, audio_codec]
          description: playable = false の理由。判定前は省略される
        probeState:
          type: string
          enum: [pending, done, failed]
        probeError:
          type: string
          description: probeState = failed のときの理由
        thumbnailState:
          type: string
          enum: [pending, done, failed]
        thumbnailUrl:
          type: string
          description: thumbnailState = done のときだけ入る
        progress:
          $ref: "#/components/schemas/Progress"

    ProgressUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0

    Progress:
      type: object
      required: [positionMs, completed, updatedAt]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      required: [id, state, total, completed, failed]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [running, done, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        total:
          type: integer
          description: 走査で見つけたファイル数
        completed:
          type: integer
        failed:
          type: integer
        error:
          type: string
          description: スキャン自体が失敗した理由

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 機械可読なエラー種別
          examples: [not_found, invalid_request, internal]
        message:
          type: string
          description: 人が読むための説明。利用者にそのまま提示してよい文言にする
