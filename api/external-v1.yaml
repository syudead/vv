# External API v1 contract; generate Go bindings with task generate, never edit extgen by hand.
# Keep v1 additive; changes to existing field semantics, types or requirements need v2.
# See docs/how-to/external-api.md; the UI contract lives in api/openapi.yaml.
openapi: 3.1.0

info:
  title: vv external API
  version: 1.0.0
  summary: "API for external tools to operate vv with API tokens"
  description: "All operations require `Authorization: Bearer <token>`. Owners issue tokens in the API tokens section of Settings; missing, malformed, invalid or revoked tokens return `401 unauthenticated` with `WWW-Authenticate: Bearer`. Cookies are ignored.\n\nRequests act as the owner, including access to private videos, without same-origin checks. Operations accepting a body require `Content-Type: application/json`."
servers:
  - url: /api/v1
    description: "Served by the application"

security:
  - bearerAuth: []

paths:
  /videos:
    get:
      operationId: listVideos
      summary: "List videos with pagination"
      description: "Return videos with at least one location under a registered folder, ordered by `(addedAt, id)` ascending. Pass each `nextCursor` as `cursor` until it is empty. Changes are not tracked: reread the list to discover new videos and use a lookup `404` to detect removals."
      parameters:
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response; omit to start at the beginning."
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size; out-of-range values return `400 invalid_request`."
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "One page of videos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideoPage"
        "400":
          description: "Out-of-range limit (`invalid_request`) or unreadable cursor (`invalid_request` / `invalid_cursor`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /videos/lookup:
    get:
      operationId: lookupVideo
      summary: "Look up a video by ID, content key or path"
      description: "Provide exactly one of `id`, `contentKey` or `path`; otherwise return `400 invalid_request`. Paths match current locations byte-for-byte without normalization, so pass the path returned by the list unchanged."
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: contentKey
          in: query
          schema:
            type: string
        - name: path
          in: query
          description: "Absolute location path"
          schema:
            type: string
      responses:
        "200":
          description: "Video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideo"
        "400":
          description: "Not exactly one reference supplied (`invalid_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Video absent or without a location under a registered folder (`not_found` / `video_not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-tags:
    post:
      operationId: updateVideoTags
      summary: "Add, remove or replace named tags on multiple videos"
      description: "Apply atomically to manual tags, preserving folder-derived tags even on `replace`. Resolve names and synonyms, coalescing references to the same tag; `add` and `replace` create unknown tags, while `remove` ignores unknown names. Any missing video returns `404` without changes. With `tentative: true`, new tags are tentative and rejected names are skipped and returned in `skippedTags`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: "Resulting tags for each video, in `videos` order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          description: "Malformed body, invalid action or invalid video reference (`invalid_request`); count limits (`too_many_videos`, `too_many_tags`, `limit`); invalid tag name (`tag_name_empty`, `tag_name_control_characters`, `tag_name_too_long`, with `index` into `tags`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing video (`not_found` / `video_not_found`, with `index` into `videos`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-display-names:
    post:
      operationId: updateVideoDisplayNames
      summary: "Set or clear display names for multiple videos"
      description: "Apply atomically. A null or whitespace-only `displayName` restores the filename-derived title. Names belong to contentKey and affect every location of that content; any missing video or invalid name prevents all changes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoDisplayNamesRequest"
      responses:
        "200":
          description: "Resulting titles in `items` order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDisplayNamesResponse"
        "400":
          description: "Malformed body or invalid video reference (`invalid_request`, `index`); item limit (`too_many_videos`, `limit`); invalid display name (`display_name_control_characters`, `display_name_too_long`, `limit`), with `index` into `items`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing video (`not_found` / `video_not_found`, with `index` into `items`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-thumbnails:
    post:
      operationId: updateVideoThumbnails
      summary: "Set or clear thumbnail positions for multiple videos"
      description: "Resolve all videos and validate positions before changing anything. Then regenerate and save each thumbnail in `items` order; null restores the automatic position. Frame generation failure stops at `409 thumbnail_frame_unavailable` with `index`: earlier items remain applied, while that item and later items remain unchanged."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoThumbnailsRequest"
      responses:
        "200":
          description: "Resulting positions in `items` order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoThumbnailsResponse"
        "400":
          description: "Malformed body or invalid video reference (`invalid_request`, `index`); more than 20 items (`too_many_videos`, `limit: 20`); negative position or position at/beyond duration (`thumbnail_position_out_of_range`, `index`, with duration in milliseconds as `limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing video (`video_not_found`) or no readable location (`file_unavailable`), with `index` into `items`; no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Unknown duration (`conflict` / `duration_unknown`; no changes) or frame generation failure (`conflict` / `thumbnail_frame_unavailable`; items before `index` remain applied)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-work-info:
    post:
      operationId: updateVideoWorkInfo
      summary: "Replace work information for multiple videos"
      description: "Each `workInfo` replaces the entire saved value; omitted, null or whitespace-only properties clear it, and `{}` clears everything. Reference people and organizations by IDs obtained through external-ID lookup or creation. Apply atomically; any error prevents all changes. Later entries win for repeated videos, and repeating a request is idempotent."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoWorkInfoRequest"
      responses:
        "200":
          description: "Resulting work information in `items` order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWorkInfoResponse"
        "400":
          description: "Malformed body or invalid video reference (`invalid_request`, `index`); item limit (`too_many_videos`, `limit`); invalid work information (`work_info_*`, `limit`, `field` within the item workInfo), with `index` into `items`; no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing video (`video_not_found`), person or organization (`person_not_found`, `organization_not_found`, `field`), with `index` into `items`; no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags:
    get:
      operationId: listTags
      summary: "List tags"
      description: "Use the same search, filtering, ordering and pagination as `GET /api/tags`. Combine `q`, `tentative` and `unused` with AND and order by `sort`; `limit` enables pagination and `nextCursor` when more remain. Without `limit`, return all matches without a cursor."
      parameters:
        - name: q
          in: query
          description: "Trim and normalize width, case and hiragana/katakana variants, then substring-match the original name or synonyms when nonempty. Do not split into words."
          schema:
            type: string
            maxLength: 100
        - name: tentative
          in: query
          description: "If true, return tentative tags only."
          schema:
            type: boolean
            default: false
        - name: unused
          in: query
          description: "If true, return tags with no videos only."
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          description: "Filter by a positive kind ID or `none` for unclassified tags. Missing IDs return an empty list; this filter affects `total`, not `totalAll`."
          schema:
            type: string
            pattern: "^([1-9][0-9]*|none)$"
        - name: sort
          in: query
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/TagSort"
        - name: cursor
          in: query
          description: "Opaque cursor from the previous response; reuse with the same `q`, `tentative`, `unused`, `kind` and `sort`. Ignored without `limit`."
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size; omit to return all matches without `nextCursor`."
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "Tag list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          description: "Invalid sort, limit outside 1-200, q over 100 characters or kind other than a positive integer or none (`invalid_request`); unreadable cursor or sort mismatch (`invalid_request` / `invalid_cursor`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/merge:
    post:
      operationId: mergeTags
      summary: "Merge tags into one target"
      description: "Atomically move source assignments, original names and synonyms to the target, then delete sources and confirm the target. Skip missing sources into `notFoundIds`; if all are missing, return the unchanged target. Uses the same store operation as `POST /api/tags/{id}/merge`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMergeRequest"
      responses:
        "200":
          description: "Merged target and missing sources"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMergeResponse"
        "400":
          description: "Malformed body (`invalid_request`); empty or over 20,000 sourceIds (`too_many_tags`, `limit`); target included in sourceIds (`merge_same_tag`; no changes)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing target (`not_found` / `tag_not_found`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rename:
    post:
      operationId: renameTag
      summary: "Rename a tag"
      description: "A changed name confirms a tentative tag; an unchanged name is a no-op. Uses the same store operation as `PATCH /api/tags/{id}`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRenameRequest"
      responses:
        "200":
          description: "Updated tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: "Malformed body (`invalid_request`) or invalid name (`tag_name_empty`, `tag_name_control_characters`, `tag_name_too_long`, `limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing tag (`not_found` / `tag_not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Name belongs to another tag or synonym, or is this tag's own synonym (`conflict` / `tag_name_taken`, `tagId`, `tagName`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/synonyms:
    post:
      operationId: updateTagSynonyms
      summary: "Add or remove a tag synonym"
      description: "Adding a new synonym confirms a tentative tag; an existing synonym is a no-op. If the name is another tag S's original name, merge S into id only when `mergeTagId` equals S; otherwise return `409 tag_merge_required` with S as `tagId` and no changes. Removing a non-synonym is a no-op. Uses the store operations behind `POST` and `DELETE /api/tags/{id}/synonyms`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSynonymsRequest"
      responses:
        "200":
          description: "Updated tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: "Malformed body or invalid action (`invalid_request`); invalid added name (`tag_name_empty`, `tag_name_control_characters`, `tag_name_too_long`, `limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing tag (`not_found` / `tag_not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Added name is the tag's original name or another tag's synonym (`conflict` / `tag_name_taken`), or another tag's original name without matching mergeTagId (`conflict` / `tag_merge_required`). Both return `tagId` and `tagName` without changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/batch:
    post:
      operationId: batchTags
      summary: "Confirm, reject, delete or classify multiple tags"
      description: "Apply atomically to `ids`. `confirm` and `reject` affect tentative tags; `delete` affects confirmed tags. Return incompatible tags in `notApplicableIds` and missing IDs in `notFoundIds`; rejection remembers the original name, deletion does not. `setKind` assigns kindId and `clearKind` removes it without confirming tentative tags; already-matching tags are not applicable. Send a single-element ids array for one tag. Uses the store operation behind `POST /api/tags/batch`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBatchRequest"
      responses:
        "200":
          description: "Applied, missing and inapplicable tags"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBatchResponse"
        "400":
          description: "Malformed body, invalid action, setKind without kindId or kindId on another action (`invalid_request`); empty or over 20,000 ids (`too_many_tags`, `limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing setKind target kind (`not_found` / `tag_kind_not_found`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rejected-names:
    get:
      operationId: listRejectedTagNames
      summary: "List rejected tag names"
      description: "Return rejected names in natural-name order, with total count and nextCursor when more remain. Uses the store operation behind `GET /api/tags/rejected-names`."
      parameters:
        - name: cursor
          in: query
          description: "Opaque nextCursor from the previous response."
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "One page of rejected names"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameList"
        "400":
          description: "Limit outside 1-200 (`invalid_request`) or unreadable cursor (`invalid_request` / `invalid_cursor`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: forgetRejectedTagName
      summary: "Forget a rejected tag name"
      description: "Forget the normalized name so future tentative assignment may recreate it. Missing or invalid names return `removed: false` without changes; normalization follows tag-name rules. Uses the store operation behind `DELETE /api/tags/rejected-names`."
      parameters:
        - name: name
          in: query
          required: true
          description: "Name to forget"
          schema:
            type: string
      responses:
        "200":
          description: "Matched name and whether it was removed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameForgetResult"
        "400":
          description: "Missing name (`invalid_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tag-kinds:
    get:
      operationId: listTagKinds
      summary: "List all tag kinds"
      description: "Return all kinds in ID order using the store operation behind `GET /api/tag-kinds`."
      responses:
        "200":
          description: "All tag kinds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKindList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createTagKind
      summary: "Create a tag kind"
      description: "Normalize the name using tag-name rules and require uniqueness among kinds. Uses the store operation behind `POST /api/tag-kinds` and returns 200, like other external writes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindCreateRequest"
      responses:
        "200":
          description: "Created tag kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKind"
        "400":
          $ref: "#/components/responses/TagKindNameInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/TagKindNameConflict"
        "500":
          $ref: "#/components/responses/Internal"

  /tag-kinds/update:
    post:
      operationId: renameTagKind
      summary: "Rename a tag kind"
      description: "Rename the kind identified by id; an unchanged name returns it without changes. Uses the store operation behind `PATCH /api/tag-kinds/{id}`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindRenameRequest"
      responses:
        "200":
          description: "Renamed tag kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKind"
        "400":
          $ref: "#/components/responses/TagKindNameInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "Missing kind (`not_found` / `tag_kind_not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/TagKindNameConflict"
        "500":
          $ref: "#/components/responses/Internal"

  /tag-kinds/delete:
    post:
      operationId: deleteTagKinds
      summary: "Delete tag kinds"
      description: "Delete kinds individually using the store operation behind `DELETE /api/tag-kinds/{id}`. Their tags remain unclassified; missing IDs are returned in notFoundIds without errors."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindDeleteRequest"
      responses:
        "200":
          description: "Deleted and missing kinds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKindDeleteResponse"
        "400":
          description: "Malformed body or empty/over-20,000 ids (`invalid_request`); no changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /people:
    get:
      operationId: listPeople
      summary: "List people or look up one by external ID"
      description: "Use the search, ordering and pagination of `GET /api/people`; omitting limit returns all matches. A source/externalId pair returns at most one matching person in items, or an empty list, and ignores q, sort, cursor and limit."
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditSource"
        - $ref: "#/components/parameters/CreditExternalId"
      responses:
        "200":
          description: "Person list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          $ref: "#/components/responses/CreditListInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createPerson
      summary: "Create a person"
      description: "Uses the store operation behind `POST /api/people` and returns 200. Look up the external ID first and reuse an existing person; sending parentId for a person returns `400 invalid_request`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: "Created person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /people/update:
    post:
      operationId: updatePerson
      summary: "Update a person"
      description: "Update only supplied properties for id; replace lists entirely and clear lists on null. Uses the store operation behind `PATCH /api/people/{id}`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditUpdateRequest"
      responses:
        "200":
          description: "Updated person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /people/merge:
    post:
      operationId: mergePeople
      summary: "Merge people into one target"
      description: "Atomically move video links, names (as aliases) and external IDs to the target, then delete sources. Return missing sources in notFoundIds; uses the store operation behind `POST /api/people/{id}/merge`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: "Merged target and missing sources"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMergeResponse"
        "400":
          $ref: "#/components/responses/CreditMergeInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /people/delete:
    post:
      operationId: deletePeople
      summary: "Delete people"
      description: "Delete people individually with their video links using the store operation behind `DELETE /api/people/{id}`. Return missing IDs in notFoundIds without errors."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDeleteRequest"
      responses:
        "200":
          description: "Deleted and missing people"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDeleteResponse"
        "400":
          $ref: "#/components/responses/CreditDeleteInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations:
    get:
      operationId: listOrganizations
      summary: "List organizations or look up one by external ID"
      description: "Use the search, ordering and pagination of `GET /api/organizations`; omitting limit returns all matches. A source/externalId pair returns at most one matching organization in items, or an empty list, and ignores q, sort, cursor and limit."
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditSource"
        - $ref: "#/components/parameters/CreditExternalId"
      responses:
        "200":
          description: "Organization list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/CreditListInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createOrganization
      summary: "Create an organization"
      description: "Uses the store operation behind `POST /api/organizations` and returns 200. Look up the external ID first and reuse an existing organization."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: "Created organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/update:
    post:
      operationId: updateOrganization
      summary: "Update an organization"
      description: "Update only supplied properties for id; replace lists entirely, clear lists on null, and detach the parent on parentId null. Uses the store operation behind `PATCH /api/organizations/{id}`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditUpdateRequest"
      responses:
        "200":
          description: "Updated organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/merge:
    post:
      operationId: mergeOrganizations
      summary: "Merge organizations into one target"
      description: "Atomically move video links, names (as aliases), external IDs and children to the target, then delete sources. Return missing sources in notFoundIds; uses the store operation behind `POST /api/organizations/{id}/merge`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: "Merged target and missing sources"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMergeResponse"
        "400":
          $ref: "#/components/responses/CreditMergeInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/delete:
    post:
      operationId: deleteOrganizations
      summary: "Delete organizations"
      description: "Delete organizations individually with their video links using the store operation behind `DELETE /api/organizations/{id}`; their children become roots. Return missing IDs in notFoundIds without errors."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDeleteRequest"
      responses:
        "200":
          description: "Deleted and missing organizations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDeleteResponse"
        "400":
          $ref: "#/components/responses/CreditDeleteInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /scans:
    post:
      operationId: startScan
      summary: "Start a scan"
      description: "Return 201 for a new scan, or 200 with the already-running scan without starting another. No request body."
      responses:
        "201":
          description: "Newly started scan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "200":
          description: "Existing running scan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: "No media folders configured (`media_folders_not_configured`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /scans/current:
    get:
      operationId: getCurrentScan
      summary: "Get the latest scan status"
      description: "Return the running scan, or the last completed scan when none is running."
      responses:
        "200":
          description: "Latest scan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "No scan has run (`not_found` / `no_scan`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token issued in Settings: 47 characters beginning with vvt_."

  parameters:
    CreditQuery:
      name: q
      in: query
      description: "Trim and normalize the query, then substring-match names or aliases when nonempty."
      schema:
        type: string
        maxLength: 100
    CreditSort:
      name: sort
      in: query
      description: "Sort order"
      schema:
        $ref: "#/components/schemas/CreditSort"
    CreditCursor:
      name: cursor
      in: query
      description: "Previous nextCursor; reuse with the same q and sort. Ignored without limit."
      schema:
        type: string
    CreditLimit:
      name: limit
      in: query
      description: "Page size; omit to return all matches without nextCursor. Ignored for source/externalId lookup."
      schema:
        type: integer
        minimum: 1
        maximum: 200
        # Parse limit only for listing; external-ID lookup ignores even nonnumeric values.
        x-go-type: string
    CreditSource:
      name: source
      in: query
      description: "External-ID source; pair with externalId to return only the matching entity."
      schema:
        type: string
    CreditExternalId:
      name: externalId
      in: query
      description: "External-ID value; pair with source."
      schema:
        type: string

  responses:
    Unauthenticated:
      description: "Missing, malformed, invalid or revoked token (`unauthenticated`)."
      headers:
        WWW-Authenticate:
          description: "Always Bearer"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: "Unexpected failure (`internal`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditListInvalid:
      description: "Invalid sort, limit outside 1-200, q over 100 characters or only one of source/externalId supplied (`invalid_request`); unreadable cursor or sort mismatch (`invalid_request` / `invalid_cursor`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditInvalid:
      description: "Malformed body, parentId on a person or null name (`invalid_request`); invalid name, alias, language, external ID or list (`work_info_*`, field, limit); parent is self or descendant (`organization_parent_cycle`). No changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditNotFound:
      description: "Missing id/targetId entity or parent organization (field: parentId), with `not_found` / `person_not_found` or `organization_not_found`; no changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditExternalIdTaken:
      description: "Another entity of the same kind owns an external ID (`conflict` / `external_id_taken`, field: externalIds[i]); no changes. Look up that external ID and reuse its entity if intended."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditMergeInvalid:
      description: "Malformed body (`invalid_request`); empty/over-20,000 sourceIds or merged alias/external-ID limits (`work_info_too_many`, field, limit); target among sources (`merge_same_person`, `merge_same_organization`); source organization is a target ancestor (`organization_parent_cycle`). No changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditDeleteInvalid:
      description: "Malformed body (`invalid_request`) or empty/over-20,000 ids (`work_info_too_many`, field: ids, limit); no changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TagKindNameInvalid:
      description: "Malformed body (`invalid_request`) or invalid name (`tag_name_empty`, `tag_name_control_characters`, `tag_name_too_long`, limit); no changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TagKindNameConflict:
      description: "Another kind has the same name (`conflict` / `tag_kind_name_taken`, tagName); no changes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      description: "Same error shape as the UI API, with the additional index field."
      properties:
        code:
          type: string
          description: "Machine-readable error code."
          enum:
            - unauthenticated
            - invalid_request
            - not_found
            - conflict
            - media_folders_not_configured
            - internal
        message:
          type: string
          description: "English explanation; clients should branch on code and reason."
        reason:
          $ref: "#/components/schemas/ErrorReason"
        limit:
          type: integer
          description: "Limit for the reason; present only when that reason has a limit."
        index:
          type: integer
          description: "Zero-based position in tags for tag-name errors, items for display-name/thumbnail/work-info operations, or videos otherwise."
        field:
          type: string
          description: "Property path using JSON names and array indices, such as people[0].person.id, aliases[2].language, externalIds[1] or parentId. For bulk work-info updates, relative to the item workInfo; present only for work_info_*, person_not_found, organization_not_found or external_id_taken."
        tagId:
          type: integer
          format: int64
          description: "Conflicting tag ID; only for tag_name_taken or tag_merge_required."
        tagName:
          type: string
          description: "Untranslated original name of the conflicting tag for tag_name_taken or tag_merge_required; conflicting kind name for tag_kind_name_taken."
    ErrorReason:
      type: string
      description: "Specific reason within an error code."
      enum:
        - invalid_cursor
        - too_many_videos
        - too_many_tags
        - tag_name_empty
        - tag_name_control_characters
        - tag_name_too_long
        - video_not_found
        - no_scan
        - display_name_control_characters
        - display_name_too_long
        - duration_unknown
        - thumbnail_position_out_of_range
        - thumbnail_frame_unavailable
        - file_unavailable
        - tag_not_found
        - tag_name_taken
        - tag_merge_required
        - merge_same_tag
        - work_info_control_characters
        - work_info_too_long
        - work_info_too_many
        - work_info_invalid_date
        - work_info_invalid_url
        - work_info_invalid_language
        - work_info_duplicate
        - work_info_empty
        - work_info_out_of_range
        - person_not_found
        - organization_not_found
        - organization_parent_cycle
        - merge_same_person
        - merge_same_organization
        - external_id_taken
        - tag_kind_not_found
        - tag_kind_name_taken

    Tag:
      type: object
      required: [id, name, synonyms, videoCount, tentative, createdAt, kind]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: "Natural-name order."
          items:
            type: string
        videoCount:
          type: integer
          description: "Number of videos currently in the library."
        tentative:
          type: boolean
          description: "Tentative tag created automatically and not yet confirmed."
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp used by createdDesc and createdAsc sorting."
        kind:
          anyOf:
            - $ref: "#/components/schemas/TagKindRef"
            - type: "null"
          description: "Tag kind; null means unclassified."

    TagKindRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: "Tag kind ID and name."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    TagKind:
      type: object
      required: [id, name, tagCount, createdAt]
      additionalProperties: false
      description: "One entry in the kind list."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tagCount:
          type: integer
          description: "Number of tags of this kind, including tentative tags."
        createdAt:
          type: string
          format: date-time
          description: "Kind creation timestamp, with second precision."

    TagKindList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "All kinds in ID order."
          items:
            $ref: "#/components/schemas/TagKind"

    TagKindCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Kind name normalized like a tag name and unique among kinds."

    TagKindRenameRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "New name normalized like a tag name and unique among kinds."

    TagKindDeleteRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          description: "Kind IDs to delete: 1-20,000; otherwise invalid_request."
          items:
            type: integer
            format: int64

    TagKindDeleteResponse:
      type: object
      required: [deletedIds, notFoundIds]
      additionalProperties: false
      description: "Disjoint lists whose union is the deduplicated ids, each preserving input order; empty lists are []."
      properties:
        deletedIds:
          type: array
          description: "Deleted kinds."
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: "Missing kinds."
          items:
            type: integer
            format: int64

    TagList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          description: "Count matching q, tentative and unused, independent of pagination."
        totalAll:
          type: integer
          description: "Total tag count, independent of pagination."
        nextCursor:
          type: string
          description: "Cursor for the next page; present only when limit is supplied and more results remain."

    TagSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: "name uses natural-name order; countDesc/countAsc use video counts; createdDesc/createdAsc use creation time. Ties use natural-name order, then ID."
    TagMergeRequest:
      type: object
      required: [targetId, sourceIds]
      additionalProperties: false
      properties:
        targetId:
          type: integer
          format: int64
          description: "Target receiving assignments, names and synonyms; becomes confirmed."
        sourceIds:
          type: array
          description: "Source IDs: 1-20,000 submitted entries, counting duplicates but merging once; otherwise too_many_tags."
          items:
            type: integer
            format: int64

    TagMergeResponse:
      type: object
      required: [tag, notFoundIds]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        notFoundIds:
          type: array
          description: "Missing sources skipped during merge; empty when none."
          items:
            type: integer
            format: int64

    TagRenameRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "New original name, normalized using tag-name rules."

    TagSynonymsRequest:
      type: object
      required: [id, action, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: "Tag whose synonyms change."
        action:
          type: string
          description: "add attaches; remove detaches."
          enum: [add, remove]
        name:
          type: string
          description: "Synonym normalized using tag-name rules."
        mergeTagId:
          type: integer
          format: int64
          description: "For add only: ID authorizing a merge, taken from tag_merge_required.tagId. Ignored unless the name is another tag's original name."
    TagBatchRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          description: "confirm confirms tentative tags; reject removes them and remembers original names; delete removes confirmed tags. setKind assigns kindId and clearKind removes it, without confirming tentative tags."
          enum: [confirm, reject, delete, setKind, clearKind]
        kindId:
          type: integer
          format: int64
          minimum: 1
          description: "Kind assigned by setKind; supplying it for any other action returns invalid_request."
        ids:
          type: array
          description: "Target IDs: 1-20,000 submitted entries, counting duplicates but processing once; otherwise too_many_tags."
          items:
            type: integer
            format: int64

    TagBatchResponse:
      type: object
      required: [appliedIds, notFoundIds, notApplicableIds]
      additionalProperties: false
      description: "Three disjoint lists whose union is the deduplicated ids, each preserving input order; empty when none."
      properties:
        appliedIds:
          type: array
          description: "Processed tags."
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: "Missing tags."
          items:
            type: integer
            format: int64
        notApplicableIds:
          type: array
          description: "Tags incompatible with the action, left unchanged."
          items:
            type: integer
            format: int64

    RejectedTagNameList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "Rejected names in natural-name order; empty when none."
          items:
            type: string
        total:
          type: integer
          description: "Total rejected-name count."
        nextCursor:
          type: string
          description: "Continuation cursor, present only when more remain."

    RejectedTagNameForgetResult:
      type: object
      required: [name, removed]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Normalized spelling matched, or the submitted name if normalization failed."
        removed:
          type: boolean
          description: "True if removed from rejected names; false and unchanged if absent."

    ExternalVideo:
      type: object
      required:
        [
          id,
          contentKey,
          title,
          fileTitle,
          displayName,
          thumbnailPositionMs,
          durationMs,
          addedAt,
          updatedAt,
          fileCreatedAt,
          locations,
          tags,
          workInfo,
        ]
      additionalProperties: false
      description: "One video viewed as owner, including private videos."
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
          description: "Content-derived identifier, stable across file moves."
        title:
          type: string
          description: "Display name when set; otherwise the title of the representative first location."
        fileTitle:
          type: string
          description: "Representative location filename without extension."
        displayName:
          type: [string, "null"]
          description: "Display name, or null when unset."
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: "Thumbnail position in milliseconds; null selects the automatic position."
        durationMs:
          type: [integer, "null"]
          format: int64
          description: "Duration in milliseconds; null before probing."
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: "Last edit to display name, tags, visibility, thumbnail or work information; equals addedAt before any edit. video-tags, display-names and video-work-info operations advance it too."
        fileCreatedAt:
          type: string
          format: date-time
          description: "Creation time of the representative first location; falls back to file mtime when unavailable."
        locations:
          type: array
          description: "Current locations under registered folders, ordered by path with the representative first."
          items:
            $ref: "#/components/schemas/ExternalVideoLocation"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideoTag"
        workInfo:
          $ref: "#/components/schemas/WorkInfo"

    ExternalVideoLocation:
      type: object
      required: [path, fileName]
      additionalProperties: false
      properties:
        path:
          type: string
          description: "Absolute path in filesystem spelling, including NFD."
        fileName:
          type: string
          description: "Final path component."

    ExternalVideoTag:
      type: object
      required: [id, name, manual, fromFolder, tentative]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        manual:
          type: boolean
          description: "Manually assigned; mutable through this API."
        fromFolder:
          type: boolean
          description: "Derived from ancestor folder names; cannot be removed through this API."
        tentative:
          type: boolean
          description: "Tentative tag created automatically and not yet confirmed."

    ExternalVideoPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideo"
        nextCursor:
          type: string
          description: "Cursor for the next page; empty string when none remains."

    VideoRef:
      type: object
      additionalProperties: false
      description: "Exactly one of id, contentKey or path. Paths match current locations under registered folders byte-for-byte without normalization."
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
        path:
          type: string

    VideoTagsRequest:
      type: object
      required: [videos, action, tags]
      additionalProperties: false
      properties:
        videos:
          type: array
          description: "1-20,000 entries; otherwise too_many_videos."
          items:
            $ref: "#/components/schemas/VideoRef"
        action:
          type: string
          description: "add attaches, remove detaches, and replace makes manual tags exactly the supplied set; an empty set clears all manual tags."
          enum: [add, remove, replace]
        tags:
          type: array
          description: "Tag names or synonyms, at most 100; add/remove require at least one. Out-of-range counts return too_many_tags."
          items:
            type: string
        tentative:
          type: boolean
          default: false
          description: "For add/replace, create unknown names as tentative tags, skipping exact-spelling rejected names into skippedTags. Existing tags are attached without changing their state; has no effect on remove."
    VideoTagsResponse:
      type: object
      required: [items, skippedTags]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "In videos order."
          items:
            $ref: "#/components/schemas/VideoTagsItem"
        skippedTags:
          type: array
          description: "Rejected names skipped by tentative add/replace, normalized and deduplicated in tags order; [] when none."
          items:
            type: string

    VideoTagsItem:
      type: object
      required: [video, tags]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        tags:
          type: array
          description: "Resulting manual and folder-derived tags, with provenance."
          items:
            $ref: "#/components/schemas/ExternalVideoTag"

    VideoTagsVideo:
      type: object
      required: [id, contentKey]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string

    VideoDisplayNamesRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "1-20,000 entries; otherwise too_many_videos."
          items:
            $ref: "#/components/schemas/VideoDisplayNameChange"

    VideoDisplayNameChange:
      type: object
      required: [video, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        displayName:
          type: [string, "null"]
          description: "Display name; null or whitespace-only clears it. No control characters; at most 200 code points after normalization."
    VideoDisplayNamesResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "In items order."
          items:
            $ref: "#/components/schemas/VideoDisplayNamesItem"

    VideoDisplayNamesItem:
      type: object
      required: [video, title, fileTitle, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        title:
          type: string
          description: "Resulting effective title."
        fileTitle:
          type: string
          description: "Representative location filename without extension."
        displayName:
          type: [string, "null"]
          description: "Resulting display name, or null when cleared."

    VideoThumbnailsRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "1-20 entries; otherwise too_many_videos."
          items:
            $ref: "#/components/schemas/VideoThumbnailChange"

    VideoThumbnailChange:
      type: object
      required: [video, positionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        positionMs:
          type: [integer, "null"]
          format: int64
          description: "Thumbnail position in milliseconds, nonnegative and below duration; null restores the automatic position."
    VideoThumbnailsResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "In items order."
          items:
            $ref: "#/components/schemas/VideoThumbnailsItem"

    VideoThumbnailsItem:
      type: object
      required: [video, thumbnailPositionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: "Resulting position, or null when cleared."

    ExternalScan:
      type: object
      required:
        [id, status, startedAt, finishedAt, videos, settledVideos, errorCode]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: "Same status as the UI Scan API: failed for traversal failure, finding while counting, running while traversal or pending work remains, partial for item failures, otherwise done."
          enum: [finding, running, done, partial, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: "Traversal completion timestamp; null while traversing."
        videos:
          type: [integer, "null"]
          description: "Video count; null during finding before counting finishes."
        settledVideos:
          type: [integer, "null"]
          description: "Videos with no remaining work; null during finding, then between zero and videos inclusive."
        errorCode:
          type: [string, "null"]
          description: "Traversal failure code, present only when status is failed."

    VideoWorkInfoRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "1-20,000 entries; otherwise too_many_videos."
          items:
            $ref: "#/components/schemas/VideoWorkInfoChange"

    VideoWorkInfoChange:
      type: object
      required: [video, workInfo]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        workInfo:
          $ref: "#/components/schemas/WorkInfoInput"

    VideoWorkInfoResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "In items order."
          items:
            $ref: "#/components/schemas/VideoWorkInfoItem"

    VideoWorkInfoItem:
      type: object
      required: [video, workInfo]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        workInfo:
          $ref: "#/components/schemas/WorkInfo"

    CreditRef:
      type: object
      required: [id, name, provisional]
      additionalProperties: false
      description: "Reference to one person or organization; name is its current name, \"\" for a provisional person."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provisional:
          type: boolean
          description: "True for a person without a canonical name, whose name is then \"\"; always false for an organization."

    CreditIdRef:
      type: object
      required: [id]
      additionalProperties: false
      description: "Write reference to one person or organization."
      properties:
        id:
          type: integer
          format: int64

    Alias:
      type: object
      required: [name]
      additionalProperties: false
      description: "One person or organization alias."
      properties:
        name:
          type: string
        language:
          type: string
          description: "BCP 47 language tag; omitted when absent."

    ExternalId:
      type: object
      required: [source, value]
      additionalProperties: false
      description: "One identifier from an external source."
      properties:
        source:
          type: string
        value:
          type: string

    WorkDateKind:
      type: string
      enum: [release, recorded, published]
      description: "Date kind."

    WorkPersonRole:
      type: string
      enum: [performer, director, photographer, streamer]
      description: "Person role in a video."

    WorkOrganizationRole:
      type: string
      enum: [maker, label]
      description: "Organization role in a video."

    WorkDate:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: string
          description: "YYYY, YYYY-MM or YYYY-MM-DD; a full date must be valid in the calendar."
          examples: ["2024", "2024-02", "2024-02-29"]

    WorkPerson:
      type: object
      required: [role, person, provisional]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditRef"
        provisional:
          type: boolean
          description: "Same as person.provisional."

    WorkOrganization:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditRef"

    WorkInfo:
      type: object
      required:
        [code, description, dates, people, organizations, urls, externalIds]
      additionalProperties: false
      description: "Video work information with the same seven properties as the UI API; unset code/description are null and empty lists are []."
      properties:
        code:
          type: [string, "null"]
          description: "Product code."
        description:
          type: [string, "null"]
          description: "Description, potentially including newlines."
        dates:
          type: array
          description: "Kind order: release, recorded, published."
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: array
          description: "Role order, then input order within each role; name is the person's current name."
          items:
            $ref: "#/components/schemas/WorkPerson"
        organizations:
          type: array
          description: "Role order, then input order within each role; name is the organization's current name."
          items:
            $ref: "#/components/schemas/WorkOrganization"
        urls:
          type: array
          description: "Input order."
          items:
            type: string
        externalIds:
          type: array
          description: "Ordered by (source, value)."
          items:
            $ref: "#/components/schemas/ExternalId"

    WorkPersonInput:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditIdRef"

    WorkOrganizationInput:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditIdRef"

    WorkInfoInput:
      type: object
      additionalProperties: false
      description: "Full replacement using the UI WorkInfoInput shape and validation rules. All properties may be omitted or null; either clears the property."
      properties:
        code:
          type: [string, "null"]
        description:
          type: [string, "null"]
        dates:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkPersonInput"
        organizations:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkOrganizationInput"
        urls:
          type: [array, "null"]
          items:
            type: string
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"

    Person:
      type: object
      required: [id, name, provisional, aliases, externalIds, profile, videoCount, createdAt]
      additionalProperties: false
      description: "One person."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provisional:
          type: boolean
          description: "True while the person has no canonical name; name is then \"\". Setting a name makes the person ordinary."
        aliases:
          type: array
          description: "Natural-name order; [] when empty."
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: "Ordered by (source, value); [] when empty."
          items:
            $ref: "#/components/schemas/ExternalId"
        profile:
          $ref: "#/components/schemas/PersonProfile"
        videoCount:
          type: integer
          description: "Visible videos linked to this person in any role."
        createdAt:
          type: string
          format: date-time

    PersonProfile:
      type: object
      additionalProperties: false
      description: "A person's profile; each property is omitted when unknown. Values out of range or format return 400 with a work_info_* reason and field profile.<name>."
      properties:
        gender:
          type: string
          enum: [female, male, other]
        birthDate:
          type: string
          description: "YYYY, YYYY-MM or YYYY-MM-DD, not after today in UTC."
          examples: ["1990", "1990-05", "1990-05-17"]
        deathDate:
          type: string
          description: "Same format as birthDate; not before it at the precision both share."
        birthplace:
          type: string
          description: "1-200 code points."
        heightCm:
          type: integer
          description: "50-300."
        bustCm:
          type: integer
          description: "30-300."
        waistCm:
          type: integer
          description: "30-300."
        hipsCm:
          type: integer
          description: "30-300."
        cup:
          type: string
          description: "1-3 Latin letters, stored upper case."
        bloodType:
          type: string
          enum: [A, B, O, AB]
        careerStartYear:
          type: integer
          description: "1900-9999."
        careerEndYear:
          type: integer
          description: "1900-9999; not before careerStartYear."
        bio:
          type: string
          description: "1-5,000 code points; line breaks are kept."
        links:
          type: array
          description: "HTTP(S) URLs in order, at most 20 and unique; omitted when empty."
          items:
            type: string

    PersonProfilePatch:
      type: object
      additionalProperties: false
      description: "Profile update: each property present replaces that field, null or an empty value clears it, and links replaces the list."
      properties:
        gender:
          type: [string, "null"]
          description: "female, male or other."
        birthDate:
          type: [string, "null"]
          description: "YYYY, YYYY-MM or YYYY-MM-DD, not after today in UTC."
          examples: ["1990", "1990-05", "1990-05-17"]
        deathDate:
          type: [string, "null"]
          description: "Same format as birthDate; not before it at the precision both share."
        birthplace:
          type: [string, "null"]
          description: "1-200 code points."
        heightCm:
          type: [integer, "null"]
          description: "50-300."
        bustCm:
          type: [integer, "null"]
          description: "30-300."
        waistCm:
          type: [integer, "null"]
          description: "30-300."
        hipsCm:
          type: [integer, "null"]
          description: "30-300."
        cup:
          type: [string, "null"]
          description: "1-3 Latin letters, stored upper case."
        bloodType:
          type: [string, "null"]
          description: "A, B, O or AB."
        careerStartYear:
          type: [integer, "null"]
          description: "1900-9999."
        careerEndYear:
          type: [integer, "null"]
          description: "1900-9999; not before careerStartYear."
        bio:
          type: [string, "null"]
          description: "1-5,000 code points; line breaks are kept."
        links:
          type: [array, "null"]
          description: "HTTP(S) URLs in order, at most 20 and unique; omitted when empty."
          items:
            type: string

    Organization:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt, parent]
      additionalProperties: false
      description: "One organization; same fields as Person plus its parent."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: "Natural-name order; [] when empty."
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: "Ordered by (source, value); [] when empty."
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: "Visible videos linked to this organization in any role."
        createdAt:
          type: string
          format: date-time
        parent:
          type: [object, "null"]
          required: [id, name]
          additionalProperties: false
          description: "Parent organization as CreditRef; null for a root."
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string

    CreditInput:
      type: object
      required: [name]
      additionalProperties: false
      description: "Person or organization creation body; parentId is organization-only and profile person-only."
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: integer
          format: int64
          description: "Parent organization ID; sending it for a person returns 400 invalid_request."
        profile:
          $ref: "#/components/schemas/PersonProfile"
          description: "Person-only profile; sending it for an organization returns 400 invalid_request."

    CreditUpdateRequest:
      type: object
      required: [id]
      additionalProperties: false
      description: "Update body: id is required; omitted properties remain unchanged. Lists are replaced entirely and null clears them; organization-only parentId null removes the parent."
      properties:
        id:
          type: integer
          format: int64
          description: "Entity to update."
        name:
          type: string
        aliases:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: [integer, "null"]
          format: int64
          description: "Parent organization ID; null detaches it. Sending this for a person returns 400 invalid_request."
        profile:
          $ref: "#/components/schemas/PersonProfilePatch"
          description: "Person-only; sending it for an organization returns 400 invalid_request. A profile that changes nothing writes nothing."

    CreditMergeRequest:
      type: object
      required: [targetId, sourceIds]
      additionalProperties: false
      properties:
        targetId:
          type: integer
          format: int64
          description: "Target receiving links, names and external IDs."
        sourceIds:
          type: array
          description: "1-20,000 source IDs; otherwise work_info_too_many with field sourceIds."
          items:
            type: integer
            format: int64

    CreditDeleteRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          description: "1-20,000 IDs to delete; otherwise work_info_too_many with field ids."
          items:
            type: integer
            format: int64

    CreditDeleteResponse:
      type: object
      required: [deletedIds, notFoundIds]
      additionalProperties: false
      description: "Disjoint deduplicated lists in ids order; [] when empty."
      properties:
        deletedIds:
          type: array
          description: "Deleted entities."
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: "Missing entities."
          items:
            type: integer
            format: int64

    PersonList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: "Person list."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        total:
          type: integer
          description: "Person count matching q or external ID, independent of pagination."
        totalAll:
          type: integer
          description: "Total person count."
        nextCursor:
          type: string
          description: "Cursor for the next page; present only with limit and remaining results."

    OrganizationList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: "Organization list."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          type: integer
          description: "Organization count matching q or external ID, independent of pagination."
        totalAll:
          type: integer
          description: "Total organization count."
        nextCursor:
          type: string
          description: "Cursor for the next page; present only with limit and remaining results."

    PersonMergeResponse:
      type: object
      required: [person, notFoundIds]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        notFoundIds:
          type: array
          description: "Missing sources skipped during merge; [] when none."
          items:
            type: integer
            format: int64

    OrganizationMergeResponse:
      type: object
      required: [organization, notFoundIds]
      additionalProperties: false
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        notFoundIds:
          type: array
          description: "Missing sources skipped during merge; [] when none."
          items:
            type: integer
            format: int64

    CreditSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc, ageAsc, ageDesc]
      default: name
      description: "The five TagSort modes, plus ageAsc (newest birth date first) and ageDesc (oldest first) for people only; organizations answer either with 400 invalid_request. A partial birth date sorts as its first possible day, and people without one come last in both age sorts. Ties use natural-name order, then ID."
