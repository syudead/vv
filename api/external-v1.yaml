# vv の外部連携 API v1 の契約。このファイルが外部連携 API の唯一の真実であり、
# Go（oapi-codegen、api/oapi-codegen-external.yaml）だけをここから生成する。
# 生成物（internal/httpapi/extgen/）は手編集しない。型を変えるときはこのファイルを直し、
# task generate を実行すること。画面の API（api/openapi.yaml）とは別の約束である
# （specs/026-external-api/research.md R-5）。
#
# 互換の方針: v1 の中では項目と操作の追加だけを行う。既存の項目の意味・型・必須を変えるときは
# v2 を足す（docs/how-to/external-api.md）。
openapi: 3.1.0

info:
  title: vv external API
  version: 1.0.0
  summary: 外部ツールが API トークンで vv を操作するための API
  description: |
    すべての操作は `Authorization: Bearer <token>` で認証する。トークンは設定ページの
    「API トークン」節で所有者が発行する。トークンが無い・形式が違う・無効・失効済みのときは
    `401` `unauthenticated` と `WWW-Authenticate: Bearer` を返す。Cookie は読まない。

    見る人は常に所有者で、非公開の動画も返す。同一オリジンの検査はかけない。本文を取る操作は
    `Content-Type: application/json` を要する（specs/026-external-api/contracts/external-api.md §1）。

servers:
  - url: /api/v1
    description: アプリケーション自身が配信する

security:
  - bearerAuth: []

paths:
  /videos:
    get:
      operationId: listVideos
      summary: 動画の一覧をページを分けて返す
      description: |
        登録フォルダの下に所在を 1 つ以上持つ動画を `(addedAt, id)` の昇順で返す。`nextCursor` が
        空文字列になるまで、前回の `nextCursor` を `cursor` に渡してたどると全件を読める。
        変更の追跡はしない。新しい動画を知るには一覧を読み直し、持っている動画が消えたことは
        `lookup` の `404` で知る（contracts/external-api.md §2）。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない。省略すると先頭から
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数。範囲外は `400` `invalid_request`
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 動画の一覧 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideoPage"
        "400":
          description: >-
            limit が範囲外、またはカーソルを解釈できない（`invalid_request`、カーソルは
            `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /videos/lookup:
    get:
      operationId: lookupVideo
      summary: 動画を 1 本、id・内容キー・パスのどれかで引く
      description: |
        `id`・`contentKey`・`path` のちょうど 1 つを取る。0 個・2 個以上は `400` `invalid_request`。
        `path` は正規化せず、今の所在の `path` とバイト列で完全一致させる。一覧が返した `path` を
        そのまま渡せば引ける（contracts/external-api.md §2）。
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: contentKey
          in: query
          schema:
            type: string
        - name: path
          in: query
          description: 所在の絶対パス
          schema:
            type: string
      responses:
        "200":
          description: 動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideo"
        "400":
          description: 指定がちょうど 1 つでない（`invalid_request`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 無い、または登録フォルダの下に所在が無い（`not_found` / `video_not_found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-tags:
    post:
      operationId: updateVideoTags
      summary: 複数の動画に名前で指定したタグを付ける・外す・置き換える
      description: |
        1 つのトランザクションで行う。付け外しの対象は手で付けたタグだけで、祖先のフォルダ名から
        付くタグは残る（`replace` の後も）。名前はシノニムを含めて引き、`add`・`replace` では無い名前の
        タグを作る。`remove` ではどのタグにも当たらない名前は何もしない。同じタグに当たる名前は 1 つに
        まとめる。引けない動画が 1 つでもあれば `404` で何も反映しない（contracts/external-api.md §4）。
        `tentative` が真の `add`・`replace` では、新しく作るタグを仮のタグにし、却下した名前を飛ばして
        `skippedTags` に返す（specs/031-tentative-tags/contracts/external-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: 各動画の操作後のタグ（`videos` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          description: >-
            本文の形が違う・`action` が不正・動画の指定がちょうど 1 つでない（`invalid_request`）、
            件数の上限（`too_many_videos`・`too_many_tags`、`limit`）、タグ名の誤り
            （`tag_name_empty`・`tag_name_control_characters`・`tag_name_too_long`、`index` は `tags` の位置）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画がある（`not_found` / `video_not_found`、`index` は `videos` の位置）。
            何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-display-names:
    post:
      operationId: updateVideoDisplayNames
      summary: 複数の動画の表示名を設定・解除する
      description: |
        1 つのトランザクションで行う。`displayName` が `null`、または前後の空白を除いて空なら解除し、
        ファイル名由来の題名に戻す。表示名は内容（`contentKey`）に結び、同じ内容の全所在に効く。
        引けない動画や規則に合わない名前が 1 つでもあれば何も反映しない
        （specs/029-video-overrides/contracts/external-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoDisplayNamesRequest"
      responses:
        "200":
          description: 各動画の反映後の題名（`items` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDisplayNamesResponse"
        "400":
          description: >-
            本文の形が違う・動画の指定がちょうど 1 つでない（`invalid_request`、`index`）、件数の上限
            （`too_many_videos`、`limit`）、表示名の誤り（`display_name_control_characters`・
            `display_name_too_long`（`limit`）、`index` は `items` の位置）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画がある（`not_found` / `video_not_found`、`index` は `items` の位置）。
            何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-thumbnails:
    post:
      operationId: updateVideoThumbnails
      summary: 複数の動画の代表サムネイルの位置を設定・解除する
      description: |
        先に全件の引き当てと位置の検証を行い、誤りがあれば何も反映しない。通ったら `items` の順に
        1 件ずつ、その位置の場面で代表サムネイルを作り直して位置を記録する。`positionMs` が `null` なら
        解除し、自動の位置で作り直す。途中の 1 件で画像を作れなければ `409`
        `thumbnail_frame_unavailable` と `index` で止まり、それより前の項目は反映済み、その項目と後は
        未反映である（specs/029-video-overrides/contracts/external-api.md §2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoThumbnailsRequest"
      responses:
        "200":
          description: 各動画の反映後の位置（`items` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoThumbnailsResponse"
        "400":
          description: >-
            本文の形が違う・動画の指定がちょうど 1 つでない（`invalid_request`、`index`）、件数の上限
            （`too_many_videos`、`limit: 20`）、尺以上か負の位置（`thumbnail_position_out_of_range`、
            `index`、`limit` はその動画の尺のミリ秒）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画（`video_not_found`）、どの所在も開けない動画（`file_unavailable`）がある。
            `index` は `items` の位置。何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            解析が終わっていない動画がある（`conflict` / `duration_unknown`、何も反映しない）、または
            途中の 1 件で画像を作れなかった（`conflict` / `thumbnail_frame_unavailable`、`index` より前は
            反映済み）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-work-info:
    post:
      operationId: updateVideoWorkInfo
      summary: 複数の動画の作品情報をまるごと置き換える
      description: |
        各項目の `workInfo` は保存済みの作品情報をまるごと置き換える。省いた・`null`・前後の空白を除いて
        空のプロパティは解除で、`{}` はすべてを解除する。人物と団体は id で指す（id は `/people`・
        `/organizations` の外部 ID での検索か作成で得る）。1 つのトランザクションで行い、誤りが 1 つでも
        あれば何も反映しない。同じ動画を 2 度指せば後の項目が勝つ。同じ要求を繰り返しても状態は変わらない
        （specs/047-video-work-info/contracts/external-api.md「POST /api/v1/video-work-info」）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoWorkInfoRequest"
      responses:
        "200":
          description: 各動画の反映後の作品情報（`items` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWorkInfoResponse"
        "400":
          description: >-
            本文の形が違う・動画の指定がちょうど 1 つでない（`invalid_request`、`index`）、件数の上限
            （`too_many_videos`、`limit`）、項目の規則違反（`work_info_*`、`field` は項目の `workInfo` の中の
            経路、`limit`、`index` は `items` の位置）。何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画（`video_not_found`）、無い人物・団体を指す項目（`person_not_found`・
            `organization_not_found`、`field`）がある。`index` は `items` の位置。何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags:
    get:
      operationId: listTags
      summary: タグの一覧を返す
      description: |
        画面のタグ管理の `GET /api/tags` と同じ検索・絞り込み・並び順・ページで返す。`q`・`tentative`・
        `unused` は全部のタグに AND で掛かり、`sort` の順に並べる。`limit` を付けると 1 ページずつ返し、
        続きがあれば `nextCursor` を入れる。`limit` を省くと条件に合う全件を返し、`nextCursor` は入らない
        （specs/039-external-tag-admin/contracts/external-api.md §1）。
      parameters:
        - name: q
          in: query
          description: |
            検索語。全角・半角、大文字・小文字、ひらがな・カタカナなどの表記の揺れを吸収した形
            （照合形）にして前後の空白を落とし、空でなければ元の名前かシノニムに部分一致する
            タグだけにする。語の分解はしない
          schema:
            type: string
            maxLength: 100
        - name: tentative
          in: query
          description: true なら仮のタグだけにする
          schema:
            type: boolean
            default: false
        - name: unused
          in: query
          description: true なら本数 0 のタグだけにする
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/TagSort"
        - name: cursor
          in: query
          description: |
            前回の応答が返した `nextCursor`。中身は不透明で、解釈しない。同じ `q`・`tentative`・
            `unused`・`sort` で続けて使う。`limit` を省いたときは無視する
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数。省くと全件を返し、`nextCursor` は入らない
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: タグの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          description: >-
            `sort` が 5 値の外、`limit` が 1〜200 の外、`q` が 100 文字を超える（`invalid_request`）、
            カーソルを解釈できないか別の `sort` で作ったもの（`invalid_request` / `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/merge:
    post:
      operationId: mergeTags
      summary: 複数のタグを 1 つのタグへ統合する
      description: |
        1 つのトランザクションで、統合元それぞれの元の名前とシノニムを統合先のシノニムにし、付与を
        統合先へ移して統合元を消す。統合先は確定したタグになる。無い統合元は飛ばして `notFoundIds` に
        返し、統合元がすべて無ければ `tag` は変わらない統合先である。画面の `POST /api/tags/{id}/merge`
        と同じ保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMergeResponse"
        "400":
          description: >-
            本文の形が違う（`invalid_request`）、`sourceIds` が空か 20,000 件を超える（`too_many_tags`、
            `limit`）、`sourceIds` が `targetId` を含む（`merge_same_tag`、何も変えない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`targetId` のタグが無い（`not_found` / `tag_not_found`）。何も変えない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rename:
    post:
      operationId: renameTag
      summary: タグの元の名前を変える
      description: |
        名前が変われば仮のタグは確定する。今と同じ名前なら何も変えない。画面の `PATCH /api/tags/{id}` と
        同じ保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRenameRequest"
      responses:
        "200":
          description: 変更後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: >-
            本文の形が違う（`invalid_request`）、名前の規則違反（`tag_name_empty`・
            `tag_name_control_characters`・`tag_name_too_long`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`id` のタグが無い（`not_found` / `tag_not_found`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            名前が別のタグの元の名前かシノニム、または `id` 自身のシノニム（`conflict` / `tag_name_taken`、
            `tagId`・`tagName`）。何も変えない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/synonyms:
    post:
      operationId: updateTagSynonyms
      summary: タグのシノニムを足す・外す
      description: |
        `add` は名前をシノニムに足し、名前を足したら仮のタグを確定する。既に `id` のシノニムなら何も
        変えない。名前が別のタグ S の元の名前なら、`mergeTagId` が S のときだけ S を `id` へ統合し、
        そうでなければ `409 tag_merge_required`（`tagId` は S）で何も変えない。`remove` はシノニムで
        ない名前なら何も変えずにタグを返す。画面の `POST`・`DELETE /api/tags/{id}/synonyms` と同じ
        保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSynonymsRequest"
      responses:
        "200":
          description: 変更後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: >-
            本文の形が違う・`action` が 2 値の外（`invalid_request`）、`add` で名前の規則違反
            （`tag_name_empty`・`tag_name_control_characters`・`tag_name_too_long`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`id` のタグが無い（`not_found` / `tag_not_found`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `add` で、名前が `id` 自身の元の名前か別のタグのシノニム（`conflict` / `tag_name_taken`）、
            または別のタグの元の名前で `mergeTagId` がそのタグでない（`conflict` / `tag_merge_required`）。
            どちらも `tagId`・`tagName` を返し、何も変えない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/batch:
    post:
      operationId: batchTags
      summary: 複数のタグをまとめて確定・却下・削除する
      description: |
        1 つのトランザクションで `ids` のタグに `action` を行う。`confirm`・`reject` は仮のタグに、`delete` は
        確定したタグに効き、種類の合わないタグは何も変えずに `notApplicableIds`、無い id は `notFoundIds`
        に返す。却下したタグの元の名前は却下した名前に入り、削除したタグの名前は覚えない。1 つのタグなら
        `ids: [id]` を送る。画面の `POST /api/tags/batch` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBatchRequest"
      responses:
        "200":
          description: 処理したタグ・無かったタグ・種類が合わず変えなかったタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBatchResponse"
        "400":
          description: >-
            本文の形が違う・`action` が 3 値の外（`invalid_request`）、`ids` が空か 20,000 件を超える
            （`too_many_tags`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rejected-names:
    get:
      operationId: listRejectedTagNames
      summary: 却下した名前を一覧する
      description: |
        却下した名前を名前の自然順でページに分けて返す。`total` は却下した名前の全部の数で、続きが
        あれば `nextCursor` を入れる。画面の `GET /api/tags/rejected-names` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §6）。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 却下した名前の 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameList"
        "400":
          description: >-
            `limit` が 1〜200 の外（`invalid_request`）、カーソルを解釈できない（`invalid_request` /
            `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: forgetRejectedTagName
      summary: 却下した名前を 1 つ外す
      description: |
        名前を却下した名前から外し、次に同じ名前を仮のタグとして付けるとタグがまた作られるようにする。
        名前はタグ名と同じ規則で整えてから照合する。一覧に無い名前や整えられない名前は何も変えずに
        `removed: false` を返す。画面の `DELETE /api/tags/rejected-names` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §7）。
      parameters:
        - name: name
          in: query
          required: true
          description: 外す名前
          schema:
            type: string
      responses:
        "200":
          description: 照合した名前と、外したかどうか
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameForgetResult"
        "400":
          description: "`name` が無い（`invalid_request`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /people:
    get:
      operationId: listPeople
      summary: 人物の一覧を返す、または外部 ID で人物を 1 件引く
      description: |
        画面の `GET /api/people` と同じ検索・並び順・ページで返す。`limit` を省くと条件に合う全件を返す。
        `source` と `externalId` を組で渡すと、その外部 ID を持つ人物（高々 1 件）だけを `items` に返し、
        無ければ空の `items` を返す。このとき `q`・`sort`・`cursor`・`limit` は読まない
        （specs/047-video-work-info/contracts/external-api.md「People and organizations」）。
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditSource"
        - $ref: "#/components/parameters/CreditExternalId"
      responses:
        "200":
          description: 人物の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          $ref: "#/components/responses/CreditListInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createPerson
      summary: 人物を作る
      description: |
        画面の `POST /api/people` と同じ保存先の操作を呼ぶ。他の外部連携の書き込みと同じく `200` を返す。
        作る前に外部 ID で検索し、既にあればその id を使う。人物に `parentId` を送ると `400`
        `invalid_request`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: 作った人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /people/update:
    post:
      operationId: updatePerson
      summary: 人物を書き換える
      description: |
        `id` の人物に、本文にあるプロパティだけを重ねる。一覧は丸ごと置き換え、`null` は一覧を空にする。
        画面の `PATCH /api/people/{id}` と同じ保存先の操作を呼ぶ。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditUpdateRequest"
      responses:
        "200":
          description: 書き換えた人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /people/merge:
    post:
      operationId: mergePeople
      summary: 複数の人物を 1 人へ統合する
      description: |
        1 つのトランザクションで、統合元の動画への結び付き・名前（別名になる）・外部 ID を統合先へ移し、
        統合元を消す。無い統合元は飛ばして `notFoundIds` に返す。画面の `POST /api/people/{id}/merge` と
        同じ保存先の操作を呼ぶ。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMergeResponse"
        "400":
          $ref: "#/components/responses/CreditMergeInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /people/delete:
    post:
      operationId: deletePeople
      summary: 人物を消す
      description: |
        `ids` の人物を、画面の `DELETE /api/people/{id}` と同じ保存先の操作で 1 人ずつ消す。動画への
        結び付きも外れる。無い id は誤りにせず `notFoundIds` に返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDeleteRequest"
      responses:
        "200":
          description: 消した人物と無かった人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDeleteResponse"
        "400":
          $ref: "#/components/responses/CreditDeleteInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations:
    get:
      operationId: listOrganizations
      summary: 団体の一覧を返す、または外部 ID で団体を 1 件引く
      description: |
        画面の `GET /api/organizations` と同じ検索・並び順・ページで返す。`limit` を省くと条件に合う全件を
        返す。`source` と `externalId` を組で渡すと、その外部 ID を持つ団体（高々 1 件）だけを `items` に
        返し、無ければ空の `items` を返す。このとき `q`・`sort`・`cursor`・`limit` は読まない
        （specs/047-video-work-info/contracts/external-api.md「People and organizations」）。
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditSource"
        - $ref: "#/components/parameters/CreditExternalId"
      responses:
        "200":
          description: 団体の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/CreditListInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createOrganization
      summary: 団体を作る
      description: |
        画面の `POST /api/organizations` と同じ保存先の操作を呼ぶ。他の外部連携の書き込みと同じく `200` を
        返す。作る前に外部 ID で検索し、既にあればその id を使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: 作った団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/update:
    post:
      operationId: updateOrganization
      summary: 団体を書き換える
      description: |
        `id` の団体に、本文にあるプロパティだけを重ねる。一覧は丸ごと置き換え、`null` は一覧を空にし、
        `parentId` の `null` は親を外す。画面の `PATCH /api/organizations/{id}` と同じ保存先の操作を呼ぶ。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditUpdateRequest"
      responses:
        "200":
          description: 書き換えた団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/CreditInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "409":
          $ref: "#/components/responses/CreditExternalIdTaken"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/merge:
    post:
      operationId: mergeOrganizations
      summary: 複数の団体を 1 つへ統合する
      description: |
        1 つのトランザクションで、統合元の動画への結び付き・名前（別名になる）・外部 ID を統合先へ移し、
        統合元の子を統合先の下へ付け替えて統合元を消す。無い統合元は飛ばして `notFoundIds` に返す。画面の
        `POST /api/organizations/{id}/merge` と同じ保存先の操作を呼ぶ。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMergeResponse"
        "400":
          $ref: "#/components/responses/CreditMergeInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CreditNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /organizations/delete:
    post:
      operationId: deleteOrganizations
      summary: 団体を消す
      description: |
        `ids` の団体を、画面の `DELETE /api/organizations/{id}` と同じ保存先の操作で 1 つずつ消す。動画への
        結び付きも外れ、子の団体は根になる。無い id は誤りにせず `notFoundIds` に返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDeleteRequest"
      responses:
        "200":
          description: 消した団体と無かった団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDeleteResponse"
        "400":
          $ref: "#/components/responses/CreditDeleteInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /scans:
    post:
      operationId: startScan
      summary: スキャンを始める
      description: |
        新しく始めたら `201`、実行中のものがあれば新しく始めずにそれを `200` で返す
        （contracts/external-api.md §5）。本文は取らない。
      responses:
        "201":
          description: 新しく始めたスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "200":
          description: 実行中だったスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: メディアフォルダが 1 つも登録されていない（`media_folders_not_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: 直近のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 一度もスキャンしていない（`not_found` / `no_scan`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 設定ページで発行した API トークン（`vvt_` で始まる 47 文字）。

  parameters:
    CreditQuery:
      name: q
      in: query
      description: |
        検索語。照合形にして前後の空白を落とし、空でなければ名前か別名に部分一致する実体だけにする
      schema:
        type: string
        maxLength: 100
    CreditSort:
      name: sort
      in: query
      description: 並び順
      schema:
        $ref: "#/components/schemas/CreditSort"
    CreditCursor:
      name: cursor
      in: query
      description: |
        前回の応答が返した `nextCursor`。同じ `q`・`sort` で続けて使う。`limit` を省いたときは無視する
      schema:
        type: string
    CreditLimit:
      name: limit
      in: query
      description: |
        1 ページの件数。省くと全件を返し、`nextCursor` は入らない。`source` と `externalId` での検索では読まない
      schema:
        type: integer
        minimum: 1
        maximum: 200
        # 外部 ID での検索は limit を読まないので、整数でない値も検索の前に断らないよう、
        # サーバーでは文字列のまま受けて一覧のときだけ整数に読む。
        x-go-type: string
    CreditSource:
      name: source
      in: query
      description: 外部 ID の情報源。`externalId` と組で渡すと、その外部 ID を持つ実体だけを返す
      schema:
        type: string
    CreditExternalId:
      name: externalId
      in: query
      description: 外部 ID の値。`source` と組で渡す
      schema:
        type: string

  responses:
    Unauthenticated:
      description: トークンが無い・形式が違う・無効・失効済み（`unauthenticated`）
      headers:
        WWW-Authenticate:
          description: 常に `Bearer`
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: 予期しない失敗（`internal`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditListInvalid:
      description: >-
        `sort` が 5 値の外、`limit` が 1〜200 の外、`q` が 100 文字を超える、`source` と `externalId` の片方
        だけ（`invalid_request`）、カーソルを解釈できないか別の `sort` で作ったもの（`invalid_request` /
        `invalid_cursor`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditInvalid:
      description: >-
        本文の形が違う・人物に `parentId` を送った・`name` が `null`（`invalid_request`）、名前・別名・言語・
        外部 ID・一覧の規則違反（`work_info_*`、`field`、`limit`）、親が自分か子孫の団体
        （`organization_parent_cycle`）。何も変えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditNotFound:
      description: >-
        `id`・`targetId` の実体、または（`field: parentId`）親の団体が無い（`not_found` /
        `person_not_found`・`organization_not_found`）。何も変えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditExternalIdTaken:
      description: >-
        送った外部 ID を同じ種類の別の実体が持つ（`conflict` / `external_id_taken`、`field` は
        `externalIds[i]`）。何も変えない。その実体を指すつもりなら外部 ID で検索してその id を使う
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditMergeInvalid:
      description: >-
        本文の形が違う（`invalid_request`）、`sourceIds` が空か 20,000 件を超える、または統合後の別名・
        外部 ID が上限を超える（`work_info_too_many`、`field`、`limit`）、`sourceIds` が `targetId` を含む
        （`merge_same_person`・`merge_same_organization`）、統合元の団体が統合先の祖先
        （`organization_parent_cycle`）。何も変えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CreditDeleteInvalid:
      description: >-
        本文の形が違う（`invalid_request`）、`ids` が空か 20,000 件を超える（`work_info_too_many`、
        `field: ids`、`limit`）。何も変えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      description: >-
        誤りの形は画面の API と同じで、index はこの API だけの項目である
        （contracts/external-api.md §1）。
      properties:
        code:
          type: string
          description: 機械可読なエラー種別。
          enum:
            - unauthenticated
            - invalid_request
            - not_found
            - conflict
            - media_folders_not_configured
            - internal
        message:
          type: string
          description: 英語の説明。利用者のプログラムは code と reason で分岐する
        reason:
          $ref: "#/components/schemas/ErrorReason"
        limit:
          type: integer
          description: reason の上限値。上限を持つ reason のときだけ入る
        index:
          type: integer
          description: >-
            原因になった要素の位置（0 から）。タグ名の誤りでは tags の、表示名・サムネイル・作品情報の
            操作では items の、それ以外では videos の位置を指す（contracts/external-api.md §4）
        field:
          type: string
          description: >-
            reason が指すプロパティの経路。JSON のプロパティ名を . でつなぎ、一覧の位置を [] で書く
            （people[0].person.id・aliases[2].language・externalIds[1]・parentId）。作品情報の一括操作では
            その項目の workInfo の中の経路である。work_info_*・person_not_found・organization_not_found・
            external_id_taken のときだけ入る（specs/047-video-work-info/contracts/screen-api.md
            「Added reason values and field」）
        tagId:
          type: integer
          format: int64
          description: >-
            名前がぶつかったタグの id。`tag_name_taken`・`tag_merge_required` のときだけ入る
            （specs/039-external-tag-admin/contracts/external-api.md §0）
        tagName:
          type: string
          description: >-
            名前がぶつかったタグの元の名前（翻訳しない）。`tag_name_taken`・`tag_merge_required` の
            ときだけ入る
    ErrorReason:
      type: string
      description: 同じ code の中で状況を区別する下位の理由。
      enum:
        - invalid_cursor
        - too_many_videos
        - too_many_tags
        - tag_name_empty
        - tag_name_control_characters
        - tag_name_too_long
        - video_not_found
        - no_scan
        - display_name_control_characters
        - display_name_too_long
        - duration_unknown
        - thumbnail_position_out_of_range
        - thumbnail_frame_unavailable
        - file_unavailable
        - tag_not_found
        - tag_name_taken
        - tag_merge_required
        - merge_same_tag
        - work_info_control_characters
        - work_info_too_long
        - work_info_too_many
        - work_info_invalid_date
        - work_info_invalid_url
        - work_info_invalid_language
        - work_info_duplicate
        - work_info_empty
        - person_not_found
        - organization_not_found
        - organization_parent_cycle
        - merge_same_person
        - merge_same_organization
        - external_id_taken

    Tag:
      type: object
      required: [id, name, synonyms, videoCount, tentative, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: 名前の自然順
          items:
            type: string
        videoCount:
          type: integer
          description: いまライブラリにある動画の本数
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していないタグ）
        createdAt:
          type: string
          format: date-time
          description: タグを作った時刻。`sort` の `createdDesc`・`createdAsc` はこの値で並べる

    TagList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          description: 条件（`q`・`tentative`・`unused`）に合うタグの数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部のタグの数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    TagSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: |
        タグの一覧の並び順。name は名前の自然順（向きは無い）、countDesc・countAsc は本数、
        createdDesc・createdAsc は作った日。値が同じタグは名前の自然順、それも同じなら id
        （specs/036-tag-admin-scale/data-model.md §0・§2）

    TagMergeRequest:
      type: object
      required: [targetId, sourceIds]
      additionalProperties: false
      properties:
        targetId:
          type: integer
          format: int64
          description: 付与・名前・シノニムを受け取るタグ。確定したタグになる
        sourceIds:
          type: array
          description: >-
            統合するタグ。送った数で 1〜20,000 件（重複も数に入り、統合は 1 回）。範囲外は `too_many_tags`
          items:
            type: integer
            format: int64

    TagMergeResponse:
      type: object
      required: [tag, notFoundIds]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        notFoundIds:
          type: array
          description: 無かったので飛ばした統合元。無ければ空
          items:
            type: integer
            format: int64

    TagRenameRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 新しい元の名前。タグ名と同じ規則で整える

    TagSynonymsRequest:
      type: object
      required: [id, action, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: シノニムを変えるタグ
        action:
          type: string
          description: add は足す、remove は外す
          enum: [add, remove]
        name:
          type: string
          description: シノニム。タグ名と同じ規則で整える
        mergeTagId:
          type: integer
          format: int64
          description: >-
            `add` だけ: 統合を受け入れるタグの id。`tag_merge_required` の `tagId` を渡す。名前が別のタグの
            元の名前でなければ無視する

    TagBatchRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            confirm は仮のタグを確定し、reject は仮のタグを却下し（消して元の名前を却下した名前に入れる）、
            delete は確定したタグを消す
          enum: [confirm, reject, delete]
        ids:
          type: array
          description: >-
            対象のタグ。送った数で 1〜20,000 件（重複も数に入り、処理は 1 回）。範囲外は `too_many_tags`
          items:
            type: integer
            format: int64

    TagBatchResponse:
      type: object
      required: [appliedIds, notFoundIds, notApplicableIds]
      additionalProperties: false
      description: >-
        3 つは重ならず、合わせて重複を除いた `ids` に等しい。どれも `ids` に現れた順で、無ければ空
      properties:
        appliedIds:
          type: array
          description: 処理したタグ
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: 無かったタグ
          items:
            type: integer
            format: int64
        notApplicableIds:
          type: array
          description: 種類が `action` に合わず、何も変えなかったタグ
          items:
            type: integer
            format: int64

    RejectedTagNameList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 却下した名前（名前の自然順）。無ければ空
          items:
            type: string
        total:
          type: integer
          description: 却下した名前の全部の数
        nextCursor:
          type: string
          description: 続きを読むカーソル。続きがあるときだけ入る

    RejectedTagNameForgetResult:
      type: object
      required: [name, removed]
      additionalProperties: false
      properties:
        name:
          type: string
          description: 照合した名前（整えた後の綴り。整えられなければ送った名前）
        removed:
          type: boolean
          description: 却下した名前から外したら true。一覧に無かったら false で、何も変えていない

    ExternalVideo:
      type: object
      required:
        [
          id, contentKey, title, fileTitle, displayName, thumbnailPositionMs, durationMs, addedAt, updatedAt,
          fileCreatedAt, locations, tags, workInfo,
        ]
      additionalProperties: false
      description: 動画 1 本。見る人は常に所有者で、非公開の動画も返す
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
          description: 内容から決まる識別子。ファイルが移動しても変わらない
        title:
          type: string
          description: 有効な題名。表示名があればそれ、無ければ代表の所在（locations の先頭）の題名
        fileTitle:
          type: string
          description: 代表の所在の、拡張子を除いたファイル名
        displayName:
          type: [string, "null"]
          description: 表示名。未設定は null
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: 代表サムネイルの位置（ミリ秒）。未設定は null（自動の位置）
        durationMs:
          type: [integer, "null"]
          format: int64
          description: 長さ（ミリ秒）。解析前は null
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: |
            vv 上で動画の情報（表示名・タグ・公開設定・代表サムネイル・作品情報）を最後に編集した日時。
            一度も編集していなければ addedAt と同じ。この API の video-tags・display-names・
            video-work-info も進める
        fileCreatedAt:
          type: string
          format: date-time
          description: |
            代表の所在（locations の先頭）のファイルの作成日時。ファイルシステムから取れないときは
            そのファイルの更新日時（mtime）
        locations:
          type: array
          description: 登録フォルダの下の今の所在。パスの順で、代表が先頭
          items:
            $ref: "#/components/schemas/ExternalVideoLocation"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideoTag"
        workInfo:
          $ref: "#/components/schemas/WorkInfo"

    ExternalVideoLocation:
      type: object
      required: [path, fileName]
      additionalProperties: false
      properties:
        path:
          type: string
          description: 絶対パス。ファイルシステムの綴り（NFD を含む）のまま
        fileName:
          type: string
          description: path の最後の要素

    ExternalVideoTag:
      type: object
      required: [id, name, manual, fromFolder, tentative]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        manual:
          type: boolean
          description: 手で付けた（この API の付け外しの対象）
        fromFolder:
          type: boolean
          description: 祖先のフォルダ名から付く（この API では外れない）
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していないタグ）

    ExternalVideoPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideo"
        nextCursor:
          type: string
          description: 次のページの取得に渡す。続きが無ければ空文字列

    VideoRef:
      type: object
      additionalProperties: false
      description: >-
        動画の指定。id・contentKey・path のちょうど 1 つを持つ。path は正規化せず、登録フォルダの下の
        今の所在の path とバイト列で比べる
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
        path:
          type: string

    VideoTagsRequest:
      type: object
      required: [videos, action, tags]
      additionalProperties: false
      properties:
        videos:
          type: array
          description: 1〜20000 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoRef"
        action:
          type: string
          description: >-
            add は付ける、remove は外す、replace は手で付けたタグをちょうど tags の集合にする
            （空なら手で付けたタグをすべて外す）
          enum: [add, remove, replace]
        tags:
          type: array
          description: >-
            タグの名前（シノニムも可）。100 件まで。add・remove では 1 件以上。範囲外は `too_many_tags`
          items:
            type: string
        tentative:
          type: boolean
          default: false
          description: >-
            真なら add・replace で、どのタグの名前にもシノニムにも当たらない名前を仮のタグとして作る。
            却下した名前（綴りの完全一致）は作らず付けずに飛ばし、skippedTags に返す。既存のタグに
            当たる名前はそのタグを付け、その状態を変えない。remove では何も変えない

    VideoTagsResponse:
      type: object
      required: [items, skippedTags]
      additionalProperties: false
      properties:
        items:
          type: array
          description: videos の順
          items:
            $ref: "#/components/schemas/VideoTagsItem"
        skippedTags:
          type: array
          description: >-
            tentative が真の add・replace で、却下した名前に当たって飛ばした名前。整えた形で tags の順に
            1 回ずつ。無ければ空の配列
          items:
            type: string

    VideoTagsItem:
      type: object
      required: [video, tags]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        tags:
          type: array
          description: 操作後のタグ（手で付けた分とフォルダ名から付く分、出所つき）
          items:
            $ref: "#/components/schemas/ExternalVideoTag"

    VideoTagsVideo:
      type: object
      required: [id, contentKey]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string

    VideoDisplayNamesRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 1〜20000 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoDisplayNameChange"

    VideoDisplayNameChange:
      type: object
      required: [video, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        displayName:
          type: [string, "null"]
          description: >-
            表示名。null、または前後の空白を除いて空なら解除する。制御文字を含めず、整えた後で
            200 符号位置まで

    VideoDisplayNamesResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: items の順
          items:
            $ref: "#/components/schemas/VideoDisplayNamesItem"

    VideoDisplayNamesItem:
      type: object
      required: [video, title, fileTitle, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        title:
          type: string
          description: 反映後の有効な題名
        fileTitle:
          type: string
          description: 代表の所在の、拡張子を除いたファイル名
        displayName:
          type: [string, "null"]
          description: 反映後の表示名。解除したら null

    VideoThumbnailsRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 1〜20 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoThumbnailChange"

    VideoThumbnailChange:
      type: object
      required: [video, positionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        positionMs:
          type: [integer, "null"]
          format: int64
          description: >-
            代表サムネイルにする場面の位置（ミリ秒、0 以上で尺未満）。null なら解除し、自動の位置に戻す

    VideoThumbnailsResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: items の順
          items:
            $ref: "#/components/schemas/VideoThumbnailsItem"

    VideoThumbnailsItem:
      type: object
      required: [video, thumbnailPositionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: 反映後の位置。解除したら null

    ExternalScan:
      type: object
      required: [id, status, startedAt, finishedAt, videos, settledVideos, errorCode]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: >-
            取り込みの状態。画面の API の Scan.status と同じ値で、failed は走査そのものの失敗、
            finding は対象をまだ数え終えていない、running は走査中か済んでいない対象がある、
            partial は失敗の問題がある、done はそれ以外である
          enum: [finding, running, done, partial, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: 走査が終わった時刻。走査中なら null
        videos:
          type: [integer, "null"]
          description: 対象の動画の本数。finding のあいだは null（本数を数え終えていない）
        settledVideos:
          type: [integer, "null"]
          description: >-
            対象のうち残りの仕事が無い本数。finding のあいだは null。数えたあとは
            0 ≤ settledVideos ≤ videos
        errorCode:
          type: [string, "null"]
          description: 走査そのものが失敗した理由のコード（status が failed のときだけ入る）

    VideoWorkInfoRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 1〜20000 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoWorkInfoChange"

    VideoWorkInfoChange:
      type: object
      required: [video, workInfo]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        workInfo:
          $ref: "#/components/schemas/WorkInfoInput"

    VideoWorkInfoResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: items の順
          items:
            $ref: "#/components/schemas/VideoWorkInfoItem"

    VideoWorkInfoItem:
      type: object
      required: [video, workInfo]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        workInfo:
          $ref: "#/components/schemas/WorkInfo"

    CreditRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: 人物か団体 1 件への参照。name はその実体の今の名前
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    CreditIdRef:
      type: object
      required: [id]
      additionalProperties: false
      description: 書き込みで人物か団体 1 件を指す参照
      properties:
        id:
          type: integer
          format: int64

    Alias:
      type: object
      required: [name]
      additionalProperties: false
      description: 人物か団体の別名 1 件（specs/047-video-work-info/data-model.md「Fields」）
      properties:
        name:
          type: string
        language:
          type: string
          description: BCP 47 の構文の言語タグ。無ければ省く

    ExternalId:
      type: object
      required: [source, value]
      additionalProperties: false
      description: 外部の情報源での識別子 1 件
      properties:
        source:
          type: string
        value:
          type: string

    WorkDateKind:
      type: string
      enum: [release, recorded, published]
      description: 日付の種類（specs/047-video-work-info/data-model.md「Fields」）

    WorkPersonRole:
      type: string
      enum: [performer, director, photographer, streamer]
      description: 動画での人物の役割

    WorkOrganizationRole:
      type: string
      enum: [maker, label]
      description: 動画での団体の役割

    WorkDate:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: string
          description: YYYY・YYYY-MM・YYYY-MM-DD（日まであれば暦にある日）
          examples: ["2024", "2024-02", "2024-02-29"]

    WorkPerson:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditRef"

    WorkOrganization:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditRef"

    WorkInfo:
      type: object
      required: [code, description, dates, people, organizations, urls, externalIds]
      additionalProperties: false
      description: |
        動画の作品情報（specs/047-video-work-info/contracts/external-api.md「ExternalVideo changes」）。
        画面の API と同じ 7 つのプロパティで、この API では未設定の code・description は null、空の一覧は []
      properties:
        code:
          type: [string, "null"]
          description: 品番
        description:
          type: [string, "null"]
          description: 説明。改行を含みうる
        dates:
          type: array
          description: 種類の順（release・recorded・published）
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: array
          description: 役割の順、同じ役割の中は入力した順。name は人物の今の名前
          items:
            $ref: "#/components/schemas/WorkPerson"
        organizations:
          type: array
          description: 役割の順、同じ役割の中は入力した順。name は団体の今の名前
          items:
            $ref: "#/components/schemas/WorkOrganization"
        urls:
          type: array
          description: 入力した順
          items:
            type: string
        externalIds:
          type: array
          description: (source, value) の順
          items:
            $ref: "#/components/schemas/ExternalId"

    WorkPersonInput:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditIdRef"

    WorkOrganizationInput:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditIdRef"

    WorkInfoInput:
      type: object
      additionalProperties: false
      description: |
        作品情報の書き込み 1 件。画面の API の WorkInfoInput と同じ形で、項目の規則も同じ
        （specs/047-video-work-info/contracts/screen-api.md「WorkInfoInput schema」、data-model.md「Fields」）。
        どのプロパティも省いてよく null も受け付ける。省いたものと null は解除で、全体を置き換える
      properties:
        code:
          type: [string, "null"]
        description:
          type: [string, "null"]
        dates:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkPersonInput"
        organizations:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkOrganizationInput"
        urls:
          type: [array, "null"]
          items:
            type: string
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"

    Person:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt]
      additionalProperties: false
      description: 人物 1 件（specs/047-video-work-info/contracts/screen-api.md「People and organizations」）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: 名前の自然順。無ければ []
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: (source, value) の順。無ければ []
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: この人物をどれかの役割で結ぶ、表示中の動画の数
        createdAt:
          type: string
          format: date-time

    Organization:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt, parent]
      additionalProperties: false
      description: 団体 1 件。Person と同じ項目に親の団体が加わる
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: 名前の自然順。無ければ []
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: (source, value) の順。無ければ []
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: この団体をどれかの役割で結ぶ、表示中の動画の数
        createdAt:
          type: string
          format: date-time
        parent:
          type: [object, "null"]
          required: [id, name]
          additionalProperties: false
          description: 親の団体（CreditRef の形）。根の団体では null
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string

    CreditInput:
      type: object
      required: [name]
      additionalProperties: false
      description: 人物か団体を作るときの本文。parentId は団体だけが使う
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: integer
          format: int64
          description: 親の団体の id。団体だけで、人物に送ると 400 invalid_request

    CreditUpdateRequest:
      type: object
      required: [id]
      additionalProperties: false
      description: |
        人物か団体の書き換えの本文。id のほかはどれも省いてよく、省いたものは今のまま残す。一覧は丸ごと
        置き換え、null は一覧を空にする。parentId は団体だけが使い、null は親を外す
      properties:
        id:
          type: integer
          format: int64
          description: 書き換える実体
        name:
          type: string
        aliases:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: [integer, "null"]
          format: int64
          description: 親の団体の id。null は親を外す。人物に送ると 400 invalid_request

    CreditMergeRequest:
      type: object
      required: [targetId, sourceIds]
      additionalProperties: false
      properties:
        targetId:
          type: integer
          format: int64
          description: 結び付き・名前・外部 ID を受け取る実体
        sourceIds:
          type: array
          description: 統合元の id。1〜20,000 件。範囲外は `work_info_too_many`（field は sourceIds）
          items:
            type: integer
            format: int64

    CreditDeleteRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          description: 消す実体の id。1〜20,000 件。範囲外は `work_info_too_many`（field は ids）
          items:
            type: integer
            format: int64

    CreditDeleteResponse:
      type: object
      required: [deletedIds, notFoundIds]
      additionalProperties: false
      description: 2 つは重ならず、どちらも `ids` に現れた順で重複が無い。無ければ []
      properties:
        deletedIds:
          type: array
          description: 消した実体
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: 無かった実体
          items:
            type: integer
            format: int64

    PersonList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: 人物の一覧
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        total:
          type: integer
          description: 条件（q、または外部 ID）に合う人物の数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部の人物の数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    OrganizationList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: 団体の一覧
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          type: integer
          description: 条件（q、または外部 ID）に合う団体の数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部の団体の数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    PersonMergeResponse:
      type: object
      required: [person, notFoundIds]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        notFoundIds:
          type: array
          description: 無かったので飛ばした統合元。無ければ []
          items:
            type: integer
            format: int64

    OrganizationMergeResponse:
      type: object
      required: [organization, notFoundIds]
      additionalProperties: false
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        notFoundIds:
          type: array
          description: 無かったので飛ばした統合元。無ければ []
          items:
            type: integer
            format: int64

    CreditSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: |
        人物と団体の一覧の並び順。タグの一覧（TagSort）と同じ 5 つで、値が同じものは名前の自然順、それも同じなら id
