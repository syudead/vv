# vv の外部連携 API v1 の契約。このファイルが外部連携 API の唯一の真実であり、
# Go（oapi-codegen、api/oapi-codegen-external.yaml）だけをここから生成する。
# 生成物（internal/httpapi/extgen/）は手編集しない。型を変えるときはこのファイルを直し、
# task generate を実行すること。画面の API（api/openapi.yaml）とは別の約束である
# （specs/026-external-api/research.md R-5）。
#
# 互換の方針: v1 の中では項目と操作の追加だけを行う。既存の項目の意味・型・必須を変えるときは
# v2 を足す（docs/how-to/external-api.md）。
openapi: 3.1.0

info:
  title: vv external API
  version: 1.0.0
  summary: 外部ツールが API トークンで vv を操作するための API
  description: |
    すべての操作は `Authorization: Bearer <token>` で認証する。トークンは設定ページの
    「API トークン」節で所有者が発行する。トークンが無い・形式が違う・無効・失効済みのときは
    `401` `unauthenticated` と `WWW-Authenticate: Bearer` を返す。Cookie は読まない。

    見る人は常に所有者で、非公開の動画も返す。同一オリジンの検査はかけない。本文を取る操作は
    `Content-Type: application/json` を要する（specs/026-external-api/contracts/external-api.md §1）。

servers:
  - url: /api/v1
    description: アプリケーション自身が配信する

security:
  - bearerAuth: []

paths:
  /videos:
    get:
      operationId: listVideos
      summary: 動画の一覧をページを分けて返す
      description: |
        登録フォルダの下に所在を 1 つ以上持つ動画を `(addedAt, id)` の昇順で返す。`nextCursor` が
        空文字列になるまで、前回の `nextCursor` を `cursor` に渡してたどると全件を読める。
        変更の追跡はしない。新しい動画を知るには一覧を読み直し、持っている動画が消えたことは
        `lookup` の `404` で知る（contracts/external-api.md §2）。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない。省略すると先頭から
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数。範囲外は `400` `invalid_request`
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 動画の一覧 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideoPage"
        "400":
          description: >-
            limit が範囲外、またはカーソルを解釈できない（`invalid_request`、カーソルは
            `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /videos/lookup:
    get:
      operationId: lookupVideo
      summary: 動画を 1 本、id・内容キー・パスのどれかで引く
      description: |
        `id`・`contentKey`・`path` のちょうど 1 つを取る。0 個・2 個以上は `400` `invalid_request`。
        `path` は正規化せず、今の所在の `path` とバイト列で完全一致させる。一覧が返した `path` を
        そのまま渡せば引ける（contracts/external-api.md §2）。
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: contentKey
          in: query
          schema:
            type: string
        - name: path
          in: query
          description: 所在の絶対パス
          schema:
            type: string
      responses:
        "200":
          description: 動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVideo"
        "400":
          description: 指定がちょうど 1 つでない（`invalid_request`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 無い、または登録フォルダの下に所在が無い（`not_found` / `video_not_found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-tags:
    post:
      operationId: updateVideoTags
      summary: 複数の動画に名前で指定したタグを付ける・外す・置き換える
      description: |
        1 つのトランザクションで行う。付け外しの対象は手で付けたタグだけで、祖先のフォルダ名から
        付くタグは残る（`replace` の後も）。名前はシノニムを含めて引き、`add`・`replace` では無い名前の
        タグを作る。`remove` ではどのタグにも当たらない名前は何もしない。同じタグに当たる名前は 1 つに
        まとめる。引けない動画が 1 つでもあれば `404` で何も反映しない（contracts/external-api.md §4）。
        `tentative` が真の `add`・`replace` では、新しく作るタグを仮のタグにし、却下した名前を飛ばして
        `skippedTags` に返す（specs/031-tentative-tags/contracts/external-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: 各動画の操作後のタグ（`videos` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          description: >-
            本文の形が違う・`action` が不正・動画の指定がちょうど 1 つでない（`invalid_request`）、
            件数の上限（`too_many_videos`・`too_many_tags`、`limit`）、タグ名の誤り
            （`tag_name_empty`・`tag_name_control_characters`・`tag_name_too_long`、`index` は `tags` の位置）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画がある（`not_found` / `video_not_found`、`index` は `videos` の位置）。
            何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-display-names:
    post:
      operationId: updateVideoDisplayNames
      summary: 複数の動画の表示名を設定・解除する
      description: |
        1 つのトランザクションで行う。`displayName` が `null`、または前後の空白を除いて空なら解除し、
        ファイル名由来の題名に戻す。表示名は内容（`contentKey`）に結び、同じ内容の全所在に効く。
        引けない動画や規則に合わない名前が 1 つでもあれば何も反映しない
        （specs/029-video-overrides/contracts/external-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoDisplayNamesRequest"
      responses:
        "200":
          description: 各動画の反映後の題名（`items` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDisplayNamesResponse"
        "400":
          description: >-
            本文の形が違う・動画の指定がちょうど 1 つでない（`invalid_request`、`index`）、件数の上限
            （`too_many_videos`、`limit`）、表示名の誤り（`display_name_control_characters`・
            `display_name_too_long`（`limit`）、`index` は `items` の位置）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画がある（`not_found` / `video_not_found`、`index` は `items` の位置）。
            何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /video-thumbnails:
    post:
      operationId: updateVideoThumbnails
      summary: 複数の動画の代表サムネイルの位置を設定・解除する
      description: |
        先に全件の引き当てと位置の検証を行い、誤りがあれば何も反映しない。通ったら `items` の順に
        1 件ずつ、その位置の場面で代表サムネイルを作り直して位置を記録する。`positionMs` が `null` なら
        解除し、自動の位置で作り直す。途中の 1 件で画像を作れなければ `409`
        `thumbnail_frame_unavailable` と `index` で止まり、それより前の項目は反映済み、その項目と後は
        未反映である（specs/029-video-overrides/contracts/external-api.md §2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoThumbnailsRequest"
      responses:
        "200":
          description: 各動画の反映後の位置（`items` の順）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoThumbnailsResponse"
        "400":
          description: >-
            本文の形が違う・動画の指定がちょうど 1 つでない（`invalid_request`、`index`）、件数の上限
            （`too_many_videos`、`limit: 20`）、尺以上か負の位置（`thumbnail_position_out_of_range`、
            `index`、`limit` はその動画の尺のミリ秒）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            引けない動画（`video_not_found`）、どの所在も開けない動画（`file_unavailable`）がある。
            `index` は `items` の位置。何も反映しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            解析が終わっていない動画がある（`conflict` / `duration_unknown`、何も反映しない）、または
            途中の 1 件で画像を作れなかった（`conflict` / `thumbnail_frame_unavailable`、`index` より前は
            反映済み）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags:
    get:
      operationId: listTags
      summary: タグの一覧を返す
      description: |
        画面のタグ管理の `GET /api/tags` と同じ検索・絞り込み・並び順・ページで返す。`q`・`tentative`・
        `unused` は全部のタグに AND で掛かり、`sort` の順に並べる。`limit` を付けると 1 ページずつ返し、
        続きがあれば `nextCursor` を入れる。`limit` を省くと条件に合う全件を返し、`nextCursor` は入らない
        （specs/039-external-tag-admin/contracts/external-api.md §1）。
      parameters:
        - name: q
          in: query
          description: |
            検索語。全角・半角、大文字・小文字、ひらがな・カタカナなどの表記の揺れを吸収した形
            （照合形）にして前後の空白を落とし、空でなければ元の名前かシノニムに部分一致する
            タグだけにする。語の分解はしない
          schema:
            type: string
            maxLength: 100
        - name: tentative
          in: query
          description: true なら仮のタグだけにする
          schema:
            type: boolean
            default: false
        - name: unused
          in: query
          description: true なら本数 0 のタグだけにする
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/TagSort"
        - name: cursor
          in: query
          description: |
            前回の応答が返した `nextCursor`。中身は不透明で、解釈しない。同じ `q`・`tentative`・
            `unused`・`sort` で続けて使う。`limit` を省いたときは無視する
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数。省くと全件を返し、`nextCursor` は入らない
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: タグの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          description: >-
            `sort` が 5 値の外、`limit` が 1〜200 の外、`q` が 100 文字を超える（`invalid_request`）、
            カーソルを解釈できないか別の `sort` で作ったもの（`invalid_request` / `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/merge:
    post:
      operationId: mergeTags
      summary: 複数のタグを 1 つのタグへ統合する
      description: |
        1 つのトランザクションで、統合元それぞれの元の名前とシノニムを統合先のシノニムにし、付与を
        統合先へ移して統合元を消す。統合先は確定したタグになる。無い統合元は飛ばして `notFoundIds` に
        返し、統合元がすべて無ければ `tag` は変わらない統合先である。画面の `POST /api/tags/{id}/merge`
        と同じ保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMergeResponse"
        "400":
          description: >-
            本文の形が違う（`invalid_request`）、`sourceIds` が空か 20,000 件を超える（`too_many_tags`、
            `limit`）、`sourceIds` が `targetId` を含む（`merge_same_tag`、何も変えない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`targetId` のタグが無い（`not_found` / `tag_not_found`）。何も変えない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rename:
    post:
      operationId: renameTag
      summary: タグの元の名前を変える
      description: |
        名前が変われば仮のタグは確定する。今と同じ名前なら何も変えない。画面の `PATCH /api/tags/{id}` と
        同じ保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRenameRequest"
      responses:
        "200":
          description: 変更後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: >-
            本文の形が違う（`invalid_request`）、名前の規則違反（`tag_name_empty`・
            `tag_name_control_characters`・`tag_name_too_long`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`id` のタグが無い（`not_found` / `tag_not_found`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            名前が別のタグの元の名前かシノニム、または `id` 自身のシノニム（`conflict` / `tag_name_taken`、
            `tagId`・`tagName`）。何も変えない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/synonyms:
    post:
      operationId: updateTagSynonyms
      summary: タグのシノニムを足す・外す
      description: |
        `add` は名前をシノニムに足し、名前を足したら仮のタグを確定する。既に `id` のシノニムなら何も
        変えない。名前が別のタグ S の元の名前なら、`mergeTagId` が S のときだけ S を `id` へ統合し、
        そうでなければ `409 tag_merge_required`（`tagId` は S）で何も変えない。`remove` はシノニムで
        ない名前なら何も変えずにタグを返す。画面の `POST`・`DELETE /api/tags/{id}/synonyms` と同じ
        保存先の操作を呼ぶ（specs/039-external-tag-admin/contracts/external-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSynonymsRequest"
      responses:
        "200":
          description: 変更後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: >-
            本文の形が違う・`action` が 2 値の外（`invalid_request`）、`add` で名前の規則違反
            （`tag_name_empty`・`tag_name_control_characters`・`tag_name_too_long`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`id` のタグが無い（`not_found` / `tag_not_found`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `add` で、名前が `id` 自身の元の名前か別のタグのシノニム（`conflict` / `tag_name_taken`）、
            または別のタグの元の名前で `mergeTagId` がそのタグでない（`conflict` / `tag_merge_required`）。
            どちらも `tagId`・`tagName` を返し、何も変えない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/batch:
    post:
      operationId: batchTags
      summary: 複数のタグをまとめて確定・却下・削除する
      description: |
        1 つのトランザクションで `ids` のタグに `action` を行う。`confirm`・`reject` は仮のタグに、`delete` は
        確定したタグに効き、種類の合わないタグは何も変えずに `notApplicableIds`、無い id は `notFoundIds`
        に返す。却下したタグの元の名前は却下した名前に入り、削除したタグの名前は覚えない。1 つのタグなら
        `ids: [id]` を送る。画面の `POST /api/tags/batch` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBatchRequest"
      responses:
        "200":
          description: 処理したタグ・無かったタグ・種類が合わず変えなかったタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBatchResponse"
        "400":
          description: >-
            本文の形が違う・`action` が 3 値の外（`invalid_request`）、`ids` が空か 20,000 件を超える
            （`too_many_tags`、`limit`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /tags/rejected-names:
    get:
      operationId: listRejectedTagNames
      summary: 却下した名前を一覧する
      description: |
        却下した名前を名前の自然順でページに分けて返す。`total` は却下した名前の全部の数で、続きが
        あれば `nextCursor` を入れる。画面の `GET /api/tags/rejected-names` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §6）。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1 ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 却下した名前の 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameList"
        "400":
          description: >-
            `limit` が 1〜200 の外（`invalid_request`）、カーソルを解釈できない（`invalid_request` /
            `invalid_cursor`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: forgetRejectedTagName
      summary: 却下した名前を 1 つ外す
      description: |
        名前を却下した名前から外し、次に同じ名前を仮のタグとして付けるとタグがまた作られるようにする。
        名前はタグ名と同じ規則で整えてから照合する。一覧に無い名前や整えられない名前は何も変えずに
        `removed: false` を返す。画面の `DELETE /api/tags/rejected-names` と同じ保存先の操作を呼ぶ
        （specs/039-external-tag-admin/contracts/external-api.md §7）。
      parameters:
        - name: name
          in: query
          required: true
          description: 外す名前
          schema:
            type: string
      responses:
        "200":
          description: 照合した名前と、外したかどうか
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameForgetResult"
        "400":
          description: "`name` が無い（`invalid_request`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /scans:
    post:
      operationId: startScan
      summary: スキャンを始める
      description: |
        新しく始めたら `201`、実行中のものがあれば新しく始めずにそれを `200` で返す
        （contracts/external-api.md §5）。本文は取らない。
      responses:
        "201":
          description: 新しく始めたスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "200":
          description: 実行中だったスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: メディアフォルダが 1 つも登録されていない（`media_folders_not_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: 直近のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 一度もスキャンしていない（`not_found` / `no_scan`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 設定ページで発行した API トークン（`vvt_` で始まる 47 文字）。

  responses:
    Unauthenticated:
      description: トークンが無い・形式が違う・無効・失効済み（`unauthenticated`）
      headers:
        WWW-Authenticate:
          description: 常に `Bearer`
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: 予期しない失敗（`internal`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      description: >-
        誤りの形は画面の API と同じで、index はこの API だけの項目である
        （contracts/external-api.md §1）。
      properties:
        code:
          type: string
          description: 機械可読なエラー種別。
          enum:
            - unauthenticated
            - invalid_request
            - not_found
            - conflict
            - media_folders_not_configured
            - internal
        message:
          type: string
          description: 英語の説明。利用者のプログラムは code と reason で分岐する
        reason:
          $ref: "#/components/schemas/ErrorReason"
        limit:
          type: integer
          description: reason の上限値。上限を持つ reason のときだけ入る
        index:
          type: integer
          description: >-
            原因になった要素の位置（0 から）。タグ名の誤りでは tags の、表示名・サムネイルの操作では
            items の、それ以外では videos の位置を指す（contracts/external-api.md §4）
        tagId:
          type: integer
          format: int64
          description: >-
            名前がぶつかったタグの id。`tag_name_taken`・`tag_merge_required` のときだけ入る
            （specs/039-external-tag-admin/contracts/external-api.md §0）
        tagName:
          type: string
          description: >-
            名前がぶつかったタグの元の名前（翻訳しない）。`tag_name_taken`・`tag_merge_required` の
            ときだけ入る
    ErrorReason:
      type: string
      description: 同じ code の中で状況を区別する下位の理由。
      enum:
        - invalid_cursor
        - too_many_videos
        - too_many_tags
        - tag_name_empty
        - tag_name_control_characters
        - tag_name_too_long
        - video_not_found
        - no_scan
        - display_name_control_characters
        - display_name_too_long
        - duration_unknown
        - thumbnail_position_out_of_range
        - thumbnail_frame_unavailable
        - file_unavailable
        - tag_not_found
        - tag_name_taken
        - tag_merge_required
        - merge_same_tag

    Tag:
      type: object
      required: [id, name, synonyms, videoCount, tentative, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: 名前の自然順
          items:
            type: string
        videoCount:
          type: integer
          description: いまライブラリにある動画の本数
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していないタグ）
        createdAt:
          type: string
          format: date-time
          description: タグを作った時刻。`sort` の `createdDesc`・`createdAsc` はこの値で並べる

    TagList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          description: 条件（`q`・`tentative`・`unused`）に合うタグの数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部のタグの数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    TagSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: |
        タグの一覧の並び順。name は名前の自然順（向きは無い）、countDesc・countAsc は本数、
        createdDesc・createdAsc は作った日。値が同じタグは名前の自然順、それも同じなら id
        （specs/036-tag-admin-scale/data-model.md §0・§2）

    TagMergeRequest:
      type: object
      required: [targetId, sourceIds]
      additionalProperties: false
      properties:
        targetId:
          type: integer
          format: int64
          description: 付与・名前・シノニムを受け取るタグ。確定したタグになる
        sourceIds:
          type: array
          description: >-
            統合するタグ。送った数で 1〜20,000 件（重複も数に入り、統合は 1 回）。範囲外は `too_many_tags`
          items:
            type: integer
            format: int64

    TagMergeResponse:
      type: object
      required: [tag, notFoundIds]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        notFoundIds:
          type: array
          description: 無かったので飛ばした統合元。無ければ空
          items:
            type: integer
            format: int64

    TagRenameRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 新しい元の名前。タグ名と同じ規則で整える

    TagSynonymsRequest:
      type: object
      required: [id, action, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: シノニムを変えるタグ
        action:
          type: string
          description: add は足す、remove は外す
          enum: [add, remove]
        name:
          type: string
          description: シノニム。タグ名と同じ規則で整える
        mergeTagId:
          type: integer
          format: int64
          description: >-
            `add` だけ: 統合を受け入れるタグの id。`tag_merge_required` の `tagId` を渡す。名前が別のタグの
            元の名前でなければ無視する

    TagBatchRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            confirm は仮のタグを確定し、reject は仮のタグを却下し（消して元の名前を却下した名前に入れる）、
            delete は確定したタグを消す
          enum: [confirm, reject, delete]
        ids:
          type: array
          description: >-
            対象のタグ。送った数で 1〜20,000 件（重複も数に入り、処理は 1 回）。範囲外は `too_many_tags`
          items:
            type: integer
            format: int64

    TagBatchResponse:
      type: object
      required: [appliedIds, notFoundIds, notApplicableIds]
      additionalProperties: false
      description: >-
        3 つは重ならず、合わせて重複を除いた `ids` に等しい。どれも `ids` に現れた順で、無ければ空
      properties:
        appliedIds:
          type: array
          description: 処理したタグ
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: 無かったタグ
          items:
            type: integer
            format: int64
        notApplicableIds:
          type: array
          description: 種類が `action` に合わず、何も変えなかったタグ
          items:
            type: integer
            format: int64

    RejectedTagNameList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 却下した名前（名前の自然順）。無ければ空
          items:
            type: string
        total:
          type: integer
          description: 却下した名前の全部の数
        nextCursor:
          type: string
          description: 続きを読むカーソル。続きがあるときだけ入る

    RejectedTagNameForgetResult:
      type: object
      required: [name, removed]
      additionalProperties: false
      properties:
        name:
          type: string
          description: 照合した名前（整えた後の綴り。整えられなければ送った名前）
        removed:
          type: boolean
          description: 却下した名前から外したら true。一覧に無かったら false で、何も変えていない

    ExternalVideo:
      type: object
      required:
        [
          id, contentKey, title, fileTitle, displayName, thumbnailPositionMs, durationMs, addedAt, updatedAt,
          fileCreatedAt, locations, tags,
        ]
      additionalProperties: false
      description: 動画 1 本。見る人は常に所有者で、非公開の動画も返す
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
          description: 内容から決まる識別子。ファイルが移動しても変わらない
        title:
          type: string
          description: 有効な題名。表示名があればそれ、無ければ代表の所在（locations の先頭）の題名
        fileTitle:
          type: string
          description: 代表の所在の、拡張子を除いたファイル名
        displayName:
          type: [string, "null"]
          description: 表示名。未設定は null
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: 代表サムネイルの位置（ミリ秒）。未設定は null（自動の位置）
        durationMs:
          type: [integer, "null"]
          format: int64
          description: 長さ（ミリ秒）。解析前は null
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: |
            vv 上で動画の情報（表示名・タグ・公開設定・代表サムネイル）を最後に編集した日時。
            一度も編集していなければ addedAt と同じ。この API の video-tags・display-names も進める
        fileCreatedAt:
          type: string
          format: date-time
          description: |
            代表の所在（locations の先頭）のファイルの作成日時。ファイルシステムから取れないときは
            そのファイルの更新日時（mtime）
        locations:
          type: array
          description: 登録フォルダの下の今の所在。パスの順で、代表が先頭
          items:
            $ref: "#/components/schemas/ExternalVideoLocation"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideoTag"

    ExternalVideoLocation:
      type: object
      required: [path, fileName]
      additionalProperties: false
      properties:
        path:
          type: string
          description: 絶対パス。ファイルシステムの綴り（NFD を含む）のまま
        fileName:
          type: string
          description: path の最後の要素

    ExternalVideoTag:
      type: object
      required: [id, name, manual, fromFolder, tentative]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        manual:
          type: boolean
          description: 手で付けた（この API の付け外しの対象）
        fromFolder:
          type: boolean
          description: 祖先のフォルダ名から付く（この API では外れない）
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していないタグ）

    ExternalVideoPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalVideo"
        nextCursor:
          type: string
          description: 次のページの取得に渡す。続きが無ければ空文字列

    VideoRef:
      type: object
      additionalProperties: false
      description: >-
        動画の指定。id・contentKey・path のちょうど 1 つを持つ。path は正規化せず、登録フォルダの下の
        今の所在の path とバイト列で比べる
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string
        path:
          type: string

    VideoTagsRequest:
      type: object
      required: [videos, action, tags]
      additionalProperties: false
      properties:
        videos:
          type: array
          description: 1〜20000 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoRef"
        action:
          type: string
          description: >-
            add は付ける、remove は外す、replace は手で付けたタグをちょうど tags の集合にする
            （空なら手で付けたタグをすべて外す）
          enum: [add, remove, replace]
        tags:
          type: array
          description: >-
            タグの名前（シノニムも可）。100 件まで。add・remove では 1 件以上。範囲外は `too_many_tags`
          items:
            type: string
        tentative:
          type: boolean
          default: false
          description: >-
            真なら add・replace で、どのタグの名前にもシノニムにも当たらない名前を仮のタグとして作る。
            却下した名前（綴りの完全一致）は作らず付けずに飛ばし、skippedTags に返す。既存のタグに
            当たる名前はそのタグを付け、その状態を変えない。remove では何も変えない

    VideoTagsResponse:
      type: object
      required: [items, skippedTags]
      additionalProperties: false
      properties:
        items:
          type: array
          description: videos の順
          items:
            $ref: "#/components/schemas/VideoTagsItem"
        skippedTags:
          type: array
          description: >-
            tentative が真の add・replace で、却下した名前に当たって飛ばした名前。整えた形で tags の順に
            1 回ずつ。無ければ空の配列
          items:
            type: string

    VideoTagsItem:
      type: object
      required: [video, tags]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        tags:
          type: array
          description: 操作後のタグ（手で付けた分とフォルダ名から付く分、出所つき）
          items:
            $ref: "#/components/schemas/ExternalVideoTag"

    VideoTagsVideo:
      type: object
      required: [id, contentKey]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        contentKey:
          type: string

    VideoDisplayNamesRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 1〜20000 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoDisplayNameChange"

    VideoDisplayNameChange:
      type: object
      required: [video, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        displayName:
          type: [string, "null"]
          description: >-
            表示名。null、または前後の空白を除いて空なら解除する。制御文字を含めず、整えた後で
            200 符号位置まで

    VideoDisplayNamesResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: items の順
          items:
            $ref: "#/components/schemas/VideoDisplayNamesItem"

    VideoDisplayNamesItem:
      type: object
      required: [video, title, fileTitle, displayName]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        title:
          type: string
          description: 反映後の有効な題名
        fileTitle:
          type: string
          description: 代表の所在の、拡張子を除いたファイル名
        displayName:
          type: [string, "null"]
          description: 反映後の表示名。解除したら null

    VideoThumbnailsRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 1〜20 件。範囲外は `too_many_videos`
          items:
            $ref: "#/components/schemas/VideoThumbnailChange"

    VideoThumbnailChange:
      type: object
      required: [video, positionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        positionMs:
          type: [integer, "null"]
          format: int64
          description: >-
            代表サムネイルにする場面の位置（ミリ秒、0 以上で尺未満）。null なら解除し、自動の位置に戻す

    VideoThumbnailsResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: items の順
          items:
            $ref: "#/components/schemas/VideoThumbnailsItem"

    VideoThumbnailsItem:
      type: object
      required: [video, thumbnailPositionMs]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/VideoTagsVideo"
        thumbnailPositionMs:
          type: [integer, "null"]
          format: int64
          description: 反映後の位置。解除したら null

    ExternalScan:
      type: object
      required: [id, status, startedAt, finishedAt, videos, settledVideos, errorCode]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: >-
            取り込みの状態。画面の API の Scan.status と同じ値で、failed は走査そのものの失敗、
            finding は対象をまだ数え終えていない、running は走査中か済んでいない対象がある、
            partial は失敗の問題がある、done はそれ以外である
          enum: [finding, running, done, partial, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: 走査が終わった時刻。走査中なら null
        videos:
          type: [integer, "null"]
          description: 対象の動画の本数。finding のあいだは null（本数を数え終えていない）
        settledVideos:
          type: [integer, "null"]
          description: >-
            対象のうち残りの仕事が無い本数。finding のあいだは null。数えたあとは
            0 ≤ settledVideos ≤ videos
        errorCode:
          type: [string, "null"]
          description: 走査そのものが失敗した理由のコード（status が failed のときだけ入る）
