# vv の API 契約。このファイルが唯一の真実であり、Go（oapi-codegen）と
# TypeScript（openapi-typescript）の双方をここから生成する。
# 生成物（internal/httpapi/gen/、web/src/api/gen/）は手編集しない。
# 型を変えるときはこのファイルを直し、task generate を実行すること。
openapi: 3.1.0

info:
  title: MDM API
  version: 0.3.0
  summary: セルフホストの動画管理システム API
  description: |
    取り込み（スキャン）・一覧・再生・題名検索までを公開する。

    すべての要求は「誰でも」「ゲストも」「所有者だけ」のどれかに入る
    （specs/016-single-account-auth/contracts/auth-api.md §1）。各操作の `security` がその
    分類で、`[]` は誰でも、`[{sessionCookie: []}, {}]` はゲストも、既定（全体の
    `security`）は所有者だけである。所有者だけの要求に有効なセッションが無いとき、
    アカウントが未設定のときの誰でも以外の要求には、`401` `unauthenticated` を返す。
    `/api/*` のすべての応答は、その要求を所有者とゲストのどちらとして処理したかを
    `X-VV-Audience: owner` か `guest` で示す。

    「ゲストも」の要求は、有効なセッションが無ければゲストとして処理する
    （specs/016-single-account-auth/contracts/guest-api.md）。ゲストの応答には公開の動画だけが
    現れ、`Video.location`・`Video.progress`・`Video.probeError`・`FolderSummary.rootPath` を
    省き、`Video.tags` を空の配列にする。公開でない動画・公開の動画を含まないフォルダは、
    存在しないものと同じ `404` にする。

servers:
  - url: /
    description: アプリケーション自身が配信する

# 既定は所有者だけ（ログインしたセッションが要る）。誰でも・ゲストもの操作は
# 操作ごとの security で上書きする。定義の無い経路も所有者だけとして扱う。
security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      summary: 稼働状態とビルド情報を返す
      description: |
        認証を必要としない。外形監視とコンテナのヘルスチェックから参照される。
        データベースへ疎通できない場合も応答自体は返し、`status` で区別する。
      responses:
        "200":
          description: 稼働中。依存する保存層にも疎通できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 起動はしているが保存層に疎通できていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/setup:
    post:
      operationId: setupAccount
      summary: 未設定のサーバーで最初のアカウントを作り、そのままログインする
      description: |
        本文は 8 KiB まで。成立したら `Set-Cookie` でセッションを渡す（contracts/auth-api.md §2・§7）。
        同時の初回設定は1つだけが成立し、他は 409 になる。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: 初回設定が成立し、ログインした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: アカウントは既に設定されている（account_already_configured）。何も書かない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: login
      summary: ユーザー名とパスワードでログインする
      description: |
        本文は 8 KiB まで。ユーザー名かパスワードの誤り、空欄、上限超え、アカウントの
        未設定は、どれも同じ 401 `invalid_credentials` になる（contracts/auth-api.md §3）。
        `next` は戻り先の候補で、安全でなければ `/` にして `redirectTo` に返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログインした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: ユーザー名またはパスワードが違う（invalid_credentials）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: 試行が多すぎる（login_throttled）。照合していない
          headers:
            Retry-After:
              description: 再び試せるまでの秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: 見る人の状態を返す
      description: |
        未設定なら Cookie によらず `setupRequired` を返す。ユーザー名は返さない。
        `next` を付けると、`owner` のときだけ確かめた戻り先を `redirectTo` に返す
        （contracts/auth-api.md §4）。
      security: []
      parameters:
        - name: next
          in: query
          description: ログイン済みのときに戻る先の候補
          schema:
            type: string
      responses:
        "200":
          description: 見る人の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /api/auth/logout:
    post:
      operationId: logout
      summary: ログアウトする
      description: |
        要求に付いていたセッションの Cookie（`__Host-vv_session` と `vv_session` の両方）を
        見て、有効なセッションを消し、両方の Cookie を `Max-Age=0` で消す。本文は無い
        （contracts/auth-api.md §4）。
      security: []
      responses:
        "204":
          description: ログアウトした
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/videos:
    get:
      operationId: listVideos
      security:
        - sessionCookie: []
        - {}
      summary: 動画の一覧を返す
      description: |
        カーソル方式でページングする。対象は登録メディアフォルダの下に所在がある動画で、
        `query`・`watch`・`playable` で絞り込む。`total` は絞り込み後の総件数で、
        ページングとは独立に返る。

        同じ動画の別バージョンの集まりは、実効の代表（代表に見せてよい所在が無ければ、
        見せてよい所在を持つバージョンのうち id の最小のもの）の1件だけを返し、代表以外の
        バージョンは返さない。`query` は集まりのどれかのバージョンの所在に当たれば代表の
        1件を返し、タグ・視聴状態・並び順は集まりの値で判定する
        （specs/030-video-versions/data-model.md §4）。代表以外のバージョンも
        `GET /api/videos/{id}` では引ける。

        ゲストでは公開の動画だけを対象にし、`query` はタグの名前とシノニムに照合しない。
        所有者のデータに依る条件（`watch` が `all` 以外、`sort` が `playedAsc`・
        `playedDesc`・`favoritedAsc`・`favoritedDesc`、`tag`、`favorite` が true、`person`、
        `organization`）は
        `400` `invalid_request` にする（guest-api.md §3、specs/035-favorites/contracts/screen-api.md §2）。
      parameters:
        - name: query
          in: query
          description: |
            検索語。空白で区切った語をすべて含む動画に絞る（AND）。`"…"` で囲んだ部分は
            空白を含めて1語（フレーズ）、先頭の `-` はその語を含まない（除外）、単独の
            `OR` と `|` は前後の語のどちらかを含む（和）。全角・半角、大文字・小文字、
            ひらがな・カタカナなどの表記の揺れは吸収する。照合するのは題名と、登録
            フォルダより下の相対パスで、いずれも部分一致。先頭から 16 語までを使い、
            語が残らなければ絞り込まない。書き方の誤りは返さない
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          description: 視聴状態で絞る。all は絞り込まない
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          description: true ならブラウザでそのまま再生できる（playable = true の）動画だけにする
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: |
            true ならお気に入りの項目だけにする。項目ごとに自分のお気に入りで判定し、
            ほかの絞り込みと AND で組み合わさる（specs/035-favorites/contracts/screen-api.md §2）
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: |
            `sort=random` の並びを決める値。同じ値ならページをまたいでも同じ並びになる。
            ほかの並び順では無視する
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: |
            タグの id ごとに1つ（`tag=3&tag=8`）。すべて持つ動画だけにする（AND）。
            最大16個、17個以上は400。存在しない id は条件から落とし、応答の
            missingTagIds に返す（specs/014-video-tags/contracts/tags-api.md §5）
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/library:
    get:
      operationId: listLibrary
      security:
        - sessionCookie: []
        - {}
      summary: ライブラリの項目（動画とグループ）の一覧を返す
      description: |
        `listVideos` と同じ条件で、当たった動画を項目にまとめて返す
        （specs/027-partial-group-search/contracts/library-api.md §1。値の作り方は
        specs/017-folder-groups/data-model.md §5）。
        `query`・`tag`・`person`・`organization` はメンバー単位で掛け（1本の動画が全条件を満たす）、グループの
        全メンバーが当たればグループの項目1件に、一部だけが当たれば当たったメンバーを
        それぞれ動画の項目にする。グループに属さない動画は動画の項目になる。
        絞り込みが無ければどのグループも全メンバーが当たる。グループの値は全メンバーから
        数える。`playable` は項目に掛け（グループはメンバーのどれか1本が再生できれば残る）、
        `watch` は項目の視聴状態に掛け、並べ替えは項目の値で行う。`total` は絞り込み後の
        項目（カード）の数。カーソルの形は `listVideos` と同じ。

        `favorite` が true なら、項目ごとに自分のお気に入りで判定する（動画の項目は動画、
        グループの項目はグループ）。お気に入りでないグループに属するお気に入りの動画は
        動画の項目になる（specs/035-favorites/contracts/screen-api.md §2）。

        同じ動画の別バージョンの集まりは `listVideos` と同じく実効の代表の1件だけを
        項目にし、代表以外のバージョンは出ない。代表以外のバージョンはフォルダの
        グループのメンバーにもならない（specs/030-video-versions/data-model.md §4）。

        ゲストでは公開のメンバーだけを数え（「全メンバー」も公開のメンバー）、公開の
        メンバーが1本のグループは動画の項目にし、0本のグループは出さない。`watch` が `all` 以外、`sort` が `playedAsc`・
        `playedDesc`・`favoritedAsc`・`favoritedDesc`、`tag`、`favorite` が true、`person`、`organization` は
        `400` `invalid_request` にする
        （data-model.md §7、specs/035-favorites/contracts/screen-api.md §2）。
      parameters:
        - name: query
          in: query
          description: |
            検索語。空白で区切った語をすべて含む動画に絞る（AND）。`"…"` で囲んだ部分は
            空白を含めて1語（フレーズ）、先頭の `-` はその語を含まない（除外）、単独の
            `OR` と `|` は前後の語のどちらかを含む（和）。全角・半角、大文字・小文字、
            ひらがな・カタカナなどの表記の揺れは吸収する。照合するのは題名と、登録
            フォルダより下の相対パスで、いずれも部分一致。先頭から 16 語までを使い、
            語が残らなければ絞り込まない。書き方の誤りは返さない
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          description: 視聴状態で絞る。all は絞り込まない
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          description: true ならブラウザでそのまま再生できる（playable = true の）動画だけにする
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: |
            true ならお気に入りの項目だけにする。項目ごとに自分のお気に入りで判定し、
            ほかの絞り込みと AND で組み合わさる（specs/035-favorites/contracts/screen-api.md §2）
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: |
            `sort=random` の並びを決める値。同じ値ならページをまたいでも同じ並びになる。
            ほかの並び順では無視する
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: |
            タグの id ごとに1つ（`tag=3&tag=8`）。すべて持つ動画だけにする（AND）。
            最大16個、17個以上は400。存在しない id は条件から落とし、応答の
            missingTagIds に返す（specs/014-video-tags/contracts/tags-api.md §5）
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
      responses:
        "200":
          description: 項目の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/library/ids:
    get:
      operationId: listLibraryIds
      summary: 絞り込みに合う項目の動画の id を返す
      description: |
        `listLibrary` と同じ条件（`query`・`watch`・`playable`・`tag`・`favorite`・`person`・
        `organization`）に合う項目の、
        動画の項目の id と、グループの項目の全メンバーの id を、ページングせずに返す。
        一部のメンバーだけが当たったグループは動画の項目なので、当たったメンバーの id
        だけが入る。並びは決めない。「すべて選択」用
        （specs/027-partial-group-search/contracts/library-api.md §2）。
        グループの項目は `groups` にも、フォルダと全メンバーの id として入る。

        `favorite` が true なら、項目ごとに自分のお気に入りで判定する（動画の項目は動画、
        グループの項目はグループ）。お気に入りでないグループに属するお気に入りの動画は
        動画の項目になる（specs/035-favorites/contracts/screen-api.md §2・§3）。
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: |
            true ならお気に入りの項目だけにする。項目ごとに自分のお気に入りで判定し、
            ほかの絞り込みと AND で組み合わさる（specs/035-favorites/contracts/screen-api.md §2）
          schema:
            type: boolean
            default: false
        - name: tag
          in: query
          description: 最大16個、17個以上は400。存在しない id は無視して missingTagIds に返す
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
      responses:
        "200":
          description: 条件に合う項目の動画の id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoIdsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/{id}:
    get:
      operationId: getVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画1件の詳細を返す
      description: |
        ゲストでは公開の動画だけを返し、公開でない動画は存在しない動画と同じ 404 にする
        （guest-api.md §2）。この扱いは関連動画・配信・プレビュー・ライブ変換・
        サムネイル・シークプレビューでも同じである。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
      responses:
        "200":
          description: 詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/related:
    get:
      operationId: getRelatedVideos
      security:
        - sessionCookie: []
        - {}
      summary: 関連動画を返す
      description: |
        見る人に見せる動画を、この動画との近さの点が高い順に、`cursor` の後から最大 `limit` 件
        返す。この動画自身、同じ動画の別バージョン（集まりの代表以外）、同じグループのメンバーは
        含めない。点は映像の指紋で似た場面が共通する割合（満点 40）、タグの一致率（30）、題名・
        ファイル名の数字を除いた語の重なり（25）、同じディレクトリの直下（20）、追加日時の近さ
        （5）の合計で、同点なら追加日時の新しい方、それも同じなら id の大きい方を先にする
        （docs/design-docs/related-videos.md）。件数に上限は無く、`nextCursor` を `cursor` に
        渡して続きを読む。続きは返した位置より後の動画だけなので、読む間に動画が足されたり
        消えたりしても、同じ動画が二重に出ない。
        `cursor` を付けない最初の要求だけが `nextId`・`prevId`・`group` を持つ。この動画が
        グループにあれば、文脈のグループ（`group` の問い合わせ、specs/048-groups/research.md R-9）
        の再生順で、group にこの動画を中ほどに置いた最大 100 本のメンバーの窓を載せ、
        nextId・prevId をその再生順の前後にする。窓の外のメンバーは `listVideoGroupMembers` で
        読む。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
        - name: cursor
          in: query
          description: 前の応答の `nextCursor`。省くと先頭から返す
          schema:
            type: string
        - name: limit
          in: query
          description: 返す件数の上限
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: 関連動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedVideos"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/group-members:
    get:
      operationId: listVideoGroupMembers
      security:
        - sessionCookie: []
        - {}
      summary: 動画が属するグループのメンバーを、並びの範囲で返す
      description: |
        文脈のグループ（`group` の問い合わせ、specs/048-groups/research.md R-9）の見せてよい
        動画を、その再生順で `offset` 本目（0 始まり）から最大 `limit` 本返す。メンバーの選び方と
        形は関連動画の group と同じで、ゲストには公開の動画だけで数える。動画がどのグループにも
        無ければ `404`。`offset` が本数以上なら items は空。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
        - name: offset
          in: query
          description: 返す最初のメンバーの、グループの中の並びの位置（0 始まり）
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: 返す本数の上限
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: グループのメンバーの範囲
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/probe:
    post:
      operationId: reprobeVideo
      summary: 読み取りに失敗した動画を読み取り直す
      description: |
        `probeState = failed` の動画だけを受け付ける。1つの取引の中で読み取りの状態を
        pending に戻し、読み取りのジョブを積む。代表サムネイル・シーク用サムネイル・
        一覧用プレビューのうち failed のもの（代表サムネイルは完成していないもの）を
        pending に戻し、代表サムネイルとシーク用サムネイルは戻したときだけそのジョブを
        積む（一覧用プレビューは読み取りの成功後に積まれる）。要求の本文は無い。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: 読み取りを積み直した。更新後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: probeState が failed でない（probe_not_failed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/auto-tag:
    post:
      operationId: autoTagVideo
      summary: 動画 1 本を自動タグ付けの判定に回す
      description: |
        判定を終えていても回し直す。判定中なら積まない（`queued` が偽）。要求の本文は無い
        （docs/design-docs/auto-tagging.md）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: 積んだかどうか
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTagVideoResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 自動タグ付けの機能が切（auto_tagging_off）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/tags/{tagId}/confirm:
    post:
      operationId: confirmVideoTag
      summary: 自動タグ付けが仮に付けたタグを確定する
      description: |
        動画に仮に付いたタグ（`VideoTag.unconfirmed`）を普通の付与にする。要求の本文は無い
        （docs/design-docs/auto-tagging.md）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoTagId"
      responses:
        "204":
          description: 確定した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/tags/{tagId}/reject:
    post:
      operationId: rejectVideoTag
      summary: 自動タグ付けが仮に付けたタグを却下する
      description: |
        動画に仮に付いたタグを外し、この動画にこのタグを自動タグ付けで付け直さない。要求の本文は
        無い（docs/design-docs/auto-tagging.md）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoTagId"
      responses:
        "204":
          description: 却下した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/open:
    post:
      operationId: openVideoFile
      summary: 代表の所在をサーバーの PC の既定アプリで開く
      description: |
        要求の本文は無く、パスも受け取らない。子プロセスを起動した時点で 204 を返す。
        判定は 404 → 409 open_unavailable → 403 → 409 file_missing → 500 の順に行う。
        要求元（RemoteAddr）がループバックで、Host がループバックの名前
        （localhost・127.0.0.1・[::1]）のときだけ受け付ける。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: 既定アプリを起動した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 既定アプリを起動できない環境（open_unavailable）か、ファイルが無い（file_missing）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 子プロセスを起動できなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/stream:
    get:
      operationId: streamVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画本体を配信する
      description: |
        `Range` 要求に対応し、`206 Partial Content` と `Content-Range` を返す。
        詳細は [http-routes.md](./http-routes.md) を参照。再生できない形式
        （`playable = false`）でもファイルはそのまま配信する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 指定された範囲
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/preview:
    get:
      operationId: getVideoPreview
      security:
        - sessionCookie: []
        - {}
      summary: 生成済み hover preview を配信する
      description: |
        保存済みの preview MP4 だけを Range 対応で配信する。元動画の stream や
        live transcode へ fallback しない。成功の応答は `Cache-Control: private, no-cache`
        と `ETag` を持ち、`If-None-Match` が一致すれば `304` を返す（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した current content key
          schema:
            type: string
      responses:
        "200":
          description: preview MP4 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: preview MP4 の指定範囲
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/transcode.mp4:
    get:
      operationId: transcodeVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画をMP4へライブ変換して配信する
      description: |
        指定位置からfragmented MP4を生成し、保存せずレスポンスへ直送する。
        Rangeは使わず、シークはstartMsを変えた新しいrequestで行う。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: startMs
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: attempt
          in: query
          required: false
          description: |
            プレイヤーが要求ごとに作る識別子。付けると、実際の開始位置を
            `getTranscodeStart` で引けるよう台帳に載る。形式が違えば 400。
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - name: quality
          in: query
          required: false
          description: |
            縮める画質。無ければ元の画質（今までどおり、映像をコピーできればコピーする）。
            あれば映像を必ずエンコードし、表示の短辺をこの値に縮め、ビットレートに上限を付ける。
            動画の表示の短辺（`Video.width`・`height` の小さい方）より小さい画質だけを受け付け、
            それ以外と寸法の無い動画は 400
            （specs/027-playback-quality/contracts/transcode-quality-api.md）。
          schema:
            type: string
            enum: [1080p, 720p, 480p, 360p]
      responses:
        "200":
          description: fragmented MP4 stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 変換processを開始できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/transcode-start:
    get:
      operationId: getTranscodeStart
      security:
        - sessionCookie: []
        - {}
      summary: ライブ変換の実際の開始位置を返す
      description: |
        同じ `attempt` を付けた `transcodeVideo` の出力の時間軸の 0 が、元動画のどの時刻かを
        ミリ秒で返す。`attempt` がまだ無いか開始位置が未決なら、決まるまで最大 6 秒待つ。
        それまでに決まらないか、変換が最初のデータを出せずに失敗したら 404。応答は
        `Cache-Control: no-store`（specs/018-live-transcode-seek/contracts/transcode-start-api.md）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: attempt
          in: query
          required: true
          description: "`transcodeVideo` に付けた識別子"
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: 実際の開始位置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeStart"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/subtitles:
    get:
      operationId: listVideoSubtitles
      security:
        - sessionCookie: []
        - {}
      summary: 動画の隣に置いた字幕ファイルの一覧を返す
      description: |
        配信が開く所在（`streamVideo` と同じ順で最初に開けたもの）のフォルダを要求のたびに読み、
        `<名前>.srt`・`<名前>.vtt`・`<名前>.<ラベル>.srt`・`<名前>.<ラベル>.vtt` を返す。
        ラベルの無いものが先頭で、続いてラベルの自然順。同じラベルの `.srt` と `.vtt` は `.vtt`
        だけ、4 MiB を超えるファイルは載せない。中身は読まない。無ければ空の配列で、フォルダを
        読めないときも空の配列を返す。応答は `Cache-Control: no-store`
        （specs/028-sidecar-subtitles/contracts/subtitles-api.md §1）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 字幕ファイルの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrackList"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/subtitles/{file}:
    get:
      operationId: getVideoSubtitle
      security:
        - sessionCookie: []
        - {}
      summary: 字幕ファイルを WebVTT にして返す
      description: |
        `file` が `listVideoSubtitles` と同じ一覧の 1 つと完全に一致するときだけ開き、文字コードを
        判定して UTF-8 の WebVTT にし、すべての cue の時刻から `offsetMs` を引いて返す。
        一覧に無い、開けない、上限を超える、読めない字幕は `404`（reason `subtitle_unavailable`）。
        成功の応答は `Cache-Control: private, no-cache` と `ETag` を持ち、`If-None-Match` が
        一致すれば `304` を返す（specs/028-sidecar-subtitles/contracts/subtitles-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: file
          in: path
          required: true
          description: "`listVideoSubtitles` が返した `file`"
          schema:
            type: string
        - name: offsetMs
          in: query
          description: 再生の時間軸の 0 に当たる元動画の時刻（ミリ秒）。cue の時刻からこの値を引く
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: UTF-8 の WebVTT
          content:
            text/vtt:
              schema:
                type: string
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: サムネイル画像を返す
      description: |
        `v` は内容由来の識別子で、画像が変われば URL も変わる。未生成の場合は 404。
        成功の応答は `Cache-Control: private, no-cache` と `ETag` を持ち、`If-None-Match` が
        一致すれば `304` を返す。見るたびにサーバーへ確かめさせ、ログアウト後や非公開に
        した後にキャッシュから出続けないようにする（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した URL に含まれる版
          schema:
            type: string
      responses:
        "200":
          description: 画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "404":
          description: 動画が存在しないか、サムネイルが未生成

  /api/videos/{id}/seek-thumbnail:
    get:
      operationId: getVideoSeekThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: シーク用サムネイルのスプライトの配置情報を返す
      description: |
        完成したスプライトの配置情報を返す。位置 p ms のコマは
        `min(floor(p / intervalMs), frameCount - 1)` で、コマ k はシート
        `floor(k / (columns * rows))` の左上から行優先で `k mod (columns * rows)` 番目に載る
        （specs/021-seek-thumbnail-sprite/contracts/seek-sprite-api.md §2）。
        `v` は内容由来の識別子である。成功の応答は `Cache-Control: private, no-cache` と
        `ETag` を持ち、`If-None-Match` が一致すれば `304` を返す（guest-api.md §5）。
        解析が終わっていない・尺が無い、またはスプライトが完成していない（生成待ち・生成中・
        失敗）ときは `409`。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返したURLに含まれる内容由来の版
          schema:
            type: string
      responses:
        "200":
          description: スプライトの配置情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekThumbnailSprite"
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 配置情報を読めない、または形が違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/seek-thumbnail/{sheet}:
    get:
      operationId: getVideoSeekThumbnailSheet
      security:
        - sessionCookie: []
        - {}
      summary: シーク用サムネイルのスプライトのシートを返す
      description: |
        配置情報の `sheets[sheet]` が指す JPEG を返す。幅は `columns × frameWidth`、高さは
        `rows × frameHeight`。`sheet` が枚数以上なら `404`。成功の応答は
        `Cache-Control: private, no-cache` と `ETag` を持ち、`If-None-Match` が一致すれば
        `304` を返す（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: sheet
          in: path
          required: true
          description: シートの番号（0 から）
          schema:
            type: integer
            minimum: 0
        - name: v
          in: query
          description: 配置情報の `sheets` に含まれていた内容由来の版
          schema:
            type: string
      responses:
        "200":
          description: シートの画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 画像を読めない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/progress:
    put:
      operationId: putVideoProgress
      summary: 再生位置を記録する
      description: |
        視聴済みの判定はサーバー側で行う。クライアントは位置だけを送る。
        記録は動画の内容に紐づくため、ファイルを移動・改名しても引き継がれる。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: 記録後の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/display-name:
    put:
      operationId: setVideoDisplayName
      summary: 動画の表示名を設定・解除する
      description: |
        所有者だけ。`displayName` の前後の空白を取り除き、空なら表示名を解除して元の題名に戻す。
        制御文字を含む名前と 200 符号位置を超える名前は受け付けない。他の動画と同じ表示名も
        受け付け、同時の変更は後勝ちである。応答は `GET /api/videos/{id}` と同じ形の `Video` で、
        `title`・`fileTitle`・`displayName` が反映済みである。確定後に `/api/events` の `video` が
        流れる（specs/029-video-overrides/contracts/screen-api.md §1）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayNameUpdate"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/work-info:
    put:
      operationId: setVideoWorkInfo
      summary: 動画の作品情報をまるごと置き換える
      description: |
        所有者だけ。本文の作品情報で保存済みのものを置き換える。省いた・null の・前後の空白を除いて空の
        項目は解除し、`{}` はすべてを解除する。人物と団体は id で指す。規則に合わない最初の項目を
        `field` 付きの誤りで返し、何も書かない。応答は `GET /api/videos/{id}` と同じ形の `Video` で、
        `workInfo` が反映済み（すべて解除したときは無い）。変わったときは確定後に同じ利用者データの鍵の
        各動画の `video` が `/api/events` に流れる
        （specs/047-video-work-info/contracts/screen-api.md「PUT /api/videos/{id}/work-info」）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoInput"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/details:
    put:
      operationId: setVideoDetails
      summary: 動画の表示名と作品情報を 1 回で保存する
      description: |
        所有者だけ。全画面の編集画面の保存で、表示名（`PUT /api/videos/{id}/display-name` の規則）と
        作品情報（`PUT /api/videos/{id}/work-info` の規則）を 1 つの取引で書き、どちらかが規則に
        合わなければどちらも書かない。表示名を先に、次に作品情報を `WorkInfo` の項目の順に確かめ、
        最初の誤りだけを返す。表示名の誤りの `field` は `displayName`、作品情報の誤りの `field` は
        `workInfo` の中の位置である。応答は `GET /api/videos/{id}` と同じ形の `Video`
        （specs/047-video-work-info/contracts/screen-api.md「PUT /api/videos/{id}/details」）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoDetailsInput"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/thumbnail-position:
    put:
      operationId: setVideoThumbnailPosition
      summary: 動画の代表サムネイルの位置を設定・解除する
      description: |
        所有者だけ。`positionMs` の場面で代表サムネイルを作り直して公開し、位置を記録する。
        `null` は位置を解除し、自動の位置で作り直す。応答は生成が終わってから返し、形は
        `GET /api/videos/{id}` と同じ `Video` である（`thumbnailState: done`、新しい版の
        `thumbnailUrl`、指定なら `thumbnailPositionMs`）。解析が終わっていないか尺が分からなければ
        409 `duration_unknown`、0 未満か尺以上なら 400 `thumbnail_position_out_of_range`（`limit` に
        尺のミリ秒）、画像を作れなければ 409 `thumbnail_frame_unavailable`（前の画像と位置はそのまま）、
        どの所在も開けなければ 404 `file_unavailable` を返す。同じ動画への同時の指定は直列になり、
        最後に記録した位置の画像が残る。適用した画像があれば同じ取引で外す
        （specs/045-comfyui-thumbnails/contracts/screen-api.md）。確定後に `/api/events` の `video` が流れる
        （specs/029-video-overrides/contracts/screen-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailPositionUpdate"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-image:
    post:
      operationId: uploadThumbnailImage
      summary: 手元の画像を動画のサムネイルにする
      description: |
        所有者だけ。`multipart/form-data` の `image`（PNG・JPEG・静止画の WebP、64 MiB・1 億 2000 万画素まで）を
        受け取り、メモリに持ったまま最後まで読めるかを確かめて、生成した画像と同じ適用で動画の縦横比に
        合わせた代表サムネイルにする。本文全体は部分の区切りと見出しのぶん 1 MiB 多くまで認める。応答は
        公開が終わってから返し、形は `GET /api/videos/{id}` と同じ `Video` である（`thumbnailImage:
        "uploaded"`、新しい版の `thumbnailUrl`）。記録した位置はそのまま残る。`image` が 64 MiB を越えるか
        見出しが 1 億 2000 万画素を越えれば 400 `thumbnail_upload_too_large`（`limit` に越えた上限）、
        PNG・JPEG・WebP でない、アニメーションの WebP、最後まで読めない画像は 400
        `thumbnail_upload_invalid`、動画が無ければ 404 `video_not_found`、要求を始めたときから動画が消えたか
        別の内容になれば 409 `content_changed`、ffmpeg が合わせられなければ 409 `thumbnail_image_invalid`
        を返し、どの誤りでも何も書かない。本文が届き終わったあとの確かめと適用は、接続が切れても 5 分を
        上限に最後まで行う。確定後に `/api/events` の `video` が流れる
        （specs/046-thumbnail-image-upload/contracts/screen-api.md、research.md R-1・R-2）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadThumbnailImageRequest"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: revertThumbnailImage
      summary: 動画に適用したサムネイルの画像を外す
      description: |
        所有者だけ。要求の本文は無い。適用した画像を外し、代表サムネイルをコマから作り直して公開する。
        `thumbnailPositionMs` があればその場面、無ければ自動の位置で作る。画像を適用していなくても
        作り直して 200 を返す。応答は生成が終わってから返し、形は `GET /api/videos/{id}` と同じ
        `Video` である（`thumbnailImage` は無く、新しい版の `thumbnailUrl`）。誤りは
        `PUT /api/videos/{id}/thumbnail-position` と同じで、画像を作れなければ 409
        `thumbnail_frame_unavailable`（適用した画像と前のファイルはそのまま）、どの所在も開けなければ
        404 `file_unavailable` を返す。確定後に `/api/events` の `video` が流れる
        （specs/045-comfyui-thumbnails/contracts/screen-api.md）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-edits:
    post:
      operationId: startThumbnailEdit
      summary: 動画の1コマか今のサムネイルからサムネイルの編集を始める
      description: |
        所有者だけ。`source` が `frame` なら `positionMs` の場面を、長辺を動画の長辺（上限 2048 px）にした
        PNG として取り出す。`thumbnail` なら今のサムネイルから始め、画像を適用していればその元の画像
        （長辺最大 2048 px）を PNG にしたもの、なければ指定した位置のコマ、それも無ければサムネイル
        ジョブと同じ自動の位置のコマ（そこで取れなければ先頭のコマ）を使う。`ready` の編集のセッションを
        `201` で返し、セッションは始めた時点の画像を持ち続ける。同じ動画のセッションがあれば、その実行を
        ComfyUI で中止してから終える。`frame` で `positionMs` が無いか尺の外なら 400
        `thumbnail_position_out_of_range`、ほかの位置の誤りと所在の誤りは
        `PUT /api/videos/{id}/thumbnail-position` と同じで、ComfyUI の接続先が保存されていなければ 409
        `thumbnail_edit_not_ready`、コマを取り出せないか保存した画像を読めなければ 409
        `thumbnail_frame_unavailable` を返す。セッションはメモリにだけあり、イベントは流れない
        （specs/045-comfyui-thumbnails/contracts/screen-api.md、research.md R-4・R-8・R-11、
        specs/046-thumbnail-image-upload/contracts/screen-api.md、research.md R-4）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartThumbnailEditRequest"
      responses:
        "201":
          description: 始めたセッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/versions:
    get:
      operationId: listVideoVersions
      security:
        - sessionCookie: []
        - {}
      summary: 動画の集まりの全バージョンを返す
      description: |
        この動画が属する集まり（同じ動画の別バージョン）のうち、見る人に見せてよい所在を持つ
        バージョンを、実効の代表を先頭に、続きを題名の自然順（同じなら id）で返す。集まりに
        属さなければ `items` はこの動画 1 本である。各項目は `GET /api/videos/{id}` と同じ形
        （所有者には `location`、どちらにも `folder`）で、解像度・コーデック・`sizeBytes`・
        `container` を持つ。ゲストでは公開の動画だけを数え、見せられない動画は 404 `video_not_found`
        （specs/030-video-versions/contracts/screen-api.md §1）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 集まりの全バージョン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/make-representative:
    post:
      operationId: makeRepresentativeVersion
      summary: 動画をその集まりの代表にする
      description: |
        所有者だけ。要求の本文は無い。この動画を集まりの代表（一覧に出す 1 件）にし、集まりの
        全バージョンを返す（既に代表でも同じ）。集まりのタグ・再生位置・公開の設定は変わらない。
        集まりに属さなければ 400 `not_bundled`、無いか登録フォルダの下に所在が無ければ 404
        `video_not_found`。確定後に `/api/events` の `video` が全メンバーで流れる
        （specs/030-video-versions/contracts/screen-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 反映後の集まりの全バージョン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/unbundle:
    post:
      operationId: unbundleVideo
      summary: 動画をその集まりから外す
      description: |
        所有者だけ。要求の本文は無い。外した動画を `GET /api/videos/{id}` と同じ形で返し、
        `tags`・`progress`・`public` は束ねる前のこの動画の値で、`versions` は無い。残りが 1 本
        なら集まりは解け、その 1 本が集まりの値を持つ。集まりに属さなければ 400 `not_bundled`、
        無いか登録フォルダの下に所在が無ければ 404 `video_not_found`。確定後に `/api/events` の
        `video` が元の全メンバーで流れる（specs/030-video-versions/contracts/screen-api.md §4）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 外した動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans:
    post:
      operationId: startScan
      summary: 取り込みを開始する
      description: |
        すでに実行中の場合は、新しく始めずに実行中のスキャンを返す。
        応答は即座に返り、取り込みは背後で進む。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: 開始した、または実行中のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: メディアフォルダが未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/media-folders:
    get:
      operationId: listMediaFolders
      summary: 登録済みメディアフォルダを返す
      responses:
        "200":
          description: id昇順のメディアフォルダ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaFolder"
    post:
      operationId: createMediaFolder
      summary: メディアフォルダを1件追加する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaFolderRequest"
      responses:
        "201":
          description: 作成したメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/media-folders/{id}:
    put:
      operationId: updateMediaFolder
      summary: メディアフォルダ1件のpathを変更する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaFolderRequest"
      responses:
        "200":
          description: 更新後のメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMediaFolder
      summary: メディアフォルダを1件削除する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: 削除した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/transcoding:
    get:
      operationId: getTranscodingSettings
      summary: ライブ変換の映像エンコード方式の設定と、各方式が使えるかを返す
      description: |
        保存した選択、今のライブ変換の要求が使う方式、選んだ方式を使えないときの理由、起動時の
        確認が終わっていないか、ハードウェアの方式ごとの確認結果を返す
        （specs/025-hardware-encoding/contracts/transcoding-settings-api.md §2）。
      responses:
        "200":
          description: 今の設定と確認結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingSettings"
    put:
      operationId: updateTranscodingSettings
      summary: ライブ変換の映像エンコード方式を保存する
      description: |
        保存は次に始まるライブ変換の要求から効き、配信中の変換は始めた方式のまま続く。
        `software` と `auto` は常に受け付ける。使える（`state` が `available`）ハードウェアの
        方式でないときは `409` `conflict`・reason `encoder_unavailable` を返し、保存値は変えない
        （specs/025-hardware-encoding/contracts/transcoding-settings-api.md §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTranscodingSettingsRequest"
      responses:
        "200":
          description: 保存後の設定と確認結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/network:
    get:
      operationId: getNetworkSettings
      summary: LAN からの接続の許可と、許可中に開けるアドレスを返す
      description: |
        Windows デスクトップ版だけの設定。保存した選択、今の待ち受けのポート、許可中なら上がっている
        非ループバックの IPv4 アドレスごとの URL を返す。デスクトップ版でなければ `404` `not_found`
        （specs/037-windows-app/contracts/network-settings-api.md §2）。
      responses:
        "200":
          description: 今の設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNetworkSettings
      summary: LAN からの接続を許可するかを切り替え、待ち受けを開き直してから保存する
      description: |
        許可するなら `0.0.0.0:<ポート>`、しないなら `127.0.0.1:<ポート>` で待ち受けを開き直し、
        開き直せたら保存する。確立済みの接続は切らない。今と同じ値なら何もしない。新しいアドレスで
        開き直せなければ元のアドレスで待ち受けを戻し、保存値を変えずに `409` `conflict`・reason
        `listen_failed` を返す。開き直せたが保存に失敗したら、待ち受けを元のアドレスへ戻して `500`
        を返す。デスクトップ版でなければ `404` `not_found`
        （specs/037-windows-app/contracts/network-settings-api.md §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNetworkSettingsRequest"
      responses:
        "200":
          description: 切り替えたあとの設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 開き直したあとの保存に失敗した。待ち受けは元のアドレスへ戻した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/auto-import:
    get:
      operationId: getAutoImportSettings
      summary: 自動の取り込みの選択と、フォルダの監視の今の状態を返す
      description: |
        保存した選択（`enabled`）と、監視が今していること（`watch.state`）を返す。問題があれば
        `watch.problem` と、あればその場所 `watch.path` を返す
        （specs/042-folder-watch-import/contracts/screen-api.md）。
      responses:
        "200":
          description: 今の設定と監視の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoImportSettings"
    put:
      operationId: updateAutoImportSettings
      summary: 自動の取り込みを入れる／切るを保存し、監視を張る／外す
      description: |
        選択を保存し、監視を張る／外すだけで、スキャンは始めない。今と同じ値なら何も変えない
        （specs/042-folder-watch-import/contracts/screen-api.md）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoImportSettingsRequest"
      responses:
        "200":
          description: 変更後の設定。`watch.state` は `starting` か `off`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoImportSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/ollama:
    get:
      operationId: getOllamaSettings
      summary: Ollama の接続先を返す
      description: |
        判定モデル（Clef）を動かす Ollama の基底 URL と模型名。判定モデルを使う機能（自動タグ付け）の
        設定とは別に持つ（docs/design-docs/ai-layer.md）。保存値が無ければ既定値を返す。
      responses:
        "200":
          description: 今の接続先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettings"
    put:
      operationId: updateOllamaSettings
      summary: Ollama の接続先を保存する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaSettings"
      responses:
        "200":
          description: 保存後の接続先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/ollama/check:
    post:
      operationId: checkOllama
      summary: 保存した接続先に Ollama が動いていて、保存した模型があるかを確かめる
      description: |
        `GET /api/version` と `GET /api/tags` だけで確かめ、判定はさせず模型も読み込まないので
        数秒で終わる。判定に使えるかは `POST /api/auto-tagging/check` が確かめる
        （docs/design-docs/ai-layer.md）。接続先は要求の本文から取らない（任意の URL へ
        サーバーから要求を送らせないため）。要求の本文は無い。
      responses:
        "200":
          description: 確かめた結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/comfyui:
    get:
      operationId: getComfyUISettings
      summary: ComfyUI の接続先を返す
      description: |
        サムネイルの編集に使う ComfyUI の接続先（自前の ComfyUI か Comfy Cloud）。サムネイルの編集の
        機能とは別に持つ（docs/design-docs/ai-layer.md）。API キーは返さず、保存されているかを
        `apiKeySet` で返す。何も保存されていなければ `provider` を省いた `200` を返す。
        `Cache-Control: no-store` を付ける
        （specs/045-comfyui-thumbnails/contracts/screen-api.md）。
      responses:
        "200":
          description: 今の接続先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyUISettings"
    put:
      operationId: updateComfyUISettings
      summary: ComfyUI の接続先を保存する
      description: |
        `apiKey` が無ければ保存済みのキーを残し、`""` なら消す。`self_hosted` で正しい http か
        https の URL が無ければ `400` `invalid_request`・reason `comfyui_url_invalid`、`cloud` で
        キーが保存も送信もされていなければ reason `comfyui_api_key_missing` を返し、保存しない。
        `cloud` では `url` を使わず、保存済みの URL を残す
        （specs/045-comfyui-thumbnails/research.md R-9）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComfyUISettingsRequest"
      responses:
        "200":
          description: 保存後の接続先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyUISettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/comfyui/check:
    post:
      operationId: checkComfyUI
      summary: 保存した接続先に ComfyUI が応えるかを確かめる
      description: |
        自前の ComfyUI は保存した URL の `GET /system_stats`、Comfy Cloud は `GET /jobs?limit=1` に
        `X-API-Key` を付けて確かめる。応えたら `GET /object_info` を読み、vv のワークフローの
        ノードの型とローダーが名指すモデルファイルがあるかを確かめ、足りなければ `available: false`
        と `missing` を返す（R-13）。使えないときの `message` は、届かない、ComfyUI でない、キーが
        拒まれた、何も保存されていない、ファイルが足りないを区別する。接続先は要求の本文から取らない
        （任意の URL へサーバーから要求を送らせないため）。要求の本文は無い
        （specs/045-comfyui-thumbnails/research.md R-5）。
      responses:
        "200":
          description: 確かめた結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/readiness:
    get:
      operationId: getThumbnailEditReadiness
      summary: サムネイルの編集を始められるかを返す
      description: |
        動画のページが編集の入口を有効にするために読む。`connection` は ComfyUI の接続先が保存されて
        いることで、接続テストに通ったことではない
        （specs/045-comfyui-thumbnails/contracts/screen-api.md）。
      responses:
        "200":
          description: 編集の準備の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEditReadiness"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/{editId}:
    get:
      operationId: getThumbnailEdit
      summary: サムネイルの編集のセッションの今の状態を返す
      description: |
        実行が進んでいれば ComfyUI の状態を読み、成功していれば出力を取ってから返す。読み取りはページの
        生存の知らせを兼ね、5 分読まれないセッションは実行を中止して終わる。送ってから 10 分終わらない
        実行は中止して `failed`（`timed_out`）にする。終わったセッションは 404
        `thumbnail_edit_not_found`。`Cache-Control: no-store` を付ける
        （specs/045-comfyui-thumbnails/contracts/screen-api.md、research.md R-4・R-11）。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: セッションの今の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: discardThumbnailEdit
      summary: サムネイルの編集のセッションを捨てる
      description: |
        実行が進んでいれば ComfyUI で中止してからセッションを捨て、`204` を返す。終わったセッションや
        無いセッションでも `204` である。サムネイルは変わらない。画面は破棄とページを離れるときに呼ぶ。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "204":
          description: 捨てた
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/{editId}/frame:
    get:
      operationId: getThumbnailEditFrame
      summary: 編集するコマの PNG を返す
      description: |
        セッションを始めたときに取り出したコマ。大きさは `ThumbnailEdit` の `frameWidth`・`frameHeight`
        で、マスクはこの大きさで描く。読み取りはページの生存の知らせを兼ねる。終わったセッションは 404
        `thumbnail_edit_not_found`。`Cache-Control: no-store` を付ける。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: コマの画像
          content:
            image/png:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/thumbnail-edits/{editId}/result:
    get:
      operationId: getThumbnailEditResult
      summary: 成功した実行の出力の画像を返す
      description: |
        `succeeded` のときの ComfyUI の出力の画像そのもの（適用で動画の縦横比に合わせる前）。成功した
        実行が無ければ 409 `thumbnail_edit_no_result`、終わったセッションは 404 `thumbnail_edit_not_found`。
        `Cache-Control: no-store` を付ける。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: 出力の画像
          content:
            image/*:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/thumbnail-edits/{editId}/runs:
    post:
      operationId: runThumbnailEdit
      summary: サムネイルの編集を ComfyUI で実行する
      description: |
        `multipart/form-data` の `prompt`（4000 文字まで）、`mask`（コマの大きさの PNG）、`reference`
        （PNG・JPEG・WebP、20 MiB まで）を受け取る。どれも省略できる。進んでいる実行があれば中止し、
        今の接続先をこの実行の写しにして、入力を上げてワークフローを送り、`202` で `queued` のセッションを
        返す。マスクがコマの大きさの PNG でなければ 400 `thumbnail_edit_mask_invalid`、参考画像を読めなければ
        400 `thumbnail_edit_reference_invalid` を、何も上げる前に返す。接続先が消されていれば 409
        `thumbnail_edit_not_ready`。上げるか送るのに失敗すれば 502 `provider_failed` と失敗の理由
        （`unreachable` など）を返し、セッションは同じ理由の `failed` になる
        （specs/045-comfyui-thumbnails/contracts/screen-api.md、contracts/workflow.md）。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RunThumbnailEditRequest"
      responses:
        "202":
          description: 送った実行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ProviderFailed"

  /api/thumbnail-edits/{editId}/cancel:
    post:
      operationId: cancelThumbnailEdit
      summary: 進んでいる実行を中止する
      description: |
        要求の本文は無い。進んでいる実行を ComfyUI で中止して `cancelled` を返す。進んでいなければ今の
        状態を返す。サムネイルは変わらない。終わったセッションは 404 `thumbnail_edit_not_found`。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: セッションの今の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/thumbnail-edits/{editId}/apply:
    post:
      operationId: applyThumbnailEdit
      summary: 成功した実行の画像をサムネイルにする
      description: |
        要求の本文は無い。出力を動画の縦横比に合わせて代表サムネイルとして適用し、セッションを終えて
        `GET /api/videos/{id}` と同じ形の `Video` を返す。`succeeded` でなければ 409
        `thumbnail_edit_no_result`、動画が消えたか別の内容を持てば 409 `content_changed`（セッションは
        終わる）、画像を読めなければ 409 `thumbnail_image_invalid` を返す。確定後に `/api/events` の
        `video` が流れる（specs/045-comfyui-thumbnails/contracts/screen-api.md、research.md R-10）。
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: 反映後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/auto-tagging:
    get:
      operationId: getAutoTaggingSettings
      summary: 自動タグ付けの機能の設定と、判定の待ち行列の件数を返す
      description: |
        機能の入切（`enabled`、既定は切）、取り込みのあとの自動の判定、2 つの確率。接続先は
        `/api/settings/ollama` が持つ（docs/design-docs/ai-layer.md）。
      responses:
        "200":
          description: 今の設定と待ち行列の件数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingSettings"
    put:
      operationId: updateAutoTaggingSettings
      summary: 自動タグ付けの機能の設定を保存する
      description: |
        値を確かめて保存する。判定は始めない。`enabled` を入れると、積んであった判定を続きから
        処理する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoTaggingSettingsRequest"
      responses:
        "200":
          description: 保存後の設定と待ち行列の件数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auto-tagging/check:
    post:
      operationId: checkAutoTaggingClassifier
      summary: 判定の口に 1 問を判定させ、自動タグ付けに使えるかを確かめる
      description: |
        今の判定の提供元に短い質問を 1 つ判定させ、確率の答えが返るかを確かめる。機能の入切に
        関係なく確かめられる。模型の読み込みを含むので数分かかることがある
        （docs/design-docs/auto-tagging.md）。要求の本文は無い。
      responses:
        "200":
          description: 確かめた結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auto-tagging/runs:
    post:
      operationId: startAutoTagging
      summary: ライブラリの動画を判定に回す
      description: |
        `missing` はまだ判定を終えていない動画（判定していない・失敗した）を、`all` は
        判定中のもの以外のすべてを積む。積んだ件数を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAutoTaggingRequest"
      responses:
        "202":
          description: 積んだ件数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingQueued"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 自動タグ付けの機能が切（auto_tagging_off）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/api-tokens:
    get:
      operationId: listApiTokens
      summary: 発行した API トークンを返す
      description: |
        作成日時の降順で返す。平文とハッシュは返さない
        （specs/026-external-api/contracts/token-api.md）。所有者のセッションだけで使え、
        Bearer は読まない。
      responses:
        "200":
          description: API トークンの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
    post:
      operationId: createApiToken
      summary: API トークンを 1 件発行する
      description: |
        `secret` は平文で、この応答にだけ現れる。名前の規則を外れれば `400` `invalid_request` に
        reason `api_token_name_empty`・`api_token_name_control_characters`・
        `api_token_name_too_long`（`limit` 付き）を付ける
        （specs/026-external-api/contracts/token-api.md）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
      responses:
        "201":
          description: 発行した API トークンと、その平文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/api-tokens/{id}:
    delete:
      operationId: deleteApiToken
      summary: API トークンを 1 件失効させる
      description: 無い id も `204` にする（二重の失効を誤りにしない）。
      parameters:
        - $ref: "#/components/parameters/APITokenId"
      responses:
        "204":
          description: 失効させた
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tags:
    get:
      operationId: listTags
      summary: タグを一覧する
      description: |
        本数0のタグも含む（contracts/tags-api.md §3）。`q`・`tentative`・`unused` は全部のタグに
        AND で掛かり、`sort` の順に並べる。`limit` を付けると1ページずつ返し、続きがあれば
        `nextCursor` を入れる。`limit` を省くと条件に合う全件を返す
        （specs/036-tag-admin-scale/contracts/screen-api.md §5）。
      parameters:
        - name: q
          in: query
          description: |
            検索語。全角・半角、大文字・小文字、ひらがな・カタカナなどの表記の揺れを吸収した形
            （照合形）にして前後の空白を落とし、空でなければ元の名前かシノニムに部分一致する
            タグだけにする。語の分解はしない
          schema:
            type: string
            maxLength: 100
        - name: tentative
          in: query
          description: true なら仮のタグだけにする
          schema:
            type: boolean
            default: false
        - name: unused
          in: query
          description: true なら本数0のタグだけにする
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/TagSort"
        - name: cursor
          in: query
          description: |
            前回の応答が返した `nextCursor`。中身は不透明で、解釈しない。同じ `q`・`tentative`・
            `unused`・`sort` で続けて使う。`limit` を省いたときは無視する
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数。省くと全件を返し、`nextCursor` は入らない
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: タグの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createTag
      summary: タグを1件作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: 作成したタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags/{id}:
    patch:
      operationId: renameTag
      summary: タグの元の名前を書き換える
      description: 今と同じ名前を送ったときは何も変えずに今の状態を返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: 更新後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTag
      summary: タグを1件削除する
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: 削除した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/merge:
    post:
      operationId: mergeTag
      summary: sourceIdsのタグをidのタグへ統合する
      description: |
        統合元（sourceIds、1件以上20,000件以下）の付与・元の名前・シノニムはすべて
        統合先（id）へ1つの取引で移り、統合元は一覧から消え、統合先は確定したタグになる。
        無い統合元は飛ばしてnotFoundIdsに載せる。統合元がすべて無かったときも200で、
        tagは変わらない統合先。sourceIdsが空か多すぎる（too_many_tags）・idを含む
        （merge_same_tag）ときは400、統合先が無いときは404を返す
        （specs/036-tag-admin-scale/contracts/screen-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTagRequest"
      responses:
        "200":
          description: 統合後の統合先タグと、もう無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/synonyms:
    post:
      operationId: addTagSynonym
      summary: 名前をidのタグのシノニムにする
      description: |
        既にidのシノニムなら何も変えずに200を返す。idの元の名前なら409
        tag_name_takenを返す。別のタグSの元の名前で、mergeTagIdがSのidと
        一致するときはSをidへ統合し、一致しない（無い場合を含む）ときは409
        tag_merge_requiredを返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagSynonymRequest"
      responses:
        "200":
          description: 更新後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeTagSynonym
      summary: nameをidのタグのシノニムから外す
      description: nameがidのシノニムでなければ何も変えずに204を返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
        - name: name
          in: query
          required: true
          description: 外すシノニムの名前
          schema:
            type: string
      responses:
        "204":
          description: 外した、またはもともとシノニムでなかった
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/confirm:
    post:
      operationId: confirmTag
      summary: 仮のタグを確定する
      description: |
        仮のタグを確定したタグにする。付いている動画・名前・シノニムは変えない。既に確定した
        タグなら何も変えずに今の状態を返す（specs/031-tentative-tags/contracts/screen-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "200":
          description: 確定したタグ（tentative は偽）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/reject:
    post:
      operationId: rejectTag
      summary: 仮のタグを却下する
      description: |
        仮のタグを消し、付いていた動画から外し、元の名前を却下した名前の一覧に入れる。
        確定したタグには 409 tag_not_tentative を返し、何も変えない
        （specs/031-tentative-tags/contracts/screen-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: 却下した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags/rejected-names:
    get:
      operationId: listRejectedTagNames
      summary: 却下した名前を一覧する
      description: |
        名前の自然順（sort_key、同じなら name のバイト順）でページに分けて返す
        （specs/036-tag-admin-scale/contracts/screen-api.md §6）。`limit` が範囲外、`cursor` が
        解釈できないときは 400 `invalid_request`。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 却下した名前の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: forgetRejectedTagName
      summary: 却下した名前を一覧から外す
      description: |
        name を登録時と同じく整えてから照合する。一覧に無い名前・整えられない入力でも、
        何も変えずに 204 を返す（specs/031-tentative-tags/contracts/screen-api.md §3）。
      parameters:
        - name: name
          in: query
          required: true
          description: 外す名前
          schema:
            type: string
      responses:
        "204":
          description: 外した、またはもともと一覧に無かった
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tags/batch:
    post:
      operationId: batchTags
      summary: 複数のタグをまとめて確定・却下・削除する
      description: |
        `ids` のうち今あり、`action` が働く種類（`confirm`・`reject` は仮のタグ、`delete` は
        確定したタグ）のタグだけを 1 つの取引で処理する。働かない種類の id は何も変えずに
        `notApplicableIds`、無い id は `notFoundIds` に入れる。`ids` の重複は 1 つとして扱い、
        3 つの配列は互いに重ならず、`ids` に現れた順。取引が失敗したら何も変えない
        （specs/036-tag-admin-scale/contracts/screen-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBatchRequest"
      responses:
        "200":
          description: 処理した・無かった・働かなかった id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tags/impact:
    post:
      operationId: tagImpact
      summary: まとめての却下・削除・統合の確認に出す数を返す
      description: |
        `ids` のうち今あり、`action` が働くタグ（`reject` は仮のタグ、`delete` は確定したタグ、
        `merge` はどちらも）の数と、そのどれかが付いた、いまライブラリにある動画の本数
        （手で付けた分とフォルダ名から付いている分のどちらでも 1 本、重複なし）を返す。
        何も変えない（specs/036-tag-admin-scale/contracts/screen-api.md §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagImpactRequest"
      responses:
        "200":
          description: 確認に出す数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagImpactResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/people:
    get:
      operationId: listPeople
      summary: 人物を一覧する
      description: |
        所有者だけ。`q` は名前と別名に部分一致し、`sort` の順に並べる。`limit` を付けると 1 ページずつ返し、
        続きがあれば `nextCursor` を入れる。`limit` を省くと条件に合う全件を返す
        （specs/047-video-work-info/contracts/screen-api.md「People and organizations」）。
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
      responses:
        "200":
          description: 人物の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createPerson
      summary: 人物を 1 件作る
      description: |
        所有者だけ。項目の規則に合わなければ 400 で `reason`（`work_info_*`）と `field` を返し、他の人物が持つ
        外部 ID なら 409 `external_id_taken`（`field: externalIds[i]`）。`parentId` は送れない（400 `invalid_request`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: 作った人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/people/{id}:
    get:
      operationId: getPerson
      summary: 人物を 1 件返す
      description: 所有者だけ。無ければ 404 `person_not_found`。
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: 人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      summary: 人物の名前・別名・外部 ID を書き換える
      description: |
        所有者だけ。送ったプロパティだけを置き換え、一覧は丸ごと置き換える（`null` は空にする）。何も変わらなければ
        書かずに今の状態を返す。誤りは作成と同じで、無ければ 404 `person_not_found`。`parentId` は送れない（400 `invalid_request`）。
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPatch"
      responses:
        "200":
          description: 書き換えた後の人物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePerson
      summary: 人物を 1 件消す
      description: 所有者だけ。動画との結び付きも外す。無ければ 404 `person_not_found`。
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: 消した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/merge:
    post:
      operationId: mergePeople
      summary: sourceIds の人物を id の人物へ統合する
      description: |
        所有者だけ。統合元（1 件以上 20,000 件以下）の結び付き・名前・外部 ID を 1 つの取引で統合先へ移し、
        統合元を消す。無い統合元は飛ばして `notFoundIds` に載せる。`sourceIds` の件数が範囲の外なら 400
        `work_info_too_many`（`field: sourceIds`）、統合先を含めば 400 `merge_same_person`、統合後の別名か
        外部 ID が上限を超えれば 400 `work_info_too_many`（`field: aliases` か `externalIds`）、統合先が無ければ
        404 `person_not_found`。誤りのときは何も変えない。
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、もう無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organizations:
    get:
      operationId: listOrganizations
      summary: 団体を一覧する
      description: |
        所有者だけ。`q` は名前と別名に部分一致し、`sort` の順に並べる。`limit` を付けると 1 ページずつ返し、
        続きがあれば `nextCursor` を入れる。`limit` を省くと条件に合う全件を返す
        （specs/047-video-work-info/contracts/screen-api.md「People and organizations」）。
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
      responses:
        "200":
          description: 団体の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createOrganization
      summary: 団体を 1 件作る
      description: |
        所有者だけ。項目の規則に合わなければ 400 で `reason`（`work_info_*`）と `field` を返し、他の団体が持つ
        外部 ID なら 409 `external_id_taken`（`field: externalIds[i]`）。`parentId` の団体が無ければ 404 `organization_not_found`（`field: parentId`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: 作った団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organizations/{id}:
    get:
      operationId: getOrganization
      summary: 団体を 1 件返す
      description: 所有者だけ。無ければ 404 `organization_not_found`。
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: 団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      summary: 団体の名前・別名・外部 ID を書き換える
      description: |
        所有者だけ。送ったプロパティだけを置き換え、一覧は丸ごと置き換える（`null` は空にする）。何も変わらなければ
        書かずに今の状態を返す。誤りは作成と同じで、無ければ 404 `organization_not_found`。`parentId` の団体が無ければ 404 `organization_not_found`（`field: parentId`）、自分か子孫なら 400 `organization_parent_cycle`。
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPatch"
      responses:
        "200":
          description: 書き換えた後の団体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteOrganization
      summary: 団体を 1 件消す
      description: 所有者だけ。動画との結び付きも外す。無ければ 404 `organization_not_found`。
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: 消した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organizations/{id}/merge:
    post:
      operationId: mergeOrganizations
      summary: sourceIds の団体を id の団体へ統合する
      description: |
        所有者だけ。統合元（1 件以上 20,000 件以下）の結び付き・名前・外部 ID を 1 つの取引で統合先へ移し、
        統合元を消す。無い統合元は飛ばして `notFoundIds` に載せる。`sourceIds` の件数が範囲の外なら 400
        `work_info_too_many`（`field: sourceIds`）、統合先を含めば 400 `merge_same_organization`、統合後の別名か
        外部 ID が上限を超えれば 400 `work_info_too_many`（`field: aliases` か `externalIds`）、統合先が無ければ
        404 `organization_not_found`。統合元が統合先の親か祖先なら 400 `organization_parent_cycle`。誤りのときは何も変えない。
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: 統合後の統合先と、もう無かった統合元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/video-tags:
    post:
      operationId: updateVideoTags
      summary: 動画へタグを付ける・外す
      description: |
        `videoIds` へ `action`（`add`・`remove`）の `tag` を適用する。再生画面の1本も
        選択バーの複数本も、同じこの経路を使う。`remove` は `tag.id` での指定だけを
        受け付け、`name` を送ると400になる。`tag: { name }` の付与は、名前を
        シノニムを含めて引き、無ければ作る。`videoIds` は1件以上20000件以下で、
        重複は1つとして数える。処理は1つのトランザクションで、全部に反映するか
        1つも反映しない（specs/014-video-tags/contracts/tags-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: 適用結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: 指定したタグがもう無い（tag_not_found）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/video-tags/summary:
    post:
      operationId: summarizeVideoTags
      summary: 選んだ動画に付いたタグの要約を返す
      description: |
        `total` は `videoIds` のうちいまライブラリにある動画の数、`count` はそのうち
        そのタグが付いている数。`count < total` のタグが一部にだけ付いている。
        `items` は1本以上に付いているタグだけで、名前の自然順
        （specs/014-video-tags/contracts/tags-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsSummaryRequest"
      responses:
        "200":
          description: タグの要約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/video-visibility:
    put:
      operationId: updateVideoVisibility
      summary: 動画の公開・非公開を切り替える
      description: |
        `videoIds` の公開フラグを `public` にそろえる。詳細画面の1本も選択バーの複数本も、
        同じこの経路を使う。`videoIds` は1件以上20000件以下で、重複は1つとして数える。
        既に同じ状態の動画も誤りにせず `applied` に数える。処理は1つのトランザクションで、
        全部に反映するか1つも反映しない。非公開にした動画をゲストとして配信中の応答は
        打ち切る（specs/016-single-account-auth/contracts/guest-api.md §4・§6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoVisibilityRequest"
      responses:
        "200":
          description: 適用結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVisibilityResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/favorites:
    put:
      operationId: updateFavorites
      summary: 動画とグループのお気に入りを付け外しする
      description: |
        所有者だけ。`videoIds` の動画と `groupIds` のグループのお気に入りを `favorite` にそろえる。
        `videoIds` と `groupIds` の合計（重複は 1 つに数える）が 1 以上 20000 以下でなければ 400
        `too_many_videos`（`POST /api/video-tags` と同じ上限）で、何も変えない。ライブラリに無い
        動画の id と無いグループの id は誤りにせず数えない。既に同じ状態のものは誤りにせず数え、
        付いているものに付けてもお気に入りにした日時は変えない。`groupIds` にグループを入れても
        その動画には付かない。グループのお気に入りはグループの解散で消える
        （specs/048-groups/research.md R-10）。処理は 1 つのトランザクションで、全部に反映するか 1 つも反映しない。確定後の
        `/api/events` の知らせは無い（specs/035-favorites/contracts/screen-api.md §1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritesRequest"
      responses:
        "200":
          description: 適用結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/playlists:
    get:
      operationId: listPlaylists
      summary: プレイリストを更新日時の新しい順に返す
      description: |
        所有者だけ。プレイリストを `updatedAt` の新しい順（同じなら id の大きい順）に、`cursor` の
        次から最大 `limit` 件返す。続きがあれば `nextCursor` を入れ、`total` はページングとは独立に
        全部の数を返す。`version` は一覧の版で、プレイリストを作る・消す・変えるたびに変わる。
        ページを読んでいる間に変わったプレイリストは前のページの側へ動いて `cursor` の次からは
        返らないので、クライアントは `version` が最初のページと違えば最初のページから読み直す。
        `covers` は返したページの分だけ作る。`cursor` が読めなければ 400
        `invalid_cursor`、`limit` が範囲の外なら 400 `invalid_request`。`itemCount` は今見せる
        項目の数である（specs/044-playlists/contracts/screen-api.md）。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: プレイリストの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createPlaylist
      summary: 空のプレイリストを作る
      description: |
        所有者だけ。名前は前後の空白を取り除いて 1〜100 文字（符号位置）でなければ 400
        `invalid_request`。同じ名前のプレイリストがあってもよい（specs/044-playlists/research.md R-11）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistName"
      responses:
        "201":
          description: 作ったプレイリスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/playlists/{id}:
    get:
      operationId: getPlaylist
      summary: プレイリスト 1 つと見せる項目を返す
      description: |
        所有者だけ。項目は位置の順で、今ライブラリの動画かグループに引ける項目だけを返す
        （specs/044-playlists/research.md R-4）。`video` と `group` はライブラリの項目と同じく所有者の値
        （`progress`・`watchState`・`watchedCount`・`favorite`）を持つ。無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      responses:
        "200":
          description: プレイリスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: renamePlaylist
      summary: プレイリストの名前を変える
      description: |
        所有者だけ。名前の規則は作成と同じで、応答の `name` は前後の空白を取り除いた名前である。
        無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistName"
      responses:
        "200":
          description: 名前を変えたあとのプレイリスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlaylist
      summary: プレイリストを消す
      description: |
        所有者だけ。項目も消える。動画・グループ、そのお気に入りと再生位置は変わらない。
        無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      responses:
        "204":
          description: 消した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items:
    post:
      operationId: addPlaylistItems
      summary: プレイリストの末尾に動画とグループを足す
      description: |
        所有者だけ。`videoIds` の動画、次に `groupIds` のグループを要求の順で末尾に足す
        （specs/044-playlists/research.md R-5、specs/048-groups/research.md R-10）。ライブラリに無い
        動画の id と無いグループの id はどちらの数にも入らず、重複は 1 度だけ数える。既にプレイリストに
        あるものは `existing` に数え、何も変えない。グループの項目はグループの解散で消える。
        両方が空なら 400 `invalid_request`、重複を除いた合計が 20000 を超えれば 400
        `too_many_videos`（`PUT /api/favorites` と同じ上限）。プレイリストが無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemsAdd"
      responses:
        "200":
          description: 足した結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItemsAdded"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items/{itemId}:
    delete:
      operationId: removePlaylistItem
      summary: プレイリストから項目を 1 つ外す
      description: |
        所有者だけ。残りの項目は詰め直す。動画・グループ、そのお気に入りと再生位置は変わらない。
        プレイリストか項目が無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - $ref: "#/components/parameters/PlaylistItemId"
      responses:
        "204":
          description: 外した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items/{itemId}/move:
    post:
      operationId: movePlaylistItem
      summary: プレイリストの項目 1 つを並べ替える
      description: |
        所有者だけ。項目を `afterItemId` の項目のすぐ後ろへ移す。`null` なら先頭へ移す
        （specs/044-playlists/research.md R-3）。プレイリスト・項目・`afterItemId` の項目がそのプレイリストに
        無ければ 404 `not_found`、`afterItemId` が `itemId` と同じなら 400 `invalid_request`。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - $ref: "#/components/parameters/PlaylistItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemMove"
      responses:
        "204":
          description: 移した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/watch-history:
    get:
      operationId: listWatchHistory
      summary: 視聴履歴を新しい順に返す
      description: |
        所有者だけ。視聴履歴を視聴を始めた時刻の新しい順（同じ時刻は id の大きい順）に返す
        （specs/043-watch-history/contracts/screen-api.md）。各件の `video` は、その内容の動画が
        いまライブラリにあって開ける所在を持つときだけ入る（集まりの代表でないバージョンも含む）。
        `watch`・`query`・`date` はページを切る前に掛け、`and` で結ぶ。`cursor` が読めなければ 400
        `invalid_cursor`。`limit` が範囲の外、`watch` が 3 つの値のどれでもない、`query` が 100 文字を
        超える、`date` が 2 つの形のどちらでもない、`date` に `tz` が無い、`tz` をサーバーが知らない
        ときは 400 `invalid_request`。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: watch
          in: query
          description: 動画のいまの視聴状態で絞る。all は絞り込まない。動画の無い件は all にだけ出る
          schema:
            $ref: "#/components/schemas/WatchHistoryFilter"
        - name: query
          in: query
          description: |
            検索語。書き方は `GET /api/videos` の `query` と同じ（AND・フレーズ・除外・OR、表記の揺れの吸収、
            先頭から 16 語まで）。照合するのは題名だけで、動画のある件はファイルの題名と表示名、動画の無い件は
            題名の写し。相対パスとタグ名には照合しない
          schema:
            type: string
            maxLength: 100
        - name: date
          in: query
          description: |
            `YYYY-MM-DD` か `YYYY-MM`。`tz` の暦でその日か月が終わるより前の件だけにする。1 ページ目は
            その日付から始まり、`nextCursor` で古い件へ続く。`tz` が必須
          schema:
            type: string
        - name: tz
          in: query
          description: 日と月の境目を取る IANA のタイムゾーン名（例 Asia/Tokyo）。`date` があるときは必須
          schema:
            type: string
      responses:
        "200":
          description: 視聴履歴の1ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    delete:
      operationId: clearWatchHistory
      summary: 視聴履歴を全件消す
      description: |
        所有者だけ。視聴履歴をすべて消す。空でも 204。再生位置・視聴済み・最後に再生した日時は
        変えず、`/api/events` の知らせも無い（specs/043-watch-history/contracts/screen-api.md）。
      responses:
        "204":
          description: 消した
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/watch-history/dates:
    get:
      operationId: listWatchHistoryDates
      summary: 視聴履歴のある日を新しい順に返す
      description: |
        所有者だけ。`watch` と `query` を満たす件のある日を、`tz` の暦の `YYYY-MM-DD` で新しい順に返す
        （specs/043-watch-history/contracts/screen-api.md）。どの日もその月も一覧の `date` に渡せる。
        `tz` が無いかサーバーが知らない、`watch` が 3 つの値のどれでもない、`query` が 100 文字を
        超えるときは 400 `invalid_request`。
      parameters:
        - name: tz
          in: query
          required: true
          description: 日を数える IANA のタイムゾーン名（例 Asia/Tokyo）
          schema:
            type: string
        - name: watch
          in: query
          description: 一覧の `watch` と同じ
          schema:
            $ref: "#/components/schemas/WatchHistoryFilter"
        - name: query
          in: query
          description: 一覧の `query` と同じ
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 件のある日
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryDates"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/watch-history/{id}:
    delete:
      operationId: deleteWatchHistoryEntry
      summary: 視聴履歴を 1 件消す
      description: |
        所有者だけ。その件が無ければ 404 `not_found`（別のタブで消えた件）。再生位置・視聴済み・
        最後に再生した日時は変えず、`/api/events` の知らせも無い
        （specs/043-watch-history/contracts/screen-api.md）。
      parameters:
        - $ref: "#/components/parameters/WatchHistoryEntryId"
      responses:
        "204":
          description: 消した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/playback:
    get:
      operationId: getPlaylistPlayback
      summary: プレイリストから再生しているときの位置と次の動画を返す
      description: |
        所有者だけ。動画ページがプレイリスト `id` の項目 `item` の動画 `video` を再生しているときの、見せる
        項目の中での位置と数、連続再生で次に開く動画（`next`）、前後の見せる項目の開始の動画
        （`previousItem`・`nextItem`）を、その時点の並びから返す。グループの項目は、今の動画が
        メンバーなら後ろのメンバーへ進み、最後のメンバーかメンバーでなくなっていれば次の見せる項目へ
        進む。項目の開始の動画は、動画の項目ならその動画、グループの項目ならグループを開くときの
        メンバー（`openVideoId`）である。今の項目が見せない項目なら `position` は 0 で、その位置の前後の
        見せる項目から決める。プレイリストの終わりなら `next` は無い。`item` か `video` が無いか
        整数でなければ 400 `invalid_request`、プレイリストか項目が無ければ 404 `not_found`
        （specs/044-playlists/contracts/screen-api.md、data-model.md「Playback order」）。
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - name: item
          in: query
          required: true
          description: 再生している項目の識別子
          schema:
            type: integer
            format: int64
        - name: video
          in: query
          required: true
          description: 動画ページで開いている動画の識別子
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 位置と次の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistPlayback"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/video-bundles:
    post:
      operationId: bundleVideos
      summary: 動画を同じ動画の別バージョンとして束ねる
      description: |
        所有者だけ。`videoIds` の動画を 1 つの集まりに束ね、`representativeId` を代表（一覧に出す
        1 件）にする。集まりのタグ・再生位置・公開の設定は代表のものになる。既に集まりに属する
        動画を含むときは、その集まりの全メンバーが新しい集まりに入る。`videoIds` の重複は 1 つと
        数え、2 本未満なら 400 `too_few_videos`、20000 本を超えれば 400 `too_many_videos`
        （`POST /api/video-tags` と同じ上限）、`representativeId` が `videoIds` に無ければ 400
        `representative_not_selected`、どれかが無いか登録フォルダの下に所在が無ければ 404
        `video_not_found` で、何も変えない。確定後に `/api/events` の `video` が全メンバーで流れる
        （specs/030-video-versions/contracts/screen-api.md §2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoBundleRequest"
      responses:
        "200":
          description: 新しい集まりの全バージョン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/version-candidates:
    get:
      operationId: listVersionCandidates
      summary: 「同じ動画かもしれない」候補の一覧を返す
      description: |
        所有者だけ。映像の指紋が一致し尺がほぼ同じ 2 本の組のうち、どちらも登録フォルダの下に
        所在を持つものを新しい順に最大 200 組返す。`total` は全件の数。「違う動画」と記録した組と
        同じ集まりの 2 本は出ない。候補は `fingerprint` の取り込みの段階で増減し、`/api/events` の
        `scan` で取り直す（specs/030-video-versions/contracts/screen-api.md §5・§6）。
      responses:
        "200":
          description: 候補の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionCandidatePage"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/version-candidates/dismiss:
    post:
      operationId: dismissVersionCandidate
      summary: 2 本の動画を「違う動画」と記録する
      description: |
        所有者だけ。2 本の組を「違う動画」と記録し、その組の候補を消す。候補に無い組でも記録し、
        記録した組は以後候補に出ない。`videoIds` が 2 つでないか同じなら 400 `invalid_request`、
        どちらかが無いか登録フォルダの下に所在が無ければ 404 `video_not_found` で、何も変えない
        （specs/030-video-versions/contracts/screen-api.md §5）。「同じ動画」は
        `POST /api/video-bundles` に 2 本と代表を渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCandidateDismissRequest"
      responses:
        "204":
          description: 記録した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/directories:
    get:
      operationId: listDirectories
      summary: フォルダ選択用の直下ディレクトリを返す
      parameters:
        - name: path
          in: query
          description: 列挙する絶対path。省略時はnavigation rootを返す
          schema:
            type: string
      responses:
        "200":
          description: directory一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders:
    get:
      operationId: listRootFolders
      security:
        - sessionCookie: []
        - {}
      summary: フォルダ画面の最上位（登録済みメディアフォルダ）を返す
      description: |
        フォルダは保存せず、取り込み済みの所在のパスから導く。登録済みの
        メディアフォルダは、動画が無くても含む。並びは名前の自然順。
        同じ動画の別バージョンの集まりは実効の代表の所在だけを数え、代表以外の
        バージョンだけがあるフォルダは動画の無いフォルダとして扱う
        （specs/030-video-versions/data-model.md §4）。

        ゲストでは公開の動画だけを数え、公開の動画の所在を1つも含まない登録フォルダは
        省く（guest-api.md §2）。
      responses:
        "200":
          description: 登録済みメディアフォルダの集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolderListing"

  /api/folders/{rootId}:
    get:
      operationId: getFolder
      security:
        - sessionCookie: []
        - {}
      summary: フォルダ1件と、その直下の子フォルダを返す
      description: |
        フォルダは登録済みメディアフォルダの id と、そこからの `/` 区切りの相対パスで
        指す。子フォルダは直下だけを名前の自然順で返す。本数は `listRootFolders` と
        同じく、同じ動画の別バージョンの集まりを実効の代表の所在だけで数える。

        ゲストでは公開の動画だけを数え、公開の動画の所在を1つも含まないフォルダは、
        登録フォルダそのもの（`path` を省いた要求）を含めて 404 にする（guest-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "200":
          description: フォルダと直下の子フォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders/{rootId}/videos:
    get:
      operationId: listFolderVideos
      security:
        - sessionCookie: []
        - {}
      summary: フォルダの動画を返す
      description: |
        `scope` で対象の所在の範囲を選ぶ。`direct`（既定）はフォルダ直下だけで、
        孫以降のフォルダにある動画は含めない。`subtree` はフォルダとその配下すべてを
        対象にする。`scope` と `query` は独立していて、照合はその範囲にある所在だけを
        対象にする。ページング・絞り込み・並び順は `listVideos` と同じ。`title` と
        `sizeBytes` はその範囲にある所在（検索語があれば当たった所在）のうちパスの
        昇順で最初のもので、同じ動画の所在が範囲に2つ以上あっても1件だけ返す。
        フォルダが無いときは `scope`・`query` に関係なく 404 を返す。

        同じ動画の別バージョンの集まりは、実効の代表の所在がこの範囲にあるときだけ
        1件として出て、代表以外のバージョンはそのファイルのあるフォルダにも出ない。
        代表以外のバージョンだけがあるフォルダは動画の無いフォルダである。集まりの
        `query` は集まりのどれかのバージョンの所在に当たればよく、`title` と `sizeBytes`
        は範囲にある代表の所在のうちパスの昇順で最初のもの
        （specs/030-video-versions/data-model.md §4）。

        ゲストでは公開の動画だけを対象にし、公開の動画の所在を1つも含まないフォルダは
        登録フォルダそのもの（`path` を省いた要求）を含めて 404 にする。`watch` が `all`
        以外、`sort` が `playedAsc`・`playedDesc`・`favoritedAsc`・`favoritedDesc`、`favorite` が true は
        `400` `invalid_request` にする
        （guest-api.md §2・§3）。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
        - name: scope
          in: query
          description: direct = フォルダ直下の所在だけ、subtree = フォルダとその配下すべての所在
          schema:
            $ref: "#/components/schemas/FolderScope"
        - name: query
          in: query
          description: |
            検索語。空白で区切った語をすべて含む動画に絞る（AND）。`"…"` で囲んだ部分は
            空白を含めて1語（フレーズ）、先頭の `-` はその語を含まない（除外）、単独の
            `OR` と `|` は前後の語のどちらかを含む（和）。全角・半角、大文字・小文字、
            ひらがな・カタカナなどの表記の揺れは吸収する。照合するのは題名と、登録
            フォルダより下の相対パスで、いずれも部分一致。先頭から 16 語までを使い、
            語が残らなければ絞り込まない。書き方の誤りは返さない
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          description: 視聴状態で絞る。all は絞り込まない
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          description: true ならブラウザでそのまま再生できる（playable = true の）動画だけにする
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: |
            true ならお気に入りの項目だけにする。項目ごとに自分のお気に入りで判定し、
            ほかの絞り込みと AND で組み合わさる（specs/035-favorites/contracts/screen-api.md §2）
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: |
            `sort=random` の並びを決める値。同じ値ならページをまたいでも同じ並びになる。
            ほかの並び順では無視する
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: フォルダの動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups:
    get:
      operationId: listGroups
      security:
        - sessionCookie: []
        - {}
      summary: 見る人に見せるグループを名前の順に返す
      description: |
        「Add to group」のピッカーの一覧（specs/048-groups/contracts/screen-api.md）。見る人に見せる
        グループを、どの深さのものも自然な名前の順（同じなら id の順）に、`cursor` の次から最大
        `limit` 件返す。`q` は前後の空白を取り除き、名前が大文字小文字を区別せずにそれを含むものだけに
        絞る（空なら全部）。グループの値は `getGroup` と同じで、ゲストでは公開の動画だけから作り、
        見る人に見せる動画の無いグループは入らない。読めない `cursor` は 400 `invalid_cursor`、
        `limit` が範囲の外なら 400 `invalid_request`。
      parameters:
        - name: q
          in: query
          description: 名前に含む文字列。前後の空白を取り除き、大文字小文字を区別しない
          schema:
            type: string
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: グループ 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createGroup
      summary: 動画とグループからグループを作る
      description: |
        所有者だけ。名前は前後の空白を取り除いて 1〜100 文字（符号位置）で、同じ名前のグループが
        あってもよい（specs/048-groups/research.md R-14）。`videoIds` の動画、次に `groupIds` の
        グループを要求の順に項目にする。名前が空か長すぎるか、メンバーが無ければ 400
        `invalid_request`。本文の動画かグループのどれかが無ければ 404 `group_target_not_found` で、
        何も作らない（R-12）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: 作ったグループ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}:
    get:
      operationId: getGroup
      security:
        - sessionCookie: []
        - {}
      summary: グループ 1 つと、その道筋と項目の最初のページを返す
      description: |
        グループの値（`LibraryGroup`）、`trail` のうち今も親と子の組が続く部分、項目（子グループと
        動画）の最初の 1 ページ（100 件）を位置の順に返す（specs/048-groups/contracts/screen-api.md）。
        項目は見る人に見せるものだけで、見る人に引けない動画と、見る人に見せる動画の無い子グループは
        入らない。続きは `listGroupItems` で読む。

        グループの値は子孫の動画を再生順（子グループは深さ優先、同じ動画は最初の 1 回）で数える
        （specs/048-groups/research.md R-7）。ゲストでは公開の動画だけから作る。無いグループと、
        見る人に見せる動画の無いグループは 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: trail
          in: query
          description: |
            画面が通ってきたグループの id を外側から順に `,` で区切って並べたもの
            （specs/048-groups/research.md R-8）。応答の `trail` は、このグループから外へ向かって
            親と子の組が続く部分で、組が崩れた所より外側を捨てる
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: グループ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: renameGroup
      summary: グループの名前を変える
      description: |
        所有者だけ。名前の規則は作成と同じで、応答の `name` は前後の空白を取り除いた名前である。
        グループが無ければ 404 `not_found`。`undoToken` が、このグループを作った
        `POST /api/organize/group` の生きているトークンなら、名前を変えた後の行をそのトークンの
        取り消しの像にするので、取り消しは名前を変えたグループを消す
        （specs/050-drag-organize/contracts/screen-api.md）。それ以外のトークンは何も変えず、応答と
        誤りはトークンが無いときと同じで、トークンが原因で失敗することはない。
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRename"
      responses:
        "200":
          description: 名前を変えたあとのグループ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: dissolveGroup
      summary: グループを解散する
      description: |
        所有者だけ。グループとその項目を消す。子グループと動画は残り、親からこのグループの項目が
        消える。自動グループならそのフォルダに `ungroup` を書く（specs/048-groups/research.md R-4）。
        グループが無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: 解散した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/items:
    get:
      operationId: listGroupItems
      security:
        - sessionCookie: []
        - {}
      summary: グループの項目の続きのページを返す
      description: |
        `getGroup` と同じ項目を、前の応答の `nextCursor` の続きから位置の順に返す。読めない
        カーソルは 400 `invalid_cursor`。グループの扱いは `getGroup` と同じで、無いか見せないときは
        404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 項目 1 ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addGroupItems
      summary: グループの末尾に動画とグループを足す
      description: |
        所有者だけ。`videoIds` の動画、次に `groupIds` のグループを要求の順で末尾に足す。既に項目に
        あるものは飛ばす（specs/048-groups/research.md R-12）。両方が空なら 400 `invalid_request`。
        本文の動画かグループのどれかが無ければ 404 `group_target_not_found`、本文のグループがこの
        グループかその祖先なら 409 `group_cycle` で、どちらも何も足さない。グループが無ければ 404
        `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembers"
      responses:
        "200":
          description: 足したあとのグループ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/groups/{id}/items/remove:
    post:
      operationId: removeGroupItems
      summary: グループから項目を外す
      description: |
        所有者だけ。項目を外して残りを詰め直す。動画と子グループそのものは残る。自動グループの
        フォルダ由来の項目は、フォルダの作り直しでも戻らない。項目が 1 つも残らなければ、そのグループは
        `DELETE /api/groups/{id}` と同じく解散され（自動グループならフォルダに `ungroup` を書く）、
        本文の無い 204 を返す。項目のどれかがこのグループに無ければ 404 `group_target_not_found` で、
        何も外さない。グループが無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupItemRemove"
      responses:
        "200":
          description: 外したあとのグループ（項目が残るとき）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "204":
          description: 最後の項目を外したので、グループを解散した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/items/{itemId}/move:
    post:
      operationId: moveGroupItem
      summary: グループの項目 1 つを並べ替える
      description: |
        所有者だけ。項目を `after` の項目のすぐ後ろへ移す。`after` が無ければ先頭へ移す
        （specs/048-groups/research.md R-12）。`after` が項目自身なら 400 `invalid_request`、項目か
        `after` がこのグループに無ければ 404 `group_target_not_found`。グループが無ければ 404
        `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/GroupItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupItemMove"
      responses:
        "204":
          description: 移した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/tag:
    post:
      operationId: tagGroup
      summary: グループをタグに変える
      description: |
        所有者だけ。1 つの取引で、グループの名前を `NormalizeTagName` に通し、名前かシノニムで
        引けたタグを使うか新しく作り、子孫の全動画に手で付け、グループを解散する
        （specs/048-groups/research.md R-11）。本文は無い。名前がタグ名の規則に合わなければ 400
        `invalid_request` で、何も変えない。グループが無ければ 404 `not_found`。
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: 使ったタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupTagResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/reorder:
    post:
      operationId: organizeReorder
      summary: グループの項目をまとめて並べ替え、取り消しのトークンを返す
      description: |
        所有者だけ。グループ `groupId` の項目 `itemIds` を画面の順のまままとめて項目 `after` の
        すぐ後ろへ移す。`after` が無ければ先頭へ移す。1 つの取引で行い、応答の `undoToken` で
        取り消せる（specs/050-drag-organize/contracts/screen-api.md）。`itemIds` が空か `after` が
        `itemIds` の中にあれば 400 `invalid_request`。グループ・項目・`after` のどれかが無いか
        そのグループに無ければ 404 `group_target_not_found` で、何も書かない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeReorder"
      responses:
        "200":
          description: 並べ替えた。取り消しのトークン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/group:
    post:
      operationId: organizeGroup
      summary: ドラッグした動画と落とした先の動画のグループを作り、取り消しのトークンを返す
      description: |
        所有者だけ。落とした先の動画 `target` の題名を先頭 100 文字に切った名前で新しいグループを作り、
        `target`、続いて `items` の動画を画面の順に入れる。`from` があれば、新しいグループが
        `from` の中で `target` の位置を取り、`target` と `items` は `from` から抜ける
        （specs/050-drag-organize/research.md R-6）。1 つの取引で行い、応答の `groupId` が新しい
        グループ、`undoToken` で取り消せる。`items` が空かグループを含めば 400 `invalid_request`。
        動画か `from` が無いか、動画が `from` に無ければ 404 `group_target_not_found` で、何も書かない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeGroup"
      responses:
        "200":
          description: グループを作った。新しいグループの id と取り消しのトークン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/move:
    post:
      operationId: organizeMove
      summary: カードをグループへ入れるか、グループの間で動かすか、グループから外し、取り消しのトークンを返す
      description: |
        所有者だけ。ドラッグしたカード `items` を画面の順のままグループ `to` の末尾へ足し（既に
        あるものは飛ばす）、`from` があればそこから外す。`to` が無ければ外すだけ（ライブラリに
        落とした）。フォルダ由来のメンバーを外すと除外を書き、最後の項目を外した `from` は解散する。
        1 つの取引で行い、応答の `undoToken` で取り消せる（specs/050-drag-organize/contracts/screen-api.md）。
        `from` と `to` がどちらも無いか同じなら 400 `invalid_request`。`from`・`to`・カードの動画や
        グループが無いか、カードが `from` に無ければ 404 `group_target_not_found`、ドラッグした
        グループが `to` か `to` の祖先なら 409 `group_cycle` で、どれも何も書かない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeMove"
      responses:
        "200":
          description: 動かした。取り消しのトークン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organize/bundle:
    post:
      operationId: organizeBundle
      summary: 動画を落とした先の動画を代表にしてバージョンとしてまとめ、取り消しのトークンを返す
      description: |
        所有者だけ。ドラッグした動画 `videoIds` を落とした先の動画 `target` と 1 つの集まりに束ね、
        `target` を代表にする（代表を選ぶダイアログは無い）。既に集まりに属する動画は、その集まりの
        全メンバーごと移る。規則は `POST /api/video-bundles` と同じで、1 つの取引で行い、応答の
        `undoToken` で取り消せる（specs/050-drag-organize/contracts/screen-api.md）。`target` の
        ほかに動画が無ければ 400 `invalid_request`、集まりを展開して 20 本を超えれば 400
        `too_many_videos`、動画がいまライブラリに無ければ 404 `group_target_not_found` で、どれも
        何も書かない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeBundle"
      responses:
        "200":
          description: 束ねた。取り消しのトークン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/undo:
    post:
      operationId: organizeUndo
      summary: ドラッグの操作を取り消す
      description: |
        所有者だけ。`token` の操作の前の状態へ戻す（specs/050-drag-organize/research.md R-1）。操作の
        後で行が変わっていれば 409 `undo_conflict` で、何も書かない。トークンが無い、使い済み、
        または 10 分より古ければ 410 `undo_expired`。トークンは 1 回だけ使える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeUndo"
      responses:
        "204":
          description: 取り消した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: 取り消しのトークンが無い、使い済み、または 10 分より古い
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/folders/{rootId}/grouping:
    put:
      operationId: setFolderGrouping
      summary: フォルダのまとめ方の例外を付ける・外す
      description: |
        `auto` は例外を外し、`ungroup` は「まとめを解除」、`groupDirect` は「直下をまとめる」を付ける
        （specs/017-folder-groups/contracts/folder-groups-api.md §1）。同じ値の再設定も 200。
        例外の保存と索引の作り直しは1つの取引で、後の要求が勝つ。フォルダの有無は
        `getFolder` と同じ判定で、無ければ 404。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderGroupingRequest"
      responses:
        "200":
          description: 変更後のまとめ方
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderGrouping"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: スキャンの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: 一度もスキャンしていない

  /api/scans/current/issues:
    get:
      operationId: listCurrentScanIssues
      summary: 直近の取り込みの問題の一覧を返す
      description: |
        直近の取り込みの問題を、動画（未登録ならファイル）ごとに1件で返す
        （specs/024-import-progress/contracts/scan-api.md §3）。失敗を先に、同じ重さの中は
        ファイル名、次にフォルダの順に並ぶ。所在がどの登録フォルダにも含まれない件は返さず、
        Scan.issues の本数にも数えない。一覧は SSE では送らない。画面は Scan.id か
        Scan.issues.revision が変わったら読み直す。
      parameters:
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 問題の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanIssuePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: 一度もスキャンしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/events:
    get:
      operationId: streamEvents
      security:
        - sessionCookie: []
        - {}
      summary: 取り込みと動画の変化を Server-Sent Events で送る
      description: |
        接続中は、変化が起きたときだけ次のイベントを送る。一定間隔の送信はしない
        （接続を保つためのコメント行を除く）。

        - `scan`: 直近の取り込みが変わった。data は `Scan`（まだ一度も無ければ送らない）。
          走査の変化、仕事の成否（済みの本数が変わる）、今の処理の変化で送る
        - `video`: 動画の状態が変わった。data は `VideoChanged`。最新の内容は
          `GET /api/videos/{id}` で取る
        - `group`: グループの名前か項目が変わった。data は `GroupChanged` で、変わったグループと
          その祖先の id を運ぶ（specs/048-groups/research.md R-13）。最新の内容は
          `GET /api/groups/{id}` で取る

        接続の直後に `scan`（あれば）を1回送るので、つなぎ直したクライアントは切れていた間の
        変化を取り戻せる。`video` と `group` は切れていた間の分を送り直さない。

        ゲストには `group` だけを送る（specs/048-groups/contracts/screen-api.md）。`scan` と
        `video` は所有者だけに送る。
      responses:
        "200":
          description: イベントの流れ
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vv_session
      description: |
        ログインで発行するセッション ID。HTTPS では `__Host-vv_session`、HTTP では
        `vv_session` の名前で送る（contracts/auth-api.md §7）。OpenAPI の apiKey は名前を
        1つしか書けないので、ここには HTTP の名前を書く。

  headers:
    SessionSetCookie:
      description: |
        セッションの Cookie。HTTPS では
        `__Host-vv_session=<ID>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=<期限までの秒>`、
        HTTP では `vv_session=<ID>; HttpOnly; SameSite=Strict; Path=/; Max-Age=<期限までの秒>`
      schema:
        type: string

  parameters:
    ThumbnailEditId:
      name: editId
      in: path
      required: true
      description: サムネイルの編集のセッションの識別子
      schema:
        type: string
    VideoGroupContext:
      name: group
      in: query
      required: false
      description: |
        動画を開いたグループの id。動画のグループ（group）・前後・メンバーの窓とメンバーのページは、
        このグループが見る人に見せる再生順に動画を持てばその再生順で答える。省くか、動画を
        持たないグループなら、動画を直接持ち見る人に見せるグループのうち id のいちばん小さいもので
        答える（specs/048-groups/research.md R-9）
      schema:
        type: integer
        format: int64
    VideoId:
      name: id
      in: path
      required: true
      description: 動画の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonFilter:
      name: person
      in: query
      description: |
        人物の id。どの役割でもその人物に結び付いた動画だけにする。ほかの絞り込みと AND で
        組み合わさり、`total` もそれを掛けて数える。実体の無い id は空の一覧になり、誤りにも
        `missingTagIds` のような報告にもしない。正の整数でなければ `400` `invalid_request`。
        ゲストからは `400` `invalid_request` / `guest_filter_not_allowed`
        （specs/047-video-work-info/contracts/screen-api.md）
      schema:
        type: integer
        format: int64
        minimum: 1
    OrganizationFilter:
      name: organization
      in: query
      description: |
        団体の id。どの役割でもその団体に結び付いた動画だけにする。扱いは `person` と同じ
        （specs/047-video-work-info/contracts/screen-api.md）
      schema:
        type: integer
        format: int64
        minimum: 1
    MediaFolderId:
      name: id
      in: path
      required: true
      description: メディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    APITokenId:
      name: id
      in: path
      required: true
      description: API トークンの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    GroupId:
      name: id
      in: path
      required: true
      description: グループの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    GroupItemId:
      name: itemId
      in: path
      required: true
      description: グループの項目の識別子。動画やグループの id ではない
      schema:
        type: integer
        format: int64
        minimum: 1
    PlaylistId:
      name: id
      in: path
      required: true
      description: プレイリストの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    WatchHistoryEntryId:
      name: id
      in: path
      required: true
      description: 視聴履歴の 1 件の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    VideoTagId:
      name: tagId
      in: path
      required: true
      description: 動画に付いたタグの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    TagId:
      name: id
      in: path
      required: true
      description: タグの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonId:
      name: id
      in: path
      required: true
      description: 人物の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    OrganizationId:
      name: id
      in: path
      required: true
      description: 団体の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    CreditQuery:
      name: q
      in: query
      description: |
        検索語。照合形にして前後の空白を落とし、空でなければ名前か別名に部分一致する実体だけにする
      schema:
        type: string
        maxLength: 100
    CreditSort:
      name: sort
      in: query
      description: 並び順
      schema:
        $ref: "#/components/schemas/CreditSort"
    CreditCursor:
      name: cursor
      in: query
      description: |
        前回の応答が返した `nextCursor`。同じ `q`・`sort` で続けて使う。`limit` を省いたときは無視する
      schema:
        type: string
    CreditLimit:
      name: limit
      in: query
      description: 1 ページの件数。省くと全件を返し、`nextCursor` は入らない
      schema:
        type: integer
        minimum: 1
        maximum: 200
    FolderRootId:
      name: rootId
      in: path
      required: true
      description: フォルダが属する登録済みメディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    PlaylistItemId:
      name: itemId
      in: path
      required: true
      description: プレイリストの項目の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderPath:
      name: path
      in: query
      description: |
        登録済みメディアフォルダからの `/` 区切りの相対パス。省略時と空文字は
        登録フォルダそのもの。空の段・先頭や末尾の `/`・`.`・`..` は受け付けない
      schema:
        type: string

  responses:
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 要求の形式が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: same-originでない操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態と競合する操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderFailed:
      description: 画像編集の提供元（ComfyUI）が入力の受け取りか実行の受け付けに失敗した
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SetupRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          description: 1〜128 文字。制御文字を含まず、先頭と末尾に空白を置かない
        password:
          type: string
          description: 1〜1024 バイト

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
        next:
          type: string
          description: ログイン後に戻る先の候補。省略か安全でなければ `/`

    AuthRedirect:
      type: object
      required: [redirectTo]
      additionalProperties: false
      properties:
        redirectTo:
          type: string
          description: 画面が遷移する先。サーバーが確かめた同じオリジンのパス

    AuthSession:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [owner, guest, setupRequired]
          description: owner = ログイン済み、guest = 未ログイン、setupRequired = アカウントが未設定
        redirectTo:
          type: string
          description: "`next` を付けて呼び、state が owner のときだけ返す戻り先"

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok = 保存層まで疎通、degraded = プロセスのみ生存
        version:
          type: string
          description: リリース名。ビルド時に指定されなければ dev
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: ビルド元のコミット。取得できない場合は省略される
        builtAt:
          type: string
          format: date-time
          description: ビルド時刻。取得できない場合は省略される

    MediaFolder:
      type: object
      required: [id, path, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMediaFolderRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1

    UpdateMediaFolderRequest:
      type: object
      required: [path, version]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1

    VideoEncoderChoice:
      type: string
      description: >-
        所有者が選ぶライブ変換の映像エンコード方式。auto は使えるハードウェアの方式を
        nvenc・qsv・vaapi・videotoolbox の順で選び、無ければ software にする
      enum: [software, nvenc, qsv, vaapi, videotoolbox, auto]

    VideoEncoder:
      type: string
      description: ライブ変換が実際に使う映像エンコード方式
      enum: [software, nvenc, qsv, vaapi, videotoolbox]

    EncoderUnavailableReason:
      type: string
      description: ハードウェアの方式が使えない理由
      enum: [unsupported_os, encoder_missing, check_failed, timed_out]

    EncoderFallbackReason:
      type: string
      description: >-
        選んだハードウェアの方式を使えず software にしている理由。selected_unavailable は
        確認の結果使えない、checking は起動時の確認が終わっていない
      enum: [selected_unavailable, checking]

    EncoderAvailability:
      type: object
      required: [encoder, state]
      additionalProperties: false
      properties:
        encoder:
          $ref: "#/components/schemas/VideoEncoder"
        state:
          type: string
          enum: [checking, available, unavailable]
        reason:
          $ref: "#/components/schemas/EncoderUnavailableReason"

    TranscodingSettings:
      type: object
      required: [videoEncoder, effectiveEncoder, checking, encoders]
      additionalProperties: false
      properties:
        videoEncoder:
          $ref: "#/components/schemas/VideoEncoderChoice"
        effectiveEncoder:
          $ref: "#/components/schemas/VideoEncoder"
        fallbackReason:
          $ref: "#/components/schemas/EncoderFallbackReason"
        checking:
          type: boolean
          description: 起動時の確認が終わっていない
        encoders:
          type: array
          description: >-
            ハードウェアの方式の確認結果。nvenc・qsv・vaapi・videotoolbox の順で常に 4 件。
            software は常に使えるので載らない
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/EncoderAvailability"

    UpdateTranscodingSettingsRequest:
      type: object
      required: [videoEncoder]
      additionalProperties: false
      properties:
        videoEncoder:
          $ref: "#/components/schemas/VideoEncoderChoice"

    NetworkSettings:
      type: object
      required: [lanAccess, port, addresses]
      additionalProperties: false
      description: >-
        Windows デスクトップ版の LAN からの接続の設定
        （specs/037-windows-app/contracts/network-settings-api.md §1）
      properties:
        lanAccess:
          type: boolean
          description: 保存した選択。保存値が無ければ false
        port:
          type: integer
          description: 今の待ち受けのポート
        addresses:
          type: array
          description: >-
            lanAccess が true のときだけ、上がっている非ループバックの IPv4 アドレスごとに
            "http://<アドレス>:<ポート>/" が入る。false なら空
          items:
            type: string

    UpdateNetworkSettingsRequest:
      type: object
      required: [lanAccess]
      additionalProperties: false
      properties:
        lanAccess:
          type: boolean

    AutoImportSettings:
      type: object
      required: [enabled, watch]
      additionalProperties: false
      description: 自動の取り込みの選択と監視の状態（specs/042-folder-watch-import/contracts/screen-api.md）
      properties:
        enabled:
          type: boolean
          description: 保存した選択。保存値が無ければ true
        watch:
          $ref: "#/components/schemas/FolderWatch"

    FolderWatch:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          description: >-
            off は切れているか、メディアフォルダが無い。starting は監視を張っている最中。active は
            すべてのディレクトリを監視している。limited は問題がある
          enum: [off, starting, active, limited]
        problem:
          type: string
          description: 直近の問題。state が limited のときだけ返す
          enum: [watch_limit, events_lost, folder_unreachable, permission_denied]
        path:
          type: string
          description: 問題が 1 つのディレクトリに関わるときの、その絶対パス（利用者のデータ。翻訳しない）

    UpdateAutoImportSettingsRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    AutoTaggingSettings:
      type: object
      required: [enabled, afterImport, threshold, tentativeThreshold, queue]
      additionalProperties: false
      description: 自動タグ付けの機能の設定と待ち行列の件数（docs/design-docs/auto-tagging.md）
      properties:
        enabled:
          type: boolean
          description: 機能を使うか。切なら判定を始めず、Ollama に接続しない。保存値が無ければ false
        afterImport:
          type: boolean
          description: 取り込みのあとに自動で判定するか（enabled が真のときだけ効く）。保存値が無ければ false
        threshold:
          type: number
          format: double
          description: タグを確定した付与として付けるのに要る確率。保存値が無ければ 0.8
        tentativeThreshold:
          type: number
          format: double
          description: タグを仮に付けるのに要る確率（threshold 以下）。保存値が無ければ 0.5
        queue:
          $ref: "#/components/schemas/AutoTaggingQueue"

    OllamaSettings:
      type: object
      required: [endpoint, model]
      additionalProperties: false
      description: Ollama の接続先（docs/design-docs/ai-layer.md）
      properties:
        endpoint:
          type: string
          description: Ollama の基底 URL（http か https）。保存値が無ければ http://127.0.0.1:11434
        model:
          type: string
          description: Ollama の模型名。保存値が無ければ clef-flash

    ComfyUIProvider:
      type: string
      enum: [self_hosted, cloud]
      description: ComfyUI の提供元。`self_hosted` は所有者が動かす ComfyUI、`cloud` は Comfy Cloud

    ComfyUIModel:
      type: string
      enum: [flux2_klein_4b, qwen_image_edit_2511]
      description: >-
        サムネイルの編集に使うモデル。モデルごとに vv が同梱するワークフローの組が決まる。
        `flux2_klein_4b` は FLUX.2 [klein] 4B（既定）、`qwen_image_edit_2511` は Qwen-Image-Edit-2511
        に Lightning の 4 ステップの LoRA を当てたもの

    ComfyUISettings:
      type: object
      required: [apiKeySet, model]
      additionalProperties: false
      description: ComfyUI の接続先（docs/design-docs/ai-layer.md）。API キーそのものは返さない
      properties:
        provider:
          $ref: "#/components/schemas/ComfyUIProvider"
        url:
          type: string
          description: 自前の ComfyUI の基底 URL（http か https）。保存値が無ければ省く
        apiKeySet:
          type: boolean
          description: Comfy Cloud の API キーが保存されているか
        model:
          $ref: "#/components/schemas/ComfyUIModel"

    UpdateComfyUISettingsRequest:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/ComfyUIProvider"
        url:
          type: string
          description: "`self_hosted` のとき必須。http か https の基底 URL"
        apiKey:
          type: string
          description: Comfy Cloud の API キー。省けば保存済みのキーを残し、空文字列なら消す
        model:
          $ref: "#/components/schemas/ComfyUIModel"

    AutoTaggingQueue:
      type: object
      required: [queued, running, done, failed]
      additionalProperties: false
      properties:
        queued:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        lastError:
          type: string
          description: 直近に失敗した判定の理由（英語。Ollama の応答を含むことがある）。失敗が無ければ省く

    UpdateAutoTaggingSettingsRequest:
      type: object
      required: [enabled, afterImport, threshold, tentativeThreshold]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        afterImport:
          type: boolean
        threshold:
          type: number
          format: double
          description: 0 より大きく 1 以下
        tentativeThreshold:
          type: number
          format: double
          description: 0 より大きく threshold 以下。threshold と同じなら仮に付けない

    CheckResult:
      type: object
      description: 確かめた結果。使えないことも 200 で返す
      required: [available]
      additionalProperties: false
      properties:
        available:
          type: boolean
        message:
          type: string
          description: 使えないときの理由（英語。提供元が JSON で返した誤りの文を含むことがある）
        missing:
          type: array
          description: ComfyUI の確かめだけが返す。接続先は応えたが vv のワークフローに足りないノードとモデルファイル
          items:
            $ref: "#/components/schemas/ComfyUIMissingItem"

    ComfyUIMissingItem:
      type: object
      required: [kind, name]
      additionalProperties: false
      description: ComfyUI に足りないノードの型かモデルファイル（specs/045-comfyui-thumbnails/research.md R-13）
      properties:
        kind:
          type: string
          enum: [node, model]
        name:
          type: string
          description: ノードの `class_type` かファイル名
        folder:
          type: string
          description: モデルファイルだけ。ComfyUI の `models` の下のフォルダ
        source:
          type: string
          description: モデルファイルだけ。入手先のページの URL

    ThumbnailEditReadiness:
      type: object
      required: [connection]
      additionalProperties: false
      properties:
        connection:
          type: boolean
          description: ComfyUI の接続先が保存されているか（テストに通ったかではない）

    StartThumbnailEditRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/ThumbnailEditSource"
        positionMs:
          type: integer
          format: int64
          description: "`frame` のときだけ必須。編集するコマの位置（ミリ秒）。0 以上で尺未満。`thumbnail` では無視する"

    ThumbnailEditSource:
      type: string
      enum: [frame, thumbnail]
      description: |
        編集を何から始めるか。`frame` は選んだ位置のコマ、`thumbnail` は今のサムネイル
        （specs/046-thumbnail-image-upload/research.md R-4）

    RunThumbnailEditRequest:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          maxLength: 4000
          description: 持ち主の指示。省けば、塗った範囲があるとき vv の既定の指示を送る
        mask:
          type: string
          format: binary
          description: コマと同じ大きさの PNG。塗った画素が不透明な白、残りが不透明な黒。省けばコマ全体
        reference:
          type: string
          format: binary
          description: 参考画像（PNG・JPEG・WebP、20 MiB まで）。省けば参考画像の無いワークフローを使う

    UploadThumbnailImageRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: サムネイルにする画像（PNG・JPEG・静止画の WebP、64 MiB・1 億 2000 万画素まで）

    ThumbnailEditState:
      type: string
      description: 編集のセッションの状態（specs/045-comfyui-thumbnails/data-model.md の Edit session）
      enum: [ready, queued, preparing, running, succeeded, failed, cancelled]

    ThumbnailEditFailure:
      type: string
      description: 実行が失敗した理由（specs/045-comfyui-thumbnails/contracts/workflow.md の Failure reasons）
      enum:
        - unreachable
        - unauthorized
        - insufficient_credits
        - missing_models
        - workflow_rejected
        - run_failed
        - no_output
        - timed_out

    ThumbnailEdit:
      type: object
      required: [id, videoId, state, source, frameUrl, frameWidth, frameHeight]
      additionalProperties: false
      properties:
        id:
          type: string
          description: セッションの識別子
        videoId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ThumbnailEditState"
        source:
          $ref: "#/components/schemas/ThumbnailEditSource"
        positionMs:
          type: integer
          format: int64
          description: |
            画像がコマのとき、それを取った位置（ミリ秒。選んだ位置、指定した位置、自動の位置、先頭に
            戻したときは 0）。保存した元の画像から始めたときは省く
        frameUrl:
          type: string
          description: コマの PNG（`GET /api/thumbnail-edits/{editId}/frame`）
        frameWidth:
          type: integer
          description: コマの幅（px）。マスクはこの大きさで描く
        frameHeight:
          type: integer
          description: コマの高さ（px）
        elapsedMs:
          type: integer
          format: int64
          description: 実行を送ってからの時間（ミリ秒）。終わった実行では終わった時点で止まる。`ready` では省く
        progress:
          $ref: "#/components/schemas/ThumbnailEditProgress"
        error:
          $ref: "#/components/schemas/ThumbnailEditError"
        resultUrl:
          type: string
          description: "`succeeded` のときだけ。出力の画像（`GET /api/thumbnail-edits/{editId}/result`）"

    ThumbnailEditProgress:
      type: object
      required: [value, max]
      additionalProperties: false
      description: 提供元が報告したステップの進み具合。報告が無ければ省く
      properties:
        value:
          type: integer
        max:
          type: integer

    ThumbnailEditError:
      type: object
      required: [reason]
      additionalProperties: false
      description: "`failed` のときだけ。失敗の理由と、提供元が渡した文"
      properties:
        reason:
          $ref: "#/components/schemas/ThumbnailEditFailure"
        message:
          type: string
          description: 提供元の文（ノードの誤り、実行の誤り、足りない名前）。無ければ省く

    StartAutoTaggingRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [missing, all]

    AutoTaggingQueued:
      type: object
      required: [queued]
      additionalProperties: false
      properties:
        queued:
          type: integer
          description: 積んだ動画の件数

    AutoTagVideoResult:
      type: object
      required: [queued]
      additionalProperties: false
      properties:
        queued:
          type: boolean
          description: 積んだか。判定中なら偽

    APIToken:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      additionalProperties: false
      description: 発行した API トークン 1 件。平文とハッシュは持たない（specs/026-external-api/contracts/token-api.md）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: 最後に使った時刻。未使用なら null。1 分より細かくは更新しない

    APITokenList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 作成日時の降順
          items:
            $ref: "#/components/schemas/APIToken"

    CreateAPITokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: 用途の名前。前後の空白を除いて 1〜100 文字で、制御文字を含まない。重複してよい

    CreatedAPIToken:
      type: object
      required: [token, secret]
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        secret:
          type: string
          description: トークンの平文（`vvt_` で始まる 47 文字）。この応答にだけ現れ、再び取り出せない

    TagRef:
      type: object
      required: [id, name, tentative]
      additionalProperties: false
      description: 動画に付いたタグ1件。nameは常に元の名前（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していない）である（specs/031-tentative-tags/contracts/screen-api.md §0）

    VideoTag:
      type: object
      required: [id, name, manual, fromFolder, tentative]
      additionalProperties: false
      description: |
        動画に付いたタグ1件と、その出所。nameは常に元の名前。同じタグが手でも
        フォルダ名からも付いていれば1件にまとめて両方を真にする
        （specs/017-folder-groups/contracts/folder-groups-api.md §4）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        manual:
          type: boolean
          description: 手で付けた分がある
        fromFolder:
          type: boolean
          description: 祖先のフォルダ名がこのタグの名前かシノニムに一致する
        tentative:
          type: boolean
          description: そのタグが仮のタグである。フォルダ由来だけで付いていても、そのタグの状態を出す
        unconfirmed:
          type: boolean
          description: |
            自動タグ付けが確率の中間の帯で仮に付け、所有者がまだ確定していない付与である。真のときだけ
            返す。フォルダ名からも付いていれば返さない（docs/design-docs/auto-tagging.md）

    Tag:
      type: object
      required: [id, name, synonyms, videoCount, tentative, createdAt]
      additionalProperties: false
      description: 管理画面と候補に出す1件（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: 名前の自然順
          items:
            type: string
        videoCount:
          type: integer
          description: いまライブラリにある動画の本数
        tentative:
          type: boolean
          description: 仮のタグ（自動の付与で新しく作られ、まだ確定していない）である（specs/031-tentative-tags/contracts/screen-api.md §0）
        createdAt:
          type: string
          format: date-time
          description: タグを作った時刻（秒の精度。specs/036-tag-admin-scale/contracts/screen-api.md §0）

    TagList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          description: 条件（`q`・`tentative`・`unused`）に合うタグの数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部のタグの数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る
        exact:
          $ref: "#/components/schemas/Tag"
          description: |
            前後の空白を落とした `q` と、元の名前かシノニムの綴りが完全に一致し、`tentative`・`unused` にも
            合うタグ。`limit` を付け `cursor` の無い要求で、`q` が空でなく該当があるときだけ入る。
            `items` に入るとは限らない（`items` は部分一致を `sort` の順に並べた 1 ページのため）

    TagSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: |
        タグの一覧の並び順。name は名前の自然順（向きは無い）、countDesc・countAsc は本数、
        createdDesc・createdAsc は作った日。値が同じタグは名前の自然順、それも同じなら id
        （specs/036-tag-admin-scale/data-model.md §0・§2）

    RejectedTagNameList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 却下した名前。名前の自然順
          items:
            type: string
        total:
          type: integer
          description: 却下した名前の全部の数
        nextCursor:
          type: string
          description: 続きがあるときだけ入る。次の要求の `cursor` に渡す

    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    RenameTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    MergeTagRequest:
      type: object
      required: [sourceIds]
      additionalProperties: false
      properties:
        sourceIds:
          type: array
          description: 統合元の id。1 件の統合も [sourceId] で送る
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagMergeResponse:
      type: object
      required: [tag, notFoundIds]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        notFoundIds:
          type: array
          description: もう無かった統合元
          items:
            type: integer
            format: int64

    TagBatchRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [confirm, reject, delete]
        ids:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagBatchResponse:
      type: object
      required: [appliedIds, notFoundIds, notApplicableIds]
      additionalProperties: false
      properties:
        appliedIds:
          type: array
          description: 処理した id
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: もう無かった id
          items:
            type: integer
            format: int64
        notApplicableIds:
          type: array
          description: 操作が働かない種類だった id
          items:
            type: integer
            format: int64

    TagImpactRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [reject, delete, merge]
          description: 確認をとる操作。数える種類がこれで決まる
        ids:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagImpactResponse:
      type: object
      required: [tagCount, videoCount]
      additionalProperties: false
      properties:
        tagCount:
          type: integer
          description: ids のうち今あり、action が働くタグの数
        videoCount:
          type: integer
          description: そのどれかが付いた、いまライブラリにある動画の本数（重複なし）

    AddTagSynonymRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        mergeTagId:
          type: integer
          format: int64
          description: 統合を承諾したタグのid（contracts/tags-api.md §3）

    TagInput:
      type: object
      additionalProperties: false
      description: |
        付与で使うタグの指定。id と name のちょうど一方を持つ。両方あるか、どちらも
        無いときは invalid_request（400）にする（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    CreditRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: 人物か団体 1 件への参照。name はその実体の今の名前
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Alias:
      type: object
      required: [name]
      additionalProperties: false
      description: 人物か団体の別名 1 件（specs/047-video-work-info/data-model.md「Fields」）
      properties:
        name:
          type: string
        language:
          type: string
          description: BCP 47 の構文の言語タグ。無ければ省く

    ExternalId:
      type: object
      required: [source, value]
      additionalProperties: false
      description: 外部の情報源での識別子 1 件
      properties:
        source:
          type: string
        value:
          type: string

    WorkDateKind:
      type: string
      enum: [release, recorded, published]
      description: 日付の種類（specs/047-video-work-info/data-model.md「Fields」）

    WorkPersonRole:
      type: string
      enum: [performer, director, photographer, streamer]
      description: 動画での人物の役割

    WorkOrganizationRole:
      type: string
      enum: [maker, label]
      description: 動画での団体の役割

    WorkDate:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: string
          description: YYYY・YYYY-MM・YYYY-MM-DD（日まであれば暦にある日）
          examples: ["2024", "2024-02", "2024-02-29"]

    WorkPerson:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditRef"

    WorkOrganization:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditRef"

    WorkInfo:
      type: object
      required: [dates, people, organizations, urls, externalIds]
      additionalProperties: false
      description: |
        動画の作品情報（specs/047-video-work-info/contracts/screen-api.md「WorkInfo schema」）。
        一覧は必ずあり、空なら []。単一の値は未設定なら無い
      properties:
        code:
          type: string
          description: 品番
        description:
          type: string
          description: 説明。改行を含みうる
        dates:
          type: array
          description: 種類の順（release・recorded・published）
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: array
          description: 役割の順、同じ役割の中は入力した順。name は人物の今の名前
          items:
            $ref: "#/components/schemas/WorkPerson"
        organizations:
          type: array
          description: 役割の順、同じ役割の中は入力した順。name は団体の今の名前
          items:
            $ref: "#/components/schemas/WorkOrganization"
        urls:
          type: array
          description: 入力した順
          items:
            type: string
        externalIds:
          type: array
          description: (source, value) の順
          items:
            $ref: "#/components/schemas/ExternalId"

    CreditIdRef:
      type: object
      required: [id]
      additionalProperties: false
      description: 書き込みで人物か団体 1 件を指す参照
      properties:
        id:
          type: integer
          format: int64

    WorkPersonInput:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditIdRef"

    WorkOrganizationInput:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditIdRef"

    WorkInfoInput:
      type: object
      additionalProperties: false
      description: |
        作品情報の書き込みの本文（specs/047-video-work-info/contracts/screen-api.md「WorkInfoInput schema」）。
        WorkInfo の 7 つのプロパティを持ち、どれも省いてよく null も受け付ける。省いたものと null は
        解除で、全体を置き換える
      properties:
        code:
          type: [string, "null"]
        description:
          type: [string, "null"]
        dates:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkPersonInput"
        organizations:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkOrganizationInput"
        urls:
          type: [array, "null"]
          items:
            type: string
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"

    VideoDetailsInput:
      type: object
      required: [displayName, workInfo]
      additionalProperties: false
      description: |
        全画面の編集画面の保存の本文（specs/047-video-work-info/contracts/screen-api.md
        「PUT /api/videos/{id}/details」）。両方とも必須
      properties:
        displayName:
          type: string
          description: 新しい表示名。前後の空白を取り除いて空なら解除する
        workInfo:
          $ref: "#/components/schemas/WorkInfoInput"

    Person:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt]
      additionalProperties: false
      description: 人物 1 件（specs/047-video-work-info/contracts/screen-api.md「People and organizations」）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: 名前の自然順
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: (source, value) の順
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: この人物をどれかの役割で結ぶ、表示中の動画の数
        createdAt:
          type: string
          format: date-time

    Organization:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt]
      additionalProperties: false
      description: 団体 1 件。Person と同じ項目に親の団体が加わる
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: 名前の自然順
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: (source, value) の順
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: この団体をどれかの役割で結ぶ、表示中の動画の数
        createdAt:
          type: string
          format: date-time
        parent:
          $ref: "#/components/schemas/CreditRef"
          description: 親の団体。根の団体では省く

    CreditInput:
      type: object
      required: [name]
      additionalProperties: false
      description: 人物か団体を作るときの本文。parentId は団体だけが使う
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: integer
          format: int64
          description: 親の団体の id。団体だけで、人物に送ると 400 invalid_request

    CreditPatch:
      type: object
      additionalProperties: false
      description: |
        人物か団体の書き換えの本文。どのプロパティも省いてよく、省いたものは今のまま残す。一覧は丸ごと
        置き換え、null は一覧を空にする。parentId は団体だけが使い、null は親を外す
      properties:
        name:
          type: string
        aliases:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: [integer, "null"]
          format: int64
          description: 親の団体の id。null は親を外す。人物に送ると 400 invalid_request

    CreditMergeRequest:
      type: object
      required: [sourceIds]
      additionalProperties: false
      properties:
        sourceIds:
          type: array
          description: 統合元の id。1 件以上 20,000 件以下
          items:
            type: integer
            format: int64

    PersonList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: 人物の一覧（契約の CreditList の人物の形）
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        total:
          type: integer
          description: 条件（q）に合う人物の数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部の人物の数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    OrganizationList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: 団体の一覧（契約の CreditList の団体の形）
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          type: integer
          description: 条件（q）に合う団体の数。ページングとは独立に返る
        totalAll:
          type: integer
          description: 全部の団体の数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。`limit` を付けた要求で続きがあるときだけ入る

    PersonMergeResponse:
      type: object
      required: [person, notFoundIds]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        notFoundIds:
          type: array
          description: もう無かった統合元
          items:
            type: integer
            format: int64

    OrganizationMergeResponse:
      type: object
      required: [organization, notFoundIds]
      additionalProperties: false
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        notFoundIds:
          type: array
          description: もう無かった統合元
          items:
            type: integer
            format: int64

    CreditSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: |
        人物と団体の一覧の並び順。タグの一覧（TagSort）と同じ 5 つで、値が同じものは名前の自然順、それも同じなら id

    VideoTagsAction:
      type: string
      enum: [add, remove]

    VideoTagsRequest:
      type: object
      required: [videoIds, action, tag]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        action:
          $ref: "#/components/schemas/VideoTagsAction"
        tag:
          $ref: "#/components/schemas/TagInput"

    VideoTagsResponse:
      type: object
      required: [tag, applied]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        applied:
          type: integer
          description: videoIds のうちいまライブラリにある動画の数

    VideoVisibilityRequest:
      type: object
      required: [videoIds, public]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        public:
          type: boolean
          description: true で公開、false で非公開にする

    FavoritesRequest:
      type: object
      required: [favorite]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: お気に入りを付け外しする動画の id
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: お気に入りを付け外しするグループの id（specs/048-groups/research.md R-10）
          items:
            type: integer
            format: int64
        favorite:
          type: boolean
          description: true でお気に入りにし、false で外す

    FavoritesResponse:
      type: object
      required: [appliedVideos, appliedGroups]
      additionalProperties: false
      properties:
        appliedVideos:
          type: integer
          description: |
            videoIds のうちいまライブラリにある異なる動画の id の数（同じ集まりの id も 1 本ずつ数え、
            既に同じ状態だったものを含む）
        appliedGroups:
          type: integer
          description: groupIds のうちいまある異なるグループの数（既に同じ状態だったものを含む）

    PlaylistSummary:
      type: object
      required: [id, name, itemCount, updatedAt]
      additionalProperties: false
      description: プレイリスト 1 つの要約（specs/044-playlists/contracts/screen-api.md）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 前後の空白を取り除いた 1〜100 文字の名前。ほかのプレイリストと同じでもよい
        itemCount:
          type: integer
          description: 今見せる項目の数（specs/044-playlists/research.md R-4）
        updatedAt:
          type: string
          format: date-time
          description: 名前か項目を最後に変えた時刻
        covers:
          type: array
          maxItems: 4
          description: |
            一覧のカードのフォルダの絵柄に差し込むサムネイル（`LibraryGroup.previews` と同じ形）。
            見せる項目を位置の順にたどり、動画の項目はその動画、グループの項目は並びの順で
            最初のサムネイル生成済みのメンバーを 1 枚ずつ、サムネイル生成済みのものだけ最大 4 件。
            `GET /api/playlists` の要約にだけ入り、ほかの応答では省く
          items:
            $ref: "#/components/schemas/FolderPreview"

    PlaylistList:
      type: object
      required: [items, total, version]
      additionalProperties: false
      properties:
        items:
          type: array
          description: プレイリストの要約の 1 ページ。`updatedAt` の新しい順（同じなら id の大きい順）
          items:
            $ref: "#/components/schemas/PlaylistSummary"
        total:
          type: integer
          description: 全部のプレイリストの数。ページングとは独立に返る
        version:
          type: string
          description: |
            一覧の版。プレイリストを作る・消す・名前か項目を変えるたびに変わる不透明な文字列。
            ページごとの値が最初のページと違えば、並びが変わっているので最初のページから読み直す
        nextCursor:
          type: string
          description: 次のページの取得に渡す。続きがあるときだけ入る

    Playlist:
      type: object
      required: [id, name, itemCount, updatedAt, items]
      additionalProperties: false
      description: プレイリスト 1 つ。`PlaylistSummary` の欄に見せる項目を足したもの
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 前後の空白を取り除いた 1〜100 文字の名前
        itemCount:
          type: integer
          description: 今見せる項目の数
        updatedAt:
          type: string
          format: date-time
          description: 名前か項目を最後に変えた時刻
        items:
          type: array
          description: 見せる項目を位置の順に並べたもの
          items:
            $ref: "#/components/schemas/PlaylistItem"

    PlaylistItem:
      type: object
      required: [id, kind]
      additionalProperties: false
      description: プレイリストの項目 1 つ。`kind` に応じて `video` か `group` のちょうど一方が入る
      properties:
        id:
          type: integer
          format: int64
          description: 並べ替えと取り外しに使う項目の識別子
        kind:
          type: string
          enum: [video, group]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"

    PlaylistName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: プレイリストの名前。サーバーが前後の空白を取り除いてから長さを数える

    PlaylistItemsAdd:
      type: object
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: 足す動画の id
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: 足すグループの id（`PUT /api/favorites` と同じ形）
          maxItems: 20000
          items:
            type: integer
            format: int64

    PlaylistItemsAdded:
      type: object
      required: [added, existing]
      additionalProperties: false
      properties:
        added:
          type: integer
          description: 末尾に足した項目の数
        existing:
          type: integer
          description: 引けたが既にプレイリストにあった項目の数

    PlaylistItemMove:
      type: object
      required: [afterItemId]
      additionalProperties: false
      properties:
        afterItemId:
          type: [integer, "null"]
          format: int64
          description: この項目のすぐ後ろへ移す。null は先頭へ移す

    VideoVisibilityResponse:
      type: object
      required: [applied]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: videoIds のうちいまライブラリにある動画の数（既に同じ状態だったものを含む）

    VideoTagsSummaryRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    VideoTagsSummaryItem:
      type: object
      required: [tag, count, manualCount]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        count:
          type: integer
          description: 手で付けた分とフォルダ名から付いている分のどちらかで付いている本数
        manualCount:
          type: integer
          description: 手で付けた本数

    VideoTagsSummary:
      type: object
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          type: integer
        items:
          type: array
          description: 1本以上に付いているタグだけ。名前の自然順
          items:
            $ref: "#/components/schemas/VideoTagsSummaryItem"

    VideoIdsResponse:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
        missingTagIds:
          type: array
          description: tag のうち存在しなかった id。1つも無ければ省略される
          items:
            type: integer
            format: int64
        groups:
          type: array
          description: |
            条件に合うグループの項目。各要素のグループの id と、その再生順の動画の id（ids にも含まれる）。
            listLibraryIds の応答にだけ入り、1 つも無ければ省略される
            （specs/035-favorites/contracts/screen-api.md §3）
          items:
            $ref: "#/components/schemas/LibraryGroupIds"

    LibraryGroupIds:
      type: object
      required: [id, videoIds]
      additionalProperties: false
      description: GET /api/library/ids のグループの項目 1 件
      properties:
        id:
          type: integer
          format: int64
          description: グループの識別子
        videoIds:
          type: array
          description: グループの再生順の、見せてよい動画の id
          items:
            type: integer
            format: int64

    DirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string

    DirectoryListing:
      type: object
      required: [parentPath, directories]
      additionalProperties: false
      properties:
        currentPath:
          type: string
        parentPath:
          type: [string, "null"]
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    VideoSort:
      type: string
      enum:
        - addedAsc
        - addedDesc
        - modifiedAsc
        - modifiedDesc
        - createdAsc
        - createdDesc
        - titleAsc
        - titleDesc
        - durationAsc
        - durationDesc
        - sizeAsc
        - sizeDesc
        - playedAsc
        - playedDesc
        - favoritedAsc
        - favoritedDesc
        - random
      default: addedDesc
      description: |
        並び順。末尾の Asc は昇順、Desc は降順。added = 追加日、modified = 一覧に出す
        所在の更新日時（mtime）、created = 一覧に出す所在の作成日時（取れなければ mtime。
        specs/033-video-dates/research.md R-4）、title = 一覧に出す所在の題名（自然順）、duration = 長さ（無い
        動画は向きに関係なく末尾）、size = 一覧に出す所在のファイルサイズ、played =
        最後に再生した時刻（記録の無い動画は向きに関係なく末尾）、favorited = お気に入りに
        した日時（お気に入りでない項目は向きに関係なく末尾。グループの項目はグループを
        お気に入りにした日時）、random = `seed` と
        動画の識別子から作る順。値が同じなら識別子で決着させる

    WatchFilter:
      type: string
      enum: [all, unwatched, inProgress, watched]
      default: all
      description: |
        視聴状態の絞り込み。all = 絞り込まない、unwatched = 未視聴、inProgress = 視聴途中、
        watched = 視聴済み

    FolderScope:
      type: string
      enum: [direct, subtree]
      default: direct
      description: direct = フォルダ直下の所在だけ、subtree = フォルダとその配下すべての所在

    VideoPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
          description: |
            検索語・watch・playable・範囲（listFolderVideos の scope）をすべて適用した
            全件の数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。これ以上無い場合は省略される
        missingTagIds:
          type: array
          description: |
            tag のうち存在しなかった id。1つも無ければ省略される
            （specs/014-video-tags/contracts/tags-api.md §5）
          items:
            type: integer
            format: int64

    LibraryPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItem"
        total:
          type: integer
          description: 絞り込み後の項目（カード）の数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。これ以上無い場合は省略される
        missingTagIds:
          type: array
          description: tag のうち存在しなかった id。1つも無ければ省略される
          items:
            type: integer
            format: int64

    LibraryItem:
      type: object
      required: [kind]
      additionalProperties: false
      description: ライブラリの項目1件。`kind` に応じて `video` か `group` のちょうど一方が入る
      properties:
        kind:
          type: string
          enum: [video, group]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"

    LibraryGroup:
      type: object
      required: [id, name, videoCount, sizeBytes, addedAt, previews, openVideoId, videoIds, tags]
      additionalProperties: false
      description: |
        グループの項目。値はどれも、見る人に見せてよい子孫の動画を再生順（子グループは深さ優先、
        同じ動画は最初の 1 回）に並べたものから作る（specs/048-groups/research.md R-7。この説明の
        「メンバー」はその動画を指す）。グループは `id` で指す。ゲストの応答では `watchedCount`・
        `watchState`・`lastPlayedAt`・`favorite` を省き、`tags` を空の配列にする。
      properties:
        id:
          type: integer
          format: int64
          description: グループの識別子
        folder:
          $ref: "#/components/schemas/VideoFolder"
          description: |
            自動グループのフォルダ。フォルダから自動でできたグループで、そのフォルダが登録フォルダの
            下にあるときだけ入る。手で作ったグループには無く、画面はこれで 2 つを見分ける
        name:
          type: string
          description: グループの名前
        videoCount:
          type: integer
        watchedCount:
          type: integer
          description: 完了したメンバーの数。所有者の応答にだけ入る
        watchState:
          type: string
          enum: [unwatched, inProgress, watched]
          description: |
            見始めたメンバーが無ければ unwatched、全メンバーが完了なら watched、それ以外は
            inProgress。所有者の応答にだけ入る
        durationMs:
          type: integer
          format: int64
          description: 長さの分かっているメンバーの合計。1本も分からなければ省く
        sizeBytes:
          type: integer
          format: int64
          description: メンバーの代表の所在の大きさの合計
        addedAt:
          type: string
          format: date-time
          description: メンバーの追加日時の最大
        lastPlayedAt:
          type: string
          format: date-time
          description: メンバーの最後に再生した時刻の最大。無ければ省く
        previews:
          type: array
          maxItems: 4
          description: |
            カードのフォルダの絵柄に差し込むサムネイル。メンバーのうちサムネイル生成済みのものを
            並びの順に最大4件（フォルダカードの previews と同じ形）。リスト表示の行は先頭の
            1件をサムネイルに使う
          items:
            $ref: "#/components/schemas/FolderPreview"
        openVideoId:
          type: integer
          format: int64
          description: |
            押したときに開くメンバー。並びの順で途中まで見た最初のメンバー、無ければ最初の
            未完了のメンバー、全部完了なら最初のメンバー
        videoIds:
          type: array
          description: 全メンバーの id を並びの順に
          items:
            type: integer
            format: int64
        tags:
          type: array
          description: メンバーのタグの和集合。同じタグの出所は和にする
          items:
            $ref: "#/components/schemas/VideoTag"
        favorite:
          type: boolean
          description: |
            所有者がグループをお気に入りにしたか。メンバーの動画のお気に入りとは独立で、
            所有者の応答にだけ入る（specs/035-favorites/data-model.md §3）

    GroupMembers:
      type: object
      additionalProperties: false
      description: グループの項目に足す動画とグループ。動画、次にグループの順に、それぞれ要求の順で足す
      properties:
        videoIds:
          type: array
          description: 足す動画の id
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: 足すグループの id
          maxItems: 20000
          items:
            type: integer
            format: int64

    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      description: POST /api/groups の本文。`GroupMembers` に名前を足したもの
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: グループの名前。サーバーが前後の空白を取り除いてから長さを数える
        videoIds:
          type: array
          description: 項目にする動画の id
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: 項目にするグループの id
          maxItems: 20000
          items:
            type: integer
            format: int64

    GroupName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: グループの名前。サーバーが前後の空白を取り除いてから長さを数える

    GroupRename:
      type: object
      required: [name]
      additionalProperties: false
      description: PATCH /api/groups/{id} の本文（specs/050-drag-organize/contracts/screen-api.md）
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: グループの名前。サーバーが前後の空白を取り除いてから長さを数える
        undoToken:
          type: string
          description: このグループを作った POST /api/organize/group の `undoToken`。名前の変更をその取り消しに含める

    GroupListPage:
      type: object
      required: [groups]
      additionalProperties: false
      description: GET /api/groups の応答
      properties:
        groups:
          type: array
          description: 見る人に見せるグループを、どの深さのものも自然な名前の順に
          items:
            $ref: "#/components/schemas/LibraryGroup"
        nextCursor:
          type: string
          description: 続きがあるときだけ入る

    GroupItemMove:
      type: object
      additionalProperties: false
      properties:
        after:
          type: integer
          format: int64
          description: この項目のすぐ後ろへ移す。無ければ先頭へ移す

    GroupItemRemove:
      type: object
      required: [itemIds]
      additionalProperties: false
      properties:
        itemIds:
          type: array
          description: 外す項目の id（動画やグループの id ではない）
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    OrganizeRef:
      type: object
      required: [kind, id]
      additionalProperties: false
      description: ドラッグしたカード 1 枚（specs/050-drag-organize/research.md R-4）
      properties:
        kind:
          type: string
          enum: [video, group]
        id:
          type: integer
          format: int64
          description: 動画かグループの id

    OrganizeRefs:
      type: array
      description: ドラッグしたカード。画面の順
      minItems: 1
      maxItems: 20000
      items:
        $ref: "#/components/schemas/OrganizeRef"

    OrganizeResult:
      type: object
      required: [undoToken]
      additionalProperties: false
      properties:
        undoToken:
          type: string
          description: この操作を取り消すトークン（POST /api/organize/undo）。10 分有効で、1 回だけ使える
        groupId:
          type: integer
          format: int64
          description: 新しいグループの id。/api/organize/group だけが返す

    OrganizeReorder:
      type: object
      required: [groupId, itemIds]
      additionalProperties: false
      properties:
        groupId:
          type: integer
          format: int64
          description: 開いているグループ
        itemIds:
          type: array
          description: 移す項目の id（動画やグループの id ではない）。画面の順
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        after:
          type: integer
          format: int64
          description: この項目のすぐ後ろへ移す。無ければ先頭へ移す

    OrganizeGroup:
      type: object
      required: [items, target]
      additionalProperties: false
      properties:
        items:
          $ref: "#/components/schemas/OrganizeRefs"
        target:
          type: integer
          format: int64
          description: 落とした先の動画
        from:
          type: integer
          format: int64
          description: 新しいグループを置く、開いているグループ

    OrganizeMove:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          $ref: "#/components/schemas/OrganizeRefs"
        from:
          type: integer
          format: int64
          description: カードをドラッグして出した開いているグループ
        to:
          type: integer
          format: int64
          description: カードを入れるグループ。無ければライブラリ（`from` から外すだけ）

    OrganizeBundle:
      type: object
      required: [videoIds, target]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: ドラッグした動画の id
          minItems: 1
          maxItems: 20
          items:
            type: integer
            format: int64
        target:
          type: integer
          format: int64
          description: 落とした先の動画。新しい集まりの代表になる

    OrganizeUndo:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: 操作の応答の `undoToken`

    GroupTagResult:
      type: object
      required: [tag, created]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        created:
          type: boolean
          description: タグを新しく作ったとき true。名前かシノニムで引けた既存のタグなら false
    GroupRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: グループを指す id と名前
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GroupItem:
      type: object
      required: [id, kind]
      additionalProperties: false
      description: グループの項目 1 件。`kind` に応じて `video` か `group` のちょうど一方が入る
      properties:
        id:
          type: integer
          format: int64
          description: 項目の識別子。動画やグループの id ではない
        kind:
          type: string
          enum: [video, group]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"

    GroupDetail:
      type: object
      required: [group, trail, items]
      additionalProperties: false
      description: GET /api/groups/{id} の応答
      properties:
        group:
          $ref: "#/components/schemas/LibraryGroup"
        trail:
          type: array
          description: 要求の `trail` のうち親と子の組が続く部分。外側から順で、最後はこのグループの親
          items:
            $ref: "#/components/schemas/GroupRef"
        items:
          type: array
          description: 項目の最初のページ。位置の順で、見る人に見せる項目だけ
          items:
            $ref: "#/components/schemas/GroupItem"
        nextCursor:
          type: string
          description: 続きがあるときだけ入る。`listGroupItems` に渡す

    GroupItemPage:
      type: object
      required: [items]
      additionalProperties: false
      description: GET /api/groups/{id}/items の応答
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupItem"
        nextCursor:
          type: string
          description: 続きがあるときだけ入る

    GroupChanged:
      type: object
      required: [ids]
      additionalProperties: false
      description: /api/events の `group` の data
      properties:
        ids:
          type: array
          description: 名前か項目が変わったグループと、その祖先のグループの id。小さい順
          items:
            type: integer
            format: int64

    FolderPreview:
      type: object
      required: [videoId, thumbnailUrl]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
        thumbnailUrl:
          type: string
          description: Video.thumbnailUrl と同じ版付き URL
        previewUrl:
          type: string
          description: Video.previewUrl と同じ版付き URL。一覧用プレビューが生成済みで、保存済み asset が配信可能なときだけ入る

    FolderSummary:
      type: object
      required: [rootId, path, name, videoCount, folderCount, previews]
      additionalProperties: false
      properties:
        rootId:
          type: integer
          format: int64
        path:
          type: string
          description: 登録フォルダからの `/` 区切りの相対パス。登録フォルダ自身は空文字
        name:
          type: string
          description: 表示名。相対パスの最後の段、登録フォルダ自身は絶対パスの最後の段
        rootPath:
          type: string
          description: |
            登録フォルダの絶対パス。ゲストの応答では省く（guest-api.md §1）。画面は
            登録フォルダの表示名を、これが無ければ `name` から作る
        videoCount:
          type: integer
          description: 直下の動画の件数（ゲストでは公開の動画だけを数える）
        folderCount:
          type: integer
          description: 直下の子フォルダの件数
        previews:
          type: array
          maxItems: 4
          description: 直下の動画のうちサムネイル生成済みのもの。所在のパスの昇順で最大4件
          items:
            $ref: "#/components/schemas/FolderPreview"
        grouping:
          $ref: "#/components/schemas/FolderGrouping"

    FolderGroupingMode:
      type: string
      enum: [auto, ungroup, groupDirect]
      description: |
        フォルダのまとめ方の例外。`auto` は例外なし、`ungroup` は「まとめを解除」、
        `groupDirect` は「直下をまとめる」（specs/017-folder-groups/contracts/folder-groups-api.md §1）

    FolderGrouping:
      type: object
      required: [mode]
      additionalProperties: false
      description: |
        フォルダのまとめ方の今の状態。`FolderSummary.grouping` として所有者の応答にだけ入り、
        ゲストでは省く（specs/017-folder-groups/contracts/folder-groups-api.md §1、
        specs/048-groups/contracts/screen-api.md「Routes and schemas changed」）
      properties:
        mode:
          $ref: "#/components/schemas/FolderGroupingMode"
        groupId:
          type: integer
          format: int64
          description: |
            このフォルダの自動グループの id。無ければ省く。`POST /api/groups/{id}/tag` で
            タグに変えられる

    FolderGroupingRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/FolderGroupingMode"

    FolderListing:
      type: object
      required: [folder, folders]
      additionalProperties: false
      properties:
        folder:
          $ref: "#/components/schemas/FolderSummary"
        folders:
          type: array
          description: 直下の子フォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    RootFolderListing:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        folders:
          type: array
          description: 登録済みメディアフォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    Video:
      type: object
      description: |
        ゲストの応答では `location`・`progress`・`probeError`・`fileTitle`・`displayName`・
        `thumbnailPositionMs`・`thumbnailImage`・`workInfo` を省き、`tags` を空の配列にする
        （specs/016-single-account-auth/contracts/guest-api.md §1、
        specs/029-video-overrides/contracts/screen-api.md §0）。
      required:
        [
          id,
          title,
          sizeBytes,
          addedAt,
          updatedAt,
          fileCreatedAt,
          playable,
          probeState,
          thumbnailState,
          previewState,
          tags,
          public,
        ]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: |
            有効な題名。表示名があればそれ、無ければ拡張子を除いたファイル名
            （specs/029-video-overrides/contracts/screen-api.md §0）
        fileTitle:
          type: string
          description: 拡張子を除いたファイル名。所有者の応答にだけ入る
        displayName:
          type: string
          description: 所有者が付けた表示名。設定されているときだけ、所有者の応答にだけ入る
        thumbnailPositionMs:
          type: integer
          format: int64
          description: 代表サムネイルにする場面の位置（ミリ秒）。設定されているときだけ、所有者の応答にだけ入る
        thumbnailImage:
          type: string
          enum: [generated, uploaded]
          description: |
            所有者が適用した画像が代表サムネイルのとき、その出どころ。`generated` は ComfyUI の編集結果、
            `uploaded` はアップロードした画像。適用しているときだけ、所有者の応答にだけ入る
            （specs/046-thumbnail-image-upload/contracts/screen-api.md、research.md R-5）
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: |
            vv 上で動画の情報（表示名・タグ・公開設定・代表サムネイル）を最後に編集した日時。
            一度も編集していなければ addedAt と同じ（specs/033-video-dates/data-model.md §3）
        fileCreatedAt:
          type: string
          format: date-time
          description: |
            一覧に出す所在のファイルの作成日時。ファイルシステムから取れないときはそのファイルの
            更新日時（mtime）（specs/033-video-dates/research.md R-4）
        durationMs:
          type: integer
          format: int64
          description: 尺。解析前・取得不能の場合は省略される
        width:
          type: integer
          description: 表示される向きの幅（回転の印を反映済み）
        height:
          type: integer
          description: 表示される向きの高さ（回転の印を反映済み）
        displayAspectRatio:
          type: number
          format: double
          description: |
            表示される横÷縦の比率。回転と画素の縦横比（SAR）を反映し、縦長の動画は 1 未満になる。
            解析前・取得不能の場合は省略される
        container:
          type: string
          examples: [mp4, webm, mkv]
        videoCodec:
          type: string
          examples: [h264, vp9]
        audioCodec:
          type: string
          examples: [aac, opus]
        playable:
          type: boolean
          description: ブラウザでそのまま再生できると判定されたか
        unplayableReason:
          type: string
          enum: [container, video_codec, audio_codec]
          description: playable = false の理由。判定前は省略される
        probeState:
          type: string
          enum: [pending, done, failed]
        probeError:
          type: string
          description: probeState = failed のときの理由。ゲストの応答では省く（ファイルの絶対パスを含みうる）
        probeErrorCode:
          $ref: "#/components/schemas/ProbeErrorCode"
        thumbnailState:
          type: string
          enum: [pending, done, failed]
        previewState:
          type: string
          enum: [pending, done, failed]
        thumbnailUrl:
          type: string
          description: |
            thumbnailState = done のときだけ入る。版は内容鍵の先頭で、位置の指定中は `-r<改版番号>`、
            適用した画像の表示中は `-g<改版番号>` が付く（ゲストにも同じ文字列）
        previewUrl:
          type: string
          description: previewState = done かつ保存済み asset が配信可能なときだけ入る版付き URL。done なのに asset が無ければ、サーバーは作り直しを積み、previewState を pending として返す
        seekThumbnailUrl:
          type: string
          description: |
            probeState = done かつ正のdurationMsを持つときだけ入る、シーク用サムネイルの
            スプライトの配置情報（SeekThumbnailSprite）を返す経路の版付き URL
            （specs/021-seek-thumbnail-sprite/contracts/seek-sprite-api.md §1）
        progress:
          $ref: "#/components/schemas/Progress"
        location:
          $ref: "#/components/schemas/VideoLocation"
        folder:
          $ref: "#/components/schemas/VideoFolder"
        group:
          $ref: "#/components/schemas/VideoGroupRef"
        versions:
          $ref: "#/components/schemas/VideoVersionsRef"
        tags:
          type: array
          description: |
            付いたタグ。名前の自然順（domain.CompareNatural、同じなら id）。タグが
            無ければ空配列（contracts/tags-api.md §1）。ゲストの応答では常に空配列。
            フォルダ名から付いている分も含む
            （specs/017-folder-groups/contracts/folder-groups-api.md §4）
          items:
            $ref: "#/components/schemas/VideoTag"
        public:
          type: boolean
          description: |
            公開の動画か。公開の動画はログインしていない人にも見える
            （specs/016-single-account-auth/contracts/guest-api.md §4）
        favorite:
          type: boolean
          description: |
            所有者がお気に入りにした動画か。所有者の応答にだけ入る
            （specs/035-favorites/data-model.md §3）
        workInfo:
          $ref: "#/components/schemas/WorkInfo"
          description: |
            作品情報。GET /api/videos/{id} と、作品情報を書く所有者の PUT（work-info・details）の
            応答にだけ入り、行の無い動画とゲストの応答では無い。一覧の項目・関連動画・ライブラリの
            項目には入らない（specs/047-video-work-info/contracts/screen-api.md「Video changes」）
        seekThumbnailState:
          type: string
          enum: [pending, done, failed]
          description: |
            シーク用サムネイルの状態。GET /api/videos/{id} の応答にだけ入り、
            seekThumbnailUrl と同じ条件のときだけ入る。done = スプライトが完成している、
            pending = 生成を待っている、または生成中（保存した状態が done なのに置き場が
            無いときは、サーバーが作り直しを積んで pending として返す）、failed = 生成に
            失敗し、再試行の上限に達した

    SeekThumbnailSprite:
      type: object
      description: |
        シーク用サムネイルのスプライトの配置情報
        （specs/021-seek-thumbnail-sprite/contracts/seek-sprite-api.md §2）。最後のシートの
        frameCount を超える部分は黒く、クライアントはそこを指さない。
      required: [intervalMs, frameCount, columns, rows, frameWidth, frameHeight, sheets]
      additionalProperties: false
      properties:
        intervalMs:
          type: integer
          format: int64
          minimum: 1000
          description: コマ k が受け持つ位置は [k*intervalMs, (k+1)*intervalMs)
        frameCount:
          type: integer
          minimum: 1
          maximum: 600
          description: 全シートに載るコマの数
        columns:
          type: integer
          minimum: 1
          description: 1 シートの列数
        rows:
          type: integer
          minimum: 1
          description: 1 シートの行数
        frameWidth:
          type: integer
          minimum: 2
          description: 1 コマの幅（px）。1 本の中で全コマ同じ
        frameHeight:
          type: integer
          minimum: 2
          description: 1 コマの高さ（px）
        sheets:
          type: array
          minItems: 1
          maxItems: 6
          description: シートの版付き URL。番号順
          items:
            type: string

    VideoFolder:
      type: object
      required: [rootId, path]
      additionalProperties: false
      description: |
        所在が置かれたフォルダ。一覧（listVideos・listFolderVideos）では一覧に出す所在の、
        GET /api/videos/{id} では代表の所在（location）のフォルダを指す。所在がどの
        登録フォルダにも含まれなければ省かれる。ScanIssue.folder では問題の所在の、ScanActivity.folder では
        今の処理のファイルのフォルダを指す。
        LibraryGroup.folder（自動グループ）・Video.group.folder（自動グループ、GET /api/videos/{id}）では
        グループのフォルダそのものを指す
      properties:
        rootId:
          type: integer
          format: int64
          description: 所在を含む登録メディアフォルダの識別子
        path:
          type: string
          description: 登録フォルダからその所在が置かれたフォルダまでの `/` 区切りの相対パス。直下は空文字
        rootName:
          type: string
          description: |
            登録フォルダの表示名（FolderSummary.name と同じ規則）。GET /api/videos/{id} の
            Video.folder・ScanIssue.folder・ScanActivity.folder にだけ入る（Video.group.folder には入らない）

    VideoLocation:
      type: object
      required: [path, openable]
      additionalProperties: false
      description: 代表の所在。GET /api/videos/{id} の応答にだけ入る
      properties:
        path:
          type: string
          description: 代表の所在の絶対パス。サーバーから見たパスで、コンテナ内ならコンテナ内のパス
        openable:
          type: boolean
          description: |
            要求元がループバックで、Host がループバックの名前で、サーバーが既定アプリを
            起動できる環境のとき true

    VideoGroupRef:
      type: object
      required: [id, name, position, count]
      additionalProperties: false
      description: |
        動画の文脈のグループ（`group` の問い合わせ、specs/048-groups/research.md R-9）。
        GET /api/videos/{id} の応答にだけ、動画がグループにあるときだけ入る（location と同じ扱いで、
        一覧の項目には入らない）。位置と本数はそのグループの再生順（子グループは深さ優先、同じ動画は
        最初の 1 回）で数え、ゲストの応答では公開の動画だけで数える
      properties:
        id:
          type: integer
          format: int64
          description: グループの識別子
        folder:
          $ref: "#/components/schemas/VideoFolder"
          description: |
            自動グループのフォルダ。LibraryGroup の folder と同じく、フォルダから自動でできた
            グループで、そのフォルダが登録フォルダの下にあるときだけ入る
        name:
          type: string
          description: グループの名前
        position:
          type: integer
          minimum: 1
          description: グループの再生順で何本目か（1 始まり）
        count:
          type: integer
          minimum: 1
          description: グループの再生順の動画の本数

    VideoVersionsRef:
      type: object
      required: [count, representativeId]
      additionalProperties: false
      description: |
        動画が属する集まり（同じ動画の別バージョン）の要約。GET /api/videos/{id} の応答にだけ、
        集まりのメンバーのときだけ入る（group と同じ扱いで、一覧の項目には入らない）
        （specs/030-video-versions/contracts/screen-api.md §0）
      properties:
        count:
          type: integer
          minimum: 1
          description: 見る人に見せてよい所在を持つバージョンの本数
        representativeId:
          type: integer
          format: int64
          description: 実効の代表（一覧に出ている 1 件）の動画の id

    VideoVersions:
      type: object
      required: [representativeId, items]
      additionalProperties: false
      description: |
        集まりの全バージョン（specs/030-video-versions/contracts/screen-api.md §1）
      properties:
        representativeId:
          type: integer
          format: int64
          description: 実効の代表の動画の id。集まりに属さなければその動画の id
        items:
          type: array
          description: |
            代表が先頭で、続きは題名の自然順（同じなら id）。各項目は GET /api/videos/{id} と
            同じ形
          items:
            $ref: "#/components/schemas/Video"

    VideoBundleRequest:
      type: object
      required: [videoIds, representativeId]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          maxItems: 20000
          description: 束ねる動画。重複は 1 つと数え、2 本以上
          items:
            type: integer
            format: int64
        representativeId:
          type: integer
          format: int64
          description: 代表にする動画。videoIds の 1 つ

    VersionCandidate:
      type: object
      required: [videos, distance]
      additionalProperties: false
      description: |
        「同じ動画かもしれない」2 本の組（specs/030-video-versions/contracts/screen-api.md §5）
      properties:
        videos:
          type: array
          minItems: 2
          maxItems: 2
          description: 2 本の動画。id の小さい順で、各項目は GET /api/videos/{id} と同じ形
          items:
            $ref: "#/components/schemas/Video"
        distance:
          type: integer
          minimum: 0
          description: 2 本の映像の指紋のハミング距離の中央値（小さいほど似ている）

    VersionCandidatePage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 200
          description: 新しい順、最大 200 組
          items:
            $ref: "#/components/schemas/VersionCandidate"
        total:
          type: integer
          minimum: 0
          description: 候補の全件の数

    VersionCandidateDismissRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 2
          maxItems: 2
          description: 「違う動画」と記録する 2 本。同じ id は受け付けない
          items:
            type: integer
            format: int64

    RelatedGroup:
      type: object
      required: [id, name, items, offset, total]
      additionalProperties: false
      description: |
        基準の動画の文脈のグループ（`group` の問い合わせ、specs/048-groups/research.md R-9）。
        メンバーはそのグループの再生順の動画で、ゲストの応答では公開の動画だけで作る
      properties:
        id:
          type: integer
          format: int64
          description: グループの識別子
        name:
          type: string
          description: グループの名前
        items:
          type: array
          maxItems: 100
          description: |
            基準の動画を中ほどに置いた、グループの中の並びで連続するメンバーの窓（基準の動画を
            含む）。グループの端では窓を内側へ寄せる。窓の外は `listVideoGroupMembers` で読む
          items:
            $ref: "#/components/schemas/Video"
        offset:
          type: integer
          minimum: 0
          description: items の先頭のメンバーの、グループの中の並びの位置（0 始まり）
        total:
          type: integer
          minimum: 1
          description: 見せてよいメンバーの本数

    GroupMemberPage:
      type: object
      required: [items, offset, total]
      additionalProperties: false
      description: グループのメンバーの、グループの中の並びで連続する範囲
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Video"
        offset:
          type: integer
          minimum: 0
          description: items の先頭のメンバーの、グループの中の並びの位置（0 始まり）
        total:
          type: integer
          minimum: 1
          description: 見せてよいメンバーの本数

    RelatedVideos:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          description: |
            関連動画の近さの順の 1 ページ。基準の動画がグループのメンバーなら、同じグループの
            メンバーを除いてから並べる
          items:
            $ref: "#/components/schemas/Video"
        nextCursor:
          type: string
          description: 続きを読むときに `cursor` へ渡す値。並びの終わりまで返したら省く
        nextId:
          type: integer
          format: int64
          description: |
            次の動画。グループのメンバーならグループの中の並びの次（最後のメンバーでは省く）、
            そうでなければ関連動画の並びの先頭。無ければ省く。`cursor` を付けた要求では省く
        prevId:
          type: integer
          format: int64
          description: |
            グループの中の並びの前の動画（最初のメンバーでは省く）。グループに属さない動画では
            省き、画面が直前に見ていた動画を前の動画にする。`cursor` を付けた要求では省く。
            items に入るとは限らない
        group:
          $ref: "#/components/schemas/RelatedGroup"

    DisplayNameUpdate:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: 新しい表示名。前後の空白を取り除いて空なら解除する

    ThumbnailPositionUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: [integer, "null"]
          format: int64
          description: 代表サムネイルにする場面の位置（ミリ秒）。null は解除して自動の位置に戻す

    ProgressUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        playbackId:
          type: string
          minLength: 36
          maxLength: 36
          description: |
            この視聴にクライアントが付けた識別子（RFC 4122 の文字列の形）。ある識別子での
            最初の保存が動画の視聴履歴を 1 件足し、同じ識別子での以降の保存は何も足さない。
            再生が始まる前は送らない。形が違えば 400 invalid_request。

    SubtitleTrackList:
      type: object
      required: [subtitles]
      additionalProperties: false
      properties:
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleTrack"

    SubtitleTrack:
      type: object
      required: [file, label, format]
      additionalProperties: false
      properties:
        file:
          type: string
          description: 字幕ファイルの名前（フォルダを含まない）。`getVideoSubtitle` の `file` に使う
        label:
          type: string
          description: ファイル名のラベル（`ja`、`en.forced`）。ラベルの無い字幕は空文字列
        format:
          type: string
          enum: [srt, vtt]
          description: 元のファイルの形式

    TranscodeStart:
      type: object
      required: [startMs]
      additionalProperties: false
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
          description: 変換の出力の時間軸の 0 に当たる元動画の時刻（ミリ秒）

    Progress:
      type: object
      required: [positionMs, completed, updatedAt]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      description: >-
        直近の取り込みの状態（specs/024-import-progress/contracts/scan-api.md §2）。右下の表示と設定画面は、
        どちらもこの1つを読む
      required: [id, status, issues, state, origin]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        origin:
          type: string
          description: >-
            取り込みを始めた主体。watch はフォルダの監視が始めた、変わったフォルダだけの取り込み
            （specs/042-folder-watch-import/contracts/screen-api.md）
          enum: [manual, watch]
        status:
          $ref: "#/components/schemas/ScanStatus"
        videos:
          $ref: "#/components/schemas/ScanVideos"
        issues:
          $ref: "#/components/schemas/ScanIssueCounts"
        settledAt:
          type: string
          format: date-time
          description: 対象の動画がすべて済んだ時刻。status が done・partial のときだけ返す
        activity:
          $ref: "#/components/schemas/ScanActivity"
        state:
          type: string
          description: 走査そのものの状態。一覧の読み直しと、取り込みを始められるかの判定に使う
          enum: [running, done, failed]
        error:
          type: string
          description: >-
            スキャン自体が失敗した理由の自由文。画面は表示せず、errorCode と errorPath から説明を作る
            （specs/023-english-i18n/contracts/error-api.md §3）
        errorCode:
          $ref: "#/components/schemas/ScanErrorCode"
        errorPath:
          type: string
          description: >-
            errorCode の理由が特定の場所に結び付くときの、その絶対パス（メディアフォルダ、またはその下の
            読めなかった場所。翻訳しない利用者のデータ）。それ以外は省略される

    ScanStatus:
      type: string
      description: >-
        利用者に見せる取り込みの状態。上から順に最初に当てはまるものになる。failed は走査そのものの失敗、
        finding は走査が対象をまだ数え終えていない、running は走査中か済んでいない対象がある、
        partial は失敗の問題がある、done はそれ以外（specs/024-import-progress/contracts/scan-api.md §2）
      enum: [finding, running, done, partial, failed]

    ScanActivity:
      type: object
      description: >-
        取り込み中の今の処理（specs/024-import-progress/contracts/scan-api.md §2）。複数が同時に動くときは
        最後に始まったもの。何も動いていなければ Scan から省く。利用者の言葉は SPA が kind から組み立てる
      required: [kind, fileName]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/ScanActivityKind"
        fileName:
          type: string
          description: 処理しているファイルの名前（翻訳しない利用者のデータ）
        folder:
          $ref: "#/components/schemas/VideoFolder"
        videoId:
          type: integer
          format: int64
          description: 登録された動画なら、その id

    ScanActivityKind:
      type: string
      description: >-
        今の処理が何をしているか。registering は走査がファイルを一覧へ登録している、probe は動画の情報を
        読んでいる、thumbnail・seekThumbnail・preview はそれぞれの生成物を作っている、fingerprint は
        同じ動画の別バージョンを探すための映像の指紋を作っている（specs/030-video-versions/research.md R-6）
      enum: [registering, probe, thumbnail, seekThumbnail, preview, fingerprint]

    ScanVideos:
      type: object
      description: 取り込みの進み具合。status が finding のあいだは省く
      required: [total, settled]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
          description: 対象の本数。0 は変化が無かったことを示す
        settled:
          type: integer
          minimum: 0
          description: 済みの本数。total を超えない

    ScanIssueCounts:
      type: object
      description: >-
        直近の取り込みの問題の本数。GET /api/scans/current/issues のまとめた件を数える
        （specs/024-import-progress/contracts/scan-api.md §2）
      required: [failed, substituted, revision]
      additionalProperties: false
      properties:
        failed:
          type: integer
          minimum: 0
          description: 重さが失敗の件数。1以上なら取り込みは partial になる
        substituted:
          type: integer
          minimum: 0
          description: 重さが代用の件数
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            問題の一覧の中身が変わるたびに増える番号。本数が同じでも、種類や行が変われば増える。
            画面はこれが変わったら一覧を読み直す

    WatchHistoryFilter:
      type: string
      enum: [all, inProgress, watched]
      default: all
      description: |
        視聴履歴を動画のいまの視聴状態で絞る。all = 絞り込まない、inProgress = 視聴途中、watched = 視聴済み。
        視聴途中と視聴済みはライブラリの絞り込みと同じ規則で、動画の無い件は all にだけ出る

    WatchHistoryDates:
      type: object
      required: [days]
      additionalProperties: false
      properties:
        days:
          type: array
          description: 件のある日。新しい順で、合う件が無ければ空
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'

    WatchHistoryPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchHistoryEntry"
        nextCursor:
          type: string
          description: 続きがあるときだけ入る

    WatchHistoryEntry:
      type: object
      description: |
        視聴履歴の 1 件。再生 1 回につき 1 件。`video` はその内容の動画がいまライブラリにあって
        開けるときだけ入り、一覧と同じ形で `progress`・`tags`・`favorite` も入る。無ければ履歴から
        再生できない
      required: [id, playedAt, title]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: 削除の対象と、同じ時刻の並びに使う識別子
        playedAt:
          type: string
          format: date-time
          description: 視聴を始めた時刻（その視聴の最初の保存のサーバーの時刻）
        title:
          type: string
          description: 視聴を始めたときの題名の写し。空のこともある。`video` が無い件の表示に使う
        video:
          $ref: "#/components/schemas/Video"

    PlaylistStep:
      type: object
      description: 連続再生で開く動画 1 本と、それが属する項目
      required: [itemId, video]
      additionalProperties: false
      properties:
        itemId:
          type: integer
          format: int64
        video:
          $ref: "#/components/schemas/Video"

    PlaylistPlayback:
      type: object
      description: |
        プレイリストから再生しているときの位置と次の動画（specs/044-playlists/data-model.md
        「Playback order」）
      required: [playlist, itemId, position, count]
      additionalProperties: false
      properties:
        playlist:
          $ref: "#/components/schemas/PlaylistSummary"
        itemId:
          type: integer
          format: int64
          description: 再生している項目
        position:
          type: integer
          description: 見せる項目の中での 1 からの番号。今の項目が見せない項目なら 0
        count:
          type: integer
          description: 見せる項目の数
        next:
          $ref: "#/components/schemas/PlaylistStep"
        previousItem:
          $ref: "#/components/schemas/PlaylistStep"
        nextItem:
          $ref: "#/components/schemas/PlaylistStep"

    ScanIssuePage:
      type: object
      required: [scanId, items]
      additionalProperties: false
      properties:
        scanId:
          type: integer
          format: int64
          description: どの取り込みの一覧か。Scan.id と違えば、画面は読み直す
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanIssue"
        nextCursor:
          type: string
          description: 続きがあるときだけ入る

    ScanIssue:
      type: object
      description: 直近の取り込みの問題の、動画（未登録ならファイル）ごとの1件
      required: [severity, kinds, fileName, folder]
      additionalProperties: false
      properties:
        severity:
          type: string
          description: まとめた件の重さ。失敗の種類を1つでも含めば failed
          enum: [failed, substituted]
        kinds:
          type: array
          minItems: 1
          description: 起きた出来事の種類。重い順
          items:
            $ref: "#/components/schemas/ScanIssueKind"
        fileName:
          type: string
          description: ファイル名（翻訳しない利用者のデータ）
        folder:
          $ref: "#/components/schemas/VideoFolder"
        videoId:
          type: integer
          format: int64
          description: 登録された動画のときだけ入る。画面は /videos/{id} へ移れる

    ScanIssueKind:
      type: string
      description: >-
        取り込みの問題の種類（specs/024-import-progress/data-model.md §3）。unreadable・
        changed_during_import・register_failed は走査で、*_failed は準備の仕事がやり直しの上限まで
        失敗したもの（以上は失敗）。thumbnail_first_frame・seek_thumbnail_full_decode は代用
      enum:
        - unreadable
        - changed_during_import
        - register_failed
        - probe_failed
        - thumbnail_failed
        - seek_thumbnail_failed
        - preview_failed
        - fingerprint_failed
        - thumbnail_first_frame
        - seek_thumbnail_full_decode

    ProbeErrorCode:
      type: string
      description: >-
        解析の失敗理由のコード。probeState = failed でコードが保存されている動画だけで返し、
        ゲストの応答では省く（specs/023-english-i18n/data-model.md §1）。ここが正本で、Go の定数は
        生成物である（task generate）。
      enum:
        - file_unavailable
        - probe_unavailable
        - probe_failed
        - invalid_metadata
        - internal

    ScanErrorCode:
      type: string
      description: >-
        スキャン自体の失敗理由のコード。state = failed でコードが保存されているときだけ返す
        （specs/023-english-i18n/data-model.md §2）。ここが正本で、Go の定数は生成物である
        （task generate）。
      enum:
        - media_folder_unreadable
        - media_folder_not_directory
        - location_unreadable
        - interrupted
        - internal

    VideoChanged:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: 状態が変わった動画の識別子

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            機械可読なエラー種別。ここが正本で、Go の定数は生成物である
            （task generate）。新しい種別はまずここへ足す。
          enum:
            - not_found
            - invalid_request
            - internal
            - forbidden
            - conflict
            - invalid_media_directory
            - unsupported_media_directory
            - media_folder_not_found
            - overlapping_media_directories
            - scan_in_progress
            - media_folders_not_configured
            - directory_unavailable
            - probe_not_failed
            - open_unavailable
            - file_missing
            - tag_not_found
            - tag_name_taken
            - tag_merge_required
            - tag_not_tentative
            - unauthenticated
            - invalid_credentials
            - login_throttled
            - account_already_configured
            - provider_failed
        message:
          type: string
          description: >-
            英語の説明。画面は code と reason から表示し、この文は API 利用者と未知のコードに
            対するフォールバックである（specs/023-english-i18n/contracts/error-api.md §0）
        reason:
          $ref: "#/components/schemas/ErrorReason"
        limit:
          type: integer
          description: >-
            reason の上限値。契約の表で limit を返す reason のときだけ入る
            （specs/023-english-i18n/contracts/error-api.md §1）
        field:
          type: string
          description: >-
            reason が指すプロパティの経路。JSON のプロパティ名を . でつなぎ、一覧の位置を [] で書く
            （aliases[0].language・externalIds[1]・parentId）。work_info_*・person_not_found・
            organization_not_found・external_id_taken のときだけ入る
            （specs/047-video-work-info/contracts/screen-api.md「Added reason values and field」）
        tagName:
          type: string
          description: >-
            競合の相手になったタグの元の名前（翻訳しない利用者のデータ）。tag_name_taken と
            tag_merge_required のときだけ入る（specs/023-english-i18n/contracts/error-api.md §1）
    ErrorReason:
      type: string
      description: >-
        同じ code の中で状況を区別する下位の理由。契約の表の状況だけで返し、それ以外の応答には
        入らない（specs/023-english-i18n/contracts/error-api.md §1）。ここが正本で、Go の定数は
        生成物である（task generate）。
      enum:
        - name_is_tag
        - name_is_synonym
        - username_length
        - password_length
        - tag_name_empty
        - tag_name_control_characters
        - tag_name_too_long
        - merge_same_tag
        - search_too_long
        - too_many_tag_filters
        - too_many_videos
        - too_many_tags
        - guest_filter_not_allowed
        - invalid_cursor
        - invalid_folder_path
        - relative_directory_path
        - video_not_found
        - folder_not_found
        - no_scan
        - directory_not_found
        - file_unavailable
        - media_folders_changed
        - group_target_not_found
        - group_cycle
        - probe_info_missing
        - seek_preview_generating
        - transcode_unavailable
        - cross_origin
        - open_not_local
        - encoder_unavailable
        - api_token_name_empty
        - api_token_name_control_characters
        - api_token_name_too_long
        - subtitle_unavailable
        - display_name_control_characters
        - display_name_too_long
        - duration_unknown
        - thumbnail_position_out_of_range
        - thumbnail_frame_unavailable
        - too_few_videos
        - representative_not_selected
        - not_bundled
        - listen_failed
        - auto_tagging_off
        - comfyui_url_invalid
        - comfyui_api_key_missing
        - thumbnail_edit_not_found
        - thumbnail_edit_not_ready
        - thumbnail_edit_mask_invalid
        - thumbnail_edit_reference_invalid
        - thumbnail_edit_no_result
        - thumbnail_image_invalid
        - thumbnail_upload_too_large
        - thumbnail_upload_invalid
        - content_changed
        - unreachable
        - unauthorized
        - insufficient_credits
        - missing_models
        - workflow_rejected
        - run_failed
        - no_output
        - timed_out
        - work_info_control_characters
        - work_info_too_long
        - work_info_too_many
        - work_info_invalid_date
        - work_info_invalid_url
        - work_info_invalid_language
        - work_info_duplicate
        - work_info_empty
        - undo_conflict
        - undo_expired
        - person_not_found
        - organization_not_found
        - organization_parent_cycle
        - merge_same_person
        - merge_same_organization
        - external_id_taken
