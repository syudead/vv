# vv の API 契約。このファイルが唯一の真実であり、Go（oapi-codegen）と
# TypeScript（openapi-typescript）の双方をここから生成する。
# 生成物（internal/httpapi/gen/、web/src/api/gen/）は手編集しない。
# 型を変えるときはこのファイルを直し、task generate を実行すること。
openapi: 3.1.0

info:
  title: MDM API
  version: 0.3.0
  summary: セルフホストの動画管理システム API
  description: |
    取り込み（スキャン）・一覧・再生・題名検索までを公開する。
    認証は掛けていない（Phase 3 の範囲）。信頼できるネットワークの内側で使う前提。

servers:
  - url: /
    description: アプリケーション自身が配信する

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 稼働状態とビルド情報を返す
      description: |
        認証を必要としない。外形監視とコンテナのヘルスチェックから参照される。
        データベースへ疎通できない場合も応答自体は返し、`status` で区別する。
      responses:
        "200":
          description: 稼働中。依存する保存層にも疎通できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 起動はしているが保存層に疎通できていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/videos:
    get:
      operationId: listVideos
      summary: 動画の一覧を返す
      description: |
        カーソル方式でページングする。`query` を与えると題名の部分一致で絞り込む。
        `total` は絞り込み後の総件数で、ページングとは独立に返る。
      parameters:
        - name: query
          in: query
          description: 題名の部分一致。1文字から指定できる
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/{id}:
    get:
      operationId: getVideo
      summary: 動画1件の詳細を返す
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/related:
    get:
      operationId: getRelatedVideos
      summary: 関連動画を返す
      description: |
        代表の所在と同じディレクトリ直下の動画を、ファイル名の自然順でこの動画より
        後のもの、前のものの順に並べ、足りない分を追加日時の差が小さい順（差が同じなら
        id の大きい方が先）で補う。最大20件で、この動画自身は含めない。同じフォルダの
        順序は全順序で、自然順が同じならファイル名のバイト順、それも同じなら id の
        小さい方を先にする。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 関連動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedVideos"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/probe:
    post:
      operationId: reprobeVideo
      summary: 読み取りに失敗した動画を読み取り直す
      description: |
        `probeState = failed` の動画だけを受け付ける。1つの取引の中で読み取りの状態を
        pending に戻し、読み取りのジョブを積む。サムネイルが完成していないとき、または
        シーク用プレビューの置き場が無いときはサムネイルのジョブも積み、失敗した
        一覧用プレビューの状態も pending に戻す。要求の本文は無い。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: 読み取りを積み直した。更新後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: probeState が failed でない（probe_not_failed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/open:
    post:
      operationId: openVideoFile
      summary: 代表の所在をサーバーの PC の既定アプリで開く
      description: |
        要求の本文は無く、パスも受け取らない。子プロセスを起動した時点で 204 を返す。
        判定は 404 → 409 open_unavailable → 403 → 409 file_missing → 500 の順に行う。
        要求元（RemoteAddr）がループバックで、Host がループバックの名前
        （localhost・127.0.0.1・[::1]）のときだけ受け付ける。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: 既定アプリを起動した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 既定アプリを起動できない環境（open_unavailable）か、ファイルが無い（file_missing）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 子プロセスを起動できなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/stream:
    get:
      operationId: streamVideo
      summary: 動画本体を配信する
      description: |
        `Range` 要求に対応し、`206 Partial Content` と `Content-Range` を返す。
        詳細は [http-routes.md](./http-routes.md) を参照。再生できない形式
        （`playable = false`）でもファイルはそのまま配信する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 指定された範囲
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/preview:
    get:
      operationId: getVideoPreview
      summary: 生成済み hover preview を配信する
      description: |
        保存済みの preview MP4 だけを Range 対応で配信する。元動画の stream や
        live transcode へ fallback しない。`v` が current content key と一致する
        ときだけ immutable cache を許可する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した current content key
          schema:
            type: string
      responses:
        "200":
          description: preview MP4 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: preview MP4 の指定範囲
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/transcode.mp4:
    get:
      operationId: transcodeVideo
      summary: 動画をMP4へライブ変換して配信する
      description: |
        指定位置からfragmented MP4を生成し、保存せずレスポンスへ直送する。
        Rangeは使わず、シークはstartMsを変えた新しいrequestで行う。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: startMs
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: fragmented MP4 stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 変換processを開始できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      summary: サムネイル画像を返す
      description: |
        `v` は内容由来の識別子で、画像が変われば URL も変わる。長期キャッシュを
        前提にしてよい（[http-routes.md](./http-routes.md)）。未生成の場合は 404。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した URL に含まれる版
          schema:
            type: string
      responses:
        "200":
          description: 画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: 動画が存在しないか、サムネイルが未生成

  /api/videos/{id}/seek-thumbnail:
    get:
      operationId: getVideoSeekThumbnail
      summary: 指定時刻のシークプレビュー画像を返す
      description: |
        元動画の論理時刻から1秒以内のJPEGを要求時に生成する。画像は保存しない。
        `v` は内容由来の識別子で、空でない場合だけ長期キャッシュを許可する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: positionMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: v
          in: query
          description: 一覧・詳細が返したURLに含まれる内容由来の版
          schema:
            type: string
      responses:
        "200":
          description: 指定時刻に対応する画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 画像生成processを開始または完了できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/progress:
    put:
      operationId: putVideoProgress
      summary: 再生位置を記録する
      description: |
        視聴済みの判定はサーバー側で行う。クライアントは位置だけを送る。
        記録は動画の内容に紐づくため、ファイルを移動・改名しても引き継がれる。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: 記録後の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans:
    post:
      operationId: startScan
      summary: 取り込みを開始する
      description: |
        すでに実行中の場合は、新しく始めずに実行中のスキャンを返す。
        応答は即座に返り、取り込みは背後で進む。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: 開始した、または実行中のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: メディアフォルダが未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/media-folders:
    get:
      operationId: listMediaFolders
      summary: 登録済みメディアフォルダを返す
      responses:
        "200":
          description: id昇順のメディアフォルダ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaFolder"
    post:
      operationId: createMediaFolder
      summary: メディアフォルダを1件追加する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaFolderRequest"
      responses:
        "201":
          description: 作成したメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/media-folders/{id}:
    put:
      operationId: updateMediaFolder
      summary: メディアフォルダ1件のpathを変更する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaFolderRequest"
      responses:
        "200":
          description: 更新後のメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMediaFolder
      summary: メディアフォルダを1件削除する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: 削除した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/directories:
    get:
      operationId: listDirectories
      summary: フォルダ選択用の直下ディレクトリを返す
      parameters:
        - name: path
          in: query
          description: 列挙する絶対path。省略時はnavigation rootを返す
          schema:
            type: string
      responses:
        "200":
          description: directory一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders:
    get:
      operationId: listRootFolders
      summary: フォルダ画面の最上位（登録済みメディアフォルダ）を返す
      description: |
        フォルダは保存せず、取り込み済みの所在のパスから導く。登録済みの
        メディアフォルダは、動画が無くても含む。並びは名前の自然順。
      responses:
        "200":
          description: 登録済みメディアフォルダの集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolderListing"

  /api/folders/{rootId}:
    get:
      operationId: getFolder
      summary: フォルダ1件と、その直下の子フォルダを返す
      description: |
        フォルダは登録済みメディアフォルダの id と、そこからの `/` 区切りの相対パスで
        指す。子フォルダは直下だけを名前の自然順で返す。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "200":
          description: フォルダと直下の子フォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders/{rootId}/videos:
    get:
      operationId: listFolderVideos
      summary: フォルダ直下の動画を返す
      description: |
        孫以降のフォルダにある動画は含めない。ページングと並び順は
        `listVideos` と同じ。`title` と `sizeBytes` はそのフォルダにある所在のもので、
        同じ動画の所在が同じフォルダに2つ以上あっても1件だけ返す。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: 直下の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: スキャンの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: 一度もスキャンしていない

components:
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      description: 動画の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    MediaFolderId:
      name: id
      in: path
      required: true
      description: メディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderRootId:
      name: rootId
      in: path
      required: true
      description: フォルダが属する登録済みメディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderPath:
      name: path
      in: query
      description: |
        登録済みメディアフォルダからの `/` 区切りの相対パス。省略時と空文字は
        登録フォルダそのもの。空の段・先頭や末尾の `/`・`.`・`..` は受け付けない
      schema:
        type: string

  responses:
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 要求の形式が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: same-originでない操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態と競合する操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok = 保存層まで疎通、degraded = プロセスのみ生存
        version:
          type: string
          description: リリース名。ビルド時に指定されなければ dev
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: ビルド元のコミット。取得できない場合は省略される
        builtAt:
          type: string
          format: date-time
          description: ビルド時刻。取得できない場合は省略される

    MediaFolder:
      type: object
      required: [id, path, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMediaFolderRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1

    UpdateMediaFolderRequest:
      type: object
      required: [path, version]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1

    DirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string

    DirectoryListing:
      type: object
      required: [parentPath, directories]
      additionalProperties: false
      properties:
        currentPath:
          type: string
        parentPath:
          type: [string, "null"]
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    VideoSort:
      type: string
      enum: [addedDesc, titleAsc]
      default: addedDesc
      description: addedDesc = 追加が新しい順、titleAsc = 題名順

    VideoPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
          description: 絞り込み後の総件数
        nextCursor:
          type: string
          description: 次のページの取得に渡す。これ以上無い場合は省略される

    FolderPreview:
      type: object
      required: [videoId, thumbnailUrl]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
        thumbnailUrl:
          type: string
          description: Video.thumbnailUrl と同じ版付き URL

    FolderSummary:
      type: object
      required: [rootId, path, name, rootPath, videoCount, folderCount, previews]
      additionalProperties: false
      properties:
        rootId:
          type: integer
          format: int64
        path:
          type: string
          description: 登録フォルダからの `/` 区切りの相対パス。登録フォルダ自身は空文字
        name:
          type: string
          description: 表示名。相対パスの最後の段、登録フォルダ自身は絶対パスの最後の段
        rootPath:
          type: string
          description: 登録フォルダの絶対パス
        videoCount:
          type: integer
          description: 直下の動画の件数
        folderCount:
          type: integer
          description: 直下の子フォルダの件数
        previews:
          type: array
          maxItems: 4
          description: 直下の動画のうちサムネイル生成済みのもの。所在のパスの昇順で最大4件
          items:
            $ref: "#/components/schemas/FolderPreview"

    FolderListing:
      type: object
      required: [folder, folders]
      additionalProperties: false
      properties:
        folder:
          $ref: "#/components/schemas/FolderSummary"
        folders:
          type: array
          description: 直下の子フォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    RootFolderListing:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        folders:
          type: array
          description: 登録済みメディアフォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    Video:
      type: object
      required: [id, title, sizeBytes, addedAt, playable, probeState, thumbnailState, previewState]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 拡張子を除いたファイル名
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: 尺。解析前・取得不能の場合は省略される
        width:
          type: integer
        height:
          type: integer
        container:
          type: string
          examples: [mp4, webm, mkv]
        videoCodec:
          type: string
          examples: [h264, vp9]
        audioCodec:
          type: string
          examples: [aac, opus]
        playable:
          type: boolean
          description: ブラウザでそのまま再生できると判定されたか
        unplayableReason:
          type: string
          enum: [container, video_codec, audio_codec]
          description: playable = false の理由。判定前は省略される
        probeState:
          type: string
          enum: [pending, done, failed]
        probeError:
          type: string
          description: probeState = failed のときの理由
        thumbnailState:
          type: string
          enum: [pending, done, failed]
        previewState:
          type: string
          enum: [pending, done, failed]
        thumbnailUrl:
          type: string
          description: thumbnailState = done のときだけ入る
        previewUrl:
          type: string
          description: previewState = done かつ保存済み asset が配信可能なときだけ入る版付き URL
        seekThumbnailUrl:
          type: string
          description: probeState = done かつ正のdurationMsを持つときだけ入る版付き基底URL
        progress:
          $ref: "#/components/schemas/Progress"
        location:
          $ref: "#/components/schemas/VideoLocation"
        seekThumbnailState:
          type: string
          enum: [pending, done, failed]
          description: |
            シーク用プレビューの状態。GET /api/videos/{id} の応答にだけ入り、
            seekThumbnailUrl と同じ条件のときだけ入る。done = 置き場がある、
            pending = 置き場が無く thumbnailState = pending かサムネイルのジョブが
            queued・running、failed = それ以外

    VideoLocation:
      type: object
      required: [path, openable]
      additionalProperties: false
      description: 代表の所在。GET /api/videos/{id} の応答にだけ入る
      properties:
        path:
          type: string
          description: 代表の所在の絶対パス。サーバーから見たパスで、コンテナ内ならコンテナ内のパス
        openable:
          type: boolean
          description: |
            要求元がループバックで、Host がループバックの名前で、サーバーが既定アプリを
            起動できる環境のとき true

    RelatedVideos:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Video"
        nextId:
          type: integer
          format: int64
          description: 同じディレクトリで自然順の次の動画。無ければ省く

    ProgressUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0

    Progress:
      type: object
      required: [positionMs, completed, updatedAt]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      required: [id, state, total, completed, failed]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [running, done, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        total:
          type: integer
          description: 変更なしを除いた取り込み対象ファイル数。対象の確定前は0
        completed:
          type: integer
          description: 取り込み処理に成功した対象ファイル数
        failed:
          type: integer
        error:
          type: string
          description: スキャン自体が失敗した理由

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            機械可読なエラー種別。ここが正本で、Go の定数は生成物である
            （task generate）。新しい種別はまずここへ足す。
          enum:
            - not_found
            - invalid_request
            - internal
            - forbidden
            - conflict
            - invalid_media_directory
            - unsupported_media_directory
            - media_folder_not_found
            - overlapping_media_directories
            - scan_in_progress
            - media_folders_not_configured
            - directory_unavailable
            - probe_not_failed
            - open_unavailable
            - file_missing
        message:
          type: string
          description: 人が読むための説明。利用者にそのまま提示してよい文言にする
