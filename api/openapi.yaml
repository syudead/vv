        - display_name_too_long
        - duration_unknown
        - thumbnail_position_out_of_range
        - thumbnail_frame_unavailable
        - too_few_videos
        - representative_not_selected
        - not_bundled
        - listen_failed
        - auto_tagging_off
        - version_judging_off
        - version_not_rejudgeable
        - comfyui_url_invalid
        - comfyui_api_key_missing
        - thumbnail_edit_not_found
        - thumbnail_edit_not_ready
        - thumbnail_edit_mask_invalid
        - thumbnail_edit_reference_invalid
        - thumbnail_edit_no_result
        - thumbnail_image_invalid
        - thumbnail_upload_too_large
        - thumbnail_upload_invalid
        - content_changed
        - unreachable
        - unauthorized
        - insufficient_credits
        - missing_models
        - workflow_rejected
        - run_failed
        - no_output
        - timed_out
        - work_info_control_characters
        - work_info_too_long
        - work_info_too_many
        - work_info_invalid_date
        - work_info_invalid_url
        - work_info_invalid_language
        - work_info_duplicate
        - work_info_empty
        - work_info_out_of_range
        - undo_conflict
        - undo_expired
        - person_not_found
        - organization_not_found
        - organization_parent_cycle
        - merge_same_person
        - person_image_not_found
        - person_image_invalid
        - person_image_too_large
        - merge_same_organization
        - external_id_taken
        - blocked_address
        - network_error
        - memory_exceeded
        - output_too_large
        - tag_kind_not_found
        - tag_kind_name_taken
        - face_candidate_not_found
        - face_appearance_not_found
        - face_recognition_off
        - face_recognition_unsupported
        - invalid_title
        - not_virtual
        - virtual_video
        - description_too_long
        - too_many_urls
        - connection
        - not_ollama
        - model
        - timeout
        - ollama_not_saved
        - generation_model_unset
        - peer_unknown
        - peer_not_allowed
        - invalid_address
        - invalid_code
        - already_paired
        - peer_unreachable
        - mixed_nodes
        - provisional_person_remote
        - tag_name_taken
        - person_name_taken
