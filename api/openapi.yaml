        - relative_directory_path
        - video_not_found
        - folder_not_found
        - no_scan
        - directory_not_found
        - file_unavailable
        - media_folders_changed
        - group_target_not_found
        - group_cycle
        - probe_info_missing
        - seek_preview_generating
        - transcode_unavailable
        - cross_origin
        - open_not_local
        - encoder_unavailable
        - api_token_name_empty
        - api_token_name_control_characters
        - api_token_name_too_long
        - subtitle_unavailable
