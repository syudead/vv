# vv の API 契約。このファイルが唯一の真実であり、Go（oapi-codegen）と
# TypeScript（openapi-typescript）の双方をここから生成する。
# 生成物（internal/httpapi/gen/、web/src/api/gen/）は手編集しない。
# 型を変えるときはこのファイルを直し、task generate を実行すること。
openapi: 3.1.0

info:
  title: MDM API
  version: 0.3.0
  summary: セルフホストの動画管理システム API
  description: |
    取り込み（スキャン）・一覧・再生・題名検索までを公開する。

    すべての要求は「誰でも」「ゲストも」「所有者だけ」のどれかに入る
    （specs/016-single-account-auth/contracts/auth-api.md §1）。各操作の `security` がその
    分類で、`[]` は誰でも、`[{sessionCookie: []}, {}]` はゲストも、既定（全体の
    `security`）は所有者だけである。所有者だけの要求に有効なセッションが無いとき、
    アカウントが未設定のときの誰でも以外の要求には、`401` `unauthenticated` を返す。
    `/api/*` のすべての応答は、その要求を所有者とゲストのどちらとして処理したかを
    `X-VV-Audience: owner` か `guest` で示す。

    「ゲストも」の要求は、有効なセッションが無ければゲストとして処理する
    （specs/016-single-account-auth/contracts/guest-api.md）。ゲストの応答には公開の動画だけが
    現れ、`Video.location`・`Video.progress`・`Video.probeError`・`FolderSummary.rootPath` を
    省き、`Video.tags` を空の配列にする。公開でない動画・公開の動画を含まないフォルダは、
    存在しないものと同じ `404` にする。

servers:
  - url: /
    description: アプリケーション自身が配信する

# 既定は所有者だけ（ログインしたセッションが要る）。誰でも・ゲストもの操作は
# 操作ごとの security で上書きする。定義の無い経路も所有者だけとして扱う。
security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      summary: 稼働状態とビルド情報を返す
      description: |
        認証を必要としない。外形監視とコンテナのヘルスチェックから参照される。
        データベースへ疎通できない場合も応答自体は返し、`status` で区別する。
      responses:
        "200":
          description: 稼働中。依存する保存層にも疎通できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 起動はしているが保存層に疎通できていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/setup:
    post:
      operationId: setupAccount
      summary: 未設定のサーバーで最初のアカウントを作り、そのままログインする
      description: |
        本文は 8 KiB まで。成立したら `Set-Cookie` でセッションを渡す（contracts/auth-api.md §2・§7）。
        同時の初回設定は1つだけが成立し、他は 409 になる。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: 初回設定が成立し、ログインした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: アカウントは既に設定されている（account_already_configured）。何も書かない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: login
      summary: ユーザー名とパスワードでログインする
      description: |
        本文は 8 KiB まで。ユーザー名かパスワードの誤り、空欄、上限超え、アカウントの
        未設定は、どれも同じ 401 `invalid_credentials` になる（contracts/auth-api.md §3）。
        `next` は戻り先の候補で、安全でなければ `/` にして `redirectTo` に返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログインした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: ユーザー名またはパスワードが違う（invalid_credentials）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: 試行が多すぎる（login_throttled）。照合していない
          headers:
            Retry-After:
              description: 再び試せるまでの秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: 見る人の状態を返す
      description: |
        未設定なら Cookie によらず `setupRequired` を返す。ユーザー名は返さない。
        `next` を付けると、`owner` のときだけ確かめた戻り先を `redirectTo` に返す
        （contracts/auth-api.md §4）。
      security: []
      parameters:
        - name: next
          in: query
          description: ログイン済みのときに戻る先の候補
          schema:
            type: string
      responses:
        "200":
          description: 見る人の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /api/auth/logout:
    post:
      operationId: logout
      summary: ログアウトする
      description: |
        要求に付いていたセッションの Cookie（`__Host-vv_session` と `vv_session` の両方）を
        見て、有効なセッションを消し、両方の Cookie を `Max-Age=0` で消す。本文は無い
        （contracts/auth-api.md §4）。
      security: []
      responses:
        "204":
          description: ログアウトした
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/videos:
    get:
      operationId: listVideos
      security:
        - sessionCookie: []
        - {}
      summary: 動画の一覧を返す
      description: |
        カーソル方式でページングする。対象は登録メディアフォルダの下に所在がある動画で、
        `query`・`watch`・`playable` で絞り込む。`total` は絞り込み後の総件数で、
        ページングとは独立に返る。

        ゲストでは公開の動画だけを対象にし、`query` はタグの名前とシノニムに照合しない。
        所有者のデータに依る条件（`watch` が `all` 以外、`sort` が `playedAsc`・
        `playedDesc`、`tag`）は `400` `invalid_request` にする（guest-api.md §3）。
      parameters:
        - name: query
          in: query
          description: |
            検索語。空白で区切った語をすべて含む動画に絞る（AND）。`"…"` で囲んだ部分は
            空白を含めて1語（フレーズ）、先頭の `-` はその語を含まない（除外）、単独の
            `OR` と `|` は前後の語のどちらかを含む（和）。全角・半角、大文字・小文字、
            ひらがな・カタカナなどの表記の揺れは吸収する。照合するのは題名と、登録
            フォルダより下の相対パスで、いずれも部分一致。先頭から 16 語までを使い、
            語が残らなければ絞り込まない。書き方の誤りは返さない
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          description: 視聴状態で絞る。all は絞り込まない
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          description: true ならブラウザでそのまま再生できる（playable = true の）動画だけにする
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: |
            `sort=random` の並びを決める値。同じ値ならページをまたいでも同じ並びになる。
            ほかの並び順では無視する
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: |
            タグの id ごとに1つ（`tag=3&tag=8`）。すべて持つ動画だけにする（AND）。
            最大16個、17個以上は400。存在しない id は条件から落とし、応答の
            missingTagIds に返す（specs/014-video-tags/contracts/tags-api.md §5）
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/ids:
    get:
      operationId: listVideoIds
      summary: 絞り込みに合う動画の全件の id を返す
      description: |
        `listVideos` と同じ条件（`query`・`watch`・`playable`・`tag`）に合う全件の
        id を、ページングせずに返す。並びは決めない。「すべて選択」用
        （specs/014-video-tags/contracts/tags-api.md §5）。`/api/videos/{id}` とは
        Go の ServeMux の字面の段の優先で区別される。
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          schema:
            type: boolean
            default: false
        - name: tag
          in: query
          description: 最大16個、17個以上は400。存在しない id は無視して missingTagIds に返す
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: 条件に合う全件の id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoIdsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/{id}:
    get:
      operationId: getVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画1件の詳細を返す
      description: |
        ゲストでは公開の動画だけを返し、公開でない動画は存在しない動画と同じ 404 にする
        （guest-api.md §2）。この扱いは関連動画・配信・プレビュー・ライブ変換・
        サムネイル・シークプレビューでも同じである。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/related:
    get:
      operationId: getRelatedVideos
      security:
        - sessionCookie: []
        - {}
      summary: 関連動画を返す
      description: |
        代表の所在と同じディレクトリ直下の動画を、ファイル名の自然順でこの動画より
        後のもの、前のものの順に並べ、足りない分を追加日時の差が小さい順（差が同じなら
        id の大きい方が先）で補う。最大20件で、この動画自身は含めない。同じフォルダの
        順序は全順序で、自然順が同じならファイル名のバイト順、それも同じなら id の
        小さい方を先にする。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 関連動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedVideos"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/probe:
    post:
      operationId: reprobeVideo
      summary: 読み取りに失敗した動画を読み取り直す
      description: |
        `probeState = failed` の動画だけを受け付ける。1つの取引の中で読み取りの状態を
        pending に戻し、読み取りのジョブを積む。サムネイルが完成していないとき、または
        シーク用プレビューの置き場が無いときはサムネイルのジョブも積み、失敗した
        一覧用プレビューの状態も pending に戻す。要求の本文は無い。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: 読み取りを積み直した。更新後の動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: probeState が failed でない（probe_not_failed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/open:
    post:
      operationId: openVideoFile
      summary: 代表の所在をサーバーの PC の既定アプリで開く
      description: |
        要求の本文は無く、パスも受け取らない。子プロセスを起動した時点で 204 を返す。
        判定は 404 → 409 open_unavailable → 403 → 409 file_missing → 500 の順に行う。
        要求元（RemoteAddr）がループバックで、Host がループバックの名前
        （localhost・127.0.0.1・[::1]）のときだけ受け付ける。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: 既定アプリを起動した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 既定アプリを起動できない環境（open_unavailable）か、ファイルが無い（file_missing）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 子プロセスを起動できなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/stream:
    get:
      operationId: streamVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画本体を配信する
      description: |
        `Range` 要求に対応し、`206 Partial Content` と `Content-Range` を返す。
        詳細は [http-routes.md](./http-routes.md) を参照。再生できない形式
        （`playable = false`）でもファイルはそのまま配信する。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 指定された範囲
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/preview:
    get:
      operationId: getVideoPreview
      security:
        - sessionCookie: []
        - {}
      summary: 生成済み hover preview を配信する
      description: |
        保存済みの preview MP4 だけを Range 対応で配信する。元動画の stream や
        live transcode へ fallback しない。成功の応答は `Cache-Control: private, no-cache`
        と `ETag` を持ち、`If-None-Match` が一致すれば `304` を返す（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した current content key
          schema:
            type: string
      responses:
        "200":
          description: preview MP4 全体
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: preview MP4 の指定範囲
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 範囲指定が不正

  /api/videos/{id}/transcode.mp4:
    get:
      operationId: transcodeVideo
      security:
        - sessionCookie: []
        - {}
      summary: 動画をMP4へライブ変換して配信する
      description: |
        指定位置からfragmented MP4を生成し、保存せずレスポンスへ直送する。
        Rangeは使わず、シークはstartMsを変えた新しいrequestで行う。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: startMs
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: fragmented MP4 stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 変換processを開始できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: サムネイル画像を返す
      description: |
        `v` は内容由来の識別子で、画像が変われば URL も変わる。未生成の場合は 404。
        成功の応答は `Cache-Control: private, no-cache` と `ETag` を持ち、`If-None-Match` が
        一致すれば `304` を返す。見るたびにサーバーへ確かめさせ、ログアウト後や非公開に
        した後にキャッシュから出続けないようにする（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: 一覧・詳細が返した URL に含まれる版
          schema:
            type: string
      responses:
        "200":
          description: 画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "404":
          description: 動画が存在しないか、サムネイルが未生成

  /api/videos/{id}/seek-thumbnail:
    get:
      operationId: getVideoSeekThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: 指定時刻のシークプレビュー画像を返す
      description: |
        元動画の論理時刻から1秒以内のJPEGを要求時に生成する。画像は保存しない。
        `v` は内容由来の識別子である。成功の応答は `Cache-Control: private, no-cache` と
        `ETag` を持ち、`If-None-Match` が一致すれば `304` を返す（guest-api.md §5）。
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: positionMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: v
          in: query
          description: 一覧・詳細が返したURLに含まれる内容由来の版
          schema:
            type: string
      responses:
        "200":
          description: 指定時刻に対応する画像
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` が `ETag` と一致した"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 画像生成processを開始または完了できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/progress:
    put:
      operationId: putVideoProgress
      summary: 再生位置を記録する
      description: |
        視聴済みの判定はサーバー側で行う。クライアントは位置だけを送る。
        記録は動画の内容に紐づくため、ファイルを移動・改名しても引き継がれる。
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: 記録後の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans:
    post:
      operationId: startScan
      summary: 取り込みを開始する
      description: |
        すでに実行中の場合は、新しく始めずに実行中のスキャンを返す。
        応答は即座に返り、取り込みは背後で進む。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: 開始した、または実行中のスキャン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: メディアフォルダが未設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/media-folders:
    get:
      operationId: listMediaFolders
      summary: 登録済みメディアフォルダを返す
      responses:
        "200":
          description: id昇順のメディアフォルダ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaFolder"
    post:
      operationId: createMediaFolder
      summary: メディアフォルダを1件追加する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaFolderRequest"
      responses:
        "201":
          description: 作成したメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/media-folders/{id}:
    put:
      operationId: updateMediaFolder
      summary: メディアフォルダ1件のpathを変更する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaFolderRequest"
      responses:
        "200":
          description: 更新後のメディアフォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMediaFolder
      summary: メディアフォルダを1件削除する
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: 削除した
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags:
    get:
      operationId: listTags
      summary: タグを一覧する
      description: 名前の自然順で返す。本数0のタグも含む（contracts/tags-api.md §3）。
      responses:
        "200":
          description: タグの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
    post:
      operationId: createTag
      summary: タグを1件作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: 作成したタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags/{id}:
    patch:
      operationId: renameTag
      summary: タグの元の名前を書き換える
      description: 今と同じ名前を送ったときは何も変えずに今の状態を返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: 更新後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTag
      summary: タグを1件削除する
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: 削除した
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/merge:
    post:
      operationId: mergeTag
      summary: sourceIdのタグをidのタグへ統合する
      description: |
        統合元（sourceId）の付与・元の名前・シノニムはすべて統合先（id）へ移り、
        統合元は一覧から消える。sourceIdがidと同じときは400を返す
        （contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTagRequest"
      responses:
        "200":
          description: 統合後の統合先タグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/synonyms:
    post:
      operationId: addTagSynonym
      summary: 名前をidのタグのシノニムにする
      description: |
        既にidのシノニムなら何も変えずに200を返す。idの元の名前なら409
        tag_name_takenを返す。別のタグSの元の名前で、mergeTagIdがSのidと
        一致するときはSをidへ統合し、一致しない（無い場合を含む）ときは409
        tag_merge_requiredを返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagSynonymRequest"
      responses:
        "200":
          description: 更新後のタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeTagSynonym
      summary: nameをidのタグのシノニムから外す
      description: nameがidのシノニムでなければ何も変えずに204を返す（contracts/tags-api.md §3）。
      parameters:
        - $ref: "#/components/parameters/TagId"
        - name: name
          in: query
          required: true
          description: 外すシノニムの名前
          schema:
            type: string
      responses:
        "204":
          description: 外した、またはもともとシノニムでなかった
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/video-tags:
    post:
      operationId: updateVideoTags
      summary: 動画へタグを付ける・外す
      description: |
        `videoIds` へ `action`（`add`・`remove`）の `tag` を適用する。再生画面の1本も
        選択バーの複数本も、同じこの経路を使う。`remove` は `tag.id` での指定だけを
        受け付け、`name` を送ると400になる。`tag: { name }` の付与は、名前を
        シノニムを含めて引き、無ければ作る。`videoIds` は1件以上20000件以下で、
        重複は1つとして数える。処理は1つのトランザクションで、全部に反映するか
        1つも反映しない（specs/014-video-tags/contracts/tags-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: 適用結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: 指定したタグがもう無い（tag_not_found）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/video-tags/summary:
    post:
      operationId: summarizeVideoTags
      summary: 選んだ動画に付いたタグの要約を返す
      description: |
        `total` は `videoIds` のうちいまライブラリにある動画の数、`count` はそのうち
        そのタグが付いている数。`count < total` のタグが一部にだけ付いている。
        `items` は1本以上に付いているタグだけで、名前の自然順
        （specs/014-video-tags/contracts/tags-api.md §4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsSummaryRequest"
      responses:
        "200":
          description: タグの要約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/video-visibility:
    put:
      operationId: updateVideoVisibility
      summary: 動画の公開・非公開を切り替える
      description: |
        `videoIds` の公開フラグを `public` にそろえる。詳細画面の1本も選択バーの複数本も、
        同じこの経路を使う。`videoIds` は1件以上20000件以下で、重複は1つとして数える。
        既に同じ状態の動画も誤りにせず `applied` に数える。処理は1つのトランザクションで、
        全部に反映するか1つも反映しない。非公開にした動画をゲストとして配信中の応答は
        打ち切る（specs/016-single-account-auth/contracts/guest-api.md §4・§6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoVisibilityRequest"
      responses:
        "200":
          description: 適用結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVisibilityResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/directories:
    get:
      operationId: listDirectories
      summary: フォルダ選択用の直下ディレクトリを返す
      parameters:
        - name: path
          in: query
          description: 列挙する絶対path。省略時はnavigation rootを返す
          schema:
            type: string
      responses:
        "200":
          description: directory一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders:
    get:
      operationId: listRootFolders
      security:
        - sessionCookie: []
        - {}
      summary: フォルダ画面の最上位（登録済みメディアフォルダ）を返す
      description: |
        フォルダは保存せず、取り込み済みの所在のパスから導く。登録済みの
        メディアフォルダは、動画が無くても含む。並びは名前の自然順。

        ゲストでは公開の動画だけを数え、公開の動画の所在を1つも含まない登録フォルダは
        省く（guest-api.md §2）。
      responses:
        "200":
          description: 登録済みメディアフォルダの集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolderListing"

  /api/folders/{rootId}:
    get:
      operationId: getFolder
      security:
        - sessionCookie: []
        - {}
      summary: フォルダ1件と、その直下の子フォルダを返す
      description: |
        フォルダは登録済みメディアフォルダの id と、そこからの `/` 区切りの相対パスで
        指す。子フォルダは直下だけを名前の自然順で返す。

        ゲストでは公開の動画だけを数え、公開の動画の所在を1つも含まないフォルダは、
        登録フォルダそのもの（`path` を省いた要求）を含めて 404 にする（guest-api.md §2）。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "200":
          description: フォルダと直下の子フォルダ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders/{rootId}/videos:
    get:
      operationId: listFolderVideos
      security:
        - sessionCookie: []
        - {}
      summary: フォルダの動画を返す
      description: |
        `scope` で対象の所在の範囲を選ぶ。`direct`（既定）はフォルダ直下だけで、
        孫以降のフォルダにある動画は含めない。`subtree` はフォルダとその配下すべてを
        対象にする。`scope` と `query` は独立していて、照合はその範囲にある所在だけを
        対象にする。ページング・絞り込み・並び順は `listVideos` と同じ。`title` と
        `sizeBytes` はその範囲にある所在（検索語があれば当たった所在）のうちパスの
        昇順で最初のもので、同じ動画の所在が範囲に2つ以上あっても1件だけ返す。
        フォルダが無いときは `scope`・`query` に関係なく 404 を返す。

        ゲストでは公開の動画だけを対象にし、公開の動画の所在を1つも含まないフォルダは
        登録フォルダそのもの（`path` を省いた要求）を含めて 404 にする。`watch` が `all`
        以外と、`sort` が `playedAsc`・`playedDesc` は `400` `invalid_request` にする
        （guest-api.md §2・§3）。
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
        - name: scope
          in: query
          description: direct = フォルダ直下の所在だけ、subtree = フォルダとその配下すべての所在
          schema:
            $ref: "#/components/schemas/FolderScope"
        - name: query
          in: query
          description: |
            検索語。空白で区切った語をすべて含む動画に絞る（AND）。`"…"` で囲んだ部分は
            空白を含めて1語（フレーズ）、先頭の `-` はその語を含まない（除外）、単独の
            `OR` と `|` は前後の語のどちらかを含む（和）。全角・半角、大文字・小文字、
            ひらがな・カタカナなどの表記の揺れは吸収する。照合するのは題名と、登録
            フォルダより下の相対パスで、いずれも部分一致。先頭から 16 語までを使い、
            語が残らなければ絞り込まない。書き方の誤りは返さない
          schema:
            type: string
            maxLength: 100
        - name: watch
          in: query
          description: 視聴状態で絞る。all は絞り込まない
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: playable
          in: query
          description: true ならブラウザでそのまま再生できる（playable = true の）動画だけにする
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: 並び順
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: |
            `sort=random` の並びを決める値。同じ値ならページをまたいでも同じ並びになる。
            ほかの並び順では無視する
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: 前回の応答が返した `nextCursor`。中身は不透明で、解釈しない
          schema:
            type: string
        - name: limit
          in: query
          description: 1ページの件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: フォルダの動画
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans/current:
    get:
      operationId: getCurrentScan
      summary: 直近のスキャンの状態を返す
      description: 実行中のものがあればそれを、無ければ最後に終わったものを返す。
      responses:
        "200":
          description: スキャンの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: 一度もスキャンしていない

  /api/processing:
    get:
      operationId: getProcessing
      summary: 取り込みの段階ごとに残っている仕事の数を返す
      description: |
        解析・サムネイル・プレビューの各段階で、待ち行列にあるものと処理中のものを数える。
        登録済みメディアフォルダの外にしか所在が無い動画の仕事は、処理されないので含めない。
        すべて 0 なら、取り込んだ動画の準備は終わっている。
      responses:
        "200":
          description: 段階ごとの残り
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Processing"

  /api/events:
    get:
      operationId: streamEvents
      summary: 取り込みと動画の変化を Server-Sent Events で送る
      description: |
        接続中は、変化が起きたときだけ次のイベントを送る。一定間隔の送信はしない
        （接続を保つためのコメント行を除く）。

        - `scan`: 直近のスキャンが変わった。data は `Scan`（まだ一度も無ければ送らない）
        - `processing`: 段階ごとの残りが変わった。data は `Processing`
        - `video`: 動画の状態が変わった。data は `VideoChanged`。最新の内容は
          `GET /api/videos/{id}` で取る

        接続の直後に `processing` と `scan`（あれば）を1回ずつ送るので、つなぎ直した
        クライアントは切れていた間の変化を取り戻せる。`video` は切れていた間の分を
        送り直さない。`processing` と `scan` を同時に送るときは `processing` を先に送る。
        スキャンの完了を受けた時点で、準備の残りが手元にそろっているようにするためである。
      responses:
        "200":
          description: イベントの流れ
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vv_session
      description: |
        ログインで発行するセッション ID。HTTPS では `__Host-vv_session`、HTTP では
        `vv_session` の名前で送る（contracts/auth-api.md §7）。OpenAPI の apiKey は名前を
        1つしか書けないので、ここには HTTP の名前を書く。

  headers:
    SessionSetCookie:
      description: |
        セッションの Cookie。HTTPS では
        `__Host-vv_session=<ID>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=<期限までの秒>`、
        HTTP では `vv_session=<ID>; HttpOnly; SameSite=Strict; Path=/; Max-Age=<期限までの秒>`
      schema:
        type: string

  parameters:
    VideoId:
      name: id
      in: path
      required: true
      description: 動画の識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    MediaFolderId:
      name: id
      in: path
      required: true
      description: メディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    TagId:
      name: id
      in: path
      required: true
      description: タグの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderRootId:
      name: rootId
      in: path
      required: true
      description: フォルダが属する登録済みメディアフォルダの識別子
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderPath:
      name: path
      in: query
      description: |
        登録済みメディアフォルダからの `/` 区切りの相対パス。省略時と空文字は
        登録フォルダそのもの。空の段・先頭や末尾の `/`・`.`・`..` は受け付けない
      schema:
        type: string

  responses:
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 要求の形式が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: same-originでない操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態と競合する操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SetupRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          description: 1〜128 文字。制御文字を含まず、先頭と末尾に空白を置かない
        password:
          type: string
          description: 1〜1024 バイト

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
        next:
          type: string
          description: ログイン後に戻る先の候補。省略か安全でなければ `/`

    AuthRedirect:
      type: object
      required: [redirectTo]
      additionalProperties: false
      properties:
        redirectTo:
          type: string
          description: 画面が遷移する先。サーバーが確かめた同じオリジンのパス

    AuthSession:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [owner, guest, setupRequired]
          description: owner = ログイン済み、guest = 未ログイン、setupRequired = アカウントが未設定
        redirectTo:
          type: string
          description: "`next` を付けて呼び、state が owner のときだけ返す戻り先"

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok = 保存層まで疎通、degraded = プロセスのみ生存
        version:
          type: string
          description: リリース名。ビルド時に指定されなければ dev
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: ビルド元のコミット。取得できない場合は省略される
        builtAt:
          type: string
          format: date-time
          description: ビルド時刻。取得できない場合は省略される

    MediaFolder:
      type: object
      required: [id, path, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMediaFolderRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1

    UpdateMediaFolderRequest:
      type: object
      required: [path, version]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1

    TagRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: 動画に付いたタグ1件。nameは常に元の名前（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Tag:
      type: object
      required: [id, name, synonyms, videoCount]
      additionalProperties: false
      description: 管理画面と候補に出す1件（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: 名前の自然順
          items:
            type: string
        videoCount:
          type: integer
          description: いまライブラリにある動画の本数

    TagList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    RenameTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    MergeTagRequest:
      type: object
      required: [sourceId]
      additionalProperties: false
      properties:
        sourceId:
          type: integer
          format: int64

    AddTagSynonymRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        mergeTagId:
          type: integer
          format: int64
          description: 統合を承諾したタグのid（contracts/tags-api.md §3）

    TagInput:
      type: object
      additionalProperties: false
      description: |
        付与で使うタグの指定。id と name のちょうど一方を持つ。両方あるか、どちらも
        無いときは invalid_request（400）にする（contracts/tags-api.md §1）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    VideoTagsAction:
      type: string
      enum: [add, remove]

    VideoTagsRequest:
      type: object
      required: [videoIds, action, tag]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        action:
          $ref: "#/components/schemas/VideoTagsAction"
        tag:
          $ref: "#/components/schemas/TagInput"

    VideoTagsResponse:
      type: object
      required: [tag, applied]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        applied:
          type: integer
          description: videoIds のうちいまライブラリにある動画の数

    VideoVisibilityRequest:
      type: object
      required: [videoIds, public]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        public:
          type: boolean
          description: true で公開、false で非公開にする

    VideoVisibilityResponse:
      type: object
      required: [applied]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: videoIds のうちいまライブラリにある動画の数（既に同じ状態だったものを含む）

    VideoTagsSummaryRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    VideoTagsSummaryItem:
      type: object
      required: [tag, count]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        count:
          type: integer

    VideoTagsSummary:
      type: object
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          type: integer
        items:
          type: array
          description: 1本以上に付いているタグだけ。名前の自然順
          items:
            $ref: "#/components/schemas/VideoTagsSummaryItem"

    VideoIdsResponse:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
        missingTagIds:
          type: array
          description: tag のうち存在しなかった id。1つも無ければ省略される
          items:
            type: integer
            format: int64

    DirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string

    DirectoryListing:
      type: object
      required: [parentPath, directories]
      additionalProperties: false
      properties:
        currentPath:
          type: string
        parentPath:
          type: [string, "null"]
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    VideoSort:
      type: string
      enum:
        - addedAsc
        - addedDesc
        - modifiedAsc
        - modifiedDesc
        - titleAsc
        - titleDesc
        - durationAsc
        - durationDesc
        - sizeAsc
        - sizeDesc
        - playedAsc
        - playedDesc
        - random
      default: addedDesc
      description: |
        並び順。末尾の Asc は昇順、Desc は降順。added = 追加日、modified = 一覧に出す
        所在の更新日時、title = 一覧に出す所在の題名（自然順）、duration = 長さ（無い
        動画は向きに関係なく末尾）、size = 一覧に出す所在のファイルサイズ、played =
        最後に再生した時刻（記録の無い動画は向きに関係なく末尾）、random = `seed` と
        動画の識別子から作る順。値が同じなら識別子で決着させる

    WatchFilter:
      type: string
      enum: [all, unwatched, inProgress, watched]
      default: all
      description: |
        視聴状態の絞り込み。all = 絞り込まない、unwatched = 未視聴、inProgress = 視聴途中、
        watched = 視聴済み

    FolderScope:
      type: string
      enum: [direct, subtree]
      default: direct
      description: direct = フォルダ直下の所在だけ、subtree = フォルダとその配下すべての所在

    VideoPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
          description: |
            検索語・watch・playable・範囲（listFolderVideos の scope）をすべて適用した
            全件の数。ページングとは独立に返る
        nextCursor:
          type: string
          description: 次のページの取得に渡す。これ以上無い場合は省略される
        missingTagIds:
          type: array
          description: |
            tag のうち存在しなかった id。1つも無ければ省略される
            （specs/014-video-tags/contracts/tags-api.md §5）
          items:
            type: integer
            format: int64

    FolderPreview:
      type: object
      required: [videoId, thumbnailUrl]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
        thumbnailUrl:
          type: string
          description: Video.thumbnailUrl と同じ版付き URL
        previewUrl:
          type: string
          description: Video.previewUrl と同じ版付き URL。一覧用プレビューが生成済みで、保存済み asset が配信可能なときだけ入る

    FolderSummary:
      type: object
      required: [rootId, path, name, videoCount, folderCount, previews]
      additionalProperties: false
      properties:
        rootId:
          type: integer
          format: int64
        path:
          type: string
          description: 登録フォルダからの `/` 区切りの相対パス。登録フォルダ自身は空文字
        name:
          type: string
          description: 表示名。相対パスの最後の段、登録フォルダ自身は絶対パスの最後の段
        rootPath:
          type: string
          description: |
            登録フォルダの絶対パス。ゲストの応答では省く（guest-api.md §1）。画面は
            登録フォルダの表示名を、これが無ければ `name` から作る
        videoCount:
          type: integer
          description: 直下の動画の件数（ゲストでは公開の動画だけを数える）
        folderCount:
          type: integer
          description: 直下の子フォルダの件数
        previews:
          type: array
          maxItems: 4
          description: 直下の動画のうちサムネイル生成済みのもの。所在のパスの昇順で最大4件
          items:
            $ref: "#/components/schemas/FolderPreview"

    FolderListing:
      type: object
      required: [folder, folders]
      additionalProperties: false
      properties:
        folder:
          $ref: "#/components/schemas/FolderSummary"
        folders:
          type: array
          description: 直下の子フォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    RootFolderListing:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        folders:
          type: array
          description: 登録済みメディアフォルダ。名前の自然順
          items:
            $ref: "#/components/schemas/FolderSummary"

    Video:
      type: object
      description: |
        ゲストの応答では `location`・`progress`・`probeError` を省き、`tags` を空の配列にする
        （specs/016-single-account-auth/contracts/guest-api.md §1）。
      required:
        [id, title, sizeBytes, addedAt, playable, probeState, thumbnailState, previewState, tags, public]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 拡張子を除いたファイル名
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: 尺。解析前・取得不能の場合は省略される
        width:
          type: integer
          description: 表示される向きの幅（回転の印を反映済み）
        height:
          type: integer
          description: 表示される向きの高さ（回転の印を反映済み）
        displayAspectRatio:
          type: number
          format: double
          description: |
            表示される横÷縦の比率。回転と画素の縦横比（SAR）を反映し、縦長の動画は 1 未満になる。
            解析前・取得不能の場合は省略される
        container:
          type: string
          examples: [mp4, webm, mkv]
        videoCodec:
          type: string
          examples: [h264, vp9]
        audioCodec:
          type: string
          examples: [aac, opus]
        playable:
          type: boolean
          description: ブラウザでそのまま再生できると判定されたか
        unplayableReason:
          type: string
          enum: [container, video_codec, audio_codec]
          description: playable = false の理由。判定前は省略される
        probeState:
          type: string
          enum: [pending, done, failed]
        probeError:
          type: string
          description: probeState = failed のときの理由。ゲストの応答では省く（ファイルの絶対パスを含みうる）
        thumbnailState:
          type: string
          enum: [pending, done, failed]
        previewState:
          type: string
          enum: [pending, done, failed]
        thumbnailUrl:
          type: string
          description: thumbnailState = done のときだけ入る
        previewUrl:
          type: string
          description: previewState = done かつ保存済み asset が配信可能なときだけ入る版付き URL。done なのに asset が無ければ、サーバーは作り直しを積み、previewState を pending として返す
        seekThumbnailUrl:
          type: string
          description: probeState = done かつ正のdurationMsを持つときだけ入る版付き基底URL
        progress:
          $ref: "#/components/schemas/Progress"
        location:
          $ref: "#/components/schemas/VideoLocation"
        folder:
          $ref: "#/components/schemas/VideoFolder"
        tags:
          type: array
          description: |
            付いたタグ。名前の自然順（domain.CompareNatural、同じなら id）。タグが
            無ければ空配列（contracts/tags-api.md §1）。ゲストの応答では常に空配列
          items:
            $ref: "#/components/schemas/TagRef"
        public:
          type: boolean
          description: |
            公開の動画か。公開の動画はログインしていない人にも見える
            （specs/016-single-account-auth/contracts/guest-api.md §4）
        seekThumbnailState:
          type: string
          enum: [pending, done, failed]
          description: |
            シーク用プレビューの状態。GET /api/videos/{id} の応答にだけ入り、
            seekThumbnailUrl と同じ条件のときだけ入る。done = 置き場がある、
            pending = 置き場が無く thumbnailState = pending かサムネイルのジョブが
            queued・running、failed = それ以外

    VideoFolder:
      type: object
      required: [rootId, path]
      additionalProperties: false
      description: |
        一覧に出す所在が置かれたフォルダ。一覧（listVideos・listFolderVideos）の応答に
        だけ入り、GET /api/videos/{id} には入らない
      properties:
        rootId:
          type: integer
          format: int64
          description: 所在を含む登録メディアフォルダの識別子
        path:
          type: string
          description: 登録フォルダからその所在が置かれたフォルダまでの `/` 区切りの相対パス。直下は空文字

    VideoLocation:
      type: object
      required: [path, openable]
      additionalProperties: false
      description: 代表の所在。GET /api/videos/{id} の応答にだけ入る
      properties:
        path:
          type: string
          description: 代表の所在の絶対パス。サーバーから見たパスで、コンテナ内ならコンテナ内のパス
        openable:
          type: boolean
          description: |
            要求元がループバックで、Host がループバックの名前で、サーバーが既定アプリを
            起動できる環境のとき true

    RelatedVideos:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Video"
        nextId:
          type: integer
          format: int64
          description: 同じディレクトリで自然順の次の動画。無ければ省く
        prevId:
          type: integer
          format: int64
          description: |
            同じディレクトリで自然順の前の動画。無ければ省く。items に入るとは限らない

    ProgressUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0

    Progress:
      type: object
      required: [positionMs, completed, updatedAt]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      required: [id, state, total, completed, failed]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [running, done, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        total:
          type: integer
          description: 変更なしを除いた取り込み対象ファイル数。対象の確定前は0
        completed:
          type: integer
          description: 取り込み処理に成功した対象ファイル数
        failed:
          type: integer
        error:
          type: string
          description: スキャン自体が失敗した理由

    Processing:
      type: object
      required: [probe, thumbnail, preview]
      additionalProperties: false
      properties:
        probe:
          type: integer
          description: 解析（ffprobe）の残り
        thumbnail:
          type: integer
          description: サムネイルとシーク用プレビューの残り
        preview:
          type: integer
          description: 一覧用プレビューの残り

    VideoChanged:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: 状態が変わった動画の識別子

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            機械可読なエラー種別。ここが正本で、Go の定数は生成物である
            （task generate）。新しい種別はまずここへ足す。
          enum:
            - not_found
            - invalid_request
            - internal
            - forbidden
            - conflict
            - invalid_media_directory
            - unsupported_media_directory
            - media_folder_not_found
            - overlapping_media_directories
            - scan_in_progress
            - media_folders_not_configured
            - directory_unavailable
            - probe_not_failed
            - open_unavailable
            - file_missing
            - tag_not_found
            - tag_name_taken
            - tag_merge_required
            - unauthenticated
            - invalid_credentials
            - login_throttled
            - account_already_configured
        message:
          type: string
          description: 人が読むための説明。利用者にそのまま提示してよい文言にする
