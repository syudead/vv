# Source of truth for Go and TypeScript API types; regenerate with task generate.
openapi: 3.1.0

info:
  title: MDM API
  version: 0.3.0
  summary: "Self-hosted video management API"
  description: "Provides import, listing, playback and title search. Operation security classifies requests as public (`[]`), guest-accessible (`[{sessionCookie: []}, {}]`) or owner-only (the global default). Owner-only requests without a valid session, and non-public requests before account setup, return `401 unauthenticated`. Every `/api/*` response identifies the effective audience in `X-VV-Audience: owner` or `guest`. Guest-accessible requests without a session use guest visibility: only public videos are returned, `Video.location`, `Video.progress`, `Video.probeError` and `FolderSummary.rootPath` are omitted, and `Video.tags` is empty. Private videos and folders without public videos return the same `404` as missing resources. The paired node (the peer) calls `/api/*` with `Authorization: VV-Peer <secret>` instead of a session: the audience is the owner, or the guest with `X-VV-Peer-Audience: guest` (any other value returns `400 invalid_request`); such a request sets no cookie and skips the same-origin check. An unknown or revoked secret returns `401 unauthenticated` with `peer_unknown`, and an operation outside the peer's allowed set returns `403 forbidden` with `peer_not_allowed`. A video id at or above 2^40 (1099511627776) names the peer's video, whose own id is the value minus 2^40: reads, media and the display-name, thumbnail-position and thumbnail-image edits under `/api/videos/{id}` are forwarded to the peer for the request's audience, with the ids and URLs of the answer in the same form, without `progress` and `favorite`, and with the peer's error status, `code` and `reason`; a work-info fetch and its apply run on this node with its plugin and write on the peer (docs/design-docs/peer-library.md); the other operations under that path return `404 not_found`. A group id at or above 2^40 names the peer's group in the same way: its page, items and edits under `/api/groups/{id}` are forwarded, with item ids, `trail` ids and the ids of the answer in that form; favorites and play history stay with each node, so its page and items list nothing with `favorite=true` and list in `addedDesc` order for a played or favorited sort. A forwarded request while the peer is not connected, or whose connection fails, returns `503 service_unavailable` with `peer_unreachable`. While paired, renaming, merging or deleting a tag, person or organization (`renameTag`, `deleteTag`, `mergeTag`, `batchTags` with delete, and the name in `updatePerson` and `updateOrganization`, their deletes and merges) is applied on the peer by name first and then here: a new name either node holds returns `409` with `tag_name_taken` (code `tag_name_taken` as without a peer), or code `conflict` with `person_name_taken` or `organization_name_taken`; while the peer is not connected, or when its connection fails, the change returns `409 conflict` with `peer_unreachable` and changes nothing. A failure here after the peer applied the change is returned as is, and repeating the request completes it. Synonyms, aliases, tag kinds, the tentative state, rejected names, images and links stay with each node."
servers:
  - url: /
    description: "Served by the application"

# Operations override the owner-only default for public or guest access.
security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      summary: "Return health and build information"
      description: "Unauthenticated endpoint for monitoring and container health checks. Database connectivity failures are reported through `status`."
      responses:
        "200":
          description: "Running with storage connectivity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: "Running without storage connectivity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/setup:
    post:
      operationId: setupAccount
      summary: "Create the first account and sign in"
      description: "Accepts at most 8 KiB. Returns the session through `Set-Cookie`. Only one concurrent setup succeeds; others return 409."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: "Account created and signed in"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Account already configured (`account_already_configured`); nothing written"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: login
      summary: "Sign in with a username and password"
      description: "Accepts at most 8 KiB. Incorrect, empty or oversized credentials and an unconfigured account all return `401 invalid_credentials`. Validates `next` and returns it as `redirectTo`, falling back to `/` when unsafe."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Signed in"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedirect"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "Incorrect username or password (`invalid_credentials`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: "Too many attempts (`login_throttled`); credentials were not checked"
          headers:
            Retry-After:
              description: "Seconds until another attempt is allowed"
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: "Return the viewer state"
      description: "Returns `setupRequired` before account setup regardless of cookies; never returns the username. For an owner, validates optional `next` and returns it as `redirectTo`."
      security: []
      parameters:
        - name: next
          in: query
          description: "Candidate redirect after sign-in"
          schema:
            type: string
      responses:
        "200":
          description: "Viewer state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /api/auth/logout:
    post:
      operationId: logout
      summary: "Sign out"
      description: "Revokes valid sessions from both `__Host-vv_session` and `vv_session` cookies and clears both with `Max-Age=0`. No request body."
      security: []
      responses:
        "204":
          description: "Signed out"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/account:
    get:
      operationId: getAccount
      summary: "Return the owner account"
      description: "Never returns the password or its hash."
      responses:
        "200":
          description: "Owner account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    put:
      operationId: updateAccount
      summary: "Change the username or password"
      description: "Accepts at most 8 KiB. Requires the current password and shares the login throttle. A change signs out every session, keeps API tokens valid, and returns a new session for this browser through `Set-Cookie`. Other in-flight requests stop at their next session recheck."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: "Credentials changed and signed in again"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: "Incorrect current password (`invalid_credentials`), or a cross-origin request (`forbidden`); nothing written"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many attempts (`login_throttled`); the current password was not checked"
          headers:
            Retry-After:
              description: "Seconds until another attempt is allowed"
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos:
    get:
      operationId: listVideos
      security:
        - sessionCookie: []
        - {}
      summary: "List videos"
      description: "Cursor-paginated videos with locations under registered media folders, filtered by `query`, tags, people, organizations, tag kind and favorites. `total` counts all matches independently of pagination. Version bundles appear only as their effective representative: the chosen representative when visible, otherwise the visible version with the lowest ID. A query matching any version location selects the representative; tags and sorting use bundle values. Other versions remain available through `GET /api/videos/{id}`. Guests see public videos only and queries exclude tag names and synonyms. Owner-dependent filters (played/favorited sorting, `tag`, `favorite=true`, `person`, `organization`, `tagKind`) return `400 invalid_request`, except to the paired VVMDM's credential, which filters for its guests the videos it adds to a smart folder. See docs/design-docs/catalog-organization.md."
      parameters:
        - name: query
          in: query
          description: "Search terms are ANDed. Double quotes form phrases, a leading `-` excludes a term, and standalone `OR` or `|` joins alternatives. Matching normalizes width, case and hiragana/katakana, and checks title and relative paths below registered folders by substring. Uses at most 16 terms; no remaining terms means no filter. Syntax errors are not reported."
          schema:
            type: string
            maxLength: 100
        - name: favorite
          in: query
          description: "Restrict to favorited items using each item's own favorite state, combined with other filters by AND"
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: "Seed for stable `sort=random` ordering across pages; ignored for other sorts"
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: "One parameter per tag ID (`tag=3&tag=8`), combined by AND. At most 16; more returns 400. Unknown IDs are removed from the filter and returned in `missingTagIds`."
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/PersonRoleFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
        - $ref: "#/components/parameters/TagKindFilter"
        - $ref: "#/components/parameters/MinDurationFilter"
        - $ref: "#/components/parameters/MaxDurationFilter"
        - $ref: "#/components/parameters/AddedFromFilter"
        - $ref: "#/components/parameters/AddedToFilter"
        - $ref: "#/components/parameters/WatchStateFilter"
        - $ref: "#/components/parameters/TagNameFilter"
        - $ref: "#/components/parameters/TagKindNameFilter"
        - $ref: "#/components/parameters/PersonNameFilter"
        - $ref: "#/components/parameters/OrganizationNameFilter"
        - name: kind
          in: query
          description: "Restrict to videos with a file (`file`) or virtual videos (`virtual`); `all` lists both."
          schema:
            type: string
            enum: [all, file, virtual]
            default: all
      responses:
        "200":
          description: "List"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/library:
    get:
      operationId: listLibrary
      security:
        - sessionCookie: []
        - {}
      summary: "List library items (videos and groups)"
      description: "Uses `listVideos` filters and collects matches into items. Query, tag, person, organization and tagKind filters apply to each video, which must satisfy all conditions. A group appears as one item when all members match; partial matches appear as individual videos, as do ungrouped videos. Without filters all members match. Group values aggregate all members. Without filters, the owner's smart folders come first by name in every sort and count toward `limit` and `total`; guests get none. Sorting uses item values for the rest. `total` counts matching cards; cursors follow `listVideos`. Favorites use each item's own state: a favorite video in a non-favorite group appears individually. Version bundles use their effective representative, and non-representative versions cannot be folder-group members. For guests, membership counts only public videos: groups with one become video items and groups with none are omitted. Owner-dependent filters (played/favorited sorting, `tag`, `favorite=true`, `person`, `organization`, `tagKind`) return `400 invalid_request`."
      parameters:
        - name: query
          in: query
          description: "Search terms are ANDed. Double quotes form phrases, a leading `-` excludes a term, and standalone `OR` or `|` joins alternatives. Matching normalizes width, case and hiragana/katakana, and checks title and relative paths below registered folders by substring. Uses at most 16 terms; no remaining terms means no filter. Syntax errors are not reported."
          schema:
            type: string
            maxLength: 100
        - name: favorite
          in: query
          description: "Restrict to favorited items using each item's own favorite state, combined with other filters by AND"
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: "Seed for stable `sort=random` ordering across pages; ignored for other sorts"
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: "One parameter per tag ID (`tag=3&tag=8`), combined by AND. At most 16; more returns 400. Unknown IDs are removed from the filter and returned in `missingTagIds`."
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
        - $ref: "#/components/parameters/TagKindFilter"
        - $ref: "#/components/parameters/MinDurationFilter"
        - $ref: "#/components/parameters/MaxDurationFilter"
        - $ref: "#/components/parameters/AddedFromFilter"
        - $ref: "#/components/parameters/AddedToFilter"
        - $ref: "#/components/parameters/WatchStateFilter"
        - $ref: "#/components/parameters/TagNameFilter"
        - $ref: "#/components/parameters/TagKindNameFilter"
        - $ref: "#/components/parameters/PersonNameFilter"
        - $ref: "#/components/parameters/OrganizationNameFilter"
      responses:
        "200":
          description: "Item list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/videos/{id}:
    get:
      operationId: getVideo
      security:
        - sessionCookie: []
        - {}
      summary: "Return video details"
      description: "Guests see public videos only; private videos return the same 404 as missing videos. The same rule applies to related videos, streaming, previews, live transcoding, thumbnails and seek previews."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
        - $ref: "#/components/parameters/VideoSmartFolderContext"
      responses:
        "200":
          description: "Details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteVideo
      summary: "Delete a virtual video"
      description: "Owner-only. Deletes a virtual video with its tags, favorite, public flag, playlist items and work information in one transaction. A missing video, including one already deleted or merged, returns 404 video_not_found; a contentVersion other than the video's returns 409 content_changed; a video with a file returns 409 not_virtual. Errors change nothing. Emits a video deletion event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: contentVersion
          in: query
          required: true
          description: "The contentVersion the screen read."
          schema:
            type: string
      responses:
        "204":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/virtual-videos:
    post:
      operationId: createVirtualVideo
      summary: "Create a virtual video"
      description: "Owner-only. Creates a video with no file from a title, a link or both. The title follows the display-name rules; without a url it must not be empty after trimming, and an empty or whitespace-only title returns 400 invalid_title. A url must be an http or https URL of at most 2048 characters, or 400 invalid_request with field url; the video then holds it as its link, takes it as its title when none is given, and starts a fetch by link that fills the empty fields after the response (linkFetch running). Returns the GET detail shape with virtual=true. Emits a library change after commit, and a video event when the fetch ends."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualVideoCreate"
      responses:
        "201":
          description: "Created video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/virtual-videos/{id}/merge:
    post:
      operationId: mergeVirtualVideo
      summary: "Merge a virtual video into a file video"
      description: "Owner-only. Moves the virtual video's user data to the file video's user key (its bundle key when bundled) and deletes the virtual video in one transaction. Tags, people, organizations and external ids are unioned; the video is a favorite when either was; playlist items move in place, keeping the file video's item where a playlist holds both; the file video keeps its title, thumbnail and public flag and its code and dates, which the virtual video's fill only when empty; descriptions join with a blank line, file video first; links append the virtual video's missing ones. A missing or hidden video returns 404 video_not_found; a version other than the screen read returns 409 content_changed; an id with a file returns 409 not_virtual; a videoId without a file returns 409 virtual_video; a combined description over 10,000 characters returns 409 description_too_long and more than 20 combined links 409 too_many_urls. Errors change nothing, and a merge cannot be undone. Returns the file video's GET detail shape with its work information. Emits a video deletion event for the virtual video after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualVideoMerge"
      responses:
        "200":
          description: "The file video after the merge"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/related:
    get:
      operationId: getRelatedVideos
      security:
        - sessionCookie: []
        - {}
      summary: "Return related videos"
      description: "Returns up to `limit` visible videos after `cursor`, ordered by similarity. Excludes this video, non-representative versions and members of its group. Scores combine matching fingerprint scenes (40), tags (30), title/filename words excluding digits (25), immediate directory (20) and added-time proximity (5); ties prefer newer additions, then higher IDs. See docs/design-docs/related-videos.md. Follow `nextCursor` without a total limit; resuming strictly after the returned position prevents duplicates during additions/deletions. Only the first request (without `cursor`) includes `nextId`, `prevId` and `group`. For grouped videos, the contextual group supplies playback order and a window of up to 100 members centered on this video. Read members outside that window with `listVideoGroupMembers`. On a paired node the list holds the visible videos of both nodes, a remote id also opens one, and the directory clue is 0 between nodes; while the peer cannot be reached its videos are left out."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
        - $ref: "#/components/parameters/VideoSmartFolderContext"
        - name: cursor
          in: query
          description: "Previous `nextCursor`; omit to start at the beginning"
          schema:
            type: string
        - name: limit
          in: query
          description: "Maximum results"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: "Related videos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedVideos"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/group-members:
    get:
      operationId: listVideoGroupMembers
      security:
        - sessionCookie: []
        - {}
      summary: "Return a range of group members"
      description: "Returns up to `limit` visible videos in contextual-group playback order, starting at zero-based `offset`. Selection and shape match the related-video group; guest offsets count public videos only. Returns 404 for an ungrouped video and empty items when offset is beyond the group. See docs/design-docs/catalog-organization.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoGroupContext"
        - $ref: "#/components/parameters/VideoSmartFolderContext"
        - name: offset
          in: query
          description: "Zero-based index of the first member"
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: "Maximum videos"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Group member range"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/probe:
    post:
      operationId: reprobeVideo
      summary: "Retry a failed video probe"
      description: "Accepts only `probeState=failed`. Atomically resets the probe to pending and queues it. Failed seek sprites and hover previews, and any unfinished representative thumbnail, return to pending. Thumbnail and seek jobs are queued only when reset; hover previews are queued after a successful probe. No request body."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: "Probe requeued; updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Probe state is not failed (`probe_not_failed`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/auto-tag:
    post:
      operationId: autoTagVideo
      summary: "Queue auto-tagging for a video"
      description: "Requeues even after a completed judgement. Does not queue an in-progress judgement (`queued=false`). No request body; see docs/design-docs/auto-tagging.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "202":
          description: "Whether a job was queued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTagVideoResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Auto-tagging is off (`auto_tagging_off`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/tags/{tagId}/confirm:
    post:
      operationId: confirmVideoTag
      summary: "Confirm an auto-assigned tag"
      description: "Converts an unconfirmed video tag (`VideoTag.unconfirmed`) to a normal assignment. No request body; see docs/design-docs/auto-tagging.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoTagId"
      responses:
        "204":
          description: "Confirmed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/tags/{tagId}/reject:
    post:
      operationId: rejectVideoTag
      summary: "Reject an auto-assigned tag"
      description: "Removes the tentative tag and prevents auto-tagging from assigning it to this video again. No request body; see docs/design-docs/auto-tagging.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/VideoTagId"
      responses:
        "204":
          description: "Rejected"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/open:
    post:
      operationId: openVideoFile
      summary: "Open the representative location in the server PC's default application"
      description: "Accepts no body or path; returns 204 once the child process starts. Validation order is 404, 409 open_unavailable, 403, 409 file_missing, then 500. Requires a loopback RemoteAddr and a loopback Host (localhost, 127.0.0.1 or [::1])."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: "Default application started"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Opening is unsupported (`open_unavailable`) or the file is missing (`file_missing`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Could not start the child process"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/stream:
    get:
      operationId: streamVideo
      security:
        - sessionCookie: []
        - {}
      summary: "Stream the video file"
      description: "Supports Range requests with `206 Partial Content` and `Content-Range`; see [http-routes.md](./http-routes.md). Files are served unchanged even when `playable=false`."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "Complete file"
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: "Requested range"
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: "Invalid range"

  /api/videos/{id}/preview:
    get:
      operationId: getVideoPreview
      security:
        - sessionCookie: []
        - {}
      summary: "Serve a generated hover preview"
      description: "Serves only the saved preview MP4 with Range support; never falls back to the source or live transcoding. Successful responses use `Cache-Control: private, no-cache` and `ETag`; matching `If-None-Match` returns 304."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: "Current content key from the list or detail response"
          schema:
            type: string
      responses:
        "200":
          description: "Complete preview MP4"
          headers:
            Accept-Ranges:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: "Requested preview MP4 range"
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` matches `ETag`"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: "Invalid range"

  /api/videos/{id}/transcode.mp4:
    get:
      operationId: transcodeVideo
      security:
        - sessionCookie: []
        - {}
      summary: "Stream live-transcoded MP4"
      description: "Generates fragmented MP4 from the requested position directly into the response without saving. Seeking starts a new request with a different `startMs`; Range is unsupported."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: startMs
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: attempt
          in: query
          required: false
          description: "Player-generated request identifier. When supplied, records the actual start for `getTranscodeStart`. Invalid format returns 400."
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - name: quality
          in: query
          required: false
          description: "Target short-edge resolution. Omit for original quality, copying video when possible. Supplying it forces encoding, downsizes the display's short edge and caps bitrate. Must be smaller than min(Video.width, Video.height); other values and videos without dimensions return 400."
          schema:
            type: string
            enum: [1080p, 720p, 480p, 360p]
      responses:
        "200":
          description: fragmented MP4 stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: "Could not start the transcoder"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/transcode-start:
    get:
      operationId: getTranscodeStart
      security:
        - sessionCookie: []
        - {}
      summary: "Return the actual transcode start"
      description: "Returns the source timestamp in milliseconds corresponding to output time zero for `transcodeVideo` with this `attempt`. Waits up to six seconds for a missing attempt or undecided start. Returns 404 if still unavailable or transcoding fails before its first output. Uses `Cache-Control: no-store`."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: attempt
          in: query
          required: true
          description: "Identifier supplied to `transcodeVideo`"
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: "Actual start position"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeStart"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/subtitles:
    get:
      operationId: listVideoSubtitles
      security:
        - sessionCookie: []
        - {}
      summary: "List sidecar subtitle files"
      description: "Reads the folder of the first accessible location in streamVideo order on every request. Returns <name>.srt, <name>.vtt, <name>.<label>.srt and <name>.<label>.vtt, unlabeled first then natural label order. For duplicate labels, prefers .vtt over .srt; excludes files over 4 MiB and does not read file contents. Returns an empty array when none exist or the directory is unreadable. Uses `Cache-Control: no-store`."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "Subtitle file list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrackList"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/subtitles/{file}:
    get:
      operationId: getVideoSubtitle
      security:
        - sessionCookie: []
        - {}
      summary: "Return a subtitle file as WebVTT"
      description: "Opens only a file exactly matching an entry from `listVideoSubtitles`. Detects encoding, converts to UTF-8 WebVTT and subtracts `offsetMs` from every cue. Missing, inaccessible, oversized or unreadable subtitles return 404 with reason `subtitle_unavailable`. Successful responses use `Cache-Control: private, no-cache` and `ETag`; matching `If-None-Match` returns 304."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: file
          in: path
          required: true
          description: "`file` returned by `listVideoSubtitles`"
          schema:
            type: string
        - name: offsetMs
          in: query
          description: "Source timestamp corresponding to playback time zero, in milliseconds; subtracted from cue times"
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: "UTF-8 WebVTT"
          content:
            text/vtt:
              schema:
                type: string
        "304":
          description: "`If-None-Match` matches `ETag`"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: "Return the thumbnail image"
      description: "Content-derived `v` changes the URL when the image changes; unavailable thumbnails return 404. Uses `Cache-Control: private, no-cache` and `ETag`; matching `If-None-Match` returns 304. Revalidation prevents cached images remaining visible after sign-out or visibility changes."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: "Version in the URL returned by list or detail"
          schema:
            type: string
        - name: size
          in: query
          description: "`large` returns the poster published with the thumbnail for display larger than a card, its long side up to 2048 px; without one it returns the 640 px image."
          schema:
            type: string
            enum: [large]
      responses:
        "200":
          description: "Image"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` matches `ETag`"
        "404":
          description: "Video missing or thumbnail not generated"

  /api/videos/{id}/seek-thumbnail:
    get:
      operationId: getVideoSeekThumbnail
      security:
        - sessionCookie: []
        - {}
      summary: "Return seek-sprite layout"
      description: "For position p ms, use frame `min(floor(p / intervalMs), frameCount - 1)`. Frame k appears on sheet `floor(k / (columns * rows))`, in row-major slot `k mod (columns * rows)`. `v` is content-derived. Successful responses use `Cache-Control: private, no-cache` and `ETag`; matching `If-None-Match` returns 304. Returns 409 when probing or sprite generation is incomplete, duration is unknown, or generation failed."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: v
          in: query
          description: "Content-derived version in the list/detail URL"
          schema:
            type: string
      responses:
        "200":
          description: "Sprite layout"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekThumbnailSprite"
        "304":
          description: "`If-None-Match` matches `ETag`"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: "Unreadable or invalid layout"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/seek-thumbnail/{sheet}:
    get:
      operationId: getVideoSeekThumbnailSheet
      security:
        - sessionCookie: []
        - {}
      summary: "Return a seek-sprite sheet"
      description: "Returns the JPEG identified by `sheets[sheet]`, with dimensions `columns * frameWidth` by `rows * frameHeight`. Out-of-range sheet indexes return 404. Uses `Cache-Control: private, no-cache` and `ETag`; matching `If-None-Match` returns 304."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: sheet
          in: path
          required: true
          description: "Zero-based sheet index"
          schema:
            type: integer
            minimum: 0
        - name: v
          in: query
          description: "Content-derived version from layout `sheets`"
          schema:
            type: string
      responses:
        "200":
          description: "Sheet image"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` matches `ETag`"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: "Image could not be read"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/videos/{id}/progress:
    put:
      operationId: putVideoProgress
      summary: "Save playback position"
      description: "The server determines watched state; clients send only the position. Records follow video content across moves and renames."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: "Saved state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/display-name:
    put:
      operationId: setVideoDisplayName
      summary: "Set or clear the video display name"
      description: "Owner-only. Trims surrounding whitespace; an empty name clears the override. Rejects control characters and names over 200 code points. Duplicate display names are allowed; concurrent edits are last-write-wins. Returns the same Video shape as GET details, including updated title, fileTitle and displayName. For a virtual video displayName sets its title: contentVersion is required, an empty displayName returns 400 invalid_title, a deleted or merged video returns 404 video_not_found and another contentVersion returns 409 content_changed. Emits a `video` event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayNameUpdate"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/work-info:
    put:
      operationId: setVideoWorkInfo
      summary: "Replace video work information"
      description: "Owner-only. Replaces saved work information; omitted, null or trimmed-empty fields clear their values, and `{}` clears all. People and organizations are referenced by ID. Returns the first invalid field with `field` and writes nothing. Returns Video with updated workInfo, omitted when empty. After a change commits, emits a video event for every video sharing the same user-data key."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoInput"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/details:
    put:
      operationId: setVideoDetails
      summary: "Save display name and work information atomically"
      description: "Owner-only. Applies display-name and work-info endpoint rules in one transaction, writing neither if either fails. Validates displayName first, then WorkInfo field order, returning only the first error. Error `field` is displayName or a location within workInfo. Returns the same Video shape as GET details. For a virtual video displayName sets its title: contentVersion is required, an empty displayName returns 400 invalid_title, a deleted or merged video returns 404 video_not_found and another contentVersion returns 409 content_changed. For the peer's video a person or organization may be given by name, which the peer creates when it lacks it."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoDetailsInput"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-position:
    put:
      operationId: setVideoThumbnailPosition
      summary: "Set or clear the representative thumbnail position"
      description: "Owner-only. Generates and publishes a thumbnail at positionMs, then saves the position; null restores automatic selection. Waits for generation and returns Video with thumbnailState=done, a new thumbnailUrl and the explicit position when set. Unknown duration returns 409 duration_unknown; a negative position or position at/after duration returns 400 thumbnail_position_out_of_range with duration in limit. Generation failure returns 409 thumbnail_frame_unavailable, preserving the old image and position; inaccessible locations return 404 file_unavailable. A virtual video, which has no frames, returns 409 virtual_video. Concurrent changes for one video serialize, leaving the last saved position. Clears any applied image atomically and emits a video event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailPositionUpdate"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-image:
    post:
      operationId: uploadThumbnailImage
      summary: "Use an uploaded image as the video thumbnail"
      description: "Owner-only. Accepts multipart `image` (PNG, JPEG or static WebP), up to 64 MiB and 120 million pixels, with 1 MiB additional multipart overhead. Fully decodes in memory and fits the video aspect ratio, 16:9 for a virtual video, using the generated-image application path. Waits for publication, returning Video with thumbnailImage=uploaded and a new thumbnailUrl; preserves the saved frame position. Oversized data or dimensions return 400 thumbnail_upload_too_large with limit. Unsupported, animated or unreadable images return 400 thumbnail_upload_invalid. Missing video returns 404 video_not_found; deletion, changed content or stale contentVersion since request start returns 409 content_changed; failed fitting returns 409 thumbnail_image_invalid. Errors write nothing. After upload completes, validation/application continues despite disconnect, with a five-minute limit. Emits a video event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadThumbnailImageRequest"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: revertThumbnailImage
      summary: "Remove an applied thumbnail image"
      description: "Owner-only; no body. Removes the applied image and regenerates from thumbnailPositionMs or the automatic frame. Regenerates and returns 200 even without an applied image. Returns Video after completion with no thumbnailImage and a new thumbnailUrl. Uses thumbnail-position endpoint errors: 409 thumbnail_frame_unavailable preserves the applied image and old file; inaccessible locations return 404 file_unavailable. For a virtual video, removes the uploaded image without opening a file and returns Video with no thumbnailUrl. Emits a video event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/frame:
    get:
      operationId: getVideoFrame
      summary: "Return a frame of the video"
      description: "Owner-only. Extracts positionMs as PNG with the long edge capped at 2048 px, never enlarged, for framing a person's face from a video; the page crops it and sends the result as the person's face. A position outside the video returns 400 thumbnail_position_out_of_range, an unreadable file 404 file_unavailable, and a position without a decodable frame 409 thumbnail_frame_unavailable."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: positionMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: "The frame"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-edits:
    post:
      operationId: startThumbnailEdit
      summary: "Start thumbnail editing from a frame or the current thumbnail"
      description: "Owner-only. For source=frame, extracts positionMs as PNG with the video's long edge capped at 2048 px. For source=thumbnail, uses the original applied image (long edge at most 2048 px), otherwise the explicit thumbnail frame or the automatic job position, falling back to the first frame. Returns a ready session with 201; it retains its starting image. Cancels any prior ComfyUI run for this video before closing its session. Missing/out-of-range frame position returns 400 thumbnail_position_out_of_range; other position/location errors follow the thumbnail-position endpoint. Needs no ComfyUI configuration, so the page can read the starting image to frame it; runs return 409 thumbnail_edit_not_ready without one. Unavailable frame or saved image returns 409 thumbnail_frame_unavailable. A virtual video returns 409 virtual_video. Sessions are memory-only and emit no events."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartThumbnailEditRequest"
      responses:
        "201":
          description: "Started session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/thumbnail-edits/image:
    post:
      operationId: startThumbnailEditFromImage
      summary: "Start thumbnail editing from an image the page sends"
      description: "Owner-only. Starts a session whose starting image is the sent PNG, JPEG or WebP of at most 20 MiB and 8192 × 8192 pixels, such as the framing a thumbnail preview drew; it needs no readable media file, and source is image. Otherwise behaves like startThumbnailEdit: a ready session with 201 that replaces any prior session for the video. An oversized image returns 400 thumbnail_upload_too_large with limit; an unreadable one 400 thumbnail_upload_invalid. A virtual video returns 409 virtual_video. Runs need a ComfyUI configuration."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StartThumbnailEditFromImageRequest"
      responses:
        "201":
          description: "Started session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/versions:
    get:
      operationId: listVideoVersions
      security:
        - sessionCookie: []
        - {}
      summary: "List all versions in the video's bundle"
      description: "Returns versions with visible locations, effective representative first, then natural title order with ID ties. Ungrouped videos return themselves as the sole item. Items use the GET detail shape (location for owners, folder for both audiences), including resolution, codec, sizeBytes and container. Guests count only public versions; invisible videos return 404 video_not_found."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "All bundle versions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/face-appearances:
    get:
      operationId: listVideoFaceAppearances
      summary: "List the people face recognition found in a video"
      description: "Owner-only. analysed is true once the face analysis of the video's content key is done; while it is queued or running, after a failure, and without an analysis it is false and items is empty. items are the content key's appearances that are not dropped and whose person still exists, in order of their first span's start, then by appearance ID. A missing video returns 404 video_not_found."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "The video's face appearances"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFaceAppearanceList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/make-representative:
    post:
      operationId: makeRepresentativeVersion
      summary: "Make this video the bundle representative"
      description: "Owner-only; no body. Selects the listed representative and returns all versions, including when already selected. Preserves bundle tags, playback position and visibility. Returns 400 not_bundled, 404 video_not_found when missing or without a registered-folder location, or 409 virtual_video for a virtual video. Emits video events for all members after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "Updated bundle versions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/unbundle:
    post:
      operationId: unbundleVideo
      summary: "Remove this video from its version bundle"
      description: "Owner-only; no body. Returns the removed Video with its pre-bundle tags, progress and public state, without versions. A remaining singleton dissolves the bundle and inherits bundle values. Returns 400 not_bundled, 404 video_not_found when missing or without a registered-folder location, or 409 virtual_video for a virtual video. Emits video events for every former member after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "Removed video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/scans:
    post:
      operationId: startScan
      summary: "Start import"
      description: "Returns an existing active scan instead of starting another. Responds immediately while import runs in the background."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: "New or active scan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "409":
          description: "No media folders configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/scans/rescan:
    post:
      operationId: startRescan
      summary: "Start a force rescan"
      description: "Owner-only. Starts a manual scan in force mode over the library, one media folder or one video: every video in the scope is read again and its probe, thumbnail, seek thumbnail, preview and fingerprint are rebuilt even when the file is unchanged, and auto-tagging and face analysis run on it again while each feature is on. A running watch scan is superseded first. A running manual scan or force rescan returns 409 scan_in_progress, no media folder returns 409 media_folders_not_configured, a missing folder or video returns 404 not_found, and an unknown scope or a target that does not match it returns 400 invalid_request. Responds immediately while the rescan runs in the background."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRescanRequest"
      responses:
        "202":
          description: "The started force rescan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "A manual scan or force rescan is running (scan_in_progress), or no media folder is configured (media_folders_not_configured)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/media-folders:
    get:
      operationId: listMediaFolders
      summary: "List registered media folders"
      responses:
        "200":
          description: "Media folders in ascending ID order"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaFolder"
    post:
      operationId: createMediaFolder
      summary: "Add a media folder"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaFolderRequest"
      responses:
        "201":
          description: "Created media folder"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/media-folders/{id}:
    put:
      operationId: updateMediaFolder
      summary: "Change a media folder path"
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaFolderRequest"
      responses:
        "200":
          description: "Updated media folder"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMediaFolder
      summary: "Delete a media folder"
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/media-folders/{id}/usage:
    get:
      operationId: getMediaFolderUsage
      summary: "Return a media folder's video size and disk space"
      description: "Owner-only. Reads the volume when called, so the values reflect the moment of the request. `videoBytes` sums every indexed file below the folder, each location once. `disk` is the space of the volume holding the folder as the OS reports it to the server process; it is omitted when the volume cannot be read or does not answer within a few seconds. Folders on the same volume report the same `disk`. Uses `Cache-Control: no-store`."
      parameters:
        - $ref: "#/components/parameters/MediaFolderId"
      responses:
        "200":
          description: "Usage of the media folder"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFolderUsage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/settings/transcoding:
    get:
      operationId: getTranscodingSettings
      summary: "Return live-transcode encoder settings and availability"
      description: "Returns the saved choice, effective encoder for new requests, fallback reason, whether startup probing is pending, and per-hardware-encoder availability."
      responses:
        "200":
          description: "Current settings and probe results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingSettings"
    put:
      operationId: updateTranscodingSettings
      summary: "Save the live-transcode encoder"
      description: "Applies to new transcode requests; active requests retain their encoder. Always accepts software and auto. Unavailable hardware encoders return 409 conflict with reason encoder_unavailable without changing settings."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTranscodingSettingsRequest"
      responses:
        "200":
          description: "Saved settings and probe results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/network:
    get:
      operationId: getNetworkSettings
      summary: "Return LAN access settings and available addresses"
      description: "Windows desktop only. Returns the saved setting and listening port, plus URLs for active non-loopback IPv4 addresses when enabled. Other builds return 404 not_found."
      responses:
        "200":
          description: "Current settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNetworkSettings
      summary: "Toggle LAN access, reopen the listener and save"
      description: "Reopens on `0.0.0.0:<port>` when enabled or `127.0.0.1:<port>` otherwise, then saves. Existing connections remain open; unchanged settings are a no-op. Reopen failure restores the original listener and returns 409 conflict with listen_failed without saving. Save failure restores the original listener and returns 500. Other builds return 404 not_found."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNetworkSettingsRequest"
      responses:
        "200":
          description: "Updated settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: "Saving failed after reopening; restored the original listener"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/onboarding:
    get:
      operationId: getOnboarding
      summary: オンボードの段階を返す
      description: |
        段階は設定 `onboarding.step` に 1 つで持つ。無ければ、メディアフォルダがあれば `done`、
        無ければ `folders` である（docs/design-docs/home.md）。所有者だけ。
      responses:
        "200":
          description: 今の段階
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
    put:
      operationId: updateOnboarding
      summary: オンボードの段階を書く
      description: |
        名前の段階をそのまま書くので、2 つの端末からの書き込みは後のものが残る。段階が変わったら
        画面の知らせ `onboarding` を出す（docs/design-docs/home.md）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Onboarding"
      responses:
        "200":
          description: 書いた段階
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/onboarding/interests:
    get:
      operationId: listOnboardingInterests
      summary: 分野の一覧を返す
      description: |
        Lists interests with `hasFolder` indicating an existing root smart folder matching the tag rule.
        （docs/design-docs/home.md）。
      responses:
        "200":
          description: 分野の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestList"
    post:
      operationId: pickOnboardingInterests
      summary: Create tags and smart folders for selected interests
      description: |
        Creates or reuses interest tags and ordinary root smart folders in one transaction.
        Existing root folders with the same tag rule are reused. Untyped tags receive Genre.
        When auto-tagging is enabled, queues the library and returns its count as `queued`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestPick"
      responses:
        "200":
          description: Created smart folders and the number of queued videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestPickResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/plugin-proxy:
    get:
      operationId: getPluginProxySettings
      summary: "Return the work-info plugin proxy URL"
      description: "Returns the saved URL or an empty string for no proxy. Available on all builds, unlike /api/settings/network."
      responses:
        "200":
          description: "Saved URL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginProxySettings"
    put:
      operationId: updatePluginProxySettings
      summary: "Save the work-info plugin proxy URL"
      description: "Validates and saves url; an empty string disables the proxy. New runs use the saved value; active runs retain their starting value. Missing or invalid url returns 400 invalid_request without writing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePluginProxySettingsRequest"
      responses:
        "200":
          description: "Saved URL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginProxySettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/auto-import:
    get:
      operationId: getAutoImportSettings
      summary: "Return auto-import settings and folder-watch state"
      description: "Returns saved enabled and current watch.state, with watch.problem and watch.path when available."
      responses:
        "200":
          description: "Current settings and watch state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoImportSettings"
    put:
      operationId: updateAutoImportSettings
      summary: "Save auto-import enablement and attach or detach folder watches"
      description: "Saves the setting and changes watches without starting a scan. An unchanged value is a no-op."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoImportSettingsRequest"
      responses:
        "200":
          description: "Updated settings; watch.state is starting or off"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoImportSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/ollama:
    get:
      operationId: getOllamaSettings
      summary: "Return the Ollama connection"
      description: "Ollama base URL and model for the Clef classifier, stored separately from feature settings such as auto-tagging. Returns defaults when unset; see docs/design-docs/ai-layer.md."
      responses:
        "200":
          description: "Current connection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettings"
    put:
      operationId: updateOllamaSettings
      summary: "Save the Ollama connection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOllamaSettingsRequest"
      responses:
        "200":
          description: "Saved connection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/ollama/check:
    post:
      operationId: checkOllama
      summary: "Check the saved Ollama connection and model availability"
      description: "Uses only GET /api/version and GET /api/tags, without loading a model or running inference, so usually finishes in seconds. POST /api/auto-tagging/check tests classification. Uses the saved URL, never a request-supplied URL; no body. See docs/design-docs/ai-layer.md."
      responses:
        "200":
          description: "Check result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/ollama/models:
    get:
      operationId: listOllamaModels
      summary: "List the models at the saved Ollama endpoint"
      description: "Uses only GET /api/version and GET /api/tags at the saved URL, never a request-supplied URL, without loading a model. Names come in the order Ollama lists them, for the decision and generation model pickers; see docs/design-docs/ai-layer.md."
      responses:
        "200":
          description: "Model names"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaModelList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "ollama_unreachable: the saved endpoint cannot be reached (reason connection) or does not answer as Ollama (reason not_ollama)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/assistant/readiness:
    get:
      operationId: getAssistantReadiness
      summary: "Say whether the assistant can take a request"
      description: "Reads only the saved Ollama connection and generation model; sends no request to Ollama."
      responses:
        "200":
          description: "Readiness"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReadiness"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/assistant/turns:
    post:
      operationId: createAssistantTurn
      summary: "Interpret one request into one outcome"
      description: "Owner-only. Sends the request, the screen context and, for a follow-up, the previous outcome to the saved generation model as one structured-output call, then resolves every name the model returned against the library: one match is used, several or none answer clarify with the candidates, except a tag to attach, which the proposal lists in created. An action outcome stores a proposal and answers it; a follow-up discards the previous proposal once the new request is understood. filter, navigate and answer change nothing. An answer the schema does not match is unreadable and changes nothing. text over 500 characters, or a target or selection of more than 20,000 videos, returns 400 invalid_request (reason too_many_videos for the videos). Readiness false returns 409 assistant_not_ready with the readiness reason. Ollama that cannot be reached (connection), a missing or refusing model (model) or a timeout (timeout) returns 503 assistant_unavailable and stores nothing. The call waits for the model up to 10 minutes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTurnRequest"
      responses:
        "200":
          description: "The outcome"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTurnResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The assistant is not ready (`assistant_not_ready`, reason ollama_not_saved or generation_model_unset)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The model cannot answer (`assistant_unavailable`, reason connection, model or timeout); nothing is stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/assistant/proposals:
    get:
      operationId: listAssistantProposals
      summary: "List the assistant's active proposals"
      description: "Owner-only. Lists, newest first, the proposals that are approved or running and those finished within the last hour, so the panel shows them when it opens. active=true is the only filter and is required."
      parameters:
        - name: active
          in: query
          required: true
          description: "Must be true."
          schema:
            type: boolean
      responses:
        "200":
          description: "Active proposals"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposalList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/assistant/proposals/{id}:
    get:
      operationId: getAssistantProposal
      summary: "Read one assistant proposal"
      description: "Owner-only. The panel reads it again on each assistant event. A missing or expired proposal returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/AssistantProposalId"
      responses:
        "200":
          description: "The proposal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assistant/proposals/{id}/execute:
    post:
      operationId: executeAssistantProposal
      summary: "Approve an assistant proposal for execution"
      description: "Owner-only; no body. Moves a proposed proposal to approved and returns it with 202; the assistant worker then executes exactly its stored plan in the background, in batches of 500 videos, and the progress follows assistant events. A missing, discarded or expired proposal returns 404 not_found; any other status returns 409 proposal_not_pending with the proposal in the error's proposal field."
      parameters:
        - $ref: "#/components/parameters/AssistantProposalId"
      responses:
        "202":
          description: "The approved proposal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The proposal is not pending (`proposal_not_pending`); proposal carries it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/assistant/review-runs/{id}:
    get:
      operationId: getAssistantReviewRun
      summary: "Read a review run and a page of its candidates"
      description: "Owner-only. Returns the run with its progress and its listed, adopted and rejected candidate sets, most probable first, each member with its current name and count. A candidate whose member no longer exists, such as the source of a merged tag, is left out, so a page may hold fewer than limit items. A missing run returns 404 not_found; an unknown cursor 400 invalid_request."
      parameters:
        - $ref: "#/components/parameters/AssistantReviewRunId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Candidates per page; 50 when omitted."
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "The run and one page of candidates"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReviewRunPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assistant/review-runs/{id}/candidates/adopt:
    post:
      operationId: adoptAssistantReviewCandidates
      summary: "Adopt review candidates"
      description: "Owner-only. Stores one approved proposal per chosen candidate, in the order of ids, each running the set's one operation: mergeTag or mergePeople into the member with more videos, or createGroup of the videos named by their common title. The assistant worker executes them like any approved proposal. skippedIds lists the ids that are not listed in the run or whose member no longer exists. A missing run returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/AssistantReviewRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantReviewCandidateIds"
      responses:
        "202":
          description: "The approved proposals"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReviewAdoption"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assistant/review-runs/{id}/candidates/reject:
    post:
      operationId: rejectAssistantReviewCandidates
      summary: "Reject review candidates"
      description: "Owner-only. Marks the listed candidates among ids rejected and remembers their sets, which later runs of the kind do not judge again. skippedIds lists the ids that are not listed in the run. A missing run returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/AssistantReviewRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantReviewCandidateIds"
      responses:
        "200":
          description: "The rejected and skipped ids"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReviewRejection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/settings/comfyui:
    get:
      operationId: getComfyUISettings
      summary: "Return the ComfyUI connection"
      description: "Connection for thumbnail editing, either self-hosted or Comfy Cloud, stored separately from the feature. Never returns the API key; apiKeySet indicates presence. Unconfigured connections return 200 without provider. Uses Cache-Control: no-store; see docs/design-docs/ai-layer.md."
      responses:
        "200":
          description: "Current connection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyUISettings"
    put:
      operationId: updateComfyUISettings
      summary: "Save the ComfyUI connection"
      description: "Omitted apiKey preserves the saved key; an empty string clears it. Self-hosted requires a valid HTTP(S) URL or returns 400 invalid_request with comfyui_url_invalid. Cloud requires a supplied or saved key or returns comfyui_api_key_missing. Errors do not save. Cloud ignores url and retains the saved URL."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComfyUISettingsRequest"
      responses:
        "200":
          description: "Saved connection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyUISettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/comfyui/check:
    post:
      operationId: checkComfyUI
      summary: "Check the saved ComfyUI connection"
      description: "Checks self-hosted GET /system_stats or cloud GET /jobs?limit=1 with X-API-Key, then GET /object_info for required workflow node types and loader model files. Missing requirements return available=false and missing. Failure messages distinguish unreachable, non-ComfyUI, rejected key, unconfigured and missing files. Uses only the saved connection, never a request URL; no body."
      responses:
        "200":
          description: "Check result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/readiness:
    get:
      operationId: getThumbnailEditReadiness
      summary: "Return thumbnail-edit readiness"
      description: "Used by the video page to enable editing. connection means a saved ComfyUI connection exists, not that its connection test passed."
      responses:
        "200":
          description: "Edit readiness"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEditReadiness"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/{editId}:
    get:
      operationId: getThumbnailEdit
      summary: "Return the thumbnail-edit session state"
      description: "Polls ComfyUI for an active run and retrieves successful output before responding. Reads renew the session heartbeat; five minutes without a read cancels and closes it. Runs exceeding ten minutes after submission are cancelled and marked failed/timed_out. Closed sessions return 404 thumbnail_edit_not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: "Current session state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: discardThumbnailEdit
      summary: "Discard a thumbnail-edit session"
      description: "Cancels any active ComfyUI run before discarding the session. Returns 204 even for closed or missing sessions; does not change the thumbnail. Called on discard and page exit."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "204":
          description: "Discarded"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/thumbnail-edits/{editId}/frame:
    get:
      operationId: getThumbnailEditFrame
      summary: "Return the editing frame as PNG"
      description: "Returns the starting frame at ThumbnailEdit.frameWidth/frameHeight, the dimensions required for masks. Reads renew the heartbeat. Closed sessions return 404 thumbnail_edit_not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: "Frame image"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/thumbnail-edits/{editId}/result:
    get:
      operationId: getThumbnailEditResult
      summary: "Return the successful run's output image"
      description: "Returns the original ComfyUI output before fitting it to the video's aspect ratio. Without a successful run returns 409 thumbnail_edit_no_result; closed sessions return 404 thumbnail_edit_not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: "Output image"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/thumbnail-edits/{editId}/runs:
    post:
      operationId: runThumbnailEdit
      summary: "Run thumbnail editing in ComfyUI"
      description: "Accepts optional multipart prompt (up to 4000 characters), mask (PNG matching frame dimensions) and reference (PNG/JPEG/WebP up to 20 MiB). Cancels an active run, snapshots the current connection, uploads inputs and submits the workflow, returning the queued session with 202. Invalid masks or references return 400 thumbnail_edit_mask_invalid or thumbnail_edit_reference_invalid before uploading anything. A removed connection returns 409 thumbnail_edit_not_ready. Upload/submission failure returns 502 provider_failed with a reason such as unreachable and marks the session failed with that reason."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RunThumbnailEditRequest"
      responses:
        "202":
          description: "Submitted run"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ProviderFailed"

  /api/thumbnail-edits/{editId}/cancel:
    post:
      operationId: cancelThumbnailEdit
      summary: "Cancel the active run"
      description: "No body. Cancels the active ComfyUI run and returns cancelled; otherwise returns current state. Does not change the thumbnail. Closed sessions return 404 thumbnail_edit_not_found."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: "Current session state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailEdit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/thumbnail-edits/{editId}/apply:
    post:
      operationId: applyThumbnailEdit
      summary: "Apply the successful output as the thumbnail"
      description: "No body. Fits output to the video aspect ratio, applies it, closes the session and returns Video. A non-succeeded run returns 409 thumbnail_edit_no_result. Missing or changed video content returns 409 content_changed and closes the session; unreadable output returns 409 thumbnail_image_invalid. Emits a video event after commit."
      parameters:
        - $ref: "#/components/parameters/ThumbnailEditId"
      responses:
        "200":
          description: "Updated video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/auto-tagging:
    get:
      operationId: getAutoTaggingSettings
      summary: "Return auto-tagging settings and queue counts"
      description: "Includes enablement (off by default), automatic classification after import and two probability thresholds. Connection settings live at /api/settings/ollama; see docs/design-docs/ai-layer.md."
      responses:
        "200":
          description: "Current settings and queue counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingSettings"
    put:
      operationId: updateAutoTaggingSettings
      summary: "Save auto-tagging settings"
      description: "Validates and saves without starting a judgement. Enabling resumes queued work."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoTaggingSettingsRequest"
      responses:
        "200":
          description: "Saved settings and queue counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/version-judging:
    get:
      operationId: getVersionJudgingSettings
      summary: "Return automatic duplicate-judging enablement"
      description: "Owner-only; defaults to enabled=false before saving"
      responses:
        "200":
          description: "Current settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionJudgingSettings"
    put:
      operationId: updateVersionJudgingSettings
      summary: "Save automatic duplicate-judging enablement and wake its worker"
      description: "Returns the saved setting. Enabling starts queued candidates. Connection settings live at /api/settings/ollama."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVersionJudgingSettingsRequest"
      responses:
        "200":
          description: "Saved settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionJudgingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/settings/face-recognition:
    get:
      operationId: getFaceRecognitionSettings
      summary: "Return face recognition settings, the runtime state and queue counts"
      description: "Owner-only. The runtime state is read from the files under the data folder and the running download, never stored; while downloading, poll this resource for the progress. See docs/design-docs/face-recognition.md."
      responses:
        "200":
          description: "Current settings, runtime state and queue counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceRecognitionSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateFaceRecognitionSettings
      summary: "Save face recognition settings"
      description: "Owner-only. Turning it on starts the download of the runtime and the recognizer's model when they are absent or do not match their hashes; turning it off cancels a running download. A changed recognizer increases face.generation, deletes the old recognizer's vectors and queues again every video whose analysis is done or failed; a video never analysed waits for runs with missing. An unknown recognizer returns 400 invalid_request."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFaceRecognitionSettingsRequest"
      responses:
        "200":
          description: "Saved settings, runtime state and queue counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceRecognitionSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/face-recognition/download:
    post:
      operationId: downloadFaceRuntime
      summary: "Download the face runtime and the recognizer's model again"
      description: "Owner-only; no body. Downloads what is absent or does not match its hash, after a failure for example, and returns 202 with the settings. While off returns 409 face_recognition_off; where no runtime is published returns 409 face_recognition_unsupported."
      responses:
        "202":
          description: "Download started; settings with the runtime state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceRecognitionSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Face recognition is off (`face_recognition_off`) or has no runtime for this platform (`face_recognition_unsupported`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/face-recognition/runs:
    post:
      operationId: startFaceRecognition
      summary: "Queue library videos for face analysis"
      description: "Owner-only. missing, the only scope, queues videos never analysed or whose analysis failed; an analysed video is analysed again only by a recognizer switch. Returns the queued count. Videos queued while the runtime is not ready wait for it. While off returns 409 face_recognition_off. See docs/design-docs/face-recognition.md."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFaceRecognitionRequest"
      responses:
        "202":
          description: "Queued count"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceRecognitionQueued"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Face recognition is off (`face_recognition_off`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auto-tagging/check:
    post:
      operationId: checkAutoTaggingClassifier
      summary: "Test the classifier with one question for auto-tagging"
      description: "Asks the current provider one short question and checks for a probability response, regardless of feature enablement. Model loading may take minutes. No body; see docs/design-docs/auto-tagging.md."
      responses:
        "200":
          description: "Check result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auto-tagging/runs:
    post:
      operationId: startAutoTagging
      summary: "Queue library videos for classification"
      description: "missing queues videos without a successful judgement, including failures; all queues every video not currently being judged. Returns the queued count."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAutoTaggingRequest"
      responses:
        "202":
          description: "Queued count"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoTaggingQueued"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Auto-tagging is off (`auto_tagging_off`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/api-tokens:
    get:
      operationId: listApiTokens
      summary: "List issued API tokens"
      description: "Newest first; excludes plaintext and hashes. Requires an owner session and ignores Bearer credentials."
      responses:
        "200":
          description: "API token list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
    post:
      operationId: createApiToken
      summary: "Issue an API token"
      description: "The plaintext secret appears only in this response. Invalid names return 400 invalid_request with api_token_name_empty, api_token_name_control_characters or api_token_name_too_long (with limit)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
      responses:
        "201":
          description: "Issued API token and plaintext secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/api-tokens/{id}:
    delete:
      operationId: deleteApiToken
      summary: "Revoke an API token"
      description: "Unknown IDs also return 204, making repeated revocation idempotent."
      parameters:
        - $ref: "#/components/parameters/APITokenId"
      responses:
        "204":
          description: "Revoked"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/peer:
    get:
      operationId: getPeer
      security:
        - sessionCookie: []
        - {}
      summary: "Return the pairing state"
      description: "Pairing is one-directional: link is the VVMDM this node reads, and grant the VVMDM that reads this one; each is absent until paired in that direction, and they are independent, so a mutual pairing is two pairings. Owners receive the link's name, address and version, the grant's name and pairing time, and this node's identity; guests receive state and reason only. state is the link's connection, held in memory: after a start it is unpaired without a link, revoked when the read node refused the link's secret, and unreachable with reason network otherwise, until a connection succeeds. One open event stream to the read node is the liveness signal: connected while it is open, unreachable when it fails, retried after 5 s doubling to 60 s. Each reconnection compares the read node's node id (reason network when it differs); versions are never compared, and the read node's version is shown for reference only; a pinned certificate that changed stops it with reason certificate and the new fingerprint; 401 peer_unknown from the read node marks the link revoked and gives revoked."
      responses:
        "200":
          description: "Pairing state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerState"

  /api/peer/link:
    delete:
      operationId: unpairPeer
      summary: "Stop reading the other VVMDM"
      description: "Tells the read node through its forgetPeer, best effort, then deletes the link and nothing else, which also clears a revoked state; the grant, if any, stays. A node that could not be told learns it from the 401 peer_unknown its reader's next request receives. Without a link it also returns 204."
      responses:
        "204":
          description: "Unpaired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/peer/grant:
    delete:
      operationId: revokePeerGrant
      summary: "Withdraw the reading VVMDM's access"
      description: "Deletes the grant and cancels the reading node's requests in flight; its next request receives 401 peer_unknown, after which it shows this node as revoked. The link, if any, stays. Without a grant it also returns 204."
      responses:
        "204":
          description: "Revoked"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/peer/code:
    post:
      operationId: issuePairingCode
      summary: "Issue this node's pairing code"
      description: "Returns 8 characters valid for 10 minutes and replaces an unused code. The code is kept in memory, so a restart ends it, and the pairing that uses it consumes it. A node another VVMDM already reads returns 409 conflict with already_paired; the owner withdraws that access first."
      responses:
        "201":
          description: "Pairing code"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/peer/pair:
    post:
      operationId: pairPeer
      summary: "Read the node whose code the owner typed"
      description: "Sends the code and this node's identity to the other node's acceptPairing and stores the link with the secret it answers; the other node stores a grant and never connects to this one, so this node needs no address of its own and no inbound reachability. An address without http or https scheme or host, or with a path, query or user, returns 400 invalid_request with invalid_address and field. A refused code returns 400 invalid_code; a node that already reads one, or whose target another node already reads, 409 already_paired; a failed call 409 peer_unreachable; an HTTPS certificate the system roots do not verify 409 certificate_untrusted with fingerprint. Sending fingerprint again accepts a certificate with that SPKI and pins it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairPeerRequest"
      responses:
        "201":
          description: "Paired; the state is connected"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/peer/address:
    put:
      operationId: updatePeerAddress
      summary: "Change the read node's address"
      description: "Keeps the link. An invalid address returns 400 invalid_request with invalid_address; without a link, 404 not_found."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePeerAddressRequest"
      responses:
        "200":
          description: "Pairing state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/certificate:
    post:
      operationId: confirmPeerCertificate
      summary: "Trust the read node's changed certificate"
      description: "Pins the SPKI fingerprint that getPeer shows with state unreachable and reason certificate, and reconnects at once; the next peer event reports the result. Another fingerprint, or none waiting, returns 409 conflict with fingerprint_changed and the fingerprint waiting, if any. A certificate the system roots verify is never pinned, so it needs no confirmation. Without a link, 404 not_found."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerCertificateRequest"
      responses:
        "200":
          description: "Pairing state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/peer/pairings:
    post:
      operationId: acceptPairing
      security: []
      summary: "Grant the sender read access to this node"
      description: "Called by the node that will read this one, never by the screens; the code authenticates it. Stores the grant with the sender's identity and answers the secret the sender presents from then on; this node never connects to the sender. Only a pairing that succeeded clears the code. An unknown or expired code returns 400 invalid_request with invalid_code; malformed values, or the node's own id, 400 invalid_request; a node another VVMDM already reads 409 already_paired."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: "Paired; secret is what the sender presents to this node"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingAnswer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/peer/handshake:
    get:
      operationId: peerHandshake
      security: []
      summary: "Return this node's identity to the reading node"
      description: "Requires `Authorization: VV-Peer <secret>` with the grant's credential. Anything else returns 401 unauthenticated with peer_unknown."
      responses:
        "200":
          description: "This node"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerHandshake"
        "401":
          description: "Unknown secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/peer/pairings/{nodeId}:
    delete:
      operationId: forgetPeer
      summary: "Delete the grant of a reading node that unpaired"
      description: "Called by the reading node with its credential after it removed its link. Deletes the grant when nodeId matches; a missing or different grant also returns 204."
      parameters:
        - name: nodeId
          in: path
          required: true
          description: "The caller's node id"
          schema:
            type: string
      responses:
        "204":
          description: "Forgotten"

  /api/peer/related:
    post:
      operationId: rankPeerRelated
      security:
        - sessionCookie: []
        - {}
      summary: "Score this node's videos against a video of the other node"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. Scores the visible videos of this node, except `exclude`, against `clues` with the related-video scorer and returns one page in the related order (score, then newer addedAt, then larger id) after `cursor`. The clues carry no directory: the same-directory clue counts only when `openVideoId` names this node's video that the caller's audience can see, and then from that video's representative directory, as this node's own related list does. An unknown or hidden `openVideoId` gives no folder points and no error. See docs/design-docs/related-videos.md."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerRelatedRequest"
      responses:
        "200":
          description: "One page of scored videos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerRelatedPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/vocabulary:
    post:
      operationId: applyPeerVocabulary
      summary: "Rename, merge or delete a tag, person or organization by name"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. Applies the change by canonical name in one transaction. A missing `name` changes nothing and returns `changed: false`; a merge skips the absent `sources`, returning them in `skipped`, and creates `into` only when a source exists. A person or organization name held by several entries names the lowest id. A `newName` another entry holds returns 409 conflict with tag_name_taken (with `tagName`), person_name_taken or organization_name_taken; a `newName` or `into` that breaks the name rule returns 400 invalid_request with the tag name or work-info reasons. Nothing changes on an error."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerVocabularyRequest"
      responses:
        "200":
          description: "Whether this node changed, and the absent sources"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerVocabularyResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/peer/videos/{id}/clues:
    get:
      operationId: getPeerRelatedClues
      security:
        - sessionCookie: []
        - {}
      summary: "Return the related-video clues of one video"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. A video the request's audience cannot see, or a missing one, returns 404."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: "The video's clues"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedClues"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/credit-matches:
    post:
      operationId: matchPeerCredits
      summary: "Match fetched people or organizations against this node's"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. Matches each entry as a work-info fetch of this node would, by external ID first, then by folded name and aliases, and returns the matches in entry order with this node's ids. The peer shows them while its owner chooses what to apply to a video of this node. See docs/design-docs/peer-library.md."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerCreditMatchRequest"
      responses:
        "200":
          description: "One match per entry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerCreditMatches"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/videos/{id}/fetched-work-info:
    post:
      operationId: applyPeerFetchedWorkInfo
      summary: "Apply work information the peer fetched for a video of this node"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. The peer ran its own approved plugin and checked it; this node applies the chosen values as it applies its own fetch: the title, tags as tentative assignments, and the detail fields merged into the stored work information with credits matched in the same transaction, then merges each same-person pair. A missing video, or one whose contentVersion has changed, returns 404 without writes. See docs/design-docs/peer-library.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerFetchedWorkInfo"
      responses:
        "200":
          description: "Applied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerFetchedWorkInfoApplied"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/people/{id}/fetched-person:
    post:
      operationId: applyPeerFetchedPerson
      summary: "Apply a person the peer fetched for a person of this node"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. The peer ran its own approved person plugin and checked it; this node applies the chosen items as it applies its own person page fetch, in one transaction: profile fields replace the stored values, and the aliases, external IDs and links append. The image is not an item here; the peer uploads it as the person's face. An item that is image or has no value in the request returns 400, and a missing person 404, both without writes. See docs/design-docs/peer-library.md."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerFetchedPluginPerson"
      responses:
        "200":
          description: "This node's person, in this node's ids, and the skipped values"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPluginFetchApplied"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/peer/rule-counts:
    post:
      operationId: countPeerRuleMatches
      security:
        - sessionCookie: []
        - {}
      summary: "Count this node's videos matching smart-folder rules given by name"
      description: "Called by the peer with its credential, never by the screens; any other caller gets 404. For each rule, counts the videos of this node the request's audience can see that match it as a smart folder of this node would: q with the owner's search fields, and tags, kind, person and organization by canonical name, where a name this node lacks matches no video. Returns the counts in the order of rules."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerRuleCountsRequest"
      responses:
        "200":
          description: "One count per rule"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerRuleCounts"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-info-plugins:
    get:
      operationId: listWorkInfoPlugins
      summary: "List work-info plugins"
      description: "Owner-only. Lists work-info and person plugins together, told apart by kind; sorts by name then filename, placing unreadable names last. Secret settings return only set, not values. Plugin changes emit no events; settings and video pages refetch the list."
      responses:
        "200":
          description: "Work-info plugin list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPluginList"
    post:
      operationId: uploadWorkInfoPlugin
      summary: "Add a work-info plugin or replace one with the same name"
      description: "Owner-only. Accepts one multipart module (WebAssembly up to 16 MiB), inspects without execution and saves its filename. A matching manifest name replaces the existing row with 200, whatever either kind; otherwise creates with 201. Replacement resets approval, takes kind, sources and domains from the new manifest and preserves values only for keys declared by the new manifest. A work-info plugin new to the link order is placed just before the bundled plugin, and a replacement keeps its place. A manifest named vv.link returns 409 plugin_builtin without writes. Unusable modules are saved with state=invalid and problem. Missing/multiple modules return 400 invalid_request; oversized modules return 413 plugin_too_large with limit, without writing."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadWorkInfoPluginRequest"
      responses:
        "200":
          description: "Replaced plugin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPlugin"
        "201":
          description: "Added plugin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPlugin"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PluginTooLarge"

  /api/work-info-plugins/{id}:
    delete:
      operationId: deleteWorkInfoPlugin
      summary: "Delete a work-info plugin"
      description: "Owner-only; also deletes settings. Missing plugins return 404 not_found; the bundled plugin returns 409 plugin_builtin."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      responses:
        "204":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/work-info-plugins/link-order:
    put:
      operationId: setWorkInfoPluginLinkOrder
      summary: "Set the order in which plugins are tried for a link"
      description: "Owner-only. pluginIds names every work-info plugin that declares domains, the bundled one included, once each, first tried first; otherwise 409 link_order_changed without writes. Returns the plugin list."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoPluginLinkOrder"
      responses:
        "200":
          description: "Plugin list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPluginList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/work-info-plugins/{id}/approval:
    put:
      operationId: approveWorkInfoPlugin
      summary: "Approve the module inspected by the owner"
      description: "Owner-only. digest must match the listed module. Missing plugin returns 404 not_found, changed digest returns 409 plugin_changed, and invalid plugins return 409 plugin_unusable; errors write nothing."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveWorkInfoPluginRequest"
      responses:
        "200":
          description: "Approved plugin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPlugin"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: revokeWorkInfoPluginApproval
      summary: "Revoke work-info plugin approval"
      description: "Owner-only. Missing plugins return 404 not_found; already-unapproved plugins return 200."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      responses:
        "200":
          description: "Plugin with approval revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPlugin"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-info-plugins/{id}/settings:
    put:
      operationId: setWorkInfoPluginSettings
      summary: "Save work-info plugin settings"
      description: "Owner-only. Updates each supplied values key; null or empty strings clear it, omitted keys remain. Approval is unchanged. Undeclared keys or values over 2000 characters return 400 invalid_request; missing plugins return 404 not_found; invalid plugins return 409 plugin_unusable. Errors write nothing. Secret settings return only set."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetWorkInfoPluginSettingsRequest"
      responses:
        "200":
          description: "Updated plugin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPlugin"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/work-info-plugins/{id}/last-run:
    get:
      operationId: getWorkInfoPluginLastRun
      summary: "Read stderr from the latest work-info plugin run"
      description: "Owner-only. Returns the first 64 KiB of the current module's latest stderr, replacing that run's secret-setting values with [secret]. No retained run returns {}. Replaced modules show only subsequent runs. Missing plugins return 404 not_found."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      responses:
        "200":
          description: "Latest run; run is absent when none is retained"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoPluginLastRun"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-info-plugins/{id}/search:
    post:
      operationId: searchWorkInfo
      summary: "Search for works with a work-info plugin"
      description: "Owner-only. Runs an approved plugin's search once and returns candidate ID, page URL, title and optional plain-text description. Trimmed query must be 1–200 characters or returns 400 invalid_request. A person plugin returns 409 plugin_kind_mismatch; undeclared search returns 409 operation_unsupported. See Run failures in docs/design-docs/work-info-plugins.md for execution errors."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoSearchRequest"
      responses:
        "200":
          description: "Search candidates"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoSearchResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/PluginFailed"
        "503":
          $ref: "#/components/responses/PluginBusy"
        "504":
          $ref: "#/components/responses/PluginTimedOut"

  /api/work-info-fill-targets:
    post:
      operationId: listWorkInfoFillTargets
      summary: "List the videos a selection fill searches for"
      description: "Owner-only. Resolves videoIds plus the current member videos of smartFolderIds under the same 1–20,000 distinct-video limit as updateVideoTags and returns, in request order, the first video of each user-data key with its title and the words a fill searches with: the key's work code, or the title without one. With the peer's videos or smart folders in the selection, this node's targets come first, then the peer's in their remote ids; a peer that does not answer returns 503 with peer_unreachable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoFillTargetsRequest"
      responses:
        "200":
          description: "Fill targets"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoFillTargetList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/work-info-plugins/{id}/person-search:
    post:
      operationId: searchPeopleWithPlugin
      summary: "Search for people with a person plugin"
      description: "Owner-only. Runs an approved person plugin's search once and returns candidates, each an external ID (source and id) with a name, a page URL and an optional plain-text description. Trimmed query must be 1–200 characters or returns 400 invalid_request. A work-info plugin returns 409 plugin_kind_mismatch; the other errors are searchWorkInfo's."
      parameters:
        - $ref: "#/components/parameters/WorkInfoPluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoSearchRequest"
      responses:
        "200":
          description: "Search candidates"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPluginSearchResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/PluginFailed"
        "503":
          $ref: "#/components/responses/PluginBusy"
        "504":
          $ref: "#/components/responses/PluginTimedOut"

  /api/videos/{id}/work-info-fetches:
    post:
      operationId: fetchWorkInfo
      summary: "Fetch video work information with a plugin"
      description: "Owner-only. Runs approved pluginId fetch once with a trimmed 1–200 character id from search or owner input, or with a link. Even URL-shaped IDs are passed unchanged; VV does not fetch them as URLs. A link must be an http or https URL (else 400 invalid_request) that one of the plugin's domains matches (else 400 work_info_link_unsupported), checked before the plugin runs; both or neither of id and link is 400 invalid_request. Retains the result in memory for ten minutes and returns 201 without changing the video. Missing/invalid id returns 400 invalid_request. Includes title only if it passes display-name rules. People and organizations carry their fetch-time match. Missing video returns 404 not_found; a person plugin returns 409 plugin_kind_mismatch; undeclared fetch returns 409 operation_unsupported. See Run failures in docs/design-docs/work-info-plugins.md."
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkInfoFetchRequest"
      responses:
        "201":
          description: "Fetch result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoFetch"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/PluginFailed"
        "503":
          $ref: "#/components/responses/PluginBusy"
        "504":
          $ref: "#/components/responses/PluginTimedOut"

  /api/videos/{id}/work-info-fetches/{fetchId}/apply:
    post:
      operationId: applyWorkInfoFetch
      summary: "Apply selected fetched fields to a video"
      description: "Owner-only. Atomically saves selected fields: title as display name, tags as tentative assignments, others merged into work information. After commit, cover uses uploaded-image validation/application; failure preserves the thumbnail and reports skipped invalid. With coverByPage, cover is checked like the other fields but not applied. Invalid values, excess entries and ambiguous people/organizations are skipped. A successful result is consumed. Invalid or rejected tag names are reported in skippedTags without assignment. Optional tags selects fetched names and limits skippedTags to that selection. people, organizations, urls and externalIds append the chosen entries and values, and the linked people's empty profile fields fill from theirs. An empty selection, a field without a value, a role, urls or externalIds in fields, a position or value the result lacks, empty/unknown tag selections, tags without fields containing tags, or cover without a coverIndex among covers return 400 invalid_request. Missing video or mismatched result video returns 404 not_found. Expired/unknown results or plugin replacement, revocation or deletion after fetch return 409 work_info_fetch_stale. These errors write nothing. Emits a video event after commit."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/WorkInfoFetchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyWorkInfoFetchRequest"
      responses:
        "200":
          description: "Updated video, unassigned tag names and skipped work-info values"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkInfoFetchApplied"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/videos/{id}/work-info-fetches/{fetchId}/covers/{index}:
    get:
      operationId: getWorkInfoFetchCover
      summary: "Return one of the fetched cover images"
      description: "Owner-only. Returns the cover at index among those VV fetched from the plugin's URLs and retained with the result, keeping the browser from contacting external sites. Missing, expired or mismatched-video results, or an index outside covers, return 404 not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/WorkInfoFetchId"
        - name: index
          in: path
          required: true
          description: "Position in the result's covers"
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: "Cover image"
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/videos/{id}/work-info-fetches/{fetchId}/people/{index}/image:
    get:
      operationId: getWorkInfoFetchPersonImage
      summary: "Return a fetched person's image"
      description: "Owner-only. Returns the image VV fetched for the person at index in the result's people, kept with the result like the cover. Missing, expired or mismatched-video results return 404 not_found; an index without a kept image, or outside people, returns 404 person_image_not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/WorkInfoFetchId"
        - name: index
          in: path
          required: true
          description: "Position in the result's people"
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: "Person image"
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags:
    get:
      operationId: listTags
      summary: "List tags"
      description: "Includes unused tags. Applies q, tentative, unused and kind by AND, ordered by sort. With limit, returns a page and nextCursor when more remain; without limit returns all matches."
      parameters:
        - name: q
          in: query
          description: "Normalizes width, case and hiragana/katakana and trims the query, then substring-matches the canonical name or synonyms when nonempty. Does not split terms."
          schema:
            type: string
            maxLength: 100
        - name: tentative
          in: query
          description: "Restrict to tentative tags"
          schema:
            type: boolean
            default: false
        - name: unused
          in: query
          description: "Restrict to tags with zero videos"
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          description: "Positive kind ID selects that kind; none selects unclassified tags. Unknown IDs return an empty list. Affects total but not totalAll. Other values return 400 invalid_request."
          schema:
            type: string
            pattern: "^([1-9][0-9]*|none)$"
        - name: sort
          in: query
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/TagSort"
        - name: cursor
          in: query
          description: "Opaque nextCursor from the previous response, continued with the same q, tentative, unused, kind and sort. Ignored without limit."
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size; omit for all matches without nextCursor"
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "Tag list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createTag
      summary: "Create a tag"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: "Created tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags/{id}:
    patch:
      operationId: renameTag
      summary: "Rename a tag's canonical name"
      description: "An unchanged name returns current state without writing."
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: "Updated tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTag
      summary: "Delete a tag"
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/merge:
    post:
      operationId: mergeTag
      summary: "Merge sourceIds into tag id"
      description: "Atomically moves assignments, canonical names and synonyms from 1–20,000 sourceIds into id. Sources disappear and the destination becomes confirmed. Missing sources are skipped and returned in notFoundIds; even if all are missing, returns 200 with the unchanged destination. Empty/oversized sourceIds (too_many_tags) or inclusion of id (merge_same_tag) returns 400; missing destination returns 404."
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTagRequest"
      responses:
        "200":
          description: "Merged destination tag and missing source IDs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/synonyms:
    post:
      operationId: addTagSynonym
      summary: "Add a synonym to tag id"
      description: "An existing synonym of id is a no-op with 200. Its canonical name returns 409 tag_name_taken. Another tag's canonical name merges that tag into id only when mergeTagId matches it; otherwise returns 409 tag_merge_required."
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagSynonymRequest"
      responses:
        "200":
          description: "Updated tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeTagSynonym
      summary: "Remove name from tag id's synonyms"
      description: "Returns 204 without changes when name is not a synonym of id."
      parameters:
        - $ref: "#/components/parameters/TagId"
        - name: name
          in: query
          required: true
          description: "Synonym to remove"
          schema:
            type: string
      responses:
        "204":
          description: "Removed or already absent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/confirm:
    post:
      operationId: confirmTag
      summary: "Confirm a tentative tag"
      description: "Confirms the tag without changing videos, names or synonyms. Already-confirmed tags return current state without changes."
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "200":
          description: "Confirmed tag (tentative=false)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/reject:
    post:
      operationId: rejectTag
      summary: "Reject a tentative tag"
      description: "Deletes the tentative tag and its video assignments, and records its canonical name as rejected. Confirmed tags return 409 tag_not_tentative without changes."
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: "Rejected"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags/rejected-names:
    get:
      operationId: listRejectedTagNames
      summary: "List rejected names"
      description: "Paginates in natural name order (sort_key, then bytewise name). Invalid limit or cursor returns 400 invalid_request."
      parameters:
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Rejected names"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTagNameList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: forgetRejectedTagName
      summary: "Remove a rejected name"
      description: "Normalizes name as on insertion. Missing names and unnormalizable input return 204 without changes."
      parameters:
        - name: name
          in: query
          required: true
          description: "Name to remove"
          schema:
            type: string
      responses:
        "204":
          description: "Removed or already absent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tags/batch:
    post:
      operationId: batchTags
      summary: "Bulk confirm, reject, delete or classify tags"
      description: "Atomically handles existing IDs applicable to action: confirm/reject require tentative tags, delete requires confirmed tags. Others go to notApplicableIds; missing IDs to notFoundIds. Deduplicates IDs; result arrays are disjoint and preserve input order. Transaction failure changes nothing. setKind assigns kindId and clearKind removes it without confirming tentative tags; unchanged kinds go to notApplicableIds. Missing kindId for setKind, or kindId with other actions, returns 400 invalid_request. An unknown kind returns 404 not_found/tag_kind_not_found without changes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBatchRequest"
      responses:
        "200":
          description: "Applied, missing and inapplicable IDs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/impact:
    post:
      operationId: tagImpact
      summary: "Return confirmation counts for bulk reject, delete or merge"
      description: "Counts existing applicable tags (reject: tentative; delete: confirmed; merge: either) and distinct current-library videos assigned any of them, including manual and folder-derived assignments. Writes nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagImpactRequest"
      responses:
        "200":
          description: "Confirmation counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagImpactResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tag-kinds:
    get:
      operationId: listTagKinds
      summary: "List tag kinds"
      description: "Returns all kinds in ID order"
      responses:
        "200":
          description: "Kind list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKindList"
    post:
      operationId: createTagKind
      summary: "Create a tag kind"
      description: "Normalizes names using tag-name rules, unique only among kinds. Invalid names return 400 invalid_request with tag_name_*; conflicts return 409 conflict/tag_kind_name_taken. Errors change nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindNameRequest"
      responses:
        "201":
          description: "Created kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKind"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tag-kinds/{id}:
    patch:
      operationId: renameTagKind
      summary: "Rename a tag kind"
      description: "Unchanged names return current state. Missing ID returns 404 not_found/tag_kind_not_found; duplicate name returns 409 conflict/tag_kind_name_taken."
      parameters:
        - $ref: "#/components/parameters/TagKindId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindNameRequest"
      responses:
        "200":
          description: "Updated kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKind"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTagKind
      summary: "Delete a tag kind"
      description: "Preserves its tags without a kind. Missing ID returns 404 not_found/tag_kind_not_found."
      parameters:
        - $ref: "#/components/parameters/TagKindId"
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tag-kinds/{id}/card-first:
    put:
      operationId: setTagKindCardFirst
      summary: "Set whether cards list a kind's tags first"
      description: "Owner-only. Sets TagKind.cardFirst; an unchanged value returns current state. Missing ID returns 404 not_found/tag_kind_not_found. Lists read the new order on their next fetch."
      parameters:
        - $ref: "#/components/parameters/TagKindId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKindCardFirstRequest"
      responses:
        "200":
          description: "Updated kind"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagKind"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people:
    get:
      operationId: listPeople
      summary: "List people"
      description: "Owner-only. q substring-matches names and aliases, ordered by sort. limit enables pagination with nextCursor; otherwise returns all matches. favorite=true keeps only favorite people, and provisional keeps only provisional or only named people. Provisional people follow every named person in natural-name order, including as the tie-break of the other sorts."
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditFavorite"
        - $ref: "#/components/parameters/CreditProvisional"
      responses:
        "200":
          description: "People"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createPerson
      summary: "Create a person"
      description: "Owner-only. Invalid fields return 400 with work_info_* reason and field. An external ID owned by another person returns 409 external_id_taken with field externalIds[i]. parentId is forbidden (400 invalid_request)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: "Created person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: clearPeople
      summary: "Delete every person and all face data"
      description: "Owner-only. Deletes every person, with their names, credits on videos, faces and profiles, and every face appearance and candidate, in one transaction. Videos already analysed for faces are left to be analysed again, and while face recognition is on every video is queued. Smart folders whose rule names a person then match nothing. See docs/design-docs/face-recognition.md."
      responses:
        "200":
          description: "What was deleted and queued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleCleared"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/people/{id}:
    get:
      operationId: getPerson
      summary: "Return a person"
      description: "Owner-only; missing person returns 404 person_not_found"
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: "Person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      summary: "Update a person's name, aliases and external IDs"
      description: "Owner-only. Replaces only supplied properties, replacing lists entirely (null clears them). Unchanged input returns current state without writing. Uses creation errors; missing person returns 404 person_not_found. parentId is forbidden (400 invalid_request)."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPatch"
      responses:
        "200":
          description: "Updated person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePerson
      summary: "Delete a person"
      description: "Owner-only; removes video associations. Missing person returns 404 person_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/merge:
    post:
      operationId: mergePeople
      summary: "Merge sourceIds into person id"
      description: "Owner-only. Atomically moves associations, names and external IDs from 1–20,000 sources into the destination and deletes sources. Missing sources go to notFoundIds. Invalid source count returns 400 work_info_too_many with field sourceIds; including the destination returns merge_same_person; exceeding merged alias/external-ID limits returns work_info_too_many with field aliases or externalIds. Missing destination returns 404 person_not_found. Errors change nothing."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: "Merged destination and missing source IDs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/image:
    get:
      operationId: getPersonImage
      summary: "Return a person's face"
      description: "Owner-only. Returns the stored JPEG (at most 800 px on its long side) with `Cache-Control: private, no-cache` and the person's imageRevision as `ETag`; a matching `If-None-Match` returns 304. `v` only changes the URL when the face changes. Missing person returns 404 person_not_found; a person without a face returns 404 person_image_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - name: v
          in: query
          description: "imageRevision from Person or WorkPerson; ignored by the server"
          schema:
            type: string
      responses:
        "200":
          description: "Face"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "`If-None-Match` matches `ETag`"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadPersonImage
      summary: "Set a person's face from an uploaded image"
      description: "Owner-only. Accepts multipart `image` (PNG, JPEG or static WebP) under the thumbnail upload's limits: 64 MiB with 1 MiB additional multipart overhead, and 120 million pixels. Fits it to at most 800 px on its long side, stores it as JPEG, replacing any earlier face, and returns Person with a new imageRevision. A body over the byte limit returns 413 person_image_too_large with limit. Unsupported, animated, unreadable or over-pixel images return 400 person_image_invalid. The image is stored whatever face recognition finds in it. Missing person returns 404 person_not_found. Errors write nothing. After the body arrives, fitting continues despite disconnect, with a five-minute limit."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadPersonImageRequest"
      responses:
        "200":
          description: "Updated person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PersonImageTooLarge"
    delete:
      operationId: deletePersonImage
      summary: "Remove a person's face"
      description: "Owner-only; no body. Removes the face and returns Person without imageRevision; a person without a face is returned unchanged. A later upload gets a revision never used before. Missing person returns 404 person_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: "Updated person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/face-candidates:
    get:
      operationId: listFaceCandidates
      summary: "List a person's face candidates"
      description: "Owner-only. Open (not dismissed) face candidate pairs the person takes part in, highest similarity first, each as the other person. Missing person returns 404 person_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: "Open pairs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceCandidateList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/face-candidates/{otherId}/confirm:
    post:
      operationId: confirmFaceCandidate
      summary: "Merge a face candidate pair"
      description: "Owner-only; no body. Merges otherId into id through the ordinary merge, or id into otherId when only otherId has a canonical name, and returns the merged person; the pair may be stored in either order. When the merged person had no canonical name and holds no external ID, the merge is recorded as a face_merge entry decided by the owner and undoActivityId names it, so undoActivity takes the merge back; a merged person with an external ID is merged without one, since the undo cannot restore the ID. No open pair of these two people returns 404 face_candidate_not_found; merge limits fail as mergePeople does."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/FaceCandidateOtherId"
      responses:
        "200":
          description: "Merged person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceCandidateConfirmation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/face-candidates/{otherId}/dismiss:
    post:
      operationId: dismissFaceCandidate
      summary: "Dismiss a face candidate pair"
      description: "Owner-only; no body. Marks the open pair of id and otherId, in either order, dismissed; a later analysis or face image never offers it again. No open pair of these two people returns 404 face_candidate_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/FaceCandidateOtherId"
      responses:
        "204":
          description: "Dismissed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/face-candidates/{otherId}/reopen:
    post:
      operationId: reopenFaceCandidate
      summary: "Take back the dismissal of a face candidate pair"
      description: "Owner-only; no body. For undoing \"Not the same\": marks the dismissed pair of id and otherId, in either order, open again, so it is offered as before. No dismissed pair of these two people returns 404 face_candidate_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/FaceCandidateOtherId"
      responses:
        "204":
          description: "Reopened"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/appearances:
    get:
      operationId: listPersonAppearances
      summary: "List a person's face appearances"
      description: "Owner-only. The person's appearances that are not dropped. sort newest (default) puts the newest video (by added time) first, then by descending appearance ID; appearances whose content key no video has follow every appearance with a video. sort leastSimilar puts the appearances least like the person's other faces first, then any that cannot be compared in the newest order; sort mostSimilar puts the most alike first, with the same tail. Each appearance carries its similarity when it can be compared. limit enables pagination with nextCursor; otherwise returns all. Missing person returns 404 person_not_found; an unreadable cursor, or one from another sort, returns 400 invalid_request with reason invalid_cursor."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - name: sort
          in: query
          description: "newest (default), leastSimilar or mostSimilar"
          schema:
            type: string
            enum: [newest, leastSimilar, mostSimilar]
        - name: cursor
          in: query
          description: "Opaque nextCursor from the previous response; ignored without limit"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size; omit for all appearances without nextCursor"
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "Appearances"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceAppearanceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/similar-people:
    get:
      operationId: listSimilarPeople
      summary: "List people whose faces look like some of a person's faces"
      description: "Owner-only. Ranks the other people by how close their faces are to the mean of the listed appearances of id, or of all of its appearances without appearanceId: each person is compared by the face image's vector and by the mean of their faces in videos, whichever is closer, most similar first. Each item carries the face count, up to four appearances with a crop and the title of the first appearance's video, so unnamed people can be told apart. Appearances id lacks are ignored; with none left the list is empty. Missing person returns 404 person_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - name: appearanceId
          in: query
          description: "Appearances of the person to compare; repeat for several"
          schema:
            type: array
            maxItems: 200
            items:
              type: integer
              format: int64
              minimum: 1
          style: form
          explode: true
        - name: limit
          in: query
          description: "At most this many people; default 8"
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: "People, most similar first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarPersonList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/appearances/move:
    post:
      operationId: moveFaceAppearances
      summary: "Move face appearances to another person"
      description: "Owner-only. For \"Move to person\": in one transaction moves the listed appearances of id to targetId, with each video's performer credit of id unless another appearance of id in the same work still links it; a target already credited keeps its own credit, and the response's restoreCredits lists those works with the position id's credit had. Passing them back as restoreCredits with the reverse move (Undo) keeps the original target's credit in those works and puts id's back at its position. Returns the target and restoreCredits. Missing person or target returns 404 person_not_found; targetId equal to id returns 400 invalid_request; any appearance that is dropped or linked to another person returns 404 face_appearance_not_found and moves none."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceAppearanceMoveRequest"
      responses:
        "200":
          description: "The person the faces moved to, with the credits only the reverse move can put back"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceAppearanceMove"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/appearances/split:
    post:
      operationId: splitFaceAppearances
      summary: "Split several face appearances into one new person"
      description: "Owner-only. For \"Not this person\" on a selection: as splitFaceAppearance, with every listed appearance moving to one new provisional person whose face is the first appearance's crop, in one transaction. Returns the new person. Missing person returns 404 person_not_found; any appearance that is dropped or linked to another person returns 404 face_appearance_not_found and splits none."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceAppearanceSplitRequest"
      responses:
        "201":
          description: "The new provisional person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/appearances/{appearanceId}/split:
    post:
      operationId: splitFaceAppearance
      summary: "Split a face appearance into a new person"
      description: "Owner-only; no body. For \"Not this person\": in one transaction creates a provisional person whose face is the appearance's crop, moves the appearance to it, moves the video's performer credit of id to it unless another appearance of id in the same work still links that credit, and dismisses the pair of the two people so no automatic rule or candidate joins them again. Returns the new person. Missing person returns 404 person_not_found; an appearance that is dropped or linked to another person returns 404 face_appearance_not_found."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/FaceAppearanceId"
      responses:
        "201":
          description: "The new provisional person"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/face-appearances/{id}/crop:
    get:
      operationId: getFaceAppearanceCrop
      summary: "Return a face appearance's crop"
      description: "Owner-only. Returns the appearance's face crop as JPEG with `Cache-Control: private, max-age=86400`, since a crop is never rewritten and a new appearance gets a new ID. A missing appearance, one whose person was deleted, or one without a crop returns 404 not_found."
      parameters:
        - name: id
          in: path
          required: true
          description: "Face appearance ID"
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: "Crop"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/plugin-fetches:
    post:
      operationId: fetchPersonWithPlugin
      summary: "Fetch a person's information with a person plugin"
      description: "Owner-only. Runs approved person plugin pluginId's fetch once and retains the result in memory for ten minutes without changing the person. source and id come together, from a search candidate; link fetches by that link and returns 400 person_link_unsupported before running when its host matches none of the plugin's domains. With neither, VV sends the person's first stored external ID, in (source, value) order, whose source the plugin declares; without one, the person's only link the plugin handles, after keeping once links that differ only in scheme, host case or a trailing slash; it returns 409 person_link_ambiguous with the choices in links when several remain, and 409 person_external_id_missing when there is no such ID or link, both before running. For a person of the paired node, this node's plugin runs and the peer gives the person's IDs and links; the result's images and apply are answered here too. Missing person returns 404 person_not_found; missing plugin 404 not_found; a work-info plugin 409 plugin_kind_mismatch; only one of source and id, an undeclared source, an id outside 1–200 characters after trimming, a link that is not an http or https URL, link with source or id, or a link the plugin no longer handles when it runs 400 invalid_request. See Run failures in docs/design-docs/work-info-plugins.md."
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonPluginFetchRequest"
      responses:
        "201":
          description: "Fetch result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPluginFetch"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/PluginFailed"
        "503":
          $ref: "#/components/responses/PluginBusy"
        "504":
          $ref: "#/components/responses/PluginTimedOut"

  /api/people/{id}/plugin-fetches/{fetchId}/images/{index}:
    get:
      operationId: getPersonPluginFetchImage
      summary: "Return one of a person fetch's images"
      description: "Owner-only. Returns the image at index among those VV fetched from the plugin's URLs and kept with the result. Missing, expired or another person's results return 404 not_found; an index outside the kept images returns 404 person_image_not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/WorkInfoFetchId"
        - name: index
          in: path
          required: true
          description: "Zero-based index among the kept images"
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: "Person image"
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{id}/plugin-fetches/{fetchId}/apply:
    post:
      operationId: applyPersonPluginFetch
      summary: "Apply selected items of a person fetch"
      description: "Owner-only. Atomically writes the selected profile fields, replacing stored values, and appends the chosen aliases, external IDs and links the person lacks, up to 50, 20 and 100; after commit, the image at imageIndex replaces the person's face. Invalid values, entries over the limits and external IDs another person holds are skipped, and no people are merged. A successful result is consumed. For a person of the paired node, this node rechecks its plugin, the peer writes the values, and the image is uploaded to the peer as the face; an unreachable peer returns 503 service_unavailable and keeps the result. An empty selection, aliases, externalIds or profile.links in items, an item or value the result lacks, or image without an imageIndex among the kept images return 400 invalid_request. A person deleted or merged away returns 404 person_not_found. Expired, unknown or another person's results, or plugin replacement, revocation or deletion after the fetch, return 409 work_info_fetch_stale. These errors write nothing."
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/WorkInfoFetchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPersonPluginFetchRequest"
      responses:
        "200":
          description: "Updated person and skipped values"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPluginFetchApplied"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organizations:
    get:
      operationId: listOrganizations
      summary: "List organizations"
      description: "Owner-only. q substring-matches names and aliases, ordered by sort. limit enables pagination with nextCursor; otherwise returns all matches. favorite and provisional return 400 invalid_request."
      parameters:
        - $ref: "#/components/parameters/CreditQuery"
        - $ref: "#/components/parameters/CreditSort"
        - $ref: "#/components/parameters/CreditCursor"
        - $ref: "#/components/parameters/CreditLimit"
        - $ref: "#/components/parameters/CreditFavorite"
        - $ref: "#/components/parameters/CreditProvisional"
      responses:
        "200":
          description: "Organizations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createOrganization
      summary: "Create an organization"
      description: "Owner-only. Invalid fields return 400 with work_info_* reason and field. An external ID owned by another organization returns 409 external_id_taken with field externalIds[i]. Missing parentId returns 404 organization_not_found with field parentId."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: "Created organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organizations/{id}:
    get:
      operationId: getOrganization
      summary: "Return an organization"
      description: "Owner-only; missing organization returns 404 organization_not_found"
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: "Organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      summary: "Update an organization's name, aliases and external IDs"
      description: "Owner-only. Replaces only supplied properties, replacing lists entirely (null clears them). Unchanged input returns current state without writing. Uses creation errors; missing organization returns 404 organization_not_found. Missing parentId returns the same error with field parentId; self/descendant parents return 400 organization_parent_cycle."
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPatch"
      responses:
        "200":
          description: "Updated organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteOrganization
      summary: "Delete an organization"
      description: "Owner-only; removes video associations. Missing organization returns 404 organization_not_found."
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organizations/{id}/merge:
    post:
      operationId: mergeOrganizations
      summary: "Merge sourceIds into organization id"
      description: "Owner-only. Atomically moves associations, names and external IDs from 1–20,000 sources into the destination and deletes sources. Missing sources go to notFoundIds. Invalid source count returns 400 work_info_too_many with field sourceIds; including the destination returns merge_same_organization; exceeding merged alias/external-ID limits returns work_info_too_many with field aliases or externalIds. Missing destination returns 404 organization_not_found. A source that is an ancestor of the destination returns 400 organization_parent_cycle. Errors change nothing."
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditMergeRequest"
      responses:
        "200":
          description: "Merged destination and missing source IDs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/video-tags:
    post:
      operationId: updateVideoTags
      summary: "Add or remove a video tag"
      description: "Applies action (add/remove) and tag to videoIds plus the current member videos of smartFolderIds, for single-video and bulk callers. Removal requires tag.id; name returns 400. Addition by name resolves synonyms and creates a missing tag. The union must hold 1–20,000 distinct videos after smart folders are resolved, or the request returns 400 too_many_videos without changes; all changes are atomic. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node, applies the local part first in one transaction and then the peer's part in one forwarded request, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. Tags go to the peer by name, created there when missing; applied counts both nodes and remote reports the peer's part, with the peer's video ids that were not changed when it failed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsRequest"
      responses:
        "200":
          description: "Applied result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: "Tag no longer exists (tag_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/video-tags/summary:
    post:
      operationId: summarizeVideoTags
      summary: "Summarize tags on selected videos"
      description: "Summarizes videoIds plus the current member videos of smartFolderIds, under the same 1–20,000 distinct-video limit as updateVideoTags. total counts those videos currently in the library; each tag's count counts assignments among them. count < total indicates partial assignment. items includes tags assigned to at least one video, in natural name order. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node and reads each node's summary, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. Counts merge by tag name; when the peer does not answer, the summary covers this node's videos only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsSummaryRequest"
      responses:
        "200":
          description: "Tag summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTagsSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/video-visibility:
    put:
      operationId: updateVideoVisibility
      summary: "Change video visibility"
      description: "Sets public atomically on videoIds plus the current member videos of smartFolderIds, for single-video and bulk callers. The union must hold 1–20,000 distinct videos after smart folders are resolved, or the request returns 400 too_many_videos without changes. Already-matching videos count as applied. Active guest streams are terminated when their video becomes private. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node, applies the local part first in one transaction and then the peer's part in one forwarded request, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. applied counts both nodes and remote reports the peer's part, with the peer's video ids that were not changed when it failed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoVisibilityRequest"
      responses:
        "200":
          description: "Applied result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVisibilityResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/video-edits/summary:
    post:
      operationId: summarizeVideoEdits
      summary: "Summarize the editable values of selected videos"
      description: "Owner-only. Summarizes videoIds plus the current member videos of smartFolderIds, under the same 1–20,000 distinct-video limit as updateVideoTags, for the bulk editor. total counts the resolved videos in the library, counting videos that share a user-data key once; every other count is out of total, so count < total means only some videos have the value. tags is updateVideoTags' summary; people and organizations are in role order, then natural name order; dates lists each kind at least one video has. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node and reads each node's summary, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. Counts merge by the name of the tag, person or organization, a provisional person staying apart; when the peer does not answer, the summary covers this node's videos only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsSummaryRequest"
      responses:
        "200":
          description: "Summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoEditSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/video-edits:
    post:
      operationId: applyVideoEdits
      summary: "Apply one bulk edit to selected videos"
      description: "Owner-only. Applies every present part to videoIds plus the current member videos of smartFolderIds, under the same 1–20,000 distinct-video limit as updateVideoTags, in one transaction; videos sharing a user-data key change together. tags.add attaches by ID or by name (resolving synonyms and creating a missing tag), tags.remove detaches manual attachments by ID; credits follows VideoCreditEdit; dates sets each listed kind, null clearing it; public sets visibility and ends guest streams of videos made private. Other values stay as they are. A request without any change returns 400 invalid_request. Errors write nothing: a missing tag returns 404 tag_not_found, a missing credit 404 person_not_found or organization_not_found, and an invalid value 400 with `field` at its location in the request, such as credits[0].ids[1] or dates[0].date. Emits the same events and activity as the single-part endpoints. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node, applies the local part first in one transaction and then the peer's part in one forwarded request, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. Tags, people and organizations go to the other node by name, created there when missing; a provisional person, which has no name, with a target on the other node returns 400 invalid_request with provisional_person_remote at its field. applied counts both nodes and remote reports the peer's part, with the peer's video ids that were not changed when it failed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoEditRequest"
      responses:
        "200":
          description: "Applied result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoEditResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "A tag or credit no longer exists (tag_not_found, person_not_found or organization_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/video-code-edits/summary:
    post:
      operationId: summarizeVideoCodeEdits
      summary: "List the code rows of selected videos"
      description: "Owner-only. Resolves videoIds plus the current member videos of smartFolderIds, as summarizeVideoEdits does, under a limit of 1–1,000 distinct videos counted before bundling; over it returns 400 too_many_videos with limit 1000. Returns one row per user-data key of the resolved videos in the library, in the order the videos were first listed. A row's video is the owner list item of the key's shown video (a bundle's representative) and code the key's current code, absent when there is none. Uses `Cache-Control: no-store`. Ids at or above 2^40 name the paired VVMDM's videos and smart folders: the request splits by node and reads each node's rows, and a smart folder of either node adds the other node's videos matching its rule. The limit counts both nodes' resolved videos together. This node's rows come first; when the peer does not answer, the rows cover this node's videos only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTagsSummaryRequest"
      responses:
        "200":
          description: "Rows"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoCodeEditSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/video-code-edits:
    post:
      operationId: applyVideoCodeEdits
      summary: "Write one code per selected video"
      description: "Owner-only. Replaces only the code of each item's user-data key, keeping the key's other work information, in one transaction. The code itself is last-write-wins. Errors write nothing and name the item in `field`: 400 invalid_request for no items, over 1,000 items, a repeated videoId (items[i].videoId) or a second item on a key an earlier item already writes (items[i].videoId); 400 work_info_empty, work_info_too_long or work_info_control_characters at items[i].code; 404 video_not_found at items[i].videoId for a missing, hidden or merged video; 409 content_changed at items[i].contentVersion when the video's contentVersion differs from the item's. A missing video is reported before a changed one. Emits the same events as setVideoWorkInfo for every video of each changed key and writes no activity. Uses `Cache-Control: no-store`. Items whose videoId is at or above 2^40 name the paired VVMDM's videos: the local items are applied first in one transaction, then the peer's in one forwarded request; applied counts both nodes and remote reports the peer's part, with the peer's video ids that were not changed when it failed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCodeEditRequest"
      responses:
        "200":
          description: "Applied result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoCodeEditResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "A video no longer exists (video_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "A video's content changed (content_changed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/collections/delete:
    post:
      operationId: deleteCollections
      summary: "Dissolve groups and delete smart folders in bulk"
      description: "Owner-only. Dissolves groupIds as dissolveGroup does and deletes smartFolderIds with their descendants as deleteSmartFolder does, in one transaction; videos are never deleted. Requires 1–20,000 distinct IDs across the arrays or returns 400 too_many_videos without changes. Missing groups and smart folders are ignored. Emits the same group and smart-folder change events as the single operations. Ids at or above 2^40 name the paired VVMDM's collections: the local ids are applied first in one transaction, then the peer's in one forwarded request; the counts cover both nodes, and remote reports the peer's part, with the peer's ids that were not removed when it failed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionsDeleteRequest"
      responses:
        "200":
          description: "Removed collections"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsDeleteResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/favorites:
    put:
      operationId: updateFavorites
      summary: "Set or clear favorites on videos and groups"
      description: "Owner-only. Sets favorite on videoIds, groupIds, smartFolderIds and personIds. Requires 1–20,000 distinct IDs across the arrays or returns 400 too_many_videos without changes. Missing people, smart folders, groups and videos outside the library are ignored. Unchanged items count, and setting an existing favorite preserves its timestamp. Favoriting a group does not favorite members; group favorites disappear on dissolution. Changes are atomic and emit no events."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritesRequest"
      responses:
        "200":
          description: "Applied result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/playlists:
    get:
      operationId: listPlaylists
      summary: "List playlists by most recently updated"
      description: "Owner-only. Returns up to limit after cursor in descending updatedAt, then ID order. nextCursor indicates more; total counts independently of pagination. version changes on playlist creation/deletion/update. Updated playlists move before the cursor, so clients restart from page one when version changes. Builds covers only for returned items; itemCount counts currently visible items. Invalid cursor returns 400 invalid_cursor; invalid limit returns 400 invalid_request."
      parameters:
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: "Playlist list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createPlaylist
      summary: "Create an empty playlist"
      description: "Owner-only. Trimmed name must contain 1–100 code points or returns 400 invalid_request. Duplicate names are allowed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistName"
      responses:
        "201":
          description: "Created playlist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/playlists/{id}:
    get:
      operationId: getPlaylist
      summary: "Return a playlist and its visible items"
      description: "Owner-only. Returns items in position order when they resolve to current-library videos or groups. Video/group values include owner progress, watchState, watchedCount and favorite, as library items do. Missing playlist returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      responses:
        "200":
          description: "Playlist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: renamePlaylist
      summary: "Rename a playlist"
      description: "Owner-only; follows creation name rules and returns the trimmed name. Missing playlist returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistName"
      responses:
        "200":
          description: "Renamed playlist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlaylist
      summary: "Delete a playlist"
      description: "Owner-only. Deletes items but preserves videos, groups, favorites and playback positions. Missing playlist returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      responses:
        "204":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items:
    post:
      operationId: addPlaylistItems
      summary: "Append videos and groups to a playlist"
      description: "Owner-only. Appends videoIds, then groupIds, then smartFolderIds in request order. Missing IDs are ignored; duplicates count once. Existing items count as existing without changes. Group/smart-folder items disappear when their group dissolves or folder is deleted. Empty input returns 400 invalid_request; over 20,000 distinct IDs returns 400 too_many_videos. Missing playlist returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemsAdd"
      responses:
        "200":
          description: "Append result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItemsAdded"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items/{itemId}:
    delete:
      operationId: removePlaylistItem
      summary: "Remove a playlist item"
      description: "Owner-only. Compacts remaining positions, preserving videos, groups, favorites and playback positions. Missing playlist or item returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - $ref: "#/components/parameters/PlaylistItemId"
      responses:
        "204":
          description: "Removed"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/items/{itemId}/move:
    post:
      operationId: movePlaylistItem
      summary: "Reorder a playlist item"
      description: "Owner-only. Moves the item immediately after afterItemId, or to the start for null. Missing playlist, item or afterItemId within the playlist returns 404 not_found. Moving after itself returns 400 invalid_request."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - $ref: "#/components/parameters/PlaylistItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemMove"
      responses:
        "204":
          description: "Moved"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/watch-history:
    get:
      operationId: listWatchHistory
      summary: "List watch history, newest first"
      description: "Owner-only. Orders by playback start descending, then ID descending. Includes video only when its content currently exists in the library with an accessible location, including non-representative versions. watch, query and date are ANDed before pagination. Invalid cursor returns 400 invalid_cursor. Invalid limit/watch/date/tz, query over 100 characters or date without tz returns 400 invalid_request."
      parameters:
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: watch
          in: query
          description: "Current video watch-state filter; all disables filtering and includes entries without a video"
          schema:
            $ref: "#/components/schemas/WatchHistoryFilter"
        - name: query
          in: query
          description: "Uses video-query syntax (AND, phrases, exclusion, OR, normalization, at most 16 terms), matching only titles: file title/display name for existing videos, saved title otherwise. Does not match paths or tags."
          schema:
            type: string
            maxLength: 100
        - name: date
          in: query
          description: "YYYY-MM-DD or YYYY-MM in tz. Includes entries before that day/month ends; the first page starts there and nextCursor continues backward. Requires tz."
          schema:
            type: string
        - name: tz
          in: query
          description: "IANA timezone for day/month boundaries, such as Asia/Tokyo; required with date"
          schema:
            type: string
      responses:
        "200":
          description: "Watch-history page"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    delete:
      operationId: clearWatchHistory
      summary: "Clear all watch history"
      description: "Owner-only; returns 204 even when empty. Preserves playback position, watched state and last-played time; emits no events."
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/watch-history/dates:
    get:
      operationId: listWatchHistoryDates
      summary: "List days with watch history, newest first"
      description: "Owner-only. Returns YYYY-MM-DD dates in tz with entries matching watch and query; dates or their months can be passed to the list date filter. Missing/unknown tz, invalid watch or query over 100 characters returns 400 invalid_request."
      parameters:
        - name: tz
          in: query
          required: true
          description: "IANA timezone for calendar dates, such as Asia/Tokyo"
          schema:
            type: string
        - name: watch
          in: query
          description: "Same as the list watch filter"
          schema:
            $ref: "#/components/schemas/WatchHistoryFilter"
        - name: query
          in: query
          description: "Same as the list query filter"
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: "Dates containing entries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryDates"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/watch-history/{id}:
    delete:
      operationId: deleteWatchHistoryEntry
      summary: "Delete a watch-history entry"
      description: "Owner-only. Missing entry returns 404 not_found. Preserves playback position, watched state and last-played time; emits no events."
      parameters:
        - $ref: "#/components/parameters/WatchHistoryEntryId"
      responses:
        "204":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/playlists/{id}/playback:
    get:
      operationId: getPlaylistPlayback
      summary: "Return playlist playback position and next video"
      description: "Owner-only. For playlist id, item and video, returns position/count among visible items, continuous-play next, and starting videos for previousItem/nextItem from current order. A group advances to its next member, or the next visible item if at the end or no longer a member. Item starts use the video itself or group openVideoId. An invisible current item has position=0 and navigation uses surrounding visible items. No next at playlist end. Missing/noninteger item or video returns 400 invalid_request; missing playlist/item returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - name: item
          in: query
          required: true
          description: "Playing item ID"
          schema:
            type: integer
            format: int64
        - name: video
          in: query
          required: true
          description: "Video ID open in the player"
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Position and next video"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistPlayback"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/video-bundles:
    post:
      operationId: bundleVideos
      summary: "Bundle videos as versions of the same video"
      description: "Owner-only. Bundles videoIds using representativeId as the listed representative and source of bundle tags, progress and visibility. Existing bundles expand to all members. Counts distinct input IDs: fewer than two returns 400 too_few_videos; over 20,000 returns too_many_videos; unselected representative returns representative_not_selected. Missing videos or videos without registered-folder locations return 404 video_not_found; a virtual video returns 409 virtual_video. Errors change nothing. Emits video events for all members after commit. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoBundleRequest"
      responses:
        "200":
          description: "New bundle versions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoVersions"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/version-candidates:
    get:
      operationId: listVersionCandidates
      summary: "List possible duplicate videos"
      description: "Owner-only. Returns up to 200 newest pairs with matching fingerprints, similar duration and registered-folder locations on both sides. total counts all candidates. Excludes dismissed pairs and same-bundle pairs. Fingerprint import updates candidates; refetch on scan events."
      responses:
        "200":
          description: "Candidate list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionCandidatePage"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/version-candidates/dismiss:
    post:
      operationId: dismissVersionCandidate
      summary: "Record two videos as different"
      description: "Owner-only. Dismisses the pair and removes its candidate, even if no candidate exists; the pair is excluded thereafter. Requires exactly two distinct videoIds or returns 400 invalid_request. Missing videos or registered-folder locations return 404 video_not_found and a virtual video returns 409 virtual_video, without changes. To mark them the same, use POST /api/video-bundles with both videos and a representative."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCandidateDismissRequest"
      responses:
        "204":
          description: "Recorded"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/version-candidates/rejudge:
    post:
      operationId: rejudgeVersionCandidate
      summary: "Judge a possible duplicate again"
      description: "Owner-only. Returns an undecided, failed or no_connection pair to waiting with a fresh retry count, and its activity record to running, so the duplicate judging worker sends it to the classifier again. Requires exactly two distinct videoIds or returns 400 invalid_request. Missing videos return 404 video_not_found; a pair that is not a judgeable candidate returns 404 not_found. Judging turned off returns 409 version_judging_off; a waiting or running pair returns 409 version_not_rejudgeable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCandidateDismissRequest"
      responses:
        "202":
          description: "Queued"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/activity:
    get:
      operationId: listActivity
      summary: "List activity records, newest first"
      description: "Owner-only. Returns top-level records in descending ID order: import pipelines and records that belong to no pipeline. A pipeline's members are not listed on their own; they appear in its members, and a member of two pipelines appears under both. Filters are ANDed before pagination. status matches the top-level record's own status; feature, decider, since and q match a pipeline when the pipeline or any one of its members satisfies all of them. counts applies every filter except status; features applies every filter except feature and counts a pipeline once under each feature that it or a matching member has. Unknown status/feature/decider, unreadable cursor/since or out-of-range q/limit returns 400 invalid_request (invalid_cursor reason for unreadable cursors)."
      parameters:
        - name: status
          in: query
          description: "Restrict to this status; omit for all"
          schema:
            $ref: "#/components/schemas/ActivityStatus"
        - name: feature
          in: query
          description: "Restrict to these features; repeat to select several, omit for all"
          style: form
          explode: true
          schema:
            type: array
            maxItems: 11
            items:
              $ref: "#/components/schemas/ActivityFeature"
        - name: decider
          in: query
          description: "Restrict to this decision maker"
          schema:
            $ref: "#/components/schemas/ActivityDecider"
        - name: since
          in: query
          description: "Records created at or after this time"
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: "Case-insensitive substring of the subject display name"
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: "Activity page and counts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/activity/{id}:
    get:
      operationId: getActivity
      summary: "Read one activity record with its details"
      description: "Owner-only. Returns a record of any kind with what the list leaves out: a pipeline's members, a member's pipelines and an import's stage rows. Missing record returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: "Activity record and its details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/activity/{id}/retry:
    post:
      operationId: retryActivity
      summary: "Retry an activity operation"
      description: "Owner-only. Starts a retry with 202, creating a new record and closing this one; version_judgement instead keeps its record and returns to running. import requeues failed stages; scan starts a manual scan of all folders. Missing record returns 404 not_found; unavailable retry, a pipeline record or missing subject returns 409 activity_not_retryable; active scans return scan_in_progress; disabled auto-tagging returns auto_tagging_off; face_analysis queues the video again, and disabled face recognition returns face_recognition_off."
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "202":
          description: "Restarted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/activity/{id}/judgement-frames/{index}:
    get:
      operationId: getActivityJudgementFrame
      summary: "Return a frame pair a duplicate judgement showed the classifier"
      description: "Owner-only. Returns the image at index in the version_judgement record's evidence frames: the left video's frame on the left and the other's on the right, cut from the two current seek previews as the classifier received them. A missing record, a record without evidence, an index outside its frames or a missing seek preview returns 404 not_found. Uses Cache-Control: no-store."
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - name: index
          in: path
          required: true
          description: "Position in the record's evidence frames"
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: "Image"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/activity/{id}/undo:
    post:
      operationId: undoActivity
      summary: "Undo an automatic decision"
      description: "Owner-only. Reverts the decision and returns an owner undo record. If the owner already changed state, outcome is already_reverted. Undoing a face_merge also dismisses the face candidate pair of its two people. Missing activity, a tag not assigned by its auto_tag action or a link not made by its face_analysis action returns 404 not_found. Unsupported (including pipeline records), already-undone records/tags/links return 409 activity_not_undoable."
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUndoRequest"
      responses:
        "200":
          description: "Owner undo record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEntry"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/directories:
    get:
      operationId: listDirectories
      summary: "List immediate directories for the folder picker"
      parameters:
        - name: path
          in: query
          description: "Absolute path to list; omit for navigation roots"
          schema:
            type: string
      responses:
        "200":
          description: "Directory list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders:
    get:
      operationId: listRootFolders
      security:
        - sessionCookie: []
        - {}
      summary: "List top-level registered media folders"
      description: "Derives folders from imported location paths rather than storing them. Includes empty registered folders, in natural name order. Version bundles count only effective-representative locations; folders containing only other versions count as empty. Guests count public videos only and omit roots without public-video locations."
      responses:
        "200":
          description: "Registered-folder summaries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolderListing"

  /api/folders/{rootId}:
    get:
      operationId: getFolder
      security:
        - sessionCookie: []
        - {}
      summary: "Return a folder and its immediate children"
      description: "Identifies folders by registered media-folder ID and slash-separated relative path. Returns immediate children in natural name order. Counts only effective-representative locations, as listRootFolders does. Guests count public videos only; folders without public locations return 404, including a root requested without path."
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "200":
          description: "Folder and immediate children"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folders/{rootId}/videos:
    get:
      operationId: listFolderVideos
      security:
        - sessionCookie: []
        - {}
      summary: "List folder videos"
      description: "scope selects direct locations (default, excluding descendants) or the entire subtree. Query matching considers only locations in that scope; pagination, filtering (including tag, person, personRole, organization and tagKind) and sorting follow listVideos. title and sizeBytes use the lexicographically first matching location path in scope, deduplicating videos with multiple locations. Missing folders return 404 regardless of scope/query. Version bundles appear only when their effective representative has a location in scope; other versions never appear individually. Bundle queries may match any version location, but title and sizeBytes use the first representative location in scope. Guests see public videos only; folders with no public-video locations, including roots, return 404. Guest watch filters other than all, played/favorited sorts, favorite=true, tag, person, organization and tagKind return 400 invalid_request."
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
        - name: scope
          in: query
          description: "direct selects immediate locations; subtree includes all descendants"
          schema:
            $ref: "#/components/schemas/FolderScope"
        - name: query
          in: query
          description: "Search terms are ANDed. Double quotes form phrases, a leading `-` excludes a term, and standalone `OR` or `|` joins alternatives. Matching normalizes width, case and hiragana/katakana, and checks title and relative paths below registered folders by substring. Uses at most 16 terms; no remaining terms means no filter. Syntax errors are not reported."
          schema:
            type: string
            maxLength: 100
        - name: favorite
          in: query
          description: "Restrict to favorited items using each item's own favorite state, combined with other filters by AND"
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: seed
          in: query
          description: "Seed for stable `sort=random` ordering across pages; ignored for other sorts"
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
        - name: tag
          in: query
          description: "One parameter per tag ID (`tag=3&tag=8`), combined by AND. At most 16; more returns 400. Unknown IDs are removed from the filter and returned in `missingTagIds`."
          schema:
            type: array
            maxItems: 16
            items:
              type: integer
              format: int64
        - $ref: "#/components/parameters/PersonFilter"
        - $ref: "#/components/parameters/PersonRoleFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
        - $ref: "#/components/parameters/TagKindFilter"
        - $ref: "#/components/parameters/TagNameFilter"
        - $ref: "#/components/parameters/TagKindNameFilter"
        - $ref: "#/components/parameters/PersonNameFilter"
        - $ref: "#/components/parameters/OrganizationNameFilter"
      responses:
        "200":
          description: "Folder videos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups:
    get:
      operationId: listGroups
      security:
        - sessionCookie: []
        - {}
      summary: "List visible groups by name"
      description: "Add-to-group picker: returns visible groups at any depth, in natural name order then ID, up to limit after cursor. Trimmed q is a case-insensitive name substring; empty q selects all. Values follow getGroup and guest values use public videos only. Excludes groups without visible videos. Invalid cursor returns 400 invalid_cursor; invalid limit returns 400 invalid_request. With node=peer the request is forwarded to the paired VVMDM, whose nextCursor is passed through and whose group and video ids carry 2^40; while the peer is not connected it returns 503 service_unavailable with peer_unreachable."
      parameters:
        - name: node
          in: query
          description: "Node whose groups are listed: this one (local) or the paired VVMDM (peer). The picker sends the node of the selected videos."
          schema:
            type: string
            enum: [local, peer]
            default: local
        - name: q
          in: query
          description: "Trimmed, case-insensitive name substring"
          schema:
            type: string
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Group page"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    post:
      operationId: createGroup
      summary: "Create a group from videos and groups"
      description: "Owner-only. Trimmed name must contain 1–100 code points; duplicate names are allowed. Adds videoIds then groupIds in request order. Empty/oversized name or no members returns 400 invalid_request. Any missing video/group returns 404 group_target_not_found without creating anything. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: "Created group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}:
    get:
      operationId: getGroup
      security:
        - sessionCookie: []
        - {}
      summary: "Return a group, its trail and first item page"
      description: "Returns LibraryGroup, the still-connected portion of trail and the first 100 matching items. Omitted sort uses saved position order; temporary filters and explicit sort apply before paging and never modify positions. Omits invisible videos and child groups without visible videos; continue with listGroupItems. Group values count descendant videos in depth-first playback order, deduplicated at first occurrence, using public videos only for guests. Missing groups and groups with no visible videos return 404 not_found."
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: sort
          in: query
          description: "Temporary list sort; omitted sort keeps the saved order."
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: favorite
          in: query
          description: "Temporary favorite-only filter; does not change saved settings."
          schema:
            type: boolean
        - name: seed
          in: query
          description: "Stable random-sort seed; continue with the same filters, sort and seed."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
        - name: query
          in: query
          description: "Video search with the same terms, phrases, exclusions, OR and normalization as listVideos. Search all visible descendants; retain child-group cards with matching descendants. Group summaries and playback still describe all visible members."
          schema:
            type: string
            maxLength: 100
        - name: trail
          in: query
          description: "Comma-separated group IDs visited by the UI, outermost first. Response trail retains the connected parent-child chain outward from this group and drops ancestors beyond the first broken link."
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: "Group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: renameGroup
      summary: "Rename a group"
      description: "Owner-only; follows creation name rules and returns the trimmed name. Missing group returns 404 not_found. A live undoToken from the organize/group operation that created this group updates that token's undo snapshot to include the rename, so undo still deletes it. Other tokens are ignored and never cause rename failure."
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRename"
      responses:
        "200":
          description: "Renamed group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: dissolveGroup
      summary: "Dissolve a group"
      description: "Owner-only. Deletes the group and its items, retaining child groups and videos and removing its item from parents. Automatic groups record ungroup on their folder. Missing group returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: "Dissolved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/items:
    get:
      operationId: listGroupItems
      security:
        - sessionCookie: []
        - {}
      summary: "Return the next page of group items"
      description: "Continues getGroup items after nextCursor using the same temporary filters, sort and seed. Omitted sort uses position order. Invalid cursors return 400 invalid_cursor. Missing or invisible groups return 404 not_found as in getGroup."
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: sort
          in: query
          description: "Temporary list sort; omitted sort keeps the saved order."
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: favorite
          in: query
          description: "Temporary favorite-only filter; does not change saved settings."
          schema:
            type: boolean
        - name: seed
          in: query
          description: "Stable random-sort seed; continue with the same filters, sort and seed."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
        - name: query
          in: query
          description: "Video search with the same terms, phrases, exclusions, OR and normalization as listVideos. Search all visible descendants; retain child-group cards with matching descendants. Group summaries and playback still describe all visible members."
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Item page"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addGroupItems
      summary: "Append videos and groups to a group"
      description: "Owner-only. Appends videoIds then groupIds in request order, skipping existing items. Empty input returns 400 invalid_request. Missing targets return 404 group_target_not_found; adding self or an ancestor returns 409 group_cycle. These errors add nothing. Missing destination returns 404 not_found. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembers"
      responses:
        "200":
          description: "Updated group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/groups/{id}/items/remove:
    post:
      operationId: removeGroupItems
      summary: "Remove group items"
      description: "Owner-only. Removes items and compacts positions, preserving videos and child groups. Removed folder-derived items stay excluded after rebuilding automatic groups. Removing the last item dissolves the group as DELETE does, recording ungroup for automatic groups, and returns bodyless 204. Any absent item returns 404 group_target_not_found without removals; missing group returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupItemRemove"
      responses:
        "200":
          description: "Updated group when items remain"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryGroup"
        "204":
          description: "Group dissolved after removing its last item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/items/{itemId}/move:
    post:
      operationId: moveGroupItem
      summary: "Reorder a group item"
      description: "Owner-only. Moves the item immediately after after, or to the start when omitted. Self-reference returns 400 invalid_request; item/after absent from the group returns 404 group_target_not_found; missing group returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/GroupItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupItemMove"
      responses:
        "204":
          description: "Moved"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/groups/{id}/tag:
    post:
      operationId: tagGroup
      summary: "Convert a group to a tag"
      description: "Owner-only; no body. Atomically normalizes the group name with NormalizeTagName, resolves a tag by name/synonym or creates one, assigns it manually to all descendant videos, and dissolves the group. Invalid name returns 400 invalid_request without changes; missing group returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: "Applied tag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupTagResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/smart-folders:
    get:
      operationId: listSmartFolders
      security:
        - sessionCookie: []
        - {}
      summary: "List visible smart folders with parent IDs"
      description: "Unpaginated list for parent selectors and folder trees, in natural name order then ID across all depths. Owners see all folders; guests see none. favorite appears only for owners."
      responses:
        "200":
          description: "Smart folders"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderList"
    post:
      operationId: createSmartFolder
      summary: "Create a smart folder"
      description: "Owner-only. Trimmed name follows group rules (1–100 code points). Defaults to sort=addedDesc and no parent. Invalid rule or random sort returns 400 invalid_smart_rule; invalid name returns 400 invalid_request; missing parent returns 404 smart_folder_not_found. Errors create nothing. Rules may reference missing tags, kinds, people or organizations, reported by getSmartFolder settings.missing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartFolderCreate"
      responses:
        "201":
          description: "Created smart-folder summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/smart-folders/cards:
    get:
      operationId: listSmartFolderCards
      security:
        - sessionCookie: []
        - {}
      summary: "Return values for displayed smart-folder cards"
      description: "Returns distinct requested IDs in input order. Values aggregate visible videos matching all path rules, without grouping. Skips missing folders, and every folder for guests. Missing, empty, noninteger or over-60 IDs return 400 invalid_request. Guests omit watchedCount, watchState, lastPlayedAt and favorite, with empty tags."
      parameters:
        - name: ids
          in: query
          required: true
          description: "Comma-separated folder IDs, 1–60"
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 60
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: "Card values"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderCards"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/smart-folders/{id}:
    get:
      operationId: getSmartFolder
      security:
        - sessionCookie: []
        - {}
      summary: "Return a smart folder, ancestors and first content page"
      description: "Returns LibrarySmartFolder values derived from playback order, ancestors outermost first, and the first page. Child-folder summaries come first by name for the owner, followed by up to limit library items matching this folder and all ancestors in the folder's sort order. Continue with listSmartFolderItems. Only owners receive settings (rule, sort and missing references). Missing entities referenced by path rules leave only child folders. Missing or guest-invisible folders return 404 not_found."
      parameters:
        - $ref: "#/components/parameters/SmartFolderId"
        - name: sort
          in: query
          description: "Temporary list sort; omitted sort keeps the saved order."
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: favorite
          in: query
          description: "Temporary favorite-only filter; does not change saved settings."
          schema:
            type: boolean
        - name: seed
          in: query
          description: "Stable random-sort seed; continue with the same filters, sort and seed."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
        - name: query
          in: query
          description: "Temporary video search within the current saved-rule result. Uses the library video-query syntax and audience permissions. Does not change saved rules, folder summary or playback order. Search hides child-folder navigation; no matches returns an empty page, not 404. Continue with the same query."
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: "Page size excluding child folders"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Smart folder"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeSmartFolder
      summary: "Update a smart folder's name, rule, sort or parent"
      description: "Owner-only. Changes only supplied fields; no fields returns 400 invalid_request. Null parentId moves to the root. Uses creation validation; self/descendant parents additionally return 409 smart_folder_cycle without changes. Missing folder returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/SmartFolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartFolderChange"
      responses:
        "200":
          description: "Updated smart-folder summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSmartFolder
      summary: "Delete a smart folder and descendants"
      description: "Owner-only. Deletes folders, their favorites and playlist items, preserving videos. Missing folder returns 404 not_found."
      parameters:
        - $ref: "#/components/parameters/SmartFolderId"
      responses:
        "204":
          description: "Deleted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/smart-folders/{id}/items:
    get:
      operationId: listSmartFolderItems
      security:
        - sessionCookie: []
        - {}
      summary: "Return the next smart-folder content page"
      description: "Continues getSmartFolder content after nextCursor; child folders appear only on the first page. Invalid cursors return 400 invalid_cursor. Missing or invisible folders return 404 not_found as in getSmartFolder."
      parameters:
        - $ref: "#/components/parameters/SmartFolderId"
        - name: sort
          in: query
          description: "Temporary list sort; omitted sort keeps the saved order."
          schema:
            $ref: "#/components/schemas/VideoSort"
        - name: favorite
          in: query
          description: "Temporary favorite-only filter; does not change saved settings."
          schema:
            type: boolean
        - name: seed
          in: query
          description: "Stable random-sort seed; continue with the same filters, sort and seed."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2147483647
        - name: query
          in: query
          description: "Temporary video search within the current saved-rule result. Uses the library video-query syntax and audience permissions. Does not change saved rules, folder summary or playback order. Search hides child-folder navigation; no matches returns an empty page, not 404. Continue with the same query."
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          required: true
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: "Content page"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFolderItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/reorder:
    post:
      operationId: organizeReorder
      summary: "Reorder group items together and return an undo token"
      description: "Owner-only. Atomically moves itemIds in display order immediately after after in groupId, or to the start when omitted. Returns undoToken. Empty itemIds or after within itemIds returns 400 invalid_request. Missing group/items/after or items outside the group return 404 group_target_not_found without writing. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeReorder"
      responses:
        "200":
          description: "Reordered; undo token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/group:
    post:
      operationId: organizeGroup
      summary: "Create a group from dragged videos and the drop target"
      description: "Owner-only. Names the new group from the first 100 characters of target's title, adding target then items in display order. When from is supplied, the new group replaces target there and removes target/items from from. Atomic; returns groupId and undoToken. Empty items or group items return 400 invalid_request. Missing videos/from or videos outside from return 404 group_target_not_found without writing. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeGroup"
      responses:
        "200":
          description: "Created group ID and undo token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/organize/move:
    post:
      operationId: organizeMove
      summary: "Move cards into, between or out of groups and return an undo token"
      description: "Owner-only. Appends items to to in display order, skipping duplicates, and removes them from optional from. Omitted to means removal only (drop on library). Records exclusions for removed folder-derived members and dissolves an emptied from group. Atomic; returns undoToken. Missing or identical from/to returns 400 invalid_request. Missing groups/cards or cards outside from returns 404 group_target_not_found. Moving to self/descendant returns 409 group_cycle. Errors write nothing. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeMove"
      responses:
        "200":
          description: "Moved; undo token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organize/merge:
    post:
      operationId: organizeMerge
      summary: "Merge dragged groups and return an undo token"
      description: "Owner-only. Processes items in display order: merges groups into into and appends videos, skipping duplicates. Merging X appends its items, carries its favorite, replaces playlist/parent items at X's position with into, then deletes X. If the parent already contains into or into is the parent/ancestor, removes X's item instead. Optional from removes dragged cards in the same transaction without replacing group items with into; folder-derived members get exclusions. Atomic; returns undoToken. No group items returns 400 invalid_request; missing targets/from/cards or cards outside from returns 404 group_target_not_found; merging self/ancestor returns 409 group_cycle. Errors write nothing. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeMerge"
      responses:
        "200":
          description: "Merged; undo token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organize/bundle:
    post:
      operationId: organizeBundle
      summary: "Bundle dragged videos with the drop target as representative"
      description: "Owner-only. Bundles videoIds with target as representative, expanding existing bundles to all members. Uses video-bundles rules atomically and returns undoToken. No video besides target returns 400 invalid_request; over 20 videos after expansion returns 400 too_many_videos; videos absent from the library return 404 group_target_not_found; a virtual video returns 409 virtual_video. Errors write nothing. Ids at or above 2^40 name the paired VVMDM's videos and groups: when every id does, the request is forwarded to the peer and its answer's ids carry 2^40; ids of both nodes return 400 invalid_request with mixed_nodes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeBundle"
      responses:
        "200":
          description: "Bundled; undo token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/organize/undo:
    post:
      operationId: organizeUndo
      summary: "Undo a drag operation"
      description: "Owner-only. Restores the state before token's operation. Changed rows since the operation return 409 undo_conflict without writing. Missing, consumed or over-ten-minute-old tokens return 410 undo_expired. Single-use. A token from a forwarded operation is undone on the paired VVMDM."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeUndo"
      responses:
        "204":
          description: "Undone"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: "Undo token missing, consumed or older than ten minutes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/folders/{rootId}/grouping:
    put:
      operationId: setFolderGrouping
      summary: "Set or clear a folder grouping override"
      description: "auto clears the override; ungroup disables grouping; groupDirect groups immediate videos. Repeating the current value returns 200. Saving and rebuilding the index are atomic, last-write-wins. Folder existence follows getFolder; missing folders return 404."
      parameters:
        - $ref: "#/components/parameters/FolderRootId"
        - $ref: "#/components/parameters/FolderPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderGroupingRequest"
      responses:
        "200":
          description: "Updated grouping mode"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderGrouping"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/scans/current:
    get:
      operationId: getCurrentScan
      summary: "Return the latest scan state"
      description: "Returns the active scan if any, otherwise the most recently completed scan"
      responses:
        "200":
          description: "Scan state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: "No scan has run"

  /api/scans/current/issues:
    get:
      operationId: listCurrentScanIssues
      summary: "List latest import issues"
      description: "Returns one issue per video, or per file when unregistered. Failures sort first, then filename and folder. Excludes locations outside registered folders from both this list and Scan.issues counts. Issues are not streamed through SSE; refetch when Scan.id or Scan.issues.revision changes."
      parameters:
        - name: cursor
          in: query
          description: "Opaque `nextCursor` from the previous response"
          schema:
            type: string
        - name: limit
          in: query
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "Issues"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanIssuePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: "No scan has run"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/events:
    get:
      operationId: streamEvents
      security:
        - sessionCookie: []
        - {}
      summary: "Stream import and video changes through Server-Sent Events"
      description: "Sends changes only, except connection-keeping comments. scan carries Scan when scanning, job results or current work change; video carries VideoChanged for detail refetch; group carries GroupChanged IDs for the changed group and ancestors; smartFolder carries SmartFolderChanged IDs for edited folders, descendants and parent, or all folders when matching may change (tags, people, organizations, favorites, watch state, library videos, bundles or groups). onboarding carries an empty object to owners when setup progress changes; refetch GET /api/onboarding. candidates and activity carry empty objects after committed changes; refetch their lists/counts. peer carries PeerState in the audience's shape (as getPeer returns it) on every pairing state change and once on connection. While paired, the peer's video, group and smartFolder events are forwarded with its ids plus 2^40. Sends one current scan on connection when available, but does not replay missed video/group/smartFolder/candidates/activity/onboarding/assistant events. assistant carries an empty object to owners after every committed change of an assistant proposal; refetch the proposals the panel shows. Guests receive only group, smartFolder and peer; scan, video, onboarding, candidates, activity and assistant are owner-only."
      responses:
        "200":
          description: "Event stream"
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vv_session
      description: "Session ID issued on login. HTTPS uses __Host-vv_session; HTTP uses vv_session. OpenAPI apiKey supports one name, so this definition uses the HTTP name."
  headers:
    SessionSetCookie:
      description: "Session cookie: HTTPS uses `__Host-vv_session=<ID>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=<seconds>`; HTTP uses `vv_session=<ID>; HttpOnly; SameSite=Strict; Path=/; Max-Age=<seconds>`."
      schema:
        type: string

  parameters:
    AssistantReviewRunId:
      name: id
      in: path
      required: true
      description: "Assistant review run ID"
      schema:
        type: integer
        format: int64
    AssistantProposalId:
      name: id
      in: path
      required: true
      description: "Assistant proposal ID"
      schema:
        type: integer
        format: int64
    ActivityId:
      name: id
      in: path
      required: true
      description: "Activity record ID"
      schema:
        type: integer
        format: int64
    ThumbnailEditId:
      name: editId
      in: path
      required: true
      description: "Thumbnail-edit session ID"
      schema:
        type: string
    VideoGroupContext:
      name: group
      in: query
      required: false
      description: "Group from which the video was opened. If its visible playback order contains the video, uses that order for context, navigation and member windows/pages. If omitted or inapplicable, uses the lowest-ID visible group directly containing the video."
      schema:
        type: integer
        format: int64
    VideoSmartFolderContext:
      name: smartFolder
      in: query
      required: false
      description: "Smart folder from which the video was opened. Without group, uses its visible playback order for context, navigation and member windows/pages when it contains the video. group takes precedence; inapplicable folders are ignored."
      schema:
        type: integer
        format: int64
    VideoId:
      name: id
      in: path
      required: true
      description: "Video ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonFilter:
      name: person
      in: query
      description: "Positive person ID, matching videos associated in any role and ANDed with other filters including total. Unknown IDs return an empty list without errors or missing-ID reports. Invalid IDs return 400 invalid_request; guests return 400 invalid_request/guest_filter_not_allowed."
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonRoleFilter:
      name: personRole
      in: query
      description: "Keeps only videos linked to `person` in this role, including total. Requires `person` or `personName`; without either, or with an unknown role, returns 400 invalid_request. Guests return 400 invalid_request/guest_filter_not_allowed."
      schema:
        $ref: "#/components/schemas/WorkPersonRole"
    OrganizationFilter:
      name: organization
      in: query
      description: "Organization ID, matching any role; follows person filter semantics"
      schema:
        type: integer
        format: int64
        minimum: 1
    TagKindFilter:
      name: tagKind
      in: query
      description: "Positive tag-kind ID, matching any manual or folder-derived tag of that kind, ANDed with other filters including total. Unknown IDs return an empty list without errors/reports. Invalid IDs return 400 invalid_request; guests return 400 invalid_request/guest_filter_not_allowed."
      schema:
        type: integer
        format: int64
        minimum: 1
    MinDurationFilter:
      name: minDurationMs
      in: query
      description: "Videos at least this long, in milliseconds; a video of unknown duration never matches. Above `maxDurationMs` returns 400 invalid_request."
      schema:
        type: integer
        format: int64
        minimum: 0
    MaxDurationFilter:
      name: maxDurationMs
      in: query
      description: "Videos at most this long, in milliseconds; a video of unknown duration never matches."
      schema:
        type: integer
        format: int64
        minimum: 0
    AddedFromFilter:
      name: addedFrom
      in: query
      description: "Videos added on or after the start of this `YYYY-MM-DD` day in the server's local time zone. After `addedTo`, or a day that does not parse, returns 400 invalid_request."
      schema:
        type: string
    AddedToFilter:
      name: addedTo
      in: query
      description: "Videos added before the start of the day after this `YYYY-MM-DD` day in the server's local time zone."
      schema:
        type: string
    WatchStateFilter:
      name: watchState
      in: query
      description: "Videos in this watch state, derived from playback positions as the cards' `watchState` is. Guests return 400 invalid_request/guest_filter_not_allowed."
      schema:
        $ref: "#/components/schemas/WatchState"
    TagNameFilter:
      name: tagName
      in: query
      description: "One parameter per tag name (`tagName=a&tagName=b`), matching a tag by its name or a synonym, combined by AND with `tag`. At most 16 together with `tag`; more returns 400. A name no tag has matches no video. Guests return 400 invalid_request/guest_filter_not_allowed."
      schema:
        type: array
        maxItems: 16
        items:
          type: string
          minLength: 1
    TagKindNameFilter:
      name: tagKindName
      in: query
      description: "Tag-kind name; follows `tagKind` semantics, and a name no kind has matches no video."
      schema:
        type: string
        minLength: 1
    PersonNameFilter:
      name: personName
      in: query
      description: "Canonical person name; follows `person` semantics for every person with that name, and `personRole` applies to it as to `person`. A name no person has matches no video."
      schema:
        type: string
        minLength: 1
    OrganizationNameFilter:
      name: organizationName
      in: query
      description: "Canonical organization name; follows `organization` semantics, and a name no organization has matches no video."
      schema:
        type: string
        minLength: 1
    MediaFolderId:
      name: id
      in: path
      required: true
      description: "Media folder ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    APITokenId:
      name: id
      in: path
      required: true
      description: "API token ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkInfoPluginId:
      name: id
      in: path
      required: true
      description: "Work-info plugin ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkInfoFetchId:
      name: fetchId
      in: path
      required: true
      description: "Fetch result ID"
      schema:
        type: string
        minLength: 1
        maxLength: 64
    GroupId:
      name: id
      in: path
      required: true
      description: "Group ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    SmartFolderId:
      name: id
      in: path
      required: true
      description: "Smart folder ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    GroupItemId:
      name: itemId
      in: path
      required: true
      description: "Group item ID, distinct from a video or group ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    PlaylistId:
      name: id
      in: path
      required: true
      description: "Playlist ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    WatchHistoryEntryId:
      name: id
      in: path
      required: true
      description: "Watch-history entry ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    VideoTagId:
      name: tagId
      in: path
      required: true
      description: "Assigned video-tag ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    TagId:
      name: id
      in: path
      required: true
      description: "Tag ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    TagKindId:
      name: id
      in: path
      required: true
      description: "Tag kind ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonId:
      name: id
      in: path
      required: true
      description: "Person ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    FaceAppearanceId:
      name: appearanceId
      in: path
      required: true
      description: "ID of the face appearance"
      schema:
        type: integer
        format: int64
        minimum: 1
    FaceCandidateOtherId:
      name: otherId
      in: path
      required: true
      description: "ID of the other person of the pair"
      x-vv-entity: person
      schema:
        type: integer
        format: int64
        minimum: 1
    OrganizationId:
      name: id
      in: path
      required: true
      description: "Organization ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    CreditQuery:
      name: q
      in: query
      description: "Normalized, trimmed query; nonempty queries substring-match names or aliases"
      schema:
        type: string
        maxLength: 100
    CreditSort:
      name: sort
      in: query
      description: "Sort order"
      schema:
        $ref: "#/components/schemas/CreditSort"
    CreditCursor:
      name: cursor
      in: query
      description: "Previous nextCursor, continued with the same q and sort; ignored without limit"
      schema:
        type: string
    CreditLimit:
      name: limit
      in: query
      description: "Page size; omit for all results without nextCursor"
      schema:
        type: integer
        minimum: 1
        maximum: 200
    CreditFavorite:
      name: favorite
      in: query
      description: "People only: true keeps favorite people, combined with q by AND, and total counts them. Any value on an organization list returns 400 invalid_request."
      schema:
        type: boolean
        default: false
    CreditProvisional:
      name: provisional
      in: query
      description: "People only: true keeps provisional people (no canonical name), false keeps named people; omit for both. Combined with q and favorite by AND, and total counts the matches. Any value on an organization list returns 400 invalid_request."
      schema:
        type: boolean
    FolderRootId:
      name: rootId
      in: path
      required: true
      description: "Registered media-folder ID containing this folder"
      schema:
        type: integer
        format: int64
        minimum: 1
    PlaylistItemId:
      name: itemId
      in: path
      required: true
      description: "Playlist item ID"
      schema:
        type: integer
        format: int64
        minimum: 1
    FolderPath:
      name: path
      in: query
      description: "Slash-separated path relative to the registered folder; omitted/empty selects the root. Rejects empty segments, leading/trailing slash, dot and dot-dot segments."
      schema:
        type: string

  responses:
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: "Invalid request format"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Operation is not same-origin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Operation conflicts with current state"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PluginTooLarge:
      description: "Plugin module exceeds limit"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PersonImageTooLarge:
      description: "Uploaded person image body exceeds the byte limit (reason person_image_too_large, limit)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PluginFailed:
      description: "Plugin execution failed (reason, pluginMessage, host)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PluginBusy:
      description: "Another plugin run did not release a slot"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PluginTimedOut:
      description: "Plugin execution stopped after exceeding 30 seconds"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderFailed:
      description: "Image-edit provider (ComfyUI) rejected input upload or run submission"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SetupRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          description: "1–128 characters, without control characters or surrounding whitespace"
        password:
          type: string
          description: "1–1024 bytes"

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
        next:
          type: string
          description: "Candidate redirect after login; omitted or unsafe values become `/`"

    AuthRedirect:
      type: object
      required: [redirectTo]
      additionalProperties: false
      properties:
        redirectTo:
          type: string
          description: "Server-validated same-origin navigation path"

    Account:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username:
          type: string

    UpdateAccountRequest:
      type: object
      required: [currentPassword, username]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        username:
          type: string
          description: "1–128 characters, without control characters or surrounding whitespace; send the current username to keep it"
        newPassword:
          type: string
          description: "1–1024 bytes; omit to keep the current password"

    AuthSession:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [owner, guest, setupRequired]
          description: "owner: signed in; guest: signed out; setupRequired: account unconfigured"
        redirectTo:
          type: string
          description: "Validated redirect returned only when next was supplied and state is owner"

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "ok: storage reachable; degraded: process alive without storage connectivity"
        version:
          type: string
          description: "Release name; defaults to dev when unset at build time"
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: "Source commit; omitted when unavailable"
        builtAt:
          type: string
          format: date-time
          description: "Build time; omitted when unavailable"

    MediaFolder:
      type: object
      required: [id, path, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaFolderUsage:
      type: object
      required: [videoBytes]
      additionalProperties: false
      properties:
        videoBytes:
          type: integer
          format: int64
        disk:
          $ref: "#/components/schemas/DiskUsage"

    DiskUsage:
      type: object
      required: [freeBytes, totalBytes]
      additionalProperties: false
      properties:
        freeBytes:
          type: integer
          format: int64
          description: "Space the server process can still write."
        totalBytes:
          type: integer
          format: int64

    CreateMediaFolderRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1

    UpdateMediaFolderRequest:
      type: object
      required: [path, version]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1

    VideoEncoderChoice:
      type: string
      description: "Owner-selected live encoder. auto tries available hardware in nvenc, qsv, vaapi, videotoolbox order, falling back to software."
      enum: [software, nvenc, qsv, vaapi, videotoolbox, auto]

    VideoEncoder:
      type: string
      description: "Effective live-transcode encoder"
      enum: [software, nvenc, qsv, vaapi, videotoolbox]

    EncoderUnavailableReason:
      type: string
      description: "Reason hardware encoding is unavailable"
      enum: [unsupported_os, encoder_missing, check_failed, timed_out]

    EncoderFallbackReason:
      type: string
      description: "Software fallback reason: selected_unavailable after probing, or checking while startup probing remains incomplete"
      enum: [selected_unavailable, checking]

    EncoderAvailability:
      type: object
      required: [encoder, state]
      additionalProperties: false
      properties:
        encoder:
          $ref: "#/components/schemas/VideoEncoder"
        state:
          type: string
          enum: [checking, available, unavailable]
        reason:
          $ref: "#/components/schemas/EncoderUnavailableReason"

    TranscodingSettings:
      type: object
      required: [videoEncoder, effectiveEncoder, checking, encoders]
      additionalProperties: false
      properties:
        videoEncoder:
          $ref: "#/components/schemas/VideoEncoderChoice"
        effectiveEncoder:
          $ref: "#/components/schemas/VideoEncoder"
        fallbackReason:
          $ref: "#/components/schemas/EncoderFallbackReason"
        checking:
          type: boolean
          description: "Startup probing is incomplete"
        encoders:
          type: array
          description: "Always four results in nvenc, qsv, vaapi, videotoolbox order; software is always available and omitted"
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/EncoderAvailability"

    UpdateTranscodingSettingsRequest:
      type: object
      required: [videoEncoder]
      additionalProperties: false
      properties:
        videoEncoder:
          $ref: "#/components/schemas/VideoEncoderChoice"

    NetworkSettings:
      type: object
      required: [lanAccess, port, addresses]
      additionalProperties: false
      description: "Windows desktop LAN access settings"
      properties:
        lanAccess:
          type: boolean
          description: "Saved choice; defaults to false"
        port:
          type: integer
          description: "Current listening port"
        addresses:
          type: array
          description: "When lanAccess=true, http://<address>:<port>/ for every active non-loopback IPv4 address; otherwise empty"
          items:
            type: string

    UpdateNetworkSettingsRequest:
      type: object
      required: [lanAccess]
      additionalProperties: false
      properties:
        lanAccess:
          type: boolean

    PluginProxySettings:
      type: object
      required: [url]
      additionalProperties: false
      description: "Proxy for work-info plugin requests"
      properties:
        url:
          type: string
          maxLength: 2048
          x-vv-secret: true
          description: "Saved URL with http, https or socks5 scheme, host, optional port/userinfo, and no path/query. Empty string disables the proxy."
    UpdatePluginProxySettingsRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: "URL to save, following PluginProxySettings.url; empty string disables the proxy"

    AutoImportSettings:
      type: object
      required: [enabled, watch]
      additionalProperties: false
      description: "Auto-import setting and watch state"
      properties:
        enabled:
          type: boolean
          description: "Saved choice; defaults to true"
        watch:
          $ref: "#/components/schemas/FolderWatch"

    FolderWatch:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          description: "off: disabled or no media folders; starting: attaching watches; active: watching every directory; limited: a problem occurred"
          enum: [off, starting, active, limited]
        problem:
          type: string
          description: "Latest problem, returned only in limited state"
          enum:
            [watch_limit, events_lost, folder_unreachable, permission_denied]
        path:
          type: string
          description: "Absolute path when the problem concerns one directory; user data, not translated"

    UpdateAutoImportSettingsRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    VersionJudgingSettings:
      type: object
      required: [enabled]
      additionalProperties: false
      description: "Automatic duplicate-judging enablement"
      properties:
        enabled:
          type: boolean
          description: "Saved choice; defaults to false"

    UpdateVersionJudgingSettingsRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    AutoTaggingSettings:
      type: object
      required: [enabled, afterImport, threshold, tentativeThreshold, queue]
      additionalProperties: false
      description: "Auto-tagging settings and queue counts; see docs/design-docs/auto-tagging.md"
      properties:
        enabled:
          type: boolean
          description: "Enable classification; when off, no judgement starts and Ollama is not contacted. Defaults to false."
        afterImport:
          type: boolean
          description: "Classify automatically after import when enabled; defaults to false"
        threshold:
          type: number
          format: double
          description: "Minimum probability for confirmed assignment; defaults to 0.8"
        tentativeThreshold:
          type: number
          format: double
          description: "Minimum probability for tentative assignment, at most threshold; defaults to 0.5"
        queue:
          $ref: "#/components/schemas/AutoTaggingQueue"

    OllamaSettings:
      type: object
      required: [endpoint, model, generationModel, saved]
      additionalProperties: false
      description: "Ollama connection; see docs/design-docs/ai-layer.md"
      properties:
        endpoint:
          type: string
          description: "HTTP(S) Ollama base URL; defaults to http://127.0.0.1:11434"
        model:
          type: string
          description: "Decision model name for the Clef classifier; defaults to clef-flash"
        generationModel:
          type: string
          description: "Chat model name the assistant generates with; empty until the owner saves one, and empty turns the assistant off"
        saved:
          type: boolean
          description: "Whether the owner has saved connection settings. Until then, endpoint and model are server defaults; save responses always return true."
    UpdateOllamaSettingsRequest:
      type: object
      required: [endpoint, model]
      additionalProperties: false
      description: "Request to save Ollama settings; omit saved."
      properties:
        endpoint:
          type: string
          description: "Ollama base URL using HTTP or HTTPS."
        model:
          type: string
          description: "Decision model name."
        generationModel:
          type: string
          description: "Generation model name; an empty string clears it and keeps the connection saved. Omitted keeps the saved value."
    OllamaModelList:
      type: object
      required: [items]
      additionalProperties: false
      description: "Models at the saved Ollama endpoint, in Ollama's order."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OllamaModel"
    OllamaModel:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Model name as Ollama lists it, such as qwen3:8b."
    AssistantTurnRequest:
      type: object
      required: [text, context]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: "The owner's request, as untranslated user data; at most 500 characters."
        context:
          $ref: "#/components/schemas/AssistantTurnContext"
        previous:
          $ref: "#/components/schemas/AssistantTurnOutcome"

    AssistantTurnContext:
      type: object
      required: [route]
      additionalProperties: false
      description: "The screen the request was sent from; the server resolves the words meaning this, the selected ones and here from it."
      properties:
        route:
          $ref: "#/components/schemas/AssistantRoute"
        selectedVideoIds:
          type: array
          maxItems: 20000
          description: "The list selection; over 20,000 returns 400 too_many_videos."
          items:
            type: integer
            format: int64
        selectedCollectionIds:
          $ref: "#/components/schemas/AssistantSelectedCollections"
        filter:
          $ref: "#/components/schemas/SmartRule"
        sort:
          $ref: "#/components/schemas/VideoSort"
        pinned:
          type: array
          maxItems: 50
          description: "Ids chosen in a clarification, used before resolving the same name again."
          items:
            $ref: "#/components/schemas/AssistantPin"

    AssistantRoute:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [library, folder, video, person, organization, playlist, group, smartFolder, tag, tags, people, duplicates, settings, other]
        id:
          type: integer
          format: int64
          description: "The entity the screen shows, for the kinds that show one."

    AssistantSelectedCollections:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolders:
          type: array
          maxItems: 20000
          items:
            type: integer
            format: int64

    AssistantPin:
      type: object
      required: [kind, name, id]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/AssistantLabelKind"
        name:
          type: string
          description: "The name the clarification asked about, as untranslated user data."
        id:
          type: integer
          format: int64

    AssistantTurnResponse:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome:
          $ref: "#/components/schemas/AssistantTurnOutcome"

    AssistantTurnOutcome:
      type: object
      required: [kind]
      additionalProperties: false
      description: "One turn's outcome. The panel composes every sentence from these typed members; none is text from the model. filter carries criteria; navigate destination; answer question with total, items and link; proposal the stored proposal; review the review run the request started, or the one of its kind already running; clarify about with candidates or the names that matched nothing; unsupported the catalog operation the assistant cannot build yet, when the model named one; unreadable nothing."
      properties:
        kind:
          type: string
          enum: [filter, navigate, answer, proposal, review, clarify, unsupported, unreadable]
        criteria:
          $ref: "#/components/schemas/AssistantCriteria"
        destination:
          $ref: "#/components/schemas/AssistantDestination"
        question:
          type: string
          enum: [count, appearances, recent, list]
        total:
          type: integer
          description: "The count the screens show for the same filter or entity."
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AssistantAnswerItem"
        link:
          $ref: "#/components/schemas/AssistantAnswerLink"
        proposal:
          $ref: "#/components/schemas/AssistantProposal"
        run:
          $ref: "#/components/schemas/AssistantReviewRun"
        about:
          type: string
          enum: [operation, target, value]
        candidates:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AssistantCandidate"
        names:
          type: array
          description: "Names that matched nothing, as untranslated user data."
          items:
            type: string
        operation:
          type: string
          description: "The catalog row id the model named that the assistant cannot build a request for yet."

    AssistantCriteria:
      type: object
      required: [rule, labels]
      additionalProperties: false
      description: "Library conditions with ids, in the names the library URL uses, and the labels of the entities they name."
      properties:
        rule:
          $ref: "#/components/schemas/SmartRule"
        sort:
          $ref: "#/components/schemas/VideoSort"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/AssistantLabel"

    AssistantDestination:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [video, person, organization, playlist, group, smartFolder, tag, library, folders, tags, people, organizations, playlists, history, duplicates, activity, settings]
        id:
          type: integer
          format: int64
        settingsPage:
          type: string
          enum: [scan, library, auto-tagging, face-recognition, connections, plugins, conversion, network, account, api, danger-zone]

    AssistantAnswerItem:
      type: object
      required: [id, title]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: "The video's title, as untranslated user data."

    AssistantAnswerLink:
      type: object
      additionalProperties: false
      description: "Where the number came from: the library with criteria, or the page of the entity."
      properties:
        criteria:
          $ref: "#/components/schemas/AssistantCriteria"
        destination:
          $ref: "#/components/schemas/AssistantDestination"

    AssistantCandidate:
      type: object
      required: [kind, id, name, count]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/AssistantLabelKind"
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "The entity's name, as untranslated user data."
        count:
          type: integer
          description: "Videos the tag is on or the person or organization is credited on; 0 for other kinds."

    AssistantLabelKind:
      type: string
      enum: [video, tag, tagKind, person, organization, playlist, group, smartFolder, folderRoot]

    AssistantReviewRun:
      type: object
      required: [id, kind, status, total, judged, listed, startedAt]
      additionalProperties: false
      description: "A search for candidate sets of one kind and their judging by the classifier, one question per set."
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [tags, people, works]
        status:
          type: string
          enum: [running, done, failed, interrupted]
          description: "interrupted was stopped by a restart."
        total:
          type: integer
          description: "Candidate sets found."
        judged:
          type: integer
          description: "Sets judged so far."
        listed:
          type: integer
          description: "Sets judged at 0.5 or more and listed."
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    AssistantReviewRunPage:
      type: object
      required: [run, items]
      additionalProperties: false
      properties:
        run:
          $ref: "#/components/schemas/AssistantReviewRun"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantReviewCandidate"
        nextCursor:
          type: string

    AssistantReviewCandidate:
      type: object
      required: [id, probability, members, state]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        probability:
          type: number
          format: double
          description: "The classifier's probability that the set is one entity or one work, 0.5 or more."
        members:
          type: array
          minItems: 2
          description: "Two tags or two people, or two or more videos."
          items:
            $ref: "#/components/schemas/AssistantReviewMember"
        state:
          type: string
          enum: [listed, adopted, rejected]

    AssistantReviewMember:
      type: object
      required: [kind, id, name, count]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/AssistantLabelKind"
        id:
          type: integer
          format: int64
          description: "The tag or person, or a current library video of the member."
        name:
          type: string
          description: "The current name, or the video's title when the set was judged, as untranslated user data."
        count:
          type: integer
          description: "Videos the tag is on or the person is credited on; 0 for a video."

    AssistantReviewCandidateIds:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64

    AssistantReviewAdoption:
      type: object
      required: [proposals, skippedIds]
      additionalProperties: false
      properties:
        proposals:
          type: array
          description: "The approved proposals, in the order of ids."
          items:
            $ref: "#/components/schemas/AssistantProposal"
        skippedIds:
          type: array
          items:
            type: integer
            format: int64

    AssistantReviewRejection:
      type: object
      required: [rejectedIds, skippedIds]
      additionalProperties: false
      properties:
        rejectedIds:
          type: array
          items:
            type: integer
            format: int64
        skippedIds:
          type: array
          items:
            type: integer
            format: int64

    AssistantProposalList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposal"

    AssistantProposal:
      type: object
      required: [id, status, request, operation, irreversible, targets, change, created, counts]
      additionalProperties: false
      description: "A write the assistant proposed, with what the confirmation card shows and the run's progress."
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/AssistantProposalStatus"
        request:
          type: string
          description: "The owner's text, as untranslated user data."
        operation:
          type: string
          description: "The catalog row id: the operationId, or operationId.action for a variant, such as updateVideoTags.add."
        irreversible:
          type: boolean
          description: "From the catalog row; the card marks the change as one that cannot be undone."
        targets:
          $ref: "#/components/schemas/AssistantProposalTargets"
        change:
          type: array
          description: "The arguments after resolution, one per argument, in the order the card shows them."
          items:
            $ref: "#/components/schemas/AssistantChange"
        created:
          type: array
          description: "Names the operation creates, such as a tag to attach that does not exist yet."
          items:
            type: string
        impact:
          $ref: "#/components/schemas/AssistantImpact"
        counts:
          $ref: "#/components/schemas/AssistantProposalCounts"
        error:
          $ref: "#/components/schemas/AssistantProposalError"
        activityId:
          type: integer
          format: int64
          description: "The assistant_run activity entry, present once the proposal is approved."
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    AssistantProposalStatus:
      type: string
      enum: [proposed, approved, running, done, partial, stale, failed, discarded]
      description: "proposed waits for Execute; approved waits for the worker; partial stopped at a failed batch after earlier ones applied, or lost videos between batches; stale changed nothing because a target changed before the first call; failed changed nothing, or was stopped by a restart (error code interrupted); discarded was replaced by a follow-up."

    AssistantProposalTargets:
      type: object
      required: [kind, count, labels]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: "The catalog row's target kind; empty for a row that acts on its arguments alone."
        count:
          type: integer
          description: "Videos for a video target, otherwise the named entities."
        labels:
          type: array
          maxItems: 10
          description: "The first 10 targets the card names."
          items:
            $ref: "#/components/schemas/AssistantLabel"

    AssistantLabel:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/AssistantLabelKind"
        id:
          type: integer
          format: int64
          description: "The entity's id when the card showed it; absent when unknown."
        name:
          type: string
          description: "The name the card showed, as untranslated user data."

    AssistantChange:
      type: object
      required: [argument]
      additionalProperties: false
      properties:
        argument:
          type: string
          description: "The argument name of the action outcome, such as tagNames or enabled."
        labels:
          type: array
          description: "The entities the argument names after resolution."
          items:
            $ref: "#/components/schemas/AssistantLabel"
        value:
          description: "A literal value, such as a boolean, a number or a date."

    AssistantImpact:
      type: object
      required: [videos]
      additionalProperties: false
      description: "Present on mergeTag, mergePeople and mergeOrganizations only: the distinct current-library videos carrying any source tag, or credited to any source person or organization, counted when the proposal was stored."
      properties:
        videos:
          type: integer

    AssistantProposalCounts:
      type: object
      required: [total, applied, failed]
      additionalProperties: false
      description: "In videos for a batched operation, otherwise 0 or 1 for the one call."
      properties:
        total:
          type: integer
        applied:
          type: integer
        failed:
          type: integer

    AssistantProposalError:
      type: object
      required: [code]
      additionalProperties: false
      description: "The first failed call's screen API code and reason, or the code interrupted after a restart."
      properties:
        code:
          type: string
        reason:
          type: string

    AssistantReadiness:
      type: object
      required: [ready]
      additionalProperties: false
      description: "Whether a turn can run; reason is present only when ready is false."
      properties:
        ready:
          type: boolean
        reason:
          type: string
          enum: [ollama_not_saved, generation_model_unset]
          description: "ollama_not_saved: no Ollama connection is saved; generation_model_unset: no generation model is saved."

    ComfyUIProvider:
      type: string
      enum: [self_hosted, cloud]
      description: "ComfyUI provider: self_hosted for the owner's instance, cloud for Comfy Cloud."

    ComfyUIModel:
      type: string
      enum: [flux2_klein_4b, qwen_image_edit_2511]
      description: "Thumbnail editing model, selecting a bundled workflow set: flux2_klein_4b is FLUX.2 [klein] 4B (default); qwen_image_edit_2511 uses Qwen-Image-Edit-2511 with the four-step Lightning LoRA."
    ComfyUISettings:
      type: object
      required: [apiKeySet, model]
      additionalProperties: false
      description: "ComfyUI connection settings; never returns the API key. See docs/design-docs/ai-layer.md."
      properties:
        provider:
          $ref: "#/components/schemas/ComfyUIProvider"
        url:
          type: string
          description: "Self-hosted ComfyUI HTTP or HTTPS base URL; omitted when unset."
        apiKeySet:
          type: boolean
          description: "Whether a Comfy Cloud API key is stored."
        model:
          $ref: "#/components/schemas/ComfyUIModel"

    UpdateComfyUISettingsRequest:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/ComfyUIProvider"
        url:
          type: string
          description: "Required for self_hosted: HTTP or HTTPS base URL."
        apiKey:
          type: string
          description: "Comfy Cloud API key; omission preserves the stored key, an empty string deletes it."
        model:
          $ref: "#/components/schemas/ComfyUIModel"

    AutoTaggingQueue:
      type: object
      required: [queued, running, done, failed]
      additionalProperties: false
      properties:
        queued:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        lastError:
          type: string
          description: "Latest judging failure reason in English, possibly including the Ollama response; omitted if none."

    UpdateAutoTaggingSettingsRequest:
      type: object
      required: [enabled, afterImport, threshold, tentativeThreshold]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        afterImport:
          type: boolean
        threshold:
          type: number
          format: double
          description: "Greater than zero and at most one."
        tentativeThreshold:
          type: number
          format: double
          description: "Greater than zero and at most threshold; equal values disable tentative assignment."

    CheckResult:
      type: object
      description: "Connection check result; unavailable providers also return 200."
      required: [available]
      additionalProperties: false
      properties:
        available:
          type: boolean
        message:
          type: string
          description: "Unavailability reason in English, possibly including the provider's JSON error message."
        reason:
          type: string
          enum: [generation_model_missing]
          description: "Ollama checks only: the decision model is listed but the saved generation model is not."
        missing:
          type: array
          description: "ComfyUI checks only: missing nodes and model files when the endpoint responds but cannot run vv workflows."
          items:
            $ref: "#/components/schemas/ComfyUIMissingItem"

    ComfyUIMissingItem:
      type: object
      required: [kind, name]
      additionalProperties: false
      description: "Missing ComfyUI node type or model file."
      properties:
        kind:
          type: string
          enum: [node, model]
        name:
          type: string
          description: "Node class_type or filename."
        folder:
          type: string
          description: "Model files only: directory under ComfyUI models."
        source:
          type: string
          description: "Model files only: download page URL."

    ThumbnailEditReadiness:
      type: object
      required: [connection]
      additionalProperties: false
      properties:
        connection:
          type: boolean
          description: "Whether ComfyUI settings are saved, regardless of connection test success."

    StartThumbnailEditRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/ThumbnailEditSource"
        positionMs:
          type: integer
          format: int64
          description: "Required only for frame: frame position in milliseconds, nonnegative and below duration. Ignored for thumbnail."

    ThumbnailEditSource:
      type: string
      enum: [frame, thumbnail, image]
      description: "Editing source: frame uses the selected video frame; thumbnail uses the current thumbnail; image uses an image sent to startThumbnailEditFromImage and is refused by startThumbnailEdit."

    StartThumbnailEditFromImageRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: "Starting image: PNG, JPEG or WebP, at most 20 MiB and 8192 × 8192 pixels."
    RunThumbnailEditRequest:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          maxLength: 4000
          description: "Owner's instruction; when omitted with a painted mask, use vv's default instruction."
        mask:
          type: string
          format: binary
          description: "PNG matching the frame dimensions, with painted pixels opaque white and all others opaque black; omission selects the whole frame."
        reference:
          type: string
          format: binary
          description: "Reference image: PNG, JPEG or WebP up to 20 MiB; omission selects a workflow without a reference image."

    UploadThumbnailImageRequest:
      type: object
      additionalProperties: false
      required: [image, contentVersion]
      properties:
        image:
          type: string
          format: binary
          description: "Thumbnail image: PNG, JPEG or static WebP, at most 64 MiB and 120 million pixels."
        contentVersion:
          type: string
          maxLength: 64
          description: "Video contentVersion held by the UI when the preview opened."

    UploadPersonImageRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: "Face image: PNG, JPEG or static WebP, at most 64 MiB and 120 million pixels."

    UploadWorkInfoPluginRequest:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          type: string
          format: binary
          description: "Work-info plugin WebAssembly module, up to 16 MiB; retain the uploaded filename."

    WorkInfoPluginState:
      type: string
      description: "Plugin state."
      enum: [approved, unapproved, invalid]

    WorkInfoPluginProblem:
      type: string
      description: "Reason the plugin cannot be approved."
      enum:
        - not_wasm
        - manifest_missing
        - manifest_invalid
        - contract_unsupported
        - import_unsupported
        - export_invalid
        - table_too_large

    WorkInfoOperation:
      type: string
      description: "Plugin operation."
      enum: [search, fetch]

    WorkInfoPluginSetting:
      type: object
      required: [key, label, secret, required, set]
      additionalProperties: false
      description: "One manifest setting and its availability; value appears only for nonsecret settings with a stored value."
      properties:
        key:
          type: string
        label:
          type: string
        secret:
          type: boolean
        required:
          type: boolean
        set:
          type: boolean
          description: "Whether a value is stored."
        value:
          type: string
          description: "Stored value; never included for secret settings."
        default:
          type: string
          description: "Manifest default used at runtime when no value is stored or the stored value is outside the current choices."
        options:
          type: array
          items:
            type: string
          description: "Manifest choices in declaration order; absent means free-text input."
        staleValue:
          type: string
          description: "Stored value outside the current choices, included only in that case. set remains true and value matches, but execution receives the default instead."
    WorkInfoPluginKind:
      type: string
      description: "work fetches a video's work information; person searches and fetches people by external ID."
      enum: [work, person]

    WorkInfoPlugin:
      type: object
      required:
        [id, kind, fileName, operations, digest, state, settings, network, updatedAt, sources, domains, builtin]
      additionalProperties: false
      description: "One work-info or person plugin."
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/WorkInfoPluginKind"
        sources:
          type: array
          description: "A person plugin's accepted external-ID sources in manifest order; empty for a work-info plugin."
          items:
            type: string
        domains:
          type: array
          description: "The link hosts the plugin fetches by url, in manifest order; empty when it declares none. The bundled plugin's only domain is *, which stands for every link."
          items:
            type: string
        builtin:
          type: boolean
          description: "True for the plugin VVMDM bundles, which cannot be replaced or deleted."
        linkRank:
          type: integer
          description: "1-based place of a work-info plugin that declares domains in the order plugins are tried for a link; absent otherwise."
        name:
          type: string
          description: "Manifest name; absent when the manifest could not be read."
        fileName:
          type: string
          description: "Uploaded filename."
        version:
          type: string
        description:
          type: string
        operations:
          type: array
          description: "Manifest operations; empty for invalid plugins."
          items:
            $ref: "#/components/schemas/WorkInfoOperation"
        digest:
          type: string
          description: "Module SHA-256 in lowercase hexadecimal; send it back when approving."
        state:
          $ref: "#/components/schemas/WorkInfoPluginState"
        problem:
          $ref: "#/components/schemas/WorkInfoPluginProblem"
        settings:
          type: array
          description: "Settings in declaration order; empty for invalid plugins."
          items:
            $ref: "#/components/schemas/WorkInfoPluginSetting"
        network:
          type: boolean
          description: "Always true in protocol v1: plugins can access internet sites."
        updatedAt:
          type: integer
          format: int64
          description: "Timestamp of the latest upload or approval change, in Unix seconds."
        lastRunAt:
          type: integer
          format: int64
          description: "Completion timestamp of the latest run whose output remains, in Unix seconds; absent when none remains."
    WorkInfoPluginLinkOrder:
      type: object
      required: [pluginIds]
      additionalProperties: false
      properties:
        pluginIds:
          type: array
          items:
            type: integer
            format: int64

    WorkInfoPluginRunFailure:
      type: string
      description: "Run failure kind; busy is not retained because runs without an execution slot never start the module."
      enum:
        - plugin_failed
        - timed_out
        - memory_exceeded
        - output_too_large
        - blocked_address
        - network_error

    WorkInfoPluginRun:
      type: object
      required: [ranAt, operation, stderr, truncated]
      additionalProperties: false
      description: "Latest run's standard error."
      properties:
        ranAt:
          type: integer
          format: int64
          description: "Run completion timestamp in Unix seconds."
        operation:
          $ref: "#/components/schemas/WorkInfoOperation"
        failure:
          $ref: "#/components/schemas/WorkInfoPluginRunFailure"
        stderr:
          type: string
          description: "First 64 KiB of standard error, with secret setting values replaced by [secret]; empty if nothing was written."
        truncated:
          type: boolean
          description: "Whether output beyond 64 KiB was discarded."

    WorkInfoPluginLastRun:
      type: object
      additionalProperties: false
      properties:
        run:
          $ref: "#/components/schemas/WorkInfoPluginRun"

    WorkInfoPluginList:
      type: object
      required: [plugins]
      additionalProperties: false
      properties:
        plugins:
          type: array
          description: "Ordered by name, then filename."
          items:
            $ref: "#/components/schemas/WorkInfoPlugin"

    ApproveWorkInfoPluginRequest:
      type: object
      required: [digest]
      additionalProperties: false
      properties:
        digest:
          type: string
          description: "Digest observed in the list response."

    SetWorkInfoPluginSettingsRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: "Map of keys to new values; null deletes a value, omitted keys remain unchanged."
          additionalProperties:
            type: [string, "null"]

    WorkInfoSearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          description: "Search query: 1-200 characters after trimming."

    WorkInfoCandidate:
      type: object
      required: [id, url, title]
      additionalProperties: false
      description: "One text-only search candidate without images."
      properties:
        id:
          type: string
          description: "Work ID: 1-200 characters after trimming; selecting the candidate passes it unchanged as the fetch id."
        url:
          type: string
          description: "HTTP or HTTPS work-page URL, displayed as a link only and not passed to fetch."
        title:
          type: string
        detail:
          type: string
          description: "One-line description distinguishing the candidate."

    PersonPluginCandidate:
      type: object
      required: [source, id, name, url]
      additionalProperties: false
      description: "One text-only person search candidate; source and id together are the fetch's external ID."
      properties:
        source:
          type: string
          description: "One of the plugin's sources."
        id:
          type: string
          description: "External ID within source: 1-200 characters after trimming."
        name:
          type: string
        url:
          type: string
          description: "HTTP or HTTPS person-page URL, displayed as a link only."
        detail:
          type: string
          description: "One-line description distinguishing the candidate."

    PersonPluginSearchResult:
      type: object
      required: [candidates]
      additionalProperties: false
      properties:
        candidates:
          type: array
          description: "First 50 candidates in plugin order."
          items:
            $ref: "#/components/schemas/PersonPluginCandidate"

    PersonPluginFetchRequest:
      type: object
      required: [pluginId]
      additionalProperties: false
      properties:
        pluginId:
          type: integer
          format: int64
        source:
          type: string
          description: "A search candidate's source; requires id and excludes link."
        id:
          type: string
          description: "A search candidate's id; requires source and excludes link."
        link:
          type: string
          description: "An http or https link to fetch by, the person's or one the owner typed; excludes source and id. Its host must be one of the plugin's domains or end with a dot and one of them."

    PersonPluginFetchedPerson:
      type: object
      required: [name, aliases, externalIds]
      additionalProperties: false
      description: "A person as the plugin returned it, after VV's limits."
      properties:
        name:
          type: string
        aliases:
          type: array
          description: "First 50 distinct names; languages are checked by the apply."
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: "The fetched ID first, then the plugin's other distinct IDs, up to 20; a fetch by link has only the plugin's IDs."
          items:
            $ref: "#/components/schemas/ExternalId"
        profile:
          $ref: "#/components/schemas/PersonProfile"
          description: "Plugin-provided profile values that pass validation; omitted when none."
        imageCount:
          type: integer
          minimum: 0
          description: "How many images VV kept, in the plugin's order; served by index."

    PersonPluginFetch:
      type: object
      required: [fetchId, expiresAt, person]
      additionalProperties: false
      description: "Person fetch result held in memory."
      properties:
        fetchId:
          type: string
          description: "Result identifier used when applying it."
        expiresAt:
          type: integer
          format: int64
          description: "Result expiration timestamp in Unix seconds."
        person:
          $ref: "#/components/schemas/PersonPluginFetchedPerson"
        link:
          type: string
          description: "The link the fetch ran with; absent for a fetch by external ID."

    PersonPluginItem:
      type: string
      description: "One applicable part of a fetched person; a profile item is one profile property."
      enum:
        - image
        - profile.gender
        - profile.birthDate
        - profile.deathDate
        - profile.birthplace
        - profile.heightCm
        - profile.bustCm
        - profile.waistCm
        - profile.hipsCm
        - profile.cup
        - profile.bloodType
        - profile.careerStartYear
        - profile.careerEndYear
        - profile.bio
        - profile.links
        - aliases
        - externalIds

    ApplyPersonPluginFetchRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "Profile fields other than links, and image, each with a value in the result; aliases, external IDs and links are chosen one by one below."
          items:
            $ref: "#/components/schemas/PersonPluginItem"
        imageIndex:
          type: integer
          minimum: 0
          description: "The kept image that image applies; required with image."
        aliases:
          type: array
          description: "Names to append as aliases, each the fetched name or one of the fetched aliases."
          items:
            type: string
        externalIds:
          type: array
          description: "Fetched external IDs to append."
          items:
            $ref: "#/components/schemas/ExternalId"
        links:
          type: array
          description: "Fetched profile links to append."
          items:
            type: string

    SkippedPersonReason:
      type: string
      description: "Apply skip reason: invalid values fail validation; too_many entries exceed the limits after existing entries; taken external IDs are held by another person."
      enum: [invalid, too_many, taken]

    SkippedPersonValue:
      type: object
      required: [item, value, reason]
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/PersonPluginItem"
        value:
          type: string
          description: "Value shown in the comparison: the profile value, the alias, or source: value."
        reason:
          $ref: "#/components/schemas/SkippedPersonReason"
        holderName:
          type: string
          description: "Name of the person holding the external ID; only for taken."

    PersonPluginFetchApplied:
      type: object
      required: [person, skipped]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        skipped:
          type: array
          description: "Skipped values: profile items in property order, then aliases, then external IDs, each in fetched order."
          items:
            $ref: "#/components/schemas/SkippedPersonValue"

    WorkInfoSearchResult:
      type: object
      required: [candidates]
      additionalProperties: false
      properties:
        candidates:
          type: array
          description: "First 50 candidates in plugin order."
          items:
            $ref: "#/components/schemas/WorkInfoCandidate"
        match:
          type: integer
          description: "Index in candidates of the one a selection fill takes by default: the first whose title or id equals the query ignoring case, width, spaces and punctuation, or the only candidate. Absent when none matches."

    WorkInfoFetchRequest:
      type: object
      required: [pluginId]
      additionalProperties: false
      description: "Exactly one of id and link."
      properties:
        pluginId:
          type: integer
          format: int64
          description: "Approved plugin."
        id:
          type: string
          description: "Work ID, such as a product code: 1-200 characters after trimming. Even URL-shaped values pass unchanged as IDs; the plugin builds request URLs."
        link:
          type: string
          description: "An http or https link one of the plugin's domains matches; the plugin fetches by url."

    WorkInfoFetch:
      type: object
      required:
        [
          fetchId,
          expiresAt,
          tags,
          dates,
          people,
          organizations,
          urls,
          externalIds,
          covers,
        ]
      additionalProperties: false
      description: "Fetch result held in memory."
      properties:
        fetchId:
          type: string
          description: "Result identifier used when applying it."
        expiresAt:
          type: integer
          format: int64
          description: "Result expiration timestamp in Unix seconds."
        title:
          type: string
          description: "Title passing display-name validation; absent if omitted by the plugin or invalid."
        tags:
          type: array
          description: "Fetched tag names; may be empty."
          items:
            type: string
        code:
          type: string
          description: "Trimmed product code; absent if omitted by the plugin. Invalid values remain in the result but are skipped when applying."
        description:
          type: string
          description: "Trimmed description; absent if omitted by the plugin."
        dates:
          type: array
          description: "Kind order: release, recorded, published; [] when empty."
          items:
            $ref: "#/components/schemas/WorkInfoFetchedDate"
        people:
          type: array
          description: "Role order, then fetched order within each role; [] when empty."
          items:
            $ref: "#/components/schemas/WorkInfoFetchedPerson"
        organizations:
          type: array
          description: "Role order, then fetched order within each role; [] when empty."
          items:
            $ref: "#/components/schemas/WorkInfoFetchedOrganization"
        urls:
          type: array
          description: "Fetched order; [] when empty."
          items:
            type: string
        externalIds:
          type: array
          description: "Video external IDs in fetched order; [] when empty."
          items:
            $ref: "#/components/schemas/ExternalId"
        covers:
          type: array
          description: "Readable fetched covers in the plugin's order, at most 5; read each through getWorkInfoFetchCover at its index. [] when none."
          items:
            $ref: "#/components/schemas/WorkInfoFetchedCover"
    WorkInfoFetchedCover:
      type: object
      required: [width, height]
      additionalProperties: false
      description: "A fetched cover's dimensions; covers omitted, unavailable or not PNG, JPEG or static WebP are left out."
      properties:
        width:
          type: integer
        height:
          type: integer

    WorkInfoFetchedDate:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: string
          description: "Plugin-provided date; invalid formats remain in the result but are skipped when applying."

    WorkInfoMatchState:
      type: string
      description: "Fetched person/organization match: existing identifies one entity, new creates an unmatched entity on apply, ambiguous matches multiple entities and is skipped."
      enum: [existing, new, ambiguous]

    WorkInfoMatch:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/WorkInfoMatchState"
        id:
          type: integer
          format: int64
          description: "Matched entity, only when state is existing."
        name:
          type: string
          description: "Matched entity's current name, only when state is existing."

    WorkInfoFetchedPerson:
      type: object
      required: [role, name, externalIds, match]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        name:
          type: string
          description: "Plugin-provided name."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        match:
          $ref: "#/components/schemas/WorkInfoMatch"
        hasImage:
          type: boolean
          description: "Present and true when VV kept an image for this person, served by getWorkInfoFetchPersonImage at its index."
        profile:
          $ref: "#/components/schemas/PersonProfile"
          description: "Plugin-provided profile values that pass validation; omitted when none. Applying the person's role fills only the linked person's empty fields."
    WorkInfoFetchedOrganization:
      type: object
      required: [role, name, externalIds, match]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        name:
          type: string
          description: "Plugin-provided name."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        match:
          $ref: "#/components/schemas/WorkInfoMatch"

    WorkInfoField:
      type: string
      description: "Fetched fields applicable to the video, in comparison-row order."
      enum:
        - title
        - tags
        - cover
        - code
        - description
        - dates.release
        - dates.recorded
        - dates.published
        - people.performer
        - people.director
        - people.photographer
        - people.streamer
        - organizations.maker
        - organizations.label
        - urls
        - externalIds

    ApplyWorkInfoFetchRequest:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: array
          description: "Whole fields to apply: title, tags, code, description, dates and cover, each with a result value. People and organization roles, urls and externalIds are chosen value by value below."
          items:
            $ref: "#/components/schemas/WorkInfoField"
        tags:
          type: array
          description: "Fetched tag names to attach when fields includes tags: a nonempty subset of result tags using their exact spelling. Omission attaches all fetched tags; an empty subset, unknown name or presence without tags in fields returns 400."
          items:
            type: string
        coverByPage:
          type: boolean
          description: "With cover in fields, validate and consume the result for the cover but leave the thumbnail to the page, which uploads its own framing of the cover through uploadThumbnailImage after this call succeeds. Ignored without cover in fields."
        coverIndex:
          type: integer
          minimum: 0
          description: "The cover that cover applies, a position in the result's covers; required with cover."
        people:
          type: array
          description: "Positions in the result's people to link in their roles, each once."
          items:
            type: integer
            minimum: 0
        organizations:
          type: array
          description: "Positions in the result's organizations to link in their roles, each once."
          items:
            type: integer
            minimum: 0
        urls:
          type: array
          description: "Fetched URLs to append."
          items:
            type: string
        externalIds:
          type: array
          description: "Fetched external IDs to append."
          items:
            $ref: "#/components/schemas/ExternalId"
        samePeople:
          type: array
          description: "Unnamed performers of the video matched with chosen fetched performers. Each is merged into the person its entry links, in the same transaction, as confirming a face candidate does. An entry not in people or not a performer, or an entry or person named twice, returns 400 invalid_request. A person who is no longer an unnamed performer of the video, or whose entry is skipped, is left as it is; a merge the people's limits refuse is reported in skipped under the entry."
          items:
            $ref: "#/components/schemas/WorkInfoSamePerson"

    WorkInfoSamePerson:
      type: object
      required: [at, personId]
      additionalProperties: false
      properties:
        at:
          type: integer
          minimum: 0
          description: "Position of a fetched performer in the result's people; it must also be in people."
        personId:
          type: integer
          format: int64
          minimum: 1
          description: "The unnamed performer of the video who is that fetched performer."

    SkippedTagReason:
      type: string
      description: "Tag skip reason: rejected names were previously rejected; invalid names fail tag-name validation."
      enum: [rejected, invalid]

    SkippedTag:
      type: object
      required: [name, reason]
      additionalProperties: false
      properties:
        name:
          type: string
        reason:
          $ref: "#/components/schemas/SkippedTagReason"

    SkippedWorkInfoReason:
      type: string
      description: "Apply skip reason: invalid values fail field validation; too_many entries exceed limits after existing entries; ambiguous people/organizations match multiple entities."
      enum: [invalid, too_many, ambiguous]

    SkippedWorkInfoValue:
      type: object
      required: [field, value, reason]
      additionalProperties: false
      properties:
        field:
          $ref: "#/components/schemas/WorkInfoField"
        value:
          type: string
          description: "Value shown in the comparison: date, URL, name, source: value, or the first 100 description characters. A profile value is name: property value, such as Hanako: heightCm 1000."
        reason:
          $ref: "#/components/schemas/SkippedWorkInfoReason"

    WorkInfoFetchApplied:
      type: object
      required: [video, skippedTags, skipped, linkedPeople]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/Video"
        linkedPeople:
          type: array
          description: "Distinct ids of the people the chosen entries were linked to, in fetched order; [] when none."
          items:
            type: integer
            format: int64
        skippedTags:
          type: array
          description: "Unattached tag names in fetched-result order."
          items:
            $ref: "#/components/schemas/SkippedTag"
        skipped:
          type: array
          description: "Skipped values for selected fields other than title and tags, in field order then fetched order."
          items:
            $ref: "#/components/schemas/SkippedWorkInfoValue"

    ThumbnailEditState:
      type: string
      description: "Editing session state."
      enum: [ready, queued, preparing, running, succeeded, failed, cancelled]

    ThumbnailEditFailure:
      type: string
      description: "Run failure reason."
      enum:
        - unreachable
        - unauthorized
        - insufficient_credits
        - missing_models
        - workflow_rejected
        - run_failed
        - no_output
        - timed_out

    ThumbnailEdit:
      type: object
      required: [id, videoId, state, source, frameUrl, frameWidth, frameHeight]
      additionalProperties: false
      properties:
        id:
          type: string
          description: "Session identifier."
        videoId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ThumbnailEditState"
        source:
          $ref: "#/components/schemas/ThumbnailEditSource"
        positionMs:
          type: integer
          format: int64
          description: "Source frame position in milliseconds: selected, specified, automatic, or zero when falling back to the start. Omitted when starting from a saved original image."
        frameUrl:
          type: string
          description: "Frame PNG at GET /api/thumbnail-edits/{editId}/frame."
        frameWidth:
          type: integer
          description: "Frame width in pixels; draw the mask at these dimensions."
        frameHeight:
          type: integer
          description: "Frame height in pixels."
        elapsedMs:
          type: integer
          format: int64
          description: "Milliseconds since submission, frozen at completion for finished runs; omitted in ready state."
        progress:
          $ref: "#/components/schemas/ThumbnailEditProgress"
        error:
          $ref: "#/components/schemas/ThumbnailEditError"
        resultUrl:
          type: string
          description: "Output image at GET /api/thumbnail-edits/{editId}/result; succeeded only."

    ThumbnailEditProgress:
      type: object
      required: [value, max]
      additionalProperties: false
      description: "Provider-reported step progress; omitted if unreported."
      properties:
        value:
          type: integer
        max:
          type: integer

    ThumbnailEditError:
      type: object
      required: [reason]
      additionalProperties: false
      description: "Failure reason and provider message; failed only."
      properties:
        reason:
          $ref: "#/components/schemas/ThumbnailEditFailure"
        message:
          type: string
          description: "Provider message for node/run errors or missing resources; omitted when absent."

    FaceRecognizer:
      type: string
      enum: [sface_int8, arcface_r50]
      description: "Recognizer that turns a face into a vector: sface_int8 (SFace 2021dec int8, the default) or arcface_r50 (InsightFace buffalo_l, non-commercial use only)."

    FaceRecognitionSettings:
      type: object
      required: [enabled, recognizer, recognizers, runtime, counts]
      additionalProperties: false
      description: "Face recognition settings, the runtime state and the analysis queue counts; see docs/design-docs/face-recognition.md."
      properties:
        enabled:
          type: boolean
          description: "Off by default; while off nothing is downloaded and no video is analysed."
        recognizer:
          $ref: "#/components/schemas/FaceRecognizer"
        recognizers:
          type: array
          items:
            $ref: "#/components/schemas/FaceRecognizerOption"
        runtime:
          $ref: "#/components/schemas/FaceRuntime"
        counts:
          $ref: "#/components/schemas/FaceRecognitionCounts"
        lastFailure:
          type: string
          description: "The latest failed analysis's message in English; omitted if none."

    FaceRecognizerOption:
      type: object
      required: [id, downloadBytes, license, nonCommercial]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/FaceRecognizer"
        downloadBytes:
          type: integer
          format: int64
          description: "Size of the recognizer's model."
        license:
          type: string
          description: "SPDX license id, or non-commercial."
        nonCommercial:
          type: boolean

    FaceRuntime:
      type: object
      required: [state]
      additionalProperties: false
      description: "The runtime and model files the chosen recognizer needs."
      properties:
        state:
          type: string
          enum: [unsupported, absent, downloading, ready, failed]
          description: "unsupported: no runtime is published for this platform."
        bytesDone:
          type: integer
          format: int64
          description: "Present while downloading."
        bytesTotal:
          type: integer
          format: int64
          description: "Present while downloading."
        reason:
          type: string
          enum: [network, hash_mismatch, disk, helper_start]
          description: "Present when failed."

    FaceRecognitionCounts:
      type: object
      required: [queued, running, done, failed]
      additionalProperties: false
      description: "Face analysis queue rows (content keys) by state."
      properties:
        queued:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer

    UpdateFaceRecognitionSettingsRequest:
      type: object
      required: [enabled, recognizer]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        recognizer:
          type: string
          description: "sface_int8 or arcface_r50; another value returns 400 invalid_request."

    StartAutoTaggingRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [missing, all]

    Onboarding:
      type: object
      required: [step]
      additionalProperties: false
      properties:
        step:
          type: string
          enum: [folders, scan, interests, done]
          description: オンボードの段階（docs/design-docs/home.md）

    Interest:
      type: object
      required: [id, name, synonym, hasFolder]
      additionalProperties: false
      properties:
        id:
          type: string
          description: 分野の変わらない識別子（docs/design-docs/home.md「Interest catalog」）
        name:
          type: string
          description: タグの名前（英語）
        synonym:
          type: string
          description: タグの同義語（日本語）
        hasFolder:
          type: boolean
          description: An ordinary root smart folder already matches this interest tag.

    InterestList:
      type: object
      required: [interests]
      additionalProperties: false
      properties:
        interests:
          type: array
          items:
            $ref: "#/components/schemas/Interest"

    InterestPick:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: string

    InterestPickResult:
      type: object
      required: [folders, queued]
      additionalProperties: false
      properties:
        folders:
          type: array
          description: New smart folders; excludes interests whose matching root folder already existed.
          items:
            $ref: "#/components/schemas/SmartFolderSummary"
        queued:
          type: integer
          description: 自動タグ付けに回した動画の件数。自動タグ付けが切なら 0

    StartFaceRecognitionRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [missing]

    PeopleCleared:
      type: object
      required: [deleted, queued]
      additionalProperties: false
      properties:
        deleted:
          type: integer
          description: "People deleted"
        queued:
          type: integer
          description: "Videos queued for face analysis"

    FaceRecognitionQueued:
      type: object
      required: [queued]
      additionalProperties: false
      properties:
        queued:
          type: integer
          description: "Number of queued videos."

    AutoTaggingQueued:
      type: object
      required: [queued]
      additionalProperties: false
      properties:
        queued:
          type: integer
          description: "Number of queued videos."

    AutoTagVideoResult:
      type: object
      required: [queued]
      additionalProperties: false
      properties:
        queued:
          type: boolean
          description: "Whether queued; false if already being judged."

    APIToken:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      additionalProperties: false
      description: "One issued API token, without plaintext or hash."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: "Last-use timestamp; null if unused, updated at most once per minute."

    APITokenList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "Creation time descending."
          items:
            $ref: "#/components/schemas/APIToken"

    CreateAPITokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Purpose name: 1-100 characters after trimming, without control characters; duplicates allowed."

    CreatedAPIToken:
      type: object
      required: [token, secret]
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        secret:
          type: string
          description: "Plaintext token: 47 characters beginning with vvt_. Returned only here and cannot be retrieved again."

    TagRef:
      type: object
      required: [id, name, tentative, kind]
      additionalProperties: false
      description: "One assigned tag; name is always the original name."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tentative:
          type: boolean
          description: "Whether the tag was automatically created and remains tentative."
        kind:
          anyOf:
            - $ref: "#/components/schemas/TagKindRef"
            - type: "null"
          description: "Tag kind; null means unclassified."

    VideoTag:
      type: object
      required: [id, name, manual, fromFolder, tentative, kind]
      additionalProperties: false
      description: "One assigned tag with provenance; name is always the original name. Coalesce manual and folder-derived assignment into one entry with both flags true."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        manual:
          type: boolean
          description: "Has a manual assignment."
        fromFolder:
          type: boolean
          description: "An ancestor folder name matches the tag name or a synonym."
        tentative:
          type: boolean
          description: "Whether the tag is tentative, even when assigned only through a folder."
        unconfirmed:
          type: boolean
          description: "Unconfirmed assignment suggested by the intermediate auto-tagging confidence band; returned only when true and not also folder-derived. See docs/design-docs/auto-tagging.md."
        kind:
          anyOf:
            - $ref: "#/components/schemas/TagKindRef"
            - type: "null"
          description: "Tag kind; null means unclassified."

    Tag:
      type: object
      required: [id, name, synonyms, videoCount, tentative, createdAt, kind]
      additionalProperties: false
      description: "One management-screen or candidate entry."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        synonyms:
          type: array
          description: "Natural-name order."
          items:
            type: string
        videoCount:
          type: integer
          description: "Number of videos currently in the library."
        tentative:
          type: boolean
          description: "Whether the tag was automatically created and remains tentative."
        createdAt:
          type: string
          format: date-time
          description: "Tag creation timestamp with second precision; see docs/design-docs/catalog-organization.md."
        kind:
          anyOf:
            - $ref: "#/components/schemas/TagKindRef"
            - type: "null"
          description: "Tag kind; null means unclassified."

    TagList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          description: "Tag count matching q, tentative, unused and kind, independent of pagination."
        totalAll:
          type: integer
          description: "Total tag count, independent of pagination."
        nextCursor:
          type: string
          description: "Next-page cursor, included only when limit is supplied and more results remain."
        exact:
          $ref: "#/components/schemas/Tag"
          description: "Tag whose original name or synonym exactly matches trimmed q and satisfies tentative, unused and kind. Included only for nonempty q with a match, limit and no cursor; it need not appear in the substring-matched, sorted items page."
    TagKindRef:
      type: object
      required: [id, name, cardFirst]
      additionalProperties: false
      description: "Tag kind ID, name and card order flag."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        cardFirst:
          type: boolean
          description: "Cards list this kind's tags before other tags; see TagKind.cardFirst."

    TagKind:
      type: object
      required: [id, name, cardFirst, tagCount, createdAt]
      additionalProperties: false
      description: "One kind-list entry."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        cardFirst:
          type: boolean
          description: "Whether video cards list this kind's tags before other tags, in natural kind-name order and then natural tag-name order. New kinds start false."
        tagCount:
          type: integer
          description: "Number of tags of this kind, including tentative tags."
        createdAt:
          type: string
          format: date-time
          description: "Kind creation timestamp with second precision."

    TagKindList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "All kinds in ID order; the UI reorders them by natural name."
          items:
            $ref: "#/components/schemas/TagKind"

    TagKindCardFirstRequest:
      type: object
      required: [cardFirst]
      additionalProperties: false
      properties:
        cardFirst:
          type: boolean

    TagKindNameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    TagSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc]
      default: name
      description: "name uses natural-name order; countDesc/countAsc use video count; createdDesc/createdAsc use creation time. Ties use natural-name order, then ID."
    RejectedTagNameList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "Rejected names in natural-name order."
          items:
            type: string
        total:
          type: integer
          description: "Total rejected-name count."
        nextCursor:
          type: string
          description: "Included only when more results remain; pass as cursor in the next request."

    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    RenameTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    MergeTagRequest:
      type: object
      required: [sourceIds]
      additionalProperties: false
      properties:
        sourceIds:
          type: array
          description: "Source IDs; use [sourceId] for a single-source merge too."
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagMergeResponse:
      type: object
      required: [tag, notFoundIds]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        notFoundIds:
          type: array
          description: "Sources that no longer exist."
          items:
            type: integer
            format: int64

    TagBatchRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [confirm, reject, delete, setKind, clearKind]
        kindId:
          type: integer
          format: int64
          minimum: 1
          description: "Kind assigned by setKind; present only for that action."
        ids:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagBatchResponse:
      type: object
      required: [appliedIds, notFoundIds, notApplicableIds]
      additionalProperties: false
      properties:
        appliedIds:
          type: array
          description: "Processed IDs."
          items:
            type: integer
            format: int64
        notFoundIds:
          type: array
          description: "IDs that no longer exist."
          items:
            type: integer
            format: int64
        notApplicableIds:
          type: array
          description: "IDs whose state is incompatible with the operation."
          items:
            type: integer
            format: int64

    TagImpactRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [reject, delete, merge]
          description: "Operation to confirm; determines which tag states are counted."
        ids:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    TagImpactResponse:
      type: object
      required: [tagCount, videoCount]
      additionalProperties: false
      properties:
        tagCount:
          type: integer
          description: "Number of existing tags in ids to which action applies."
        videoCount:
          type: integer
          description: "Distinct current library videos carrying any of those tags."

    AddTagSynonymRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        mergeTagId:
          type: integer
          format: int64
          description: "ID of the tag whose merge was approved."

    TagInput:
      type: object
      additionalProperties: false
      description: "Tag reference with exactly one of id or name; both or neither return 400 invalid_request."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    CreditRef:
      type: object
      required: [id, name, provisional]
      additionalProperties: false
      description: "Reference to one person or organization; name is its current name, \"\" for a provisional person."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provisional:
          type: boolean
          description: "True for a person without a canonical name, whose name is then \"\"; always false for an organization."

    Alias:
      type: object
      required: [name]
      additionalProperties: false
      description: "One person or organization alias."
      properties:
        name:
          type: string
        language:
          type: string
          description: "BCP 47 language tag; omitted when absent."

    ExternalId:
      type: object
      required: [source, value]
      additionalProperties: false
      description: "One identifier from an external source."
      properties:
        source:
          type: string
        value:
          type: string

    WorkDateKind:
      type: string
      enum: [release, recorded, published]
      description: "Date kind."

    WorkPersonRole:
      type: string
      enum: [performer, director, photographer, streamer]
      description: "Person role in a video."

    WorkOrganizationRole:
      type: string
      enum: [maker, label]
      description: "Organization role in a video."

    WorkDate:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: string
          description: "YYYY, YYYY-MM or YYYY-MM-DD; a full date must be calendar-valid."
          examples: ["2024", "2024-02", "2024-02-29"]

    VideoCardCredits:
      type: object
      required: [performers]
      additionalProperties: false
      description: "Card subset of WorkInfo; see docs/design-docs/library-ui.md, Cards."
      properties:
        code:
          type: string
          description: "Product code; omitted when unset."
        performers:
          type: array
          description: "Performer credits in work-information order; [] when none."
          items:
            $ref: "#/components/schemas/WorkPerson"
        organization:
          $ref: "#/components/schemas/CreditRef"
          description: "The first label, otherwise the first maker; omitted when the work has neither."

    WorkPerson:
      type: object
      required: [role, person, provisional]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditRef"
        provisional:
          type: boolean
          description: "Same as person.provisional."
        imageRevision:
          $ref: "#/components/schemas/PersonImageRevision"

    PersonImageRevision:
      type: integer
      format: int64
      minimum: 1
      description: "Present only when the person has a face; changes with every change of the face and is never reused. Load the face from /api/people/{id}/image?v={imageRevision}."

    WorkOrganization:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditRef"

    WorkInfo:
      type: object
      required: [dates, people, organizations, urls, externalIds]
      additionalProperties: false
      description: "Video work information; lists are always present, using [] when empty, while unset scalar values are absent."
      properties:
        code:
          type: string
          description: "Product code."
        description:
          type: string
          description: "Description, potentially including newlines."
        dates:
          type: array
          description: "Kind order: release, recorded, published."
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: array
          description: "Role order, then input order within each role; name is the person's current name."
          items:
            $ref: "#/components/schemas/WorkPerson"
        organizations:
          type: array
          description: "Role order, then input order within each role; name is the organization's current name."
          items:
            $ref: "#/components/schemas/WorkOrganization"
        urls:
          type: array
          description: "Input order."
          items:
            type: string
        externalIds:
          type: array
          description: "Ordered by (source, value)."
          items:
            $ref: "#/components/schemas/ExternalId"

    CreditIdRef:
      type: object
      additionalProperties: false
      description: "Write reference to one person or organization: id, or name alone in work information saved for the peer's video (an id at or above 2^40), which the peer resolves by name and creates when it lacks it. A name in any other save, or both or neither, returns 400 invalid_request."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "A person or organization the peer may lack, so this node creates nothing for the peer's video."

    WorkPersonInput:
      type: object
      required: [role, person]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditIdRef"
          x-vv-entity: person

    WorkOrganizationInput:
      type: object
      required: [role, organization]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditIdRef"
          x-vv-entity: organization

    WorkInfoInput:
      type: object
      additionalProperties: false
      description: "Full work-info replacement with the seven WorkInfo properties; each may be omitted or null, either of which clears it."
      properties:
        code:
          type: [string, "null"]
        description:
          type: [string, "null"]
        dates:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkDate"
        people:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkPersonInput"
        organizations:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkOrganizationInput"
        urls:
          type: [array, "null"]
          items:
            type: string
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"

    VideoDetailsInput:
      type: object
      required: [displayName, workInfo]
      additionalProperties: false
      description: "Fullscreen editor save body; displayName and workInfo are required."
      properties:
        displayName:
          type: string
          description: "New display name; whitespace-only after trimming clears it. For a virtual video it is the title and must not be empty."
        workInfo:
          $ref: "#/components/schemas/WorkInfoInput"
        contentVersion:
          type: string
          description: "The contentVersion the editor read; required for a virtual video. For a video with a file, a virtual video's version returns 409 content_changed and any other is ignored."

    Person:
      type: object
      required: [id, name, provisional, aliases, externalIds, profile, favorite, videoCount, createdAt]
      additionalProperties: false
      description: "One person."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provisional:
          type: boolean
          description: "True while the person has no canonical name; name is then \"\". Setting a name makes the person ordinary."
        aliases:
          type: array
          description: "Natural-name order."
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: "Ordered by (source, value)."
          items:
            $ref: "#/components/schemas/ExternalId"
        profile:
          $ref: "#/components/schemas/PersonProfile"
        favorite:
          type: boolean
          description: "Whether the owner marked this person as a favorite."
        imageRevision:
          $ref: "#/components/schemas/PersonImageRevision"
        videoCount:
          type: integer
          description: "Visible videos linked to this person in any role."
        createdAt:
          type: string
          format: date-time

    PersonProfile:
      type: object
      additionalProperties: false
      description: "A person's profile; each property is omitted when unknown. Values out of range or format return 400 with a work_info_* reason and field profile.<name>."
      properties:
        gender:
          type: string
          enum: [female, male, other]
        birthDate:
          type: string
          description: "YYYY, YYYY-MM or YYYY-MM-DD, not after today in UTC."
          examples: ["1990", "1990-05", "1990-05-17"]
        deathDate:
          type: string
          description: "Same format as birthDate; not before it at the precision both share."
        birthplace:
          type: string
          description: "1-200 code points."
        heightCm:
          type: integer
          description: "50-300."
        bustCm:
          type: integer
          description: "30-300."
        waistCm:
          type: integer
          description: "30-300."
        hipsCm:
          type: integer
          description: "30-300."
        cup:
          type: string
          description: "1-3 Latin letters, stored upper case."
        bloodType:
          type: string
          enum: [A, B, O, AB]
        careerStartYear:
          type: integer
          description: "1900-9999."
        careerEndYear:
          type: integer
          description: "1900-9999; not before careerStartYear."
        bio:
          type: string
          description: "1-5,000 code points; line breaks are kept."
        links:
          type: array
          description: "HTTP(S) URLs in order, at most 20 and unique; omitted when empty."
          items:
            type: string

    PersonProfilePatch:
      type: object
      additionalProperties: false
      description: "Profile update: each property present replaces that field, null or an empty value clears it, and links replaces the list."
      properties:
        gender:
          type: [string, "null"]
          description: "female, male or other."
        birthDate:
          type: [string, "null"]
          description: "YYYY, YYYY-MM or YYYY-MM-DD, not after today in UTC."
          examples: ["1990", "1990-05", "1990-05-17"]
        deathDate:
          type: [string, "null"]
          description: "Same format as birthDate; not before it at the precision both share."
        birthplace:
          type: [string, "null"]
          description: "1-200 code points."
        heightCm:
          type: [integer, "null"]
          description: "50-300."
        bustCm:
          type: [integer, "null"]
          description: "30-300."
        waistCm:
          type: [integer, "null"]
          description: "30-300."
        hipsCm:
          type: [integer, "null"]
          description: "30-300."
        cup:
          type: [string, "null"]
          description: "1-3 Latin letters, stored upper case."
        bloodType:
          type: [string, "null"]
          description: "A, B, O or AB."
        careerStartYear:
          type: [integer, "null"]
          description: "1900-9999."
        careerEndYear:
          type: [integer, "null"]
          description: "1900-9999; not before careerStartYear."
        bio:
          type: [string, "null"]
          description: "1-5,000 code points; line breaks are kept."
        links:
          type: [array, "null"]
          description: "HTTP(S) URLs in order, at most 20 and unique; omitted when empty."
          items:
            type: string

    Organization:
      type: object
      required: [id, name, aliases, externalIds, videoCount, createdAt]
      additionalProperties: false
      description: "One organization, with Person fields plus a parent organization."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          type: array
          description: "Natural-name order."
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          description: "Ordered by (source, value)."
          items:
            $ref: "#/components/schemas/ExternalId"
        videoCount:
          type: integer
          description: "Visible videos linked to this organization in any role."
        createdAt:
          type: string
          format: date-time
        parent:
          $ref: "#/components/schemas/CreditRef"
          description: "Parent organization; omitted for roots."

    CreditInput:
      type: object
      required: [name]
      additionalProperties: false
      description: "Person or organization creation body; parentId is organization-only and profile person-only."
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: integer
          format: int64
          description: "Parent organization ID; sending it for a person returns 400 invalid_request."
        profile:
          $ref: "#/components/schemas/PersonProfile"
          description: "Person-only profile; sending it for an organization returns 400 invalid_request."

    CreditPatch:
      type: object
      additionalProperties: false
      description: "Update body: omitted properties remain unchanged, lists are replaced entirely, and null clears a list. Organization-only parentId null detaches the parent."
      properties:
        name:
          type: string
        aliases:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalId"
        parentId:
          type: [integer, "null"]
          format: int64
          description: "Parent organization ID; null detaches it. Sending this for a person returns 400 invalid_request."
        profile:
          $ref: "#/components/schemas/PersonProfilePatch"
          description: "Person-only; sending it for an organization returns 400 invalid_request. A profile that changes nothing writes nothing."

    CreditMergeRequest:
      type: object
      required: [sourceIds]
      additionalProperties: false
      properties:
        sourceIds:
          type: array
          description: "Source IDs: 1-20,000 entries."
          items:
            type: integer
            format: int64

    PersonList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: "Person form of the CreditList contract."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        total:
          type: integer
          description: "Person count matching q, favorite and provisional, independent of pagination."
        totalAll:
          type: integer
          description: "Total person count."
        nextCursor:
          type: string
          description: "Next-page cursor, included only when limit is supplied and more results remain."

    OrganizationList:
      type: object
      required: [items, total, totalAll]
      additionalProperties: false
      description: "Organization form of the CreditList contract."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          type: integer
          description: "Organization count matching q, independent of pagination."
        totalAll:
          type: integer
          description: "Total organization count."
        nextCursor:
          type: string
          description: "Next-page cursor, included only when limit is supplied and more results remain."

    PersonMergeResponse:
      type: object
      required: [person, notFoundIds]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        notFoundIds:
          type: array
          description: "Sources that no longer exist."
          items:
            type: integer
            format: int64

    FaceCandidateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FaceCandidate"

    FaceCandidate:
      type: object
      required: [person, similarity]
      additionalProperties: false
      description: "One open pair, as the other person of it."
      properties:
        person:
          $ref: "#/components/schemas/FaceCandidatePerson"
        similarity:
          type: number
          format: double
          description: "The pair's highest face similarity when last computed, from 0 to 1."

    FaceCandidateConfirmation:
      type: object
      required: [person]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        undoActivityId:
          type: integer
          format: int64
          description: "The face_merge entry that undoes the merge; absent when the merged person had a name or an external ID."

    FaceAppearanceList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FaceAppearance"
        total:
          type: integer
          description: "Every appearance of the person that is not dropped, across all pages."
        nextCursor:
          type: string
          description: "Next-page cursor, included only when limit is supplied and more results remain."

    FaceAppearance:
      type: object
      required: [appearanceId, title, spans, hasCrop]
      additionalProperties: false
      description: "One main person of one video, linked to the listed person."
      properties:
        appearanceId:
          type: integer
          format: int64
        videoId:
          type: integer
          format: int64
          description: "The video with the appearance's content key; absent when no video has it any more."
        title:
          type: string
          description: "The video's title: its override, else its first registered location's title, else the content key."
        spans:
          type: array
          description: "When the person is on screen, in seconds, in order and without overlaps."
          items:
            $ref: "#/components/schemas/FaceAppearanceSpan"
        hasCrop:
          type: boolean
          description: "True when getFaceAppearanceCrop has a face to return."
        similarity:
          type: number
          format: double
          description: "Cosine similarity, from -1 to 1, to the mean of the person's appearances of the same recognizer; absent when the appearance cannot be compared."
        unlike:
          type: boolean
          description: "True when similarity is below its recognizer's face-candidate threshold, as unlike the person as a stranger usually is; absent otherwise."
        focus:
          $ref: "#/components/schemas/FaceFocus"

    VideoFaceAppearanceList:
      type: object
      required: [analysed, items]
      additionalProperties: false
      properties:
        analysed:
          type: boolean
          description: "True when the face analysis of the video's content key is done."
        items:
          type: array
          description: "Empty while analysed is false."
          items:
            $ref: "#/components/schemas/VideoFaceAppearance"

    VideoFaceAppearance:
      type: object
      required: [appearanceId, person, hasCrop, spans]
      additionalProperties: false
      description: "One main person of the video."
      properties:
        appearanceId:
          type: integer
          format: int64
        person:
          $ref: "#/components/schemas/CreditRef"
        imageRevision:
          $ref: "#/components/schemas/PersonImageRevision"
        hasCrop:
          type: boolean
          description: "True when getFaceAppearanceCrop has a face to return."
        spans:
          type: array
          description: "When the person is on screen, in seconds, in order and without overlaps."
          items:
            $ref: "#/components/schemas/FaceAppearanceSpan"

    SimilarPersonList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SimilarPerson"

    SimilarPerson:
      type: object
      required: [person, similarity, faceCount, sampleAppearanceIds]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        similarity:
          type: number
          format: double
          description: "Cosine similarity, from -1 to 1, of the compared faces to the person."
        faceCount:
          type: integer
          description: "The person's appearances that are not dropped."
        sampleAppearanceIds:
          type: array
          description: "Up to four of the person's appearances with a crop, latest first."
          items:
            type: integer
            format: int64
        firstSeenTitle:
          type: string
          description: "The title of the video of the person's first appearance; absent without appearances."

    FaceAppearanceMoveRequest:
      type: object
      required: [appearanceIds, targetId]
      additionalProperties: false
      properties:
        appearanceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
            x-vv-entity: faceAppearance
        targetId:
          type: integer
          format: int64
          minimum: 1
          x-vv-entity: person
        restoreCredits:
          type: array
          maxItems: 200
          description: "The restoreCredits of the move this request undoes."
          items:
            $ref: "#/components/schemas/FaceMoveCredit"

    FaceAppearanceMove:
      type: object
      required: [person, restoreCredits]
      additionalProperties: false
      properties:
        person:
          $ref: "#/components/schemas/Person"
        restoreCredits:
          type: array
          description: "Works whose performer credit of the moved-from person was removed because the target already held one."
          items:
            $ref: "#/components/schemas/FaceMoveCredit"

    FaceMoveCredit:
      type: object
      required: [workKey, position]
      additionalProperties: false
      properties:
        workKey:
          type: string
          description: "An opaque key of the work."
        position:
          type: integer
          minimum: 0
          description: "The position the credit had among the work's performers."

    FaceAppearanceSplitRequest:
      type: object
      required: [appearanceIds]
      additionalProperties: false
      properties:
        appearanceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: integer
            format: int64
            x-vv-entity: faceAppearance
            minimum: 1

    FaceFocus:
      type: object
      required: [time, x, y, w]
      additionalProperties: false
      description: "Where the face is in its longest track: the track's middle in seconds, and its mean centre and width as fractions of the frame side."
      properties:
        time:
          type: number
          format: double
        x:
          type: number
          format: double
        "y":
          type: number
          format: double
        w:
          type: number
          format: double

    FaceAppearanceSpan:
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: number
          format: double
        end:
          type: number
          format: double

    FaceCandidatePerson:
      type: object
      required: [id, name, provisional]
      additionalProperties: false
      description: "CreditRef of the other person, with its face."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provisional:
          type: boolean
          description: "True for a person without a canonical name, whose name is then \"\"."
        imageRevision:
          $ref: "#/components/schemas/PersonImageRevision"

    OrganizationMergeResponse:
      type: object
      required: [organization, notFoundIds]
      additionalProperties: false
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        notFoundIds:
          type: array
          description: "Sources that no longer exist."
          items:
            type: integer
            format: int64

    CreditSort:
      type: string
      enum: [name, countDesc, countAsc, createdDesc, createdAsc, ageAsc, ageDesc]
      default: name
      description: "The five TagSort modes, plus ageAsc (newest birth date first) and ageDesc (oldest first) for people only; organizations answer either with 400 invalid_request. A partial birth date sorts as its first possible day, and people without one come last in both age sorts. Ties use natural-name order, then ID."
    VideoTagsAction:
      type: string
      enum: [add, remove]

    VideoTagsRequest:
      type: object
      required: [videoIds, action, tag]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to change. May be empty when smartFolderIds is not."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs resolved at request time to their current member videos (the saved rule plus every ancestor rule, groups expanded to their videos) and added to videoIds. Missing folders are ignored."
          maxItems: 20000
          items:
            type: integer
            format: int64
        action:
          $ref: "#/components/schemas/VideoTagsAction"
        tag:
          $ref: "#/components/schemas/TagInput"

    VideoTagsResponse:
      type: object
      required: [tag, applied]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        applied:
          type: integer
          description: "Number of resolved videos (videoIds plus smart-folder members) currently in the library."
        remote:
          $ref: "#/components/schemas/RemoteSelectionResult"

    VideoVisibilityRequest:
      type: object
      required: [videoIds, public]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to change. May be empty when smartFolderIds is not."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs resolved at request time to their current member videos (the saved rule plus every ancestor rule, groups expanded to their videos) and added to videoIds. Missing folders are ignored."
          maxItems: 20000
          items:
            type: integer
            format: int64
        public:
          type: boolean
          description: "True makes videos public; false makes them private."

    CollectionsDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        groupIds:
          type: array
          description: "Group IDs to dissolve; member videos and child groups stay in the library."
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs to delete together with their descendants."
          items:
            type: integer
            format: int64

    CollectionsDeleteResponse:
      type: object
      required: [dissolvedGroups, deletedSmartFolders]
      additionalProperties: false
      properties:
        dissolvedGroups:
          type: integer
          description: "Distinct requested groups that existed and were dissolved, including ones dissolved because an earlier requested group left them empty."
        deletedSmartFolders:
          type: integer
          description: "Distinct requested smart folders that existed and were deleted, including ones removed as descendants of another requested folder; unrequested descendants are not counted."
        remote:
          $ref: "#/components/schemas/RemoteSelectionResult"

    RemoteSelectionResult:
      type: object
      required: [applied, failedVideoIds]
      additionalProperties: false
      description: "The paired VVMDM's part of an operation over a selection, present when the operation had a part there: ids at or above 2^40, or videos of the paired VVMDM matching a smart folder. The local part is applied first and stays applied when the peer's part fails."
      properties:
        applied:
          type: integer
          description: "Videos or collections changed on the peer."
        failedVideoIds:
          type: array
          description: "Requested ids of the peer that were not changed, with 2^40 added; for collections, the group and smart-folder ids. Empty on success."
          items:
            type: integer
            format: int64
        reason:
          $ref: "#/components/schemas/ErrorReason"

    FavoritesRequest:
      type: object
      required: [favorite]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs whose favorite state changes."
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: "Group IDs whose favorite state changes."
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs whose favorite state changes."
          items:
            type: integer
            format: int64
        personIds:
          type: array
          description: "Person IDs whose favorite state changes; missing people are ignored."
          items:
            type: integer
            format: int64
        favorite:
          type: boolean
          description: "True adds favorites; false removes them."

    FavoritesResponse:
      type: object
      required: [appliedVideos, appliedGroups, appliedSmartFolders]
      additionalProperties: false
      properties:
        appliedVideos:
          type: integer
          description: "Distinct videoIds currently in the library, counting versions within the same set separately and including videos already in the requested state."
        appliedGroups:
          type: integer
          description: "Distinct existing groupIds, including groups already in the requested state."
        appliedSmartFolders:
          type: integer
          description: "Distinct existing smartFolderIds, including folders already in the requested state."

    PlaylistSummary:
      type: object
      required: [id, name, itemCount, updatedAt]
      additionalProperties: false
      description: "One playlist summary."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "Name of 1-100 characters after trimming; may duplicate another playlist name."
        itemCount:
          type: integer
          description: "Number of currently visible items."
        updatedAt:
          type: string
          format: date-time
          description: "Timestamp of the latest name or item change."
        covers:
          type: array
          maxItems: 4
          description: "Up to four generated thumbnails for the folder-style card, shaped like LibraryGroup.previews. Walk visible items in position order, choosing a video's thumbnail or the first generated member thumbnail for a group; included only in GET /api/playlists summaries."
          items:
            $ref: "#/components/schemas/FolderPreview"

    PlaylistList:
      type: object
      required: [items, total, version]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "One summary page ordered by updatedAt descending, then ID descending."
          items:
            $ref: "#/components/schemas/PlaylistSummary"
        total:
          type: integer
          description: "Total playlist count, independent of pagination."
        version:
          type: string
          description: "Opaque list version changed by playlist creation, deletion, renaming or item changes. If a later page differs from the first, restart pagination because ordering changed."
        nextCursor:
          type: string
          description: "Next-page cursor; included only when more results remain."

    Playlist:
      type: object
      required: [id, name, itemCount, updatedAt, items]
      additionalProperties: false
      description: "PlaylistSummary fields plus visible items."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "Name of 1-100 characters after trimming."
        itemCount:
          type: integer
          description: "Number of currently visible items."
        updatedAt:
          type: string
          format: date-time
          description: "Timestamp of the latest name or item change."
        items:
          type: array
          description: "Visible items in position order."
          items:
            $ref: "#/components/schemas/PlaylistItem"

    PlaylistItem:
      type: object
      required: [id, kind]
      additionalProperties: false
      description: "One playlist item containing exactly one of video, group or smartFolder according to kind. smartFolder reflects its playback order at read time, which playback also follows."
      properties:
        id:
          type: integer
          format: int64
          description: "Item identifier for reordering and removal."
        kind:
          type: string
          enum: [video, group, smartFolder]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"
        smartFolder:
          $ref: "#/components/schemas/LibrarySmartFolder"

    PlaylistName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "Playlist name; the server trims whitespace before checking length."

    PlaylistItemsAdd:
      type: object
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to add."
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: "Group IDs to add, matching the PUT /api/favorites shape."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs to add, matching the PUT /api/favorites shape."
          maxItems: 20000
          items:
            type: integer
            format: int64

    PlaylistItemsAdded:
      type: object
      required: [added, existing]
      additionalProperties: false
      properties:
        added:
          type: integer
          description: "Number of items appended."
        existing:
          type: integer
          description: "Number of resolved items already present in the playlist."

    PlaylistItemMove:
      type: object
      required: [afterItemId]
      additionalProperties: false
      properties:
        afterItemId:
          type: [integer, "null"]
          format: int64
          description: "Move immediately after this item; null moves to the start."

    VideoEditRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to change. May be empty when smartFolderIds is not."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs resolved at request time to their current member videos (the saved rule plus every ancestor rule, groups expanded to their videos) and added to videoIds. Missing folders are ignored."
          maxItems: 20000
          items:
            type: integer
            format: int64
        tags:
          $ref: "#/components/schemas/VideoTagEdit"
        credits:
          type: array
          description: "At most one edit per role."
          maxItems: 6
          items:
            $ref: "#/components/schemas/VideoCreditEdit"
        dates:
          type: array
          description: "At most one entry per kind."
          maxItems: 3
          items:
            $ref: "#/components/schemas/VideoDateEdit"
        public:
          type: boolean
          description: "True makes the videos public, false private; omit to keep each video's visibility."

    VideoTagEdit:
      type: object
      additionalProperties: false
      properties:
        add:
          type: array
          description: "Up to 100 tags to attach; a tag named twice, or by a name and its ID, is attached once."
          maxItems: 100
          items:
            $ref: "#/components/schemas/TagInput"
        remove:
          type: array
          description: "Up to 100 distinct tag IDs whose manual attachments are removed; a tag also in add returns 400 work_info_duplicate."
          maxItems: 100
          items:
            type: integer
            format: int64

    VideoDateEdit:
      type: object
      required: [kind, date]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        date:
          type: [string, "null"]
          description: "YYYY, YYYY-MM or YYYY-MM-DD as in WorkDate; null clears the kind."

    VideoEditResponse:
      type: object
      required: [applied, tags]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: "Number of resolved videos currently in the library that any part changed."
        tags:
          type: array
          description: "The tags of tags.add as resolved, in request order without repeats."
          items:
            $ref: "#/components/schemas/TagRef"
        remote:
          $ref: "#/components/schemas/RemoteSelectionResult"

    VideoCodeEditSummary:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        rows:
          type: array
          description: "One row per user-data key, in the order the resolved videos were first listed."
          items:
            $ref: "#/components/schemas/VideoCodeEditRow"

    VideoCodeEditRow:
      type: object
      required: [video]
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/Video"
        code:
          type: string
          description: "The key's current code; absent when it has none."

    VideoCodeEditRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "One item per row to write. A videoId listed twice, or two items on one user-data key, returns 400 invalid_request."
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VideoCodeEditItem"

    VideoCodeEditItem:
      type: object
      required: [videoId, contentVersion, code]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
          description: "The row's shown video; a bundle member writes its bundle's key."
        contentVersion:
          type: string
          description: "The row's video.contentVersion from summarizeVideoCodeEdits; another value returns 409 content_changed, as when SQLite reused a deleted video's ID."
        code:
          type: string
          description: "The new code, with WorkInfo.code's rules: trimmed, 1–100 code points, no control characters."

    VideoCodeEditResponse:
      type: object
      required: [applied]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: "Number of user-data keys whose code changed; a key that already had the item's code is not counted."
        remote:
          $ref: "#/components/schemas/RemoteSelectionResult"

    VideoEditSummary:
      type: object
      required: [total, public, tags, people, organizations, dates]
      additionalProperties: false
      properties:
        total:
          type: integer
        public:
          type: integer
          description: "Videos out of total that are public."
        tags:
          type: array
          items:
            $ref: "#/components/schemas/VideoTagsSummaryItem"
        people:
          type: array
          items:
            $ref: "#/components/schemas/VideoEditPersonCount"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/VideoEditOrganizationCount"
        dates:
          type: array
          description: "Kind order: release, recorded, published."
          items:
            $ref: "#/components/schemas/VideoEditDateCount"

    VideoEditPersonCount:
      type: object
      required: [role, person, count]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        person:
          $ref: "#/components/schemas/CreditRef"
        count:
          type: integer
        imageRevision:
          $ref: "#/components/schemas/PersonImageRevision"

    VideoEditOrganizationCount:
      type: object
      required: [role, organization, count]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        organization:
          $ref: "#/components/schemas/CreditRef"
        count:
          type: integer

    VideoEditDateCount:
      type: object
      required: [kind, count]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WorkDateKind"
        count:
          type: integer
          description: "Videos out of total with a date of this kind."
        date:
          type: string
          description: "Present only when all count videos share one date."

    VideoCreditEdit:
      type: object
      required: [kind, role]
      additionalProperties: false
      description: "Changes one role on every target: remove drops the IDs, then add appends the IDs a video lacks after its own credits of the role. Together they hold at least one ID, each ID once."
      properties:
        kind:
          type: string
          enum: [person, organization]
        role:
          type: string
          description: "A WorkPersonRole for person, a WorkOrganizationRole for organization; another value returns 400 work_info_out_of_range."
        add:
          type: array
          description: "At most the role's limit (100 people, 20 organizations); a role that would exceed it on any video returns 400 work_info_too_many at credits[i].add."
          items:
            type: integer
            format: int64
        remove:
          type: array
          items:
            type: integer
            format: int64

    VideoVisibilityResponse:
      type: object
      required: [applied]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: "Number of resolved videos (videoIds plus smart-folder members) currently in the library, including videos already in the requested state."
        remote:
          $ref: "#/components/schemas/RemoteSelectionResult"

    VideoTagsSummaryRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to summarize. May be empty when smartFolderIds is not."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs resolved at request time to their current member videos (the saved rule plus every ancestor rule, groups expanded to their videos) and added to videoIds. Missing folders are ignored."
          maxItems: 20000
          items:
            type: integer
            format: int64

    WorkInfoFillTargetsRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Video IDs to fill. May be empty when smartFolderIds is not."
          maxItems: 20000
          items:
            type: integer
            format: int64
        smartFolderIds:
          type: array
          description: "Smart-folder IDs resolved at request time to their current member videos and added to videoIds, as in VideoTagsSummaryRequest. Missing folders are ignored."
          maxItems: 20000
          items:
            type: integer
            format: int64

    WorkInfoFillTargetList:
      type: object
      required: [targets]
      additionalProperties: false
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/WorkInfoFillTarget"

    WorkInfoFillTarget:
      type: object
      required: [videoId, title, query]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
        title:
          type: string
          description: "The video's title as the owner sees it."
        query:
          type: string
          description: "The work code, or the title without one; it may exceed searchWorkInfo's 200 characters."

    VideoTagsSummaryItem:
      type: object
      required: [tag, count, manualCount]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        count:
          type: integer
          description: "Videos carrying the tag manually or through folder names."
        manualCount:
          type: integer
          description: "Videos carrying the tag manually."

    VideoTagsSummary:
      type: object
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          type: integer
        items:
          type: array
          description: "Tags assigned to at least one video, in natural-name order."
          items:
            $ref: "#/components/schemas/VideoTagsSummaryItem"

    DirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string

    DirectoryListing:
      type: object
      required: [parentPath, directories]
      additionalProperties: false
      properties:
        currentPath:
          type: string
        parentPath:
          type: [string, "null"]
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    VideoSort:
      type: string
      enum:
        - addedAsc
        - addedDesc
        - modifiedAsc
        - modifiedDesc
        - createdAsc
        - createdDesc
        - titleAsc
        - titleDesc
        - durationAsc
        - durationDesc
        - sizeAsc
        - sizeDesc
        - playedAsc
        - playedDesc
        - favoritedAsc
        - favoritedDesc
        - random
      default: addedDesc
      description: "Asc/Desc select direction. added uses added time; modified uses displayed-location mtime; created uses its birth time or mtime fallback; title uses its natural title; duration uses video length; size uses its file size; played uses last playback; favorited uses favorite time (the group's for group items); random derives order from seed and video ID. Missing duration/playback/favorite values sort last in either direction; ties use ID. See docs/design-docs/catalog-organization.md."
    FolderScope:
      type: string
      enum: [direct, subtree]
      default: direct
      description: "direct selects immediate locations; subtree includes all descendants"

    VideoPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
          description: "Total after applying query, favorite and listFolderVideos scope, independent of pagination."
        nextCursor:
          type: string
          description: "Next-page cursor; omitted when no more results remain."
        missingTagIds:
          type: array
          description: "Missing IDs from tag; omitted when none."
          items:
            type: integer
            format: int64
        peerItems:
          type: array
          description: "Per-item cursors, one per item in order; only in answers to the paired VVMDM's peer credential."
          items:
            $ref: "#/components/schemas/PeerListItem"

    LibraryPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItem"
        total:
          type: integer
          description: "Filtered item/card count, independent of pagination."
        nextCursor:
          type: string
          description: "Next-page cursor; omitted when no more results remain."
        missingTagIds:
          type: array
          description: "Missing IDs from tag; omitted when none."
          items:
            type: integer
            format: int64
        peerItems:
          type: array
          description: "Per-item cursors, one per item in order; only in answers to the paired VVMDM's peer credential."
          items:
            $ref: "#/components/schemas/PeerListItem"

    PeerListItem:
      type: object
      required: [cursor, sortValue]
      additionalProperties: false
      description: "One listed item's place for merging lists of two paired VVMDMs."
      properties:
        cursor:
          type: string
          description: "Cursor that continues the list after this item."
        sortValue:
          type: [string, "null"]
          description: "The item's value under the request's sort as the cursor encodes it; null sorts last."

    LibraryItem:
      type: object
      required: [kind]
      additionalProperties: false
      description: "One library item containing exactly one of video, group or smartFolder according to kind. smartFolder summarizes a top-level folder, or a favorited folder in favorites-only mode, for the owner only; fetch card values with listSmartFolderCards."
      properties:
        kind:
          type: string
          enum: [video, group, smartFolder]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"
        smartFolder:
          $ref: "#/components/schemas/SmartFolderSummary"

    LibraryGroup:
      type: object
      required:
        [
          id,
          name,
          videoCount,
          sizeBytes,
          addedAt,
          previews,
          openVideoId,
          videoIds,
          tags,
        ]
      additionalProperties: false
      description: "Group values aggregate visible descendant videos in playback order: depth-first through subgroups, deduplicating by first occurrence. Address groups by id; guest responses omit watchedCount, watchState, lastPlayedAt and favorite, and return empty tags."
      properties:
        id:
          type: integer
          format: int64
          description: "Group ID"
        folder:
          $ref: "#/components/schemas/VideoFolder"
          description: "Folder for an automatic group, included only when that folder is under a registered folder. Absent for manual groups, allowing the UI to distinguish them."
        name:
          type: string
          description: "Group name."
        videoCount:
          type: integer
        watchedCount:
          type: integer
          description: "Completed member count; owner responses only."
        watchState:
          type: string
          enum: [unwatched, inProgress, watched]
          description: "unwatched if none have started, watched if all are complete, otherwise inProgress; owner responses only."
        durationMs:
          type: integer
          format: int64
          description: "Sum of known member durations; omitted if none are known."
        sizeBytes:
          type: integer
          format: int64
          description: "Sum of representative-location sizes for members."
        addedAt:
          type: string
          format: date-time
          description: "Latest member addition timestamp."
        lastPlayedAt:
          type: string
          format: date-time
          description: "Latest member playback timestamp; omitted when absent."
        previews:
          type: array
          maxItems: 4
          description: "Up to four generated member thumbnails in order, matching folder-card previews. List rows use the first thumbnail."
          items:
            $ref: "#/components/schemas/FolderPreview"
        openVideoId:
          type: integer
          format: int64
          description: "Member opened on click: first in-progress member, otherwise first incomplete member, otherwise the first member."
        videoIds:
          type: array
          description: "All member IDs in order."
          items:
            type: integer
            format: int64
        tags:
          type: array
          description: "Union of member tags, combining provenance for each tag."
          items:
            $ref: "#/components/schemas/VideoTag"
        favorite:
          type: boolean
          description: "Whether the owner favorited the group, independent of member favorites; owner responses only."
    GroupMembers:
      type: object
      additionalProperties: false
      description: "Videos and groups to append: videos first, then groups, preserving request order within each kind."
      properties:
        videoIds:
          type: array
          description: "Video IDs to add."
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: "Group IDs to add."
          maxItems: 20000
          items:
            type: integer
            format: int64

    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      description: "POST /api/groups body: GroupMembers plus a name."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "Group name; the server trims whitespace before checking length."
        videoIds:
          type: array
          description: "Video IDs to include as items."
          maxItems: 20000
          items:
            type: integer
            format: int64
        groupIds:
          type: array
          description: "Group IDs to include as items."
          maxItems: 20000
          items:
            type: integer
            format: int64

    GroupName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "Group name; the server trims whitespace before checking length."

    GroupRename:
      type: object
      required: [name]
      additionalProperties: false
      description: "PATCH /api/groups/{id} body."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "Group name; the server trims whitespace before checking length."
        undoToken:
          type: string
          description: "undoToken from the POST /api/organize/group that created this group, including this rename in that undo operation."

    GroupListPage:
      type: object
      required: [groups]
      additionalProperties: false
      description: "GET /api/groups response."
      properties:
        groups:
          type: array
          description: "Visible groups at every depth, in natural-name order."
          items:
            $ref: "#/components/schemas/LibraryGroup"
        nextCursor:
          type: string
          description: "Included only when more results remain."

    GroupItemMove:
      type: object
      additionalProperties: false
      properties:
        after:
          type: integer
          format: int64
          description: "Move immediately after this item; omission moves to the start."

    GroupItemRemove:
      type: object
      required: [itemIds]
      additionalProperties: false
      properties:
        itemIds:
          type: array
          description: "Item ID to remove, not a video or group ID."
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64

    OrganizeRef:
      type: object
      required: [kind, id]
      additionalProperties: false
      description: "One dragged card."
      properties:
        kind:
          type: string
          enum: [video, group]
        id:
          type: integer
          format: int64
          description: "Video or group ID."

    OrganizeRefs:
      type: array
      description: "Dragged cards in screen order."
      minItems: 1
      maxItems: 20000
      items:
        $ref: "#/components/schemas/OrganizeRef"

    OrganizeResult:
      type: object
      required: [undoToken]
      additionalProperties: false
      properties:
        undoToken:
          type: string
          description: "Single-use undo token for POST /api/organize/undo, valid for ten minutes."
        groupId:
          type: integer
          format: int64
          description: "New group ID; returned only by /api/organize/group."

    OrganizeReorder:
      type: object
      required: [groupId, itemIds]
      additionalProperties: false
      properties:
        groupId:
          type: integer
          format: int64
          description: "Currently open group."
        itemIds:
          type: array
          description: "Item IDs to move in screen order, not video or group IDs."
          minItems: 1
          maxItems: 20000
          items:
            type: integer
            format: int64
        after:
          type: integer
          format: int64
          description: "Move immediately after this item; omission moves to the start."

    OrganizeGroup:
      type: object
      required: [items, target]
      additionalProperties: false
      properties:
        items:
          $ref: "#/components/schemas/OrganizeRefs"
        target:
          type: integer
          format: int64
          description: "Drop-target video."
        from:
          type: integer
          format: int64
          description: "Currently open group in which to place the new group."

    OrganizeMove:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          $ref: "#/components/schemas/OrganizeRefs"
        from:
          type: integer
          format: int64
          description: "Currently open group from which cards were dragged."
        to:
          type: integer
          format: int64
          description: "Destination group; omission means the library, removing cards from from only."

    OrganizeMerge:
      type: object
      required: [items, into]
      additionalProperties: false
      properties:
        items:
          $ref: "#/components/schemas/OrganizeRefs"
        into:
          type: integer
          format: int64
          description: "Drop-target group; items must contain at least one group."
        from:
          type: integer
          format: int64
          description: "Source group supplied by a group page, not the library. When present, remove cards from it in the same transaction as the merge."
    OrganizeBundle:
      type: object
      required: [videoIds, target]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          description: "Dragged video IDs."
          minItems: 1
          maxItems: 20
          items:
            type: integer
            format: int64
        target:
          type: integer
          format: int64
          description: "Drop-target video, which becomes the new version-set representative."

    OrganizeUndo:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: "undoToken from the operation response."

    GroupTagResult:
      type: object
      required: [tag, created]
      additionalProperties: false
      properties:
        tag:
          $ref: "#/components/schemas/TagRef"
        created:
          type: boolean
          description: "True for a newly created tag; false for an existing tag resolved by name or synonym."
    GroupRef:
      type: object
      required: [id, name]
      additionalProperties: false
      description: "Group ID and name."
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GroupItem:
      type: object
      required: [id, kind]
      additionalProperties: false
      description: "One group item containing exactly one of video or group according to kind."
      properties:
        id:
          type: integer
          format: int64
          description: "Item identifier, not a video or group ID."
        kind:
          type: string
          enum: [video, group]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"

    GroupDetail:
      type: object
      required: [group, trail, items]
      additionalProperties: false
      description: "GET /api/groups/{id} response."
      properties:
        group:
          $ref: "#/components/schemas/LibraryGroup"
        trail:
          type: array
          description: "Connected parent-child portion of the requested trail, ordered outermost first and ending at this group's parent."
          items:
            $ref: "#/components/schemas/GroupRef"
        items:
          type: array
          description: "First item page in position order, including visible items only."
          items:
            $ref: "#/components/schemas/GroupItem"
        nextCursor:
          type: string
          description: "Included only when more results remain; pass to listGroupItems."

    GroupItemPage:
      type: object
      required: [items]
      additionalProperties: false
      description: "GET /api/groups/{id}/items response."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupItem"
        nextCursor:
          type: string
          description: "Included only when more results remain."

    GroupChanged:
      type: object
      required: [ids]
      additionalProperties: false
      description: "Data for the group event on /api/events."
      properties:
        ids:
          type: array
          description: "IDs of renamed or changed groups and their ancestors, ascending."
          items:
            type: integer
            format: int64

    SmartFolderChanged:
      type: object
      required: [ids]
      additionalProperties: false
      description: "Data for the smartFolder event on /api/events."
      properties:
        ids:
          type: array
          description: "Smart-folder IDs whose contents or cards may have changed, ascending."
          items:
            type: integer
            format: int64

    SmartRule:
      type: object
      additionalProperties: false
      description: "Smart-folder filters with the same meanings as library filters. All properties are optional; omission disables that filter and {} matches every video. Null is invalid, not omission."
      properties:
        q:
          type: string
          maxLength: 500
          description: "Search input matched with owner semantics."
        favorite:
          type: boolean
          description: "Restrict to favorite videos."
        tags:
          type: array
          minItems: 1
          maxItems: 16
          description: "Distinct tag IDs that every matching video must carry."
          items:
            type: integer
            format: int64
        tagKind:
          type: integer
          format: int64
          description: "Tag-kind IDs requiring a matching video to carry a tag of that kind."
        person:
          type: integer
          format: int64
          description: "Person IDs linked in any role."
        organization:
          type: integer
          format: int64
          description: "Organization IDs linked in any role."
        minDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: "Shortest duration in milliseconds, as `listLibrary`'s `minDurationMs`."
        maxDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: "Longest duration in milliseconds, as `listLibrary`'s `maxDurationMs`; below `minDurationMs` returns 400 invalid_smart_rule."
        addedFrom:
          type: string
          description: "First `YYYY-MM-DD` day added, in the server's local time zone."
        addedTo:
          type: string
          description: "Last `YYYY-MM-DD` day added, in the server's local time zone; before `addedFrom` returns 400 invalid_smart_rule."
        watchState:
          $ref: "#/components/schemas/WatchState"

    WatchState:
      type: string
      enum: [unwatched, inProgress, watched]
      description: "unwatched without a started position, watched when complete, otherwise inProgress."

    SmartRuleRef:
      type: object
      required: [kind, id]
      additionalProperties: false
      description: "Entities referenced by filters that no longer exist."
      properties:
        kind:
          type: string
          enum: [tag, tagKind, person, organization]
        id:
          type: integer
          format: int64

    SmartFolderSummary:
      type: object
      required: [id, name]
      additionalProperties: false
      description: "Smart-folder summary used by library and child-folder items, without card values; fetch those using listSmartFolderCards."
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: "Parent folder ID; omitted for top-level folders."
        name:
          type: string
        favorite:
          type: boolean
          description: "Whether the owner favorited the folder; owner responses only."

    SmartFolderList:
      type: object
      required: [smartFolders]
      additionalProperties: false
      description: "GET /api/smart-folders response."
      properties:
        smartFolders:
          type: array
          description: "Visible folders in natural-name order, then ID."
          items:
            $ref: "#/components/schemas/SmartFolderSummary"

    LibrarySmartFolder:
      type: object
      required: [id, name, videoCount, sizeBytes, previews, tags]
      additionalProperties: false
      description: "Smart-folder card fields match LibraryGroup semantics. getSmartFolder uses playback order; listSmartFolderCards aggregates matching videos. Guest responses omit watchedCount, watchState, lastPlayedAt and favorite, and return empty tags."
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: "Parent folder ID; omitted for top-level folders."
        name:
          type: string
        videoCount:
          type: integer
        watchedCount:
          type: integer
          description: "Completed video count; owner responses only."
        watchState:
          type: string
          enum: [unwatched, inProgress, watched]
          description: "Derived like LibraryGroup.watchState; owner responses only."
        durationMs:
          type: integer
          format: int64
          description: "Sum of known video durations; omitted if none are known."
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
          description: "Latest addition timestamp; omitted if there are no videos."
        lastPlayedAt:
          type: string
          format: date-time
          description: "Latest playback timestamp; omitted when absent."
        previews:
          type: array
          maxItems: 4
          description: "Up to four generated video thumbnails in order."
          items:
            $ref: "#/components/schemas/FolderPreview"
        openVideoId:
          type: integer
          format: int64
          description: "Video opened on click, selected like LibraryGroup.openVideoId; omitted if there are no videos."
        tags:
          type: array
          description: "Union of video tags."
          items:
            $ref: "#/components/schemas/VideoTag"
        favorite:
          type: boolean
          description: "Whether the owner favorited the folder; owner responses only."
        conditions:
          $ref: "#/components/schemas/SmartFolderConditions"
        peerRule:
          $ref: "#/components/schemas/PeerSmartRule"

    SmartFolderConditions:
      type: object
      additionalProperties: false
      description: "The duration, added-day and watch-state fields of the folder's own rule, for the card's condition chips. listSmartFolderCards owner responses only; omitted when the rule sets none of them."
      properties:
        minDurationMs:
          type: integer
          format: int64
          minimum: 0
        maxDurationMs:
          type: integer
          format: int64
          minimum: 0
        addedFrom:
          type: string
          description: "`YYYY-MM-DD` day in the server's local time zone."
        addedTo:
          type: string
          description: "`YYYY-MM-DD` day in the server's local time zone."
        watchState:
          $ref: "#/components/schemas/WatchState"

    SmartFolderCards:
      type: object
      required: [cards]
      additionalProperties: false
      description: "GET /api/smart-folders/cards response."
      properties:
        cards:
          type: array
          description: "In requested ids order, excluding missing or hidden folders."
          items:
            $ref: "#/components/schemas/LibrarySmartFolder"

    SmartFolderSettings:
      type: object
      required: [rule, sort, missing]
      additionalProperties: false
      description: "Folder filters and sort order; owner responses only."
      properties:
        rule:
          $ref: "#/components/schemas/SmartRule"
        sort:
          $ref: "#/components/schemas/VideoSort"
        missing:
          type: array
          description: "Missing entities referenced by this folder or its ancestors, ordered from the outermost ancestor."
          items:
            $ref: "#/components/schemas/SmartRuleRef"

    SmartFolderItem:
      type: object
      required: [kind]
      additionalProperties: false
      description: "One smart-folder item containing exactly one of video, group or smartFolder according to kind."
      properties:
        kind:
          type: string
          enum: [video, group, smartFolder]
        video:
          $ref: "#/components/schemas/Video"
        group:
          $ref: "#/components/schemas/LibraryGroup"
        smartFolder:
          $ref: "#/components/schemas/SmartFolderSummary"

    SmartFolderDetail:
      type: object
      required: [smartFolder, trail, items]
      additionalProperties: false
      description: "GET /api/smart-folders/{id} response."
      properties:
        smartFolder:
          $ref: "#/components/schemas/LibrarySmartFolder"
        settings:
          $ref: "#/components/schemas/SmartFolderSettings"
        trail:
          type: array
          description: "Ancestor folders, ordered outermost first and ending at this folder's parent."
          items:
            $ref: "#/components/schemas/GroupRef"
        items:
          type: array
          description: "First contents page: child folders in name order, then items in folder sort order."
          items:
            $ref: "#/components/schemas/SmartFolderItem"
        nextCursor:
          type: string
          description: "Included only when more results remain; pass to listSmartFolderItems."
        peerItems:
          type: array
          description: "Requests with the paired VVMDM's credential only: one entry per video or group item, in order, after the child folders."
          items:
            $ref: "#/components/schemas/PeerListItem"

    SmartFolderItemPage:
      type: object
      required: [items]
      additionalProperties: false
      description: "GET /api/smart-folders/{id}/items response."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SmartFolderItem"
        nextCursor:
          type: string
          description: "Included only when more results remain."
        peerItems:
          type: array
          description: "Requests with the paired VVMDM's credential only: one entry per item, in order."
          items:
            $ref: "#/components/schemas/PeerListItem"

    SmartFolderCreate:
      type: object
      required: [name, rule]
      additionalProperties: false
      description: "POST /api/smart-folders body."
      properties:
        name:
          type: string
          description: "1-100 characters after trimming."
        rule:
          $ref: "#/components/schemas/SmartRule"
        sort:
          $ref: "#/components/schemas/VideoSort"
        parentId:
          type: integer
          format: int64
          description: "Parent folder ID; omission creates a top-level folder."

    SmartFolderChange:
      type: object
      additionalProperties: false
      description: "PATCH /api/smart-folders/{id} body; change supplied properties only, requiring at least one."
      properties:
        name:
          type: string
          description: "1-100 characters after trimming."
        rule:
          $ref: "#/components/schemas/SmartRule"
        sort:
          $ref: "#/components/schemas/VideoSort"
        parentId:
          type: [integer, "null"]
          format: int64
          description: "Parent folder ID; null moves to the top level."

    VideoSmartFolderRef:
      type: object
      required: [id, name, position, count]
      additionalProperties: false
      description: "Smart-folder context from the smartFolder query, only in GET /api/videos/{id} when its playback order contains the video; group is then absent. Position and count follow folder playback order, counting only public videos for guests."
      properties:
        id:
          type: integer
          format: int64
          description: "Smart folder ID"
        name:
          type: string
          description: "Smart-folder name."
        position:
          type: integer
          minimum: 1
          description: "One-based position in folder playback order."
        count:
          type: integer
          minimum: 1
          description: "Video count in folder playback order."

    FolderPreview:
      type: object
      required: [videoId, thumbnailUrl]
      additionalProperties: false
      properties:
        videoId:
          type: integer
          format: int64
        title:
          type: string
          description: "Video title for direct playback links in smart-folder cards."
        thumbnailUrl:
          type: string
          description: "Versioned URL matching Video.thumbnailUrl."
        previewUrl:
          type: string
          description: "Versioned URL matching Video.previewUrl, included only when the list preview is generated and its stored asset is available."

    FolderSummary:
      type: object
      required: [rootId, path, name, videoCount, folderCount, previews]
      additionalProperties: false
      properties:
        rootId:
          type: integer
          format: int64
        path:
          type: string
          description: "Slash-separated path relative to the registered folder; empty for the root itself."
        name:
          type: string
          description: "Display name: final relative-path segment, or final absolute-path segment for the registered root."
        rootPath:
          type: string
          description: "Registered folder's absolute path; omitted for guests. The UI derives the root display name from this path, falling back to name."
        videoCount:
          type: integer
          description: "Direct video count, public videos only for guests."
        folderCount:
          type: integer
          description: "Direct child-folder count."
        previews:
          type: array
          maxItems: 4
          description: "Up to four generated direct-video thumbnails in location-path ascending order."
          items:
            $ref: "#/components/schemas/FolderPreview"
        grouping:
          $ref: "#/components/schemas/FolderGrouping"

    FolderGroupingMode:
      type: string
      enum: [auto, ungroup, groupDirect]
      description: "Folder grouping override: auto for none, ungroup to dissolve grouping, groupDirect to group direct children."
    FolderGrouping:
      type: object
      required: [mode]
      additionalProperties: false
      description: "Current folder grouping state, included as FolderSummary.grouping in owner responses only."
      properties:
        mode:
          $ref: "#/components/schemas/FolderGroupingMode"
        groupId:
          type: integer
          format: int64
          description: "Automatic group ID for this folder; omitted if absent. Convert it to a tag through POST /api/groups/{id}/tag."
    FolderGroupingRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/FolderGroupingMode"

    FolderListing:
      type: object
      required: [folder, folders]
      additionalProperties: false
      properties:
        folder:
          $ref: "#/components/schemas/FolderSummary"
        folders:
          type: array
          description: "Direct child folders in natural-name order."
          items:
            $ref: "#/components/schemas/FolderSummary"

    RootFolderListing:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        folders:
          type: array
          description: "Registered media folders in natural-name order."
          items:
            $ref: "#/components/schemas/FolderSummary"

    Video:
      type: object
      description: "Guest responses omit location, progress, probeError, fileTitle, displayName, thumbnailPositionMs, thumbnailImage, cardCredits and every workInfo field but description and urls, and return empty tags. A virtual video omits location, folder, fileTitle, durationMs, media fields, previewUrl, seekThumbnailUrl, versions and mediaInfo."
      required:
        [
          id,
          virtual,
          title,
          sizeBytes,
          addedAt,
          updatedAt,
          fileCreatedAt,
          fileModifiedAt,
          playable,
          probeState,
          thumbnailState,
          previewState,
          tags,
          public,
        ]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        virtual:
          type: boolean
          description: "True for a virtual video, which has no file and is never playable."
        linkFetch:
          $ref: "#/components/schemas/VirtualLinkFetch"
        title:
          type: string
          description: "Effective title: display name when set, otherwise filename without extension; a virtual video's own title."
        fileTitle:
          type: string
          description: "Filename without extension; owner responses only."
        displayName:
          type: string
          description: "Owner-assigned display name; included only when set and for owners."
        thumbnailPositionMs:
          type: integer
          format: int64
          description: "Thumbnail frame position in milliseconds; included only when set and for owners."
        contentVersion:
          type: string
          description: "Content version: first 12 content-key characters, matching the thumbnailUrl version prefix, or the whole user key for a virtual video; owner responses only. Submit with image uploads to reject changes since the preview opened (see Uploaded images in docs/design-docs/thumbnail-editing.md), and with saves and deletion of a virtual video."
        thumbnailImage:
          type: string
          enum: [generated, uploaded]
          description: "Applied thumbnail image source: generated for ComfyUI output, uploaded for an uploaded image. Included only while applied and for owners."
        sizeBytes:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: "Latest vv edit to display name, tags, visibility or thumbnail; equals addedAt if never edited."
        fileCreatedAt:
          type: string
          format: date-time
          description: "Creation timestamp of the displayed-location file; falls back to its mtime when unavailable. A virtual video's creation time."
        fileModifiedAt:
          type: string
          format: date-time
          description: "Modification time (mtime) of the displayed-location file, with the sub-second precision the scan recorded. A virtual video's creation time."
        durationMs:
          type: integer
          format: int64
          description: "Duration; omitted before probing or when unavailable."
        width:
          type: integer
          description: "Display-oriented width, including rotation metadata."
        height:
          type: integer
          description: "Display-oriented height, including rotation metadata."
        displayAspectRatio:
          type: number
          format: double
          description: "Displayed width/height ratio, including rotation and sample aspect ratio; portrait videos are below one. Omitted before probing or when unavailable."
        container:
          type: string
          examples: [mp4, webm, mkv]
        videoCodec:
          type: string
          examples: [h264, vp9]
        audioCodec:
          type: string
          examples: [aac, opus]
        playable:
          type: boolean
          description: "Whether the video is judged directly playable in the browser; always false, without unplayableReason, for a virtual video."
        unplayableReason:
          type: string
          enum: [container, video_codec, audio_codec]
          description: "Reason for playable=false; omitted before classification."
        probeState:
          type: string
          enum: [pending, done, failed]
        probeError:
          type: string
          description: "Reason for probeState=failed; omitted for guests because it may contain an absolute path."
        probeErrorCode:
          $ref: "#/components/schemas/ProbeErrorCode"
        thumbnailState:
          type: string
          enum: [pending, done, failed]
        previewState:
          type: string
          enum: [pending, done, failed]
        thumbnailUrl:
          type: string
          description: "Included only when thumbnailState=done. The content-key prefix forms the version, with -r<revision> for a selected position or -g<revision> for an applied image; guests receive the same URL."
        previewUrl:
          type: string
          description: "Versioned URL included only when previewState=done and the stored asset is available. Missing assets trigger regeneration and return previewState=pending."
        seekThumbnailUrl:
          type: string
          description: "Versioned URL for SeekThumbnailSprite layout metadata, included only when probeState=done and durationMs is positive."
        progress:
          $ref: "#/components/schemas/Progress"
        location:
          $ref: "#/components/schemas/VideoLocation"
        folder:
          $ref: "#/components/schemas/VideoFolder"
        group:
          $ref: "#/components/schemas/VideoGroupRef"
        smartFolder:
          $ref: "#/components/schemas/VideoSmartFolderRef"
        versions:
          $ref: "#/components/schemas/VideoVersionsRef"
        tags:
          type: array
          description: "Assigned tags in natural-name order (domain.CompareNatural), then ID, including folder-derived assignments. Empty when none, and always empty for guests."
          items:
            $ref: "#/components/schemas/VideoTag"
        public:
          type: boolean
          description: "Whether the video is public and visible without login."
        favorite:
          type: boolean
          description: "Whether the owner favorited the video; owner responses only."
        workInfo:
          $ref: "#/components/schemas/WorkInfo"
          description: "Work information, only in GET /api/videos/{id} and owner PUT work-info/details responses when a row exists. Guests receive only description and urls, with the other lists empty, and no workInfo when both are empty. Omitted from lists, related videos and library items."
        cardCredits:
          $ref: "#/components/schemas/VideoCardCredits"
          description: "Credits a card shows, in owner list items (video lists, library, group, playlist and smart-folder pages, related videos, versions and watch history) and in GET /api/videos/{id} with workInfo, since lists refresh a changed item from it. Present only when the video has a code, a performer or an organization; omitted for guests."
        mediaInfo:
          $ref: "#/components/schemas/MediaInfo"
          description: "Additional import-probed metadata, only in GET /api/videos/{id} when a current-version row exists. Owners and guests viewing public videos receive the same values; omitted from lists, related videos, library items and owner PUT responses."
        seekThumbnailState:
          type: string
          enum: [pending, done, failed]
          description: "Seek-thumbnail state, only in GET /api/videos/{id} under the same conditions as seekThumbnailUrl. done means a complete sprite; pending means queued or generating, including missing done assets queued for regeneration; failed means retries exhausted."
    MediaInfo:
      type: object
      description: "Additional video metadata; omit unavailable fields and objects with no fields."
      additionalProperties: false
      properties:
        video:
          $ref: "#/components/schemas/MediaInfoVideo"
        audioTracks:
          type: array
          description: "All audio streams in stream order."
          items:
            $ref: "#/components/schemas/MediaInfoAudioTrack"
        subtitleTracks:
          type: array
          description: "All subtitle streams in stream order."
          items:
            $ref: "#/components/schemas/MediaInfoSubtitleTrack"
        embedded:
          $ref: "#/components/schemas/MediaInfoEmbedded"
        broadcast:
          $ref: "#/components/schemas/MediaInfoBroadcast"
        chapters:
          type: array
          description: "Chapters in start order, within video duration."
          items:
            $ref: "#/components/schemas/MediaInfoChapter"
        container:
          $ref: "#/components/schemas/MediaInfoContainer"

    MediaInfoVideo:
      type: object
      description: "Video-stream metadata; hdr is always included when a video stream exists."
      required: [hdr]
      additionalProperties: false
      properties:
        frameRate:
          type: number
          format: double
          description: "Frames per second from avg_frame_rate."
        bitDepth:
          type: integer
          description: "Bits per sample."
        bitRate:
          type: integer
          format: int64
          description: "Video-stream bits per second."
        interlaced:
          type: boolean
          description: "Included only when the file identifies progressive or interlaced scanning."
        hdr:
          type: string
          enum: [sdr, hdr10, hlg, dolby_vision]
        projection:
          type: string
          description: "360-degree projection using ffprobe names such as equirectangular or cubemap."
        stereo3d:
          type: string
          description: "3D layout using ffprobe names such as side by side or top and bottom."
        closedCaptions:
          type: boolean
          description: "True when the video stream carries closed captions."
        profile:
          type: string
          examples: [High, "Main 10"]
        level:
          type: integer
          description: "Codec level as ffprobe reports it (H.264 41 is level 4.1)."
        pixelFormat:
          type: string
          examples: [yuv420p, yuv420p10le]
        chromaSubsampling:
          type: string
          examples: ["4:2:0", "4:2:2", "4:4:4"]
        colorRange:
          type: string
          enum: [limited, full]
        codecTag:
          type: string
          description: "Container fourcc, such as hvc1 or hev1."
        codecString:
          type: string
          description: "RFC 6381 codecs value, such as avc1.64001f."
        variableFrameRate:
          type: boolean
          description: "A header estimate: the average frame rate differs from the base rate by more than 1%."
        frameCount:
          type: integer
          format: int64
          description: "Frame count the header records."
        maxBitRate:
          type: integer
          format: int64
          description: "Maximum bits per second the header records."
        bitsPerPixel:
          type: number
          format: double
          description: "bitRate per pixel per frame; a higher value at the same codec and resolution means a larger, less compressed encode."
        mirrored:
          type: boolean
          description: "The display matrix mirrors the picture; a vertical flip is a mirror with a 180-degree rotation."
        crop:
          $ref: "#/components/schemas/MediaInfoCrop"
        mastering:
          $ref: "#/components/schemas/MediaInfoMasteringDisplay"
        contentLight:
          $ref: "#/components/schemas/MediaInfoContentLight"
        hdr10Plus:
          type: boolean
          description: "The container carries HDR10+ dynamic metadata."
        dolbyVision:
          $ref: "#/components/schemas/MediaInfoDolbyVision"
        filmGrain:
          type: boolean
          description: "AV1 only: whether the stream asks the player to synthesize film grain; absent when unknown."
        multiLayer:
          type: boolean
          description: "The stream has more than one layer, as MV-HEVC stereoscopic video does."
        startMs:
          type: integer
          format: int64
          description: "The stream's start in the file's timeline; a later audio start than video start means the audio begins late."
        durationMs:
          type: integer
          format: int64
          description: "The stream's own length; one much shorter or longer than the others suggests drifting sync."
        origin:
          $ref: "#/components/schemas/MediaInfoStreamOrigin"

    MediaInfoAudioTrack:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index:
          type: integer
          description: "Stream index within the file."
        codec:
          type: string
          description: "ffprobe codec_name."
          examples: [aac, ac3]
        channels:
          type: integer
        channelLayout:
          type: string
          examples: [stereo, "5.1"]
        language:
          type: string
          description: "File language tag; und is omitted."
        title:
          type: string
        default:
          type: boolean
        sampleRate:
          type: integer
          description: "Samples per second."
        bitDepth:
          type: integer
        sampleFormat:
          type: string
          examples: [fltp, s16, s32]
        bitRate:
          type: integer
          format: int64
        replayGain:
          $ref: "#/components/schemas/MediaInfoReplayGain"
        roles:
          $ref: "#/components/schemas/MediaInfoTrackRoles"
        serviceType:
          type: string
          enum: [main, effects, visually_impaired, hearing_impaired, dialogue, commentary, emergency, voice_over, karaoke]
        startMs:
          type: integer
          format: int64
          description: "The stream's start in the file's timeline; a later audio start than video start means the audio begins late."
        durationMs:
          type: integer
          format: int64
          description: "The stream's own length; one much shorter or longer than the others suggests drifting sync."
        origin:
          $ref: "#/components/schemas/MediaInfoStreamOrigin"

    MediaInfoSubtitleTrack:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index:
          type: integer
          description: "Stream index within the file."
        codec:
          type: string
          description: "ffprobe codec_name."
          examples: [subrip, arib_caption]
        language:
          type: string
          description: "File language tag; und is omitted."
        title:
          type: string
        default:
          type: boolean
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        roles:
          $ref: "#/components/schemas/MediaInfoTrackRoles"
        startMs:
          type: integer
          format: int64
          description: "The stream's start in the file's timeline; a later audio start than video start means the audio begins late."
        durationMs:
          type: integer
          format: int64
          description: "The stream's own length; one much shorter or longer than the others suggests drifting sync."
        origin:
          $ref: "#/components/schemas/MediaInfoStreamOrigin"

    MediaInfoEmbedded:
      type: object
      description: "Tags embedded in the file."
      additionalProperties: false
      properties:
        title:
          type: string
        author:
          type: string
        comment:
          type: string
        description:
          type: string
        genre:
          type: string
        date:
          type: string
          description: "Unmodified file date-tag text."
        recordedAt:
          type: string
          format: date-time
          description: "Capture timestamp, preserving the file's timezone offset when present."
        device:
          type: string
          description: "Manufacturer and model."
        location:
          $ref: "#/components/schemas/MediaInfoLocation"
        coverArt:
          type: boolean
          description: "True when the file contains an attached picture."
        album:
          type: string
        albumArtist:
          type: string
        composer:
          type: string
        show:
          type: string
        episode:
          type: string
        season:
          type: string
        network:
          type: string
          description: "Broadcaster or distributor tag."
        synopsis:
          type: string
        copyright:
          type: string
        publisher:
          type: string
        encodedBy:
          type: string
        encoder:
          type: string
          description: "Software that wrote the file."
        sourceUrl:
          type: string
          description: "Where a download tool fetched the file from."
        keywords:
          type: string
        rating:
          type: string
        captureSoftware:
          type: string
          description: "The phone camera's software version."
        captureFrameRate:
          type: number
          format: double
          description: "The phone's capture rate; above the playback rate means slow motion."

    MediaInfoLocation:
      type: object
      description: "Capture location in degrees, with altitude in meters."
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: number
          format: double

    MediaInfoBroadcast:
      type: object
      description: "Broadcaster and program for a TS recording."
      additionalProperties: false
      properties:
        station:
          type: string
        program:
          type: string

    MediaInfoStreamOrigin:
      type: object
      description: "What the writing tool or device recorded on the stream."
      additionalProperties: false
      properties:
        encoder:
          type: string
        handler:
          type: string
          examples: [VideoHandler, "Core Media Audio"]
        vendor:
          type: string
          description: "Vendor fourcc, such as appl."
        createdAt:
          type: string
          format: date-time
        timecode:
          type: string
          examples: ["01:00:00:00"]

    MediaInfoTrackRoles:
      type: object
      description: "Purposes the file flags on the track; only true flags are present."
      additionalProperties: false
      properties:
        dub:
          type: boolean
        original:
          type: boolean
        comment:
          type: boolean
          description: "Commentary."
        visualImpaired:
          type: boolean
          description: "Audio description for visually impaired viewers."
        hearingImpaired:
          type: boolean
        karaoke:
          type: boolean
        lyrics:
          type: boolean
        cleanEffects:
          type: boolean
          description: "Effects only, without dialogue."
        captions:
          type: boolean
        descriptions:
          type: boolean

    MediaInfoReplayGain:
      type: object
      description: "ReplayGain tags as the file writes them, such as -6.50 dB."
      additionalProperties: false
      properties:
        trackGain:
          type: string
        trackPeak:
          type: string
        albumGain:
          type: string
        albumPeak:
          type: string

    MediaInfoCrop:
      type: object
      description: "Cropping the container records, in pixels from each edge."
      additionalProperties: false
      properties:
        top:
          type: integer
        bottom:
          type: integer
        left:
          type: integer
        right:
          type: integer

    MediaInfoMasteringDisplay:
      type: object
      description: "HDR mastering display: CIE 1931 xy chromaticities and luminance in cd/m²."
      additionalProperties: false
      properties:
        redX: {type: number, format: double}
        redY: {type: number, format: double}
        greenX: {type: number, format: double}
        greenY: {type: number, format: double}
        blueX: {type: number, format: double}
        blueY: {type: number, format: double}
        whiteX: {type: number, format: double}
        whiteY: {type: number, format: double}
        minLuminance: {type: number, format: double}
        maxLuminance: {type: number, format: double}

    MediaInfoContentLight:
      type: object
      description: "HDR content light levels in cd/m²."
      additionalProperties: false
      properties:
        maxContent:
          type: integer
          description: "MaxCLL."
        maxAverage:
          type: integer
          description: "MaxFALL."

    MediaInfoDolbyVision:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile:
          type: integer
        level:
          type: integer
        compatibility:
          type: integer
          description: "dv_bl_signal_compatibility_id: what a player without Dolby Vision shows (1 HDR10, 2 SDR, 4 HLG)."

    MediaInfoContainer:
      type: object
      description: "What the container says about the file as a whole."
      additionalProperties: false
      properties:
        startMs:
          type: integer
          format: int64
          description: "The container's start time."
        majorBrand:
          type: string
          examples: [isom, qt]
        compatibleBrands:
          type: array
          items:
            type: string
        probeScore:
          type: integer
          description: "How sure ffprobe is of the format, out of 100."
        encrypted:
          type: boolean
          description: "A stream is encrypted (DRM)."
        attachments:
          type: array
          description: "Attached files such as fonts, at most 64."
          items:
            $ref: "#/components/schemas/MediaInfoAttachment"
        dataStreams:
          type: array
          description: "Non-media streams such as GoPro telemetry, at most 64."
          items:
            $ref: "#/components/schemas/MediaInfoDataStream"
        sizes:
          $ref: "#/components/schemas/MediaInfoSizes"

    MediaInfoAttachment:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        mimeType:
          type: string
        bytes:
          type: integer
          format: int64

    MediaInfoDataStream:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index:
          type: integer
        codec:
          type: string
          examples: [gpmd, tmcd]
        handler:
          type: string

    MediaInfoSizes:
      type: object
      description: "The file's bytes by stream kind, from header bit rates or Matroska statistics tags. A kind is absent unless every stream of it is known; otherBytes (container overhead, attachments, data, cover art) only when video, audio and subtitles all are."
      additionalProperties: false
      properties:
        totalBytes:
          type: integer
          format: int64
        videoBytes:
          type: integer
          format: int64
        audioBytes:
          type: integer
          format: int64
        subtitleBytes:
          type: integer
          format: int64
        otherBytes:
          type: integer
          format: int64

    MediaInfoChapter:
      type: object
      required: [startMs, endMs]
      additionalProperties: false
      properties:
        startMs:
          type: integer
          format: int64
        endMs:
          type: integer
          format: int64
        title:
          type: string

    SeekThumbnailSprite:
      type: object
      description: "Seek-thumbnail sprite layout; cells beyond frameCount on the final sheet are black and must not be addressed by clients."
      required:
        [intervalMs, frameCount, columns, rows, frameWidth, frameHeight, sheets]
      additionalProperties: false
      properties:
        intervalMs:
          type: integer
          format: int64
          minimum: 1000
          description: "Frame k covers positions [k*intervalMs, (k+1)*intervalMs)."
        frameCount:
          type: integer
          minimum: 1
          maximum: 600
          description: "Total frames across all sheets."
        columns:
          type: integer
          minimum: 1
          description: "Columns per sheet."
        rows:
          type: integer
          minimum: 1
          description: "Rows per sheet."
        frameWidth:
          type: integer
          minimum: 2
          description: "Frame width in pixels, constant within a video."
        frameHeight:
          type: integer
          minimum: 2
          description: "Frame height in pixels."
        sheets:
          type: array
          minItems: 1
          maxItems: 6
          description: "Versioned sheet URLs in index order."
          items:
            type: string

    VideoFolder:
      type: object
      required: [rootId, path]
      additionalProperties: false
      description: "Containing folder for the displayed location in video lists, representative location in GET /api/videos/{id}, problem location in ScanIssue, or active file in ScanActivity; omitted outside registered folders. For automatic LibraryGroup.folder and Video.group.folder, identifies the group folder itself."
      properties:
        rootId:
          type: integer
          format: int64
          description: "Registered media-folder ID containing the location."
        path:
          type: string
          description: "Slash-separated path from the registered root to the containing folder; empty for direct children."
        rootName:
          type: string
          description: "Registered folder display name using FolderSummary.name rules. Included only in GET /api/videos/{id} Video.folder, ScanIssue.folder and ScanActivity.folder, not Video.group.folder."
    VideoLocation:
      type: object
      required: [path, openable]
      additionalProperties: false
      description: "Representative location, only in GET /api/videos/{id}."
      properties:
        path:
          type: string
          description: "Representative absolute path as seen by the server, inside the container when containerized."
        openable:
          type: boolean
          description: "True when both request source and Host are loopback and the server environment can launch the default application."
    VideoGroupRef:
      type: object
      required: [id, name, position, count]
      additionalProperties: false
      description: "Group context from the group query; see docs/design-docs/catalog-organization.md. Included only in GET /api/videos/{id} when the video belongs to the group, never in list items. Position/count follow depth-first playback order with first-occurrence deduplication, counting only public videos for guests."
      properties:
        id:
          type: integer
          format: int64
          description: "Group ID"
        folder:
          $ref: "#/components/schemas/VideoFolder"
          description: "Automatic group folder, as in LibraryGroup.folder; included only for folder-derived groups under a registered folder."
        name:
          type: string
          description: "Group name."
        position:
          type: integer
          minimum: 1
          description: "One-based position in group playback order."
        count:
          type: integer
          minimum: 1
          description: "Video count in group playback order."

    VideoVersionsRef:
      type: object
      required: [count, representativeId]
      additionalProperties: false
      description: "Summary of the video's version set, included for members in every screen API Video response, including lists. Lists fetch these once per page; card indicators use this summary."
      properties:
        count:
          type: integer
          minimum: 1
          description: "Number of versions with locations visible to the viewer."
        representativeId:
          type: integer
          format: int64
          description: "Effective representative video ID, the one displayed in lists."

    VideoVersions:
      type: object
      required: [representativeId, items]
      additionalProperties: false
      description: "All versions in the set."
      properties:
        representativeId:
          type: integer
          format: int64
          description: "Effective representative video ID, or the video's own ID when outside a set."
        items:
          type: array
          description: "Representative first, then natural-title order with ID ties; each item has the GET /api/videos/{id} shape."
          items:
            $ref: "#/components/schemas/Video"

    VideoBundleRequest:
      type: object
      required: [videoIds, representativeId]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          maxItems: 20000
          description: "Videos to bundle: at least two distinct IDs, with duplicates counted once."
          items:
            type: integer
            format: int64
        representativeId:
          type: integer
          format: int64
          description: "Representative video, one of videoIds."

    VersionCandidate:
      type: object
      required: [videos, distance, judgement, recommendation]
      additionalProperties: false
      description: "Pair of potentially identical videos."
      properties:
        recommendation:
          $ref: "#/components/schemas/VersionRepresentativeRecommendation"
        judgement:
          $ref: "#/components/schemas/VersionCandidateJudgement"
        videos:
          type: array
          minItems: 2
          maxItems: 2
          description: "Two videos in ID ascending order, each shaped like GET /api/videos/{id}."
          items:
            $ref: "#/components/schemas/Video"
        distance:
          type: integer
          minimum: 0
          description: "Median Hamming distance between video fingerprints; lower means more similar."

    VersionRepresentativeRecommendation:
      type: object
      required: [videoId, reason]
      additionalProperties: false
      description: "The video whose file is the better representative, judged from the files alone."
      properties:
        videoId:
          type: integer
          format: int64
        reason:
          type: string
          enum: [playable, audio, audio_sync, resolution, bitrate, older]
          description: "The first file property that told the videos apart: plays in the browser, has audio, audio as long as the video, more pixels, higher video bit rate, or lower ID when nothing else differs. Bundling keeps both sides' user data whichever is chosen."

    VersionCandidateJudgement:
      type: object
      required: [state, leftVideoId]
      additionalProperties: false
      description: "The automatic judgement of a listed pair."
      properties:
        state:
          type: string
          enum: [waiting, running, undecided, failed, no_connection, held]
          description: "held is a pair automatic judging skips because the owner unbundled it or undid its automatic dismissal. undecided, failed and no_connection can be sent back with POST /api/version-candidates/rejudge."
        activityId:
          type: integer
          format: int64
          description: "The pair's version_judgement record; absent when none was opened, as while judging is off."
        probability:
          type: number
          format: double
          description: "The classifier's answer for an undecided pair; absent when the rule decided."
        error:
          type: string
          description: "Why the last attempt failed."
        retryAt:
          type: string
          format: date-time
          description: "Next automatic retry of a failed pair."
        leftVideoId:
          type: integer
          format: int64
          description: "The video whose frames are on the left of the evidence images and whose times are evidence's aMs."
        evidence:
          $ref: "#/components/schemas/VersionJudgeEvidence"

    VersionJudgeEvidence:
      type: object
      required: [rule, compared, differing]
      additionalProperties: false
      description: "Why the latest automatic judgement reached its result. See docs/design-docs/duplicate-judging.md."
      properties:
        rule:
          type: string
          enum: [frames_match, frames_differ, incomparable]
          description: "frames_match decided same without the classifier; frames_differ asked the classifier about frames; incomparable left the pair to the owner."
        compared:
          type: integer
          minimum: 0
          description: "Frame pairs compared by time, flat frames skipped."
        differing:
          type: integer
          minimum: 0
          description: "Compared pairs whose pictures differ."
        longestRun:
          type: integer
          minimum: 2
          description: "Pairs in the longest run of consecutive differing pairs; absent without such a run."
        runStartMs:
          type: integer
          format: int64
          description: "Start of that run on the left video's timeline."
        runEndMs:
          type: integer
          format: int64
          description: "End of that run on the left video's timeline."
        versionMismatch:
          type: boolean
          description: "The fingerprints were made by different fingerprint versions, so the frames could not be compared."
        conflict:
          type: boolean
          description: "The judgement found the same video, but a video on one side is marked different from one on the other side, so the pair was left undecided."
        properties:
          type: array
          description: "Properties both files have, read at import: chapters, recording time, embedded title and duration."
          items:
            $ref: "#/components/schemas/VersionPropertySignal"
        byProperties:
          type: boolean
          description: "The properties decided the result, or held a different answer they contradict for the owner."
        frames:
          type: array
          maxItems: 4
          description: "The frame pairs shown to the classifier, in time order; GET /api/activity/{id}/judgement-frames/{index} returns each image."
          items:
            $ref: "#/components/schemas/VersionEvidenceFrame"

    VersionPropertySignal:
      type: object
      required: [kind, same, a, b]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [chapters, recorded_at, embedded_title, duration]
        same:
          type: boolean
          description: "The two values agree: matching chapter starts, equal times or titles, or durations within a second."
        strong:
          type: boolean
          description: "Decides a pair on its own: titled chapters at matching starts, or an equal recording time."
        counts:
          type: boolean
          description: "Counted towards the verdict; a duration and a disagreeing value are shown only."
        a:
          type: string
          description: "The left video's value: a chapter count, a time, a title or milliseconds."
        b:
          type: string
          description: "The right video's value."

    VersionEvidenceFrame:
      type: object
      required: [aMs, bMs, distance]
      additionalProperties: false
      properties:
        aMs:
          type: integer
          format: int64
          description: "Frame time in the left video."
        bMs:
          type: integer
          format: int64
          description: "Frame time in the right video."
        distance:
          type: integer
          minimum: 0
          description: "Hamming distance between the two frames' hashes; over 12 differs."

    VersionCandidatePage:
      type: object
      required: [items, total, judging]
      additionalProperties: false
      properties:
        judging:
          type: boolean
          description: "Whether duplicate judging is on, which a rejudge needs."
        items:
          type: array
          maxItems: 200
          description: "Newest first, at most 200 pairs."
          items:
            $ref: "#/components/schemas/VersionCandidate"
        total:
          type: integer
          minimum: 0
          description: "Total candidate count."

    VersionCandidateDismissRequest:
      type: object
      required: [videoIds]
      additionalProperties: false
      properties:
        videoIds:
          type: array
          minItems: 2
          maxItems: 2
          description: "Two distinct video IDs to record as different videos."
          items:
            type: integer
            format: int64

    RelatedGroup:
      type: object
      required: [id, name, items, offset, total]
      additionalProperties: false
      description: "Reference video's group context from the group query; see docs/design-docs/catalog-organization.md. Members follow group playback order, public videos only for guests."
      properties:
        id:
          type: integer
          format: int64
          description: "Group ID"
        name:
          type: string
          description: "Group name."
        items:
          type: array
          maxItems: 100
          description: "Contiguous group-member window centered near and including the reference video, shifted inward at group edges. Fetch outside the window with listVideoGroupMembers."
          items:
            $ref: "#/components/schemas/Video"
        offset:
          type: integer
          minimum: 0
          description: "Zero-based group-order position of the first item."
        total:
          type: integer
          minimum: 1
          description: "Visible member count."

    GroupMemberPage:
      type: object
      required: [items, offset, total]
      additionalProperties: false
      description: "Contiguous range of members in group order."
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Video"
        offset:
          type: integer
          minimum: 0
          description: "Zero-based group-order position of the first item."
        total:
          type: integer
          minimum: 1
          description: "Visible member count."

    RelatedVideos:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          description: "One related-video page in relevance order, excluding members of the reference video's group when applicable."
          items:
            $ref: "#/components/schemas/Video"
        nextCursor:
          type: string
          description: "Value for the next cursor request; omitted at the end."
        nextId:
          type: integer
          format: int64
          description: "Next group member, omitted at the final member; otherwise the first related video. Omitted when unavailable or when the request includes cursor."
        prevId:
          type: integer
          format: int64
          description: "Previous group member, omitted at the first member, outside a group, or when cursor is supplied. Outside groups the UI uses the previously viewed video; this value need not appear in items."
        group:
          $ref: "#/components/schemas/RelatedGroup"

    DisplayNameUpdate:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: "New display name; whitespace-only after trimming clears it. For a virtual video it is the title and must not be empty."
        contentVersion:
          type: string
          description: "The contentVersion the screen read; required for a virtual video. For a video with a file, a virtual video's version returns 409 content_changed and any other is ignored."

    VirtualVideoCreate:
      type: object
      additionalProperties: false
      description: "A title, a url or both; the title is required without a url."
      properties:
        title:
          type: string
          description: "Title; follows the display-name rules and must not be empty after trimming unless url is set."
        url:
          type: string
          description: "The video's link, http or https, at most 2048 characters; its fetch fills the empty fields."

    VirtualLinkFetch:
      type: object
      required: [state]
      additionalProperties: false
      description: "The fetch started when a virtual video was created from a link; owner-only."
      properties:
        state:
          type: string
          enum: [running, failed, done]
        failure:
          type: string
          description: "Why a failed fetch failed, for the owner to read."
        plugin:
          type: string
          description: "Name of the plugin that ran last; absent when no plugin handled the link."

    VirtualVideoMerge:
      type: object
      required: [contentVersion, videoId, videoContentVersion]
      additionalProperties: false
      properties:
        contentVersion:
          type: string
          description: "The virtual video's contentVersion the screen read."
        videoId:
          type: integer
          format: int64
          description: "The file video to merge into."
        videoContentVersion:
          type: string
          description: "The file video's contentVersion the screen read."

    ThumbnailPositionUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: [integer, "null"]
          format: int64
          description: "Thumbnail frame position in milliseconds; null clears it and restores the automatic position."

    ProgressUpdate:
      type: object
      required: [positionMs]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        playbackId:
          type: string
          minLength: 36
          maxLength: 36
          description: "Client playback identifier in RFC 4122 string form. Its first save adds one history entry; later saves with the same ID add none. Send only after playback starts; invalid format returns 400 invalid_request."
    SubtitleTrackList:
      type: object
      required: [subtitles]
      additionalProperties: false
      properties:
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleTrack"

    SubtitleTrack:
      type: object
      required: [file, label, format]
      additionalProperties: false
      properties:
        file:
          type: string
          description: "Subtitle filename without directories, used as getVideoSubtitle's file parameter."
        label:
          type: string
          description: "Filename label such as ja or en.forced; empty for unlabeled subtitles."
        format:
          type: string
          enum: [srt, vtt]
          description: "Original file format."

    TranscodeStart:
      type: object
      required: [startMs]
      additionalProperties: false
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
          description: "Original-video timestamp in milliseconds corresponding to zero on the transcode output timeline."

    Progress:
      type: object
      required: [positionMs, completed, updatedAt]
      additionalProperties: false
      properties:
        positionMs:
          type: integer
          format: int64
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      description: "Latest import status, shared by the bottom-right indicator and Settings."
      required: [id, status, issues, state, origin]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        origin:
          type: string
          description: "Import initiator; watch means a folder-watcher import limited to changed folders."
          enum: [manual, watch]
        status:
          $ref: "#/components/schemas/ScanStatus"
        videos:
          $ref: "#/components/schemas/ScanVideos"
        issues:
          $ref: "#/components/schemas/ScanIssueCounts"
        settledAt:
          type: string
          format: date-time
          description: "Timestamp when all target videos settled; returned only for done or partial status."
        activity:
          $ref: "#/components/schemas/ScanActivity"
        state:
          type: string
          description: "Traversal state, used to refresh listings and determine whether another import can start."
          enum: [running, done, failed]
        error:
          type: string
          description: "Free-text scan failure reason; the UI builds its explanation from errorCode and errorPath instead of displaying this text."
        errorCode:
          $ref: "#/components/schemas/ScanErrorCode"
        errorPath:
          type: string
          description: "Absolute media-folder or unreadable-descendant path associated with errorCode, as untranslated user data; otherwise omitted."
        rescan:
          $ref: "#/components/schemas/ScanRescan"
    ScanRescan:
      type: object
      description: "Scope of a force rescan; omitted for any other scan. A force rescan keeps origin manual."
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/RescanScope"
        folder:
          $ref: "#/components/schemas/ScanRescanFolder"
        videoId:
          type: integer
          format: int64
          description: "The video of a video scope."
    ScanRescanFolder:
      type: object
      description: "The media folder of a folder scope, with its path when the rescan started."
      required: [id, path]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
          description: "Absolute media-folder path as untranslated user data."
    RescanScope:
      type: string
      description: "What a force rescan reads again: every media folder, one media folder or one video."
      enum: [library, folder, video]
    StartRescanRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/RescanScope"
        folderId:
          type: integer
          format: int64
          description: "Required with scope folder and refused otherwise: a media folder's id."
        videoId:
          type: integer
          format: int64
          description: "Required with scope video and refused otherwise: a video's id."
    ScanStatus:
      type: string
      description: "User-visible import status, first matching rule: failed for traversal failure; finding while counting; running while traversal or pending work remains; partial for failed issues; otherwise done."
      enum: [finding, running, done, partial, failed]

    ScanActivity:
      type: object
      description: "Current import activity, the most recently started when concurrent; omitted from Scan when idle. The SPA derives user-facing text from kind."
      required: [kind, fileName]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/ScanActivityKind"
        fileName:
          type: string
          description: "Active filename as untranslated user data."
        folder:
          $ref: "#/components/schemas/VideoFolder"
        videoId:
          type: integer
          format: int64
          description: "Video ID when already registered."

    ScanActivityKind:
      type: string
      description: "Current work: registering adds files to the catalog; probe reads metadata; thumbnail, seekThumbnail and preview generate their assets; fingerprint builds visual fingerprints to find video versions."
      enum: [registering, probe, thumbnail, seekThumbnail, preview, fingerprint]

    ScanVideos:
      type: object
      description: "Import progress; omitted while status is finding."
      required: [total, settled]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
          description: "Target count; zero means no changes."
        settled:
          type: integer
          minimum: 0
          description: "Settled count, never exceeding total."

    ScanIssueCounts:
      type: object
      description: "Issue count for the latest import, counting aggregated GET /api/scans/current/issues entries."
      required: [failed, substituted, revision]
      additionalProperties: false
      properties:
        failed:
          type: integer
          minimum: 0
          description: "Failed-severity issue count; any failure makes the import partial."
        substituted:
          type: integer
          minimum: 0
          description: "Fallback-severity issue count."
        revision:
          type: integer
          format: int64
          minimum: 0
          description: "Revision incremented whenever issue-list contents change, even with the same count; the UI refreshes the list when it changes."
    WatchHistoryFilter:
      type: string
      enum: [all, inProgress, watched]
      default: all
      description: "History filter using the video's current watch state: all, inProgress or watched, with library watch-state rules. Entries without a video appear only in all."
    WatchHistoryDates:
      type: object
      required: [days]
      additionalProperties: false
      properties:
        days:
          type: array
          description: "Days with matching entries, newest first; empty if none."
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'

    WatchHistoryPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchHistoryEntry"
        nextCursor:
          type: string
          description: "Included only when more results remain."

    WatchHistoryEntry:
      type: object
      description: "One history entry per playback. video appears only when that content is currently in the library and openable, using list shape including progress, tags and favorite; otherwise the entry cannot be played."
      required: [id, playedAt, title]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: "Identifier used for deletion and ordering equal timestamps."
        playedAt:
          type: string
          format: date-time
          description: "Playback-start timestamp, recorded by the server on that playback's first save."
        title:
          type: string
          description: "Title snapshot at playback start, possibly empty; displayed when video is absent."
        video:
          $ref: "#/components/schemas/Video"

    PlaylistStep:
      type: object
      description: "One continuous-playback video and its containing item."
      required: [itemId, video]
      additionalProperties: false
      properties:
        itemId:
          type: integer
          format: int64
        video:
          $ref: "#/components/schemas/Video"
        smartFolderId:
          type: integer
          format: int64
          description: "Folder ID only for smart-folder items, absent for video/group items; the video page adds smartFolder to the destination URL."
    PlaylistPlayback:
      type: object
      description: "Playlist playback position and next video."
      required: [playlist, itemId, position, count, playableCount]
      additionalProperties: false
      properties:
        playlist:
          $ref: "#/components/schemas/PlaylistSummary"
        itemId:
          type: integer
          format: int64
          description: "Currently playing item."
        position:
          type: integer
          description: "One-based position among visible items; zero when the current item is hidden."
        count:
          type: integer
          description: "Visible item count."
        playableCount:
          type: integer
          description: "Visible items whose starting video has a file; zero means the playlist has nothing to play."
        next:
          $ref: "#/components/schemas/PlaylistStep"
          description: "Continuous-playback step; passes over virtual videos."
        previousItem:
          $ref: "#/components/schemas/PlaylistStep"
        nextItem:
          $ref: "#/components/schemas/PlaylistStep"

    ScanIssuePage:
      type: object
      required: [scanId, items]
      additionalProperties: false
      properties:
        scanId:
          type: integer
          format: int64
          description: "Import identifier for this list; the UI refreshes if it differs from Scan.id."
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanIssue"
        nextCursor:
          type: string
          description: "Included only when more results remain."

    ScanIssue:
      type: object
      description: "One latest-import issue entry per video, or per file when unregistered."
      required: [severity, kinds, fileName, folder]
      additionalProperties: false
      properties:
        severity:
          type: string
          description: "Aggregated severity: failed if any included event is a failure."
          enum: [failed, substituted]
        kinds:
          type: array
          minItems: 1
          description: "Event kinds in severity order."
          items:
            $ref: "#/components/schemas/ScanIssueKind"
        fileName:
          type: string
          description: "Filename as untranslated user data."
        folder:
          $ref: "#/components/schemas/VideoFolder"
        videoId:
          type: integer
          format: int64
          description: "Included only for registered videos, allowing navigation to /videos/{id}."

    ScanIssueKind:
      type: string
      description: "Import issue kind: unreadable, changed_during_import and register_failed are traversal failures; *_failed means preparation exhausted retries. thumbnail_first_frame and seek_thumbnail_full_decode are fallbacks."
      enum:
        - unreadable
        - changed_during_import
        - register_failed
        - probe_failed
        - thumbnail_failed
        - seek_thumbnail_failed
        - preview_failed
        - fingerprint_failed
        - thumbnail_first_frame
        - seek_thumbnail_full_decode

    ProbeErrorCode:
      type: string
      description: "Probe failure code, returned only for probeState=failed with a stored code and never to guests. This schema is authoritative; task generate produces Go constants."
      enum:
        - file_unavailable
        - probe_unavailable
        - probe_failed
        - invalid_metadata
        - internal

    ScanErrorCode:
      type: string
      description: "Scan failure code, returned only for state=failed with a stored code. This schema is authoritative; task generate produces Go constants."
      enum:
        - media_folder_unreadable
        - media_folder_not_directory
        - location_unreadable
        - interrupted
        - internal

    ActivityKind:
      type: string
      description: "Activity record kind."
      enum:
        - import
        - scan
        - auto_tag
        - version_judgement
        - work_info_fetch
        - bundle
        - unbundle
        - make_representative
        - dismiss
        - tag_attach
        - tag_detach
        - tag_keep
        - tag_reject
        - work_info_apply
        - media_folder_remove
        - organize_undo
        - face_analysis
        - face_merge
        - assistant_run
        - pipeline
        - undo

    ActivityFeature:
      type: string
      description: "Kind grouping used for feature filters; undo belongs to the feature of the undone record."
      enum:
        - import
        - scan
        - duplicate_check
        - auto_tagging
        - work_info
        - tags
        - versions
        - media_folders
        - organize
        - face_recognition
        - assistant
      # Explicit names prevent colliding enum values from renaming existing constants.
      x-enum-varnames:
        - ActivityFeatureImport
        - ActivityFeatureScan
        - ActivityFeatureDuplicateCheck
        - ActivityFeatureAutoTagging
        - ActivityFeatureWorkInfo
        - ActivityFeatureTags
        - ActivityFeatureVersions
        - ActivityFeatureMediaFolders
        - ActivityFeatureOrganize
        - ActivityFeatureFaceRecognition
        - ActivityFeatureAssistant

    ActivityStatus:
      type: string
      description: "Record status."
      enum:
        - running
        - attention
        - done

    ActivityReason:
      type: string
      description: "Reason for running or attention records."
      enum:
        - waiting
        - processing
        - failed
        - interrupted
        - no_connection
        - undecided

    ActivityOutcome:
      type: string
      description: "Outcome of done records."
      enum:
        - completed
        - same
        - different
        - failed
        - superseded
        - decided_by_owner
        - gone
        - already_reverted
        - partial
        - stale

    ActivityDecider:
      type: string
      description: "Actor responsible for the recorded decision, otherwise the actor that started processing."
      enum:
        - rule
        - ai
        - owner
      x-enum-varnames:
        - ActivityDeciderRule
        - ActivityDeciderAi
        - ActivityDeciderOwner

    ActivityStage:
      type: string
      description: "Import stage, using jobs.kind values."
      enum:
        - probe
        - thumbnail
        - seek_thumbnail
        - preview
        - fingerprint

    ActivityPage:
      type: object
      required: [items, counts, features]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityListItem"
        nextCursor:
          type: string
          description: "Included only when more results remain."
        counts:
          $ref: "#/components/schemas/ActivityCounts"
        features:
          $ref: "#/components/schemas/ActivityFeatureCounts"

    ActivityCounts:
      type: object
      description: "Counts by status for top-level records matching every filter except status."
      required: [running, attention, done]
      additionalProperties: false
      properties:
        running:
          type: integer
        attention:
          type: integer
        done:
          type: integer

    ActivityFeatureCounts:
      type: object
      description: "Counts for all features among top-level records matching every filter except feature; a pipeline counts once under each feature that it or a matching member has."
      required:
        [
          import,
          scan,
          duplicate_check,
          auto_tagging,
          work_info,
          tags,
          versions,
          media_folders,
          organize,
          face_recognition,
          assistant,
        ]
      additionalProperties: false
      properties:
        import:
          type: integer
        scan:
          type: integer
        duplicate_check:
          type: integer
        auto_tagging:
          type: integer
        work_info:
          type: integer
        tags:
          type: integer
        versions:
          type: integer
        media_folders:
          type: integer
        organize:
          type: integer
        face_recognition:
          type: integer
        assistant:
          type: integer

    ActivityEntry:
      description: "One activity record."
      allOf:
        - $ref: "#/components/schemas/ActivityEntryFields"
      unevaluatedProperties: false

    ActivityEntryFields:
      type: object
      description: "The fields of one activity record, left open so ActivityEntry, ActivityListItem and ActivityDetail close them after adding their own."
      required:
        [
          id,
          kind,
          feature,
          status,
          decider,
          subject,
          candidate,
          retryRun,
          undoable,
          undone,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ActivityKind"
        feature:
          $ref: "#/components/schemas/ActivityFeature"
        status:
          $ref: "#/components/schemas/ActivityStatus"
        reason:
          $ref: "#/components/schemas/ActivityReason"
        outcome:
          $ref: "#/components/schemas/ActivityOutcome"
        decider:
          $ref: "#/components/schemas/ActivityDecider"
        probability:
          type: number
          format: double
          description: "Model answer for judged or inconclusive pairs and auto-tagging."
        detail:
          type: string
          description: "Untranslated provider/stage error text, tags changed by owner actions, or number of videos removed by unregistering a media folder."
        subject:
          $ref: "#/components/schemas/ActivitySubject"
        candidate:
          type: boolean
          description: "Whether the pair remains on the duplicate-candidate screen."
        stage:
          $ref: "#/components/schemas/ActivityStage"
        retryAt:
          type: string
          format: date-time
          description: "Next retry timestamp for a failed version_judgement."
        evidence:
          $ref: "#/components/schemas/VersionJudgeEvidence"
        progress:
          $ref: "#/components/schemas/ActivityProgress"
        undoes:
          $ref: "#/components/schemas/ActivityUndone"
        tags:
          type: array
          description: "Tags assigned by auto_tag."
          items:
            $ref: "#/components/schemas/ActivityTag"
        faceLinks:
          type: array
          description: "People a face_analysis record linked to its video as performers."
          items:
            $ref: "#/components/schemas/ActivityFaceLink"
        retryRun:
          type: boolean
          description: "Show retry action."
        undoable:
          type: boolean
          description: "Show undo action; auto_tag requires at least one undoable tag, face_analysis at least one undoable link."
        undone:
          type: boolean
          description: "Undone by the owner."
        replaced:
          type: boolean
          description: "Set only on a pipeline's members in ActivityDetail: a retried or reopened member kept for history."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ActivityListItem:
      description: "One top-level record of the list."
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ActivityEntryFields"
        - type: object
          properties:
            members:
              type: array
              description: "Pipeline only: member summaries in join order, replaced members included."
              items:
                $ref: "#/components/schemas/ActivityMemberSummary"

    ActivityMemberSummary:
      type: object
      description: "A pipeline member as the list shows it, without detail and tags."
      required:
        [id, kind, feature, status, decider, subject, retryRun, undoable, undone, replaced]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ActivityKind"
        feature:
          $ref: "#/components/schemas/ActivityFeature"
        subject:
          $ref: "#/components/schemas/ActivitySubject"
        status:
          $ref: "#/components/schemas/ActivityStatus"
        reason:
          $ref: "#/components/schemas/ActivityReason"
        outcome:
          $ref: "#/components/schemas/ActivityOutcome"
        decider:
          $ref: "#/components/schemas/ActivityDecider"
        probability:
          type: number
          format: double
        stage:
          $ref: "#/components/schemas/ActivityStage"
        progress:
          $ref: "#/components/schemas/ActivityProgress"
        retryAt:
          type: string
          format: date-time
        retryRun:
          type: boolean
        undoable:
          type: boolean
        undone:
          type: boolean
        replaced:
          type: boolean
          description: "A retried or reopened member kept for history."
        matched:
          type: boolean
          description: "Omitted without filters. With status only, whether the member has that status; with feature, decider, since or q, whether it satisfies all of those given (status is not applied)."
        tagCount:
          type: integer
          description: "auto_tag only: the number of tags the run added."
        faceLinks:
          type: array
          description: "face_analysis only: the people the run linked, as in ActivityEntry."
          items:
            $ref: "#/components/schemas/ActivityFaceLink"
        stages:
          type: array
          description: "import only, in ingest order; omitted when the stages were not recorded."
          items:
            $ref: "#/components/schemas/ActivityStageSummary"

    ActivityStageSummary:
      type: object
      required: [stage, state]
      additionalProperties: false
      properties:
        stage:
          $ref: "#/components/schemas/ActivityStage"
        state:
          $ref: "#/components/schemas/ActivityStageState"

    ActivityStageState:
      type: string
      description: "State of one ingest stage of an import; gone when the video was deleted or lost every location first."
      enum: [waiting, processing, done, failed, gone]

    ActivityStageRow:
      type: object
      required: [stage, state, updatedAt]
      additionalProperties: false
      properties:
        stage:
          $ref: "#/components/schemas/ActivityStage"
        state:
          $ref: "#/components/schemas/ActivityStageState"
        detail:
          type: string
          description: "The stage's last error message, untranslated."
        updatedAt:
          type: string
          format: date-time

    ActivityPipelineRef:
      type: object
      required: [id, subject, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        subject:
          $ref: "#/components/schemas/ActivitySubject"
        status:
          $ref: "#/components/schemas/ActivityStatus"
        createdAt:
          type: string
          format: date-time

    ActivityDetail:
      description: "One activity record with its full detail and probabilities, plus what the list leaves out."
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ActivityEntryFields"
        - type: object
          properties:
            members:
              type: array
              description: "Pipeline only: its members in join order, replaced members included."
              items:
                $ref: "#/components/schemas/ActivityEntry"
            pipelines:
              type: array
              description: "A member only: the pipelines it belongs to, newest first."
              items:
                $ref: "#/components/schemas/ActivityPipelineRef"
            stages:
              type: array
              description: "import with recorded stages: one row per stage the run held, in ingest order."
              items:
                $ref: "#/components/schemas/ActivityStageRow"
            stagesRecorded:
              type: boolean
              description: "import only: false for a record written before stages were recorded."

    ActivitySubject:
      type: object
      description: "Record targets, one per key: two for pairs and one otherwise."
      required: [kind, items]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [video, pair, scan, folder, person, proposal]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivitySubjectItem"

    ActivitySubjectItem:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          description: "Display-name snapshot at recording time, as untranslated user data."
        videoId:
          type: integer
          format: int64
          description: "Current video accessible to the viewer; omitted when unavailable."
        personId:
          type: integer
          format: int64
          description: "The person of a person subject, which may since have been deleted; omitted for other subjects."

    ActivityProgress:
      type: object
      description: "Current stage and completed-stage count for a running import beyond waiting."
      required: [stage, done, total]
      additionalProperties: false
      properties:
        stage:
          $ref: "#/components/schemas/ActivityStage"
        done:
          type: integer
        total:
          type: integer

    ActivityUndone:
      type: object
      description: "Kind and outcome of the record undone by this undo record, plus the tag for per-tag undo."
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/ActivityKind"
        outcome:
          $ref: "#/components/schemas/ActivityOutcome"
        tagName:
          type: string

    ActivityTag:
      type: object
      required: [id, name, suggested, probability, undone]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: "Tag-name snapshot at recording time."
        suggested:
          type: boolean
          description: "Assigned as a suggested tag."
        probability:
          type: number
          format: double
        undone:
          type: boolean
          description: "Undone by the owner."

    ActivityFaceLink:
      type: object
      required: [appearanceId, createdPerson, undone]
      additionalProperties: false
      properties:
        appearanceId:
          type: integer
          format: int64
        person:
          $ref: "#/components/schemas/CreditRef"
          description: "The linked person as now named; omitted once the person is deleted."
        createdPerson:
          type: boolean
          description: "The analysis created this provisional person."
        undone:
          type: boolean
          description: "Undone by the owner."

    ActivityUndoRequest:
      type: object
      additionalProperties: false
      properties:
        tagId:
          type: integer
          format: int64
          description: "Tag to undo on an auto_tag record; unused for other kinds."
          x-vv-entity: tag
        appearanceId:
          type: integer
          format: int64
          minimum: 1
          x-vv-entity: faceAppearance
          description: "Link to undo on a face_analysis record; omitted, every link not yet undone. Unused for other kinds."

    VideoChanged:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: "Identifier of the video whose state changed."

    PeerNode:
      type: object
      required: [id, name, version]
      additionalProperties: false
      properties:
        id:
          type: string
          description: "Node id, a UUID created on first start"
        name:
          type: string
          description: "Host name"
        version:
          type: string
          description: "Release version, as getHealth reports it; shown for reference, never compared"
    PeerLink:
      type: object
      required: [name, address, pinned]
      additionalProperties: false
      description: "The VVMDM this node reads"
      properties:
        name:
          type: string
          description: "Its host name at pairing"
        address:
          type: string
          description: "Its base URL"
        pinned:
          type: boolean
          description: "Whether a certificate fingerprint is pinned for it, so reason certificate means the certificate changed rather than one never trusted"
        version:
          type: string
          description: "Its version last seen, shown for reference"
    PeerGrant:
      type: object
      required: [name, pairedAt]
      additionalProperties: false
      description: "The VVMDM that reads this one"
      properties:
        name:
          type: string
          description: "Its host name at pairing"
        pairedAt:
          type: string
          format: date-time
    PeerState:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [unpaired, connected, unreachable, revoked]
          description: "The connection to the VVMDM this node reads; unpaired without link"
        reason:
          type: string
          enum: [network, certificate]
          description: "Present with unreachable"
        link:
          $ref: "#/components/schemas/PeerLink"
        fingerprint:
          type: string
          description: "With reason certificate: the SPKI fingerprint waiting for confirmation. Owner only."
        grant:
          $ref: "#/components/schemas/PeerGrant"
        node:
          $ref: "#/components/schemas/PeerNode"
      description: "Guests receive state and reason only; owners also receive link (while this node reads one), grant (while one reads this node) and node, this node's identity."
    PairingCode:
      type: object
      required: [code, expiresAt]
      additionalProperties: false
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    PairPeerRequest:
      type: object
      required: [address, code]
      additionalProperties: false
      properties:
        address:
          type: string
          description: "The other node's base URL, http or https, without a path"
        code:
          type: string
          description: "The code the other node's Pairing page shows"
        fingerprint:
          type: string
          description: "The SPKI fingerprint the owner confirmed after certificate_untrusted"
    UpdatePeerAddressRequest:
      type: object
      required: [address]
      additionalProperties: false
      properties:
        address:
          type: string
    PeerCertificateRequest:
      type: object
      required: [fingerprint]
      additionalProperties: false
      properties:
        fingerprint:
          type: string
          description: "The fingerprint getPeer shows, base64 SHA-256 of the certificate's SPKI"
    PairingRequest:
      type: object
      required: [code, node]
      additionalProperties: false
      properties:
        code:
          type: string
        node:
          $ref: "#/components/schemas/PeerNode"
      description: "The sender's identity; no address, because the receiver never connects to the sender."
    PairingAnswer:
      type: object
      required: [node, secret]
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/PeerNode"
        secret:
          type: string
          description: "What the sender presents to the receiver from then on: vvp_ and 43 base64url characters"
    PeerHandshake:
      type: object
      required: [node]
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/PeerNode"
    RelatedClues:
      type: object
      required: [tags, words, addedAt]
      additionalProperties: false
      description: "What the node holding a video sends so the other node can score its own videos against it; no directory."
      properties:
        fingerprint:
          $ref: "#/components/schemas/RelatedFingerprint"
        tags:
          type: array
          maxItems: 10000
          description: "Names of the video's confirmed, tentative and folder-name tags"
          items:
            type: string
        words:
          type: array
          maxItems: 10000
          description: "The words the scorer takes from the title and the file name"
          items:
            type: string
        addedAt:
          type: string
          format: date-time
    RelatedFingerprint:
      type: object
      required: [version, intervalMs, frames]
      additionalProperties: false
      properties:
        version:
          type: integer
        intervalMs:
          type: integer
          format: int64
        frames:
          type: string
          format: byte
          description: "The encoded frame hashes, as stored"
    PeerRelatedRequest:
      type: object
      required: [clues]
      additionalProperties: false
      properties:
        clues:
          $ref: "#/components/schemas/RelatedClues"
        exclude:
          type: array
          maxItems: 20000
          description: "This node's video ids to leave out: the open video and its group members when held here"
          items:
            type: integer
            format: int64
        openVideoId:
          type: integer
          format: int64
          minimum: 1
          description: "The open video, in this node's ids, when this node holds it; omit when the caller holds it. It adds the same-directory clue for this node's videos in its directory"
        cursor:
          type: string
          description: "Previous `nextCursor`; omit to start at the beginning"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
    PeerCreditMatchRequest:
      type: object
      required: [kind, entries]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [person, organization]
        entries:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PeerCreditMatchEntry"
    PeerCreditMatchEntry:
      type: object
      required: [name, externalIds]
      additionalProperties: false
      properties:
        name:
          type: string
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
    PeerCreditMatches:
      type: object
      required: [matches]
      additionalProperties: false
      properties:
        matches:
          type: array
          description: "One match per entry, in entry order, with this node's ids."
          items:
            $ref: "#/components/schemas/WorkInfoMatch"

    PeerFetchedWorkInfo:
      type: object
      required:
        [contentVersion, tags, dates, people, organizations, urls, externalIds, detailFields, samePeople]
      additionalProperties: false
      description: "The values the peer's owner chose from a fetch, narrowed to the chosen entries and values."
      properties:
        contentVersion:
          type: string
          description: "The video's contentVersion when the peer fetched for it."
        title:
          type: string
          description: "Present only when the title was chosen."
        tags:
          type: array
          description: "Normalized tag names to attach as tentative; [] keeps the tags."
          items:
            type: string
        code:
          type: string
        description:
          type: string
        dates:
          type: array
          items:
            $ref: "#/components/schemas/WorkInfoFetchedDate"
        people:
          type: array
          items:
            $ref: "#/components/schemas/PeerFetchedPerson"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/PeerFetchedOrganization"
        urls:
          type: array
          items:
            type: string
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        detailFields:
          type: array
          description: "The detail fields to write; [] keeps the work information."
          items:
            $ref: "#/components/schemas/WorkInfoField"
        samePeople:
          type: array
          description: "Pairs of a position in people and a provisional performer of the video, with this node's person id."
          items:
            $ref: "#/components/schemas/WorkInfoSamePerson"
    PeerFetchedPerson:
      type: object
      required: [role, name, externalIds]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkPersonRole"
        name:
          type: string
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        profile:
          $ref: "#/components/schemas/PersonProfile"
    PeerFetchedOrganization:
      type: object
      required: [role, name, externalIds]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/WorkOrganizationRole"
        name:
          type: string
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
    PeerFetchedPluginPerson:
      type: object
      required: [name, aliases, externalIds, items]
      additionalProperties: false
      description: "The person the peer's owner chose from a fetch, narrowed to the chosen aliases, external IDs and links."
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/Alias"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        profile:
          $ref: "#/components/schemas/PersonProfile"
        items:
          type: array
          description: "The items to write, each with a value above; aliases, externalIds and profile.links write all the values sent."
          items:
            $ref: "#/components/schemas/PersonPluginItem"

    PeerFetchedWorkInfoApplied:
      type: object
      required: [rejectedTags, skipped]
      additionalProperties: false
      properties:
        rejectedTags:
          type: array
          description: "Normalized tag names the video's rejections kept off, deduplicated in tags order."
          items:
            type: string
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedWorkInfoValue"

    PeerVocabularyRequest:
      type: object
      required: [kind, action]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [tag, person, organization]
        action:
          type: string
          enum: [rename, merge, delete]
        name:
          type: string
          description: "The current canonical name; required for rename and delete"
        newName:
          type: string
          description: "Required for rename"
        into:
          type: string
          description: "The merge destination, created when absent; required for merge"
        sources:
          type: array
          minItems: 1
          maxItems: 20000
          description: "The names merged into `into`; required for merge"
          items:
            type: string
    PeerVocabularyResult:
      type: object
      required: [changed, skipped]
      additionalProperties: false
      properties:
        changed:
          type: boolean
          description: "False when the entry is absent on this node, or no source of a merge is"
        skipped:
          type: array
          description: "The merge sources absent on this node"
          items:
            type: string
    PeerRelatedPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PeerRelatedItem"
        nextCursor:
          type: string
          description: "Value for the next cursor; omitted at the end"
    PeerRelatedItem:
      type: object
      required: [score, video]
      additionalProperties: false
      properties:
        score:
          type: integer
          format: int64
          description: "The scorer's points in millionths"
        video:
          $ref: "#/components/schemas/Video"
    SmartRuleByName:
      type: object
      additionalProperties: false
      description: "A smart folder's rule joined with its ancestors' rules into one, naming tags, kind, person and organization by canonical name, for the paired VVMDM to match its own videos. A name the node lacks matches no video; {} matches every video."
      properties:
        q:
          type: string
          maxLength: 100
          description: "Search input; the rules' inputs joined by spaces."
        tagNames:
          type: array
          maxItems: 16
          description: "Tags every matching video carries."
          items:
            type: string
            minLength: 1
        tagKindName:
          type: string
          minLength: 1
        personName:
          type: string
          minLength: 1
        organizationName:
          type: string
          minLength: 1
    SmartRuleRefName:
      type: object
      required: [kind, id, name]
      additionalProperties: false
      description: "One entity a smart rule names, with its canonical name."
      properties:
        kind:
          type: string
          enum: [tag, tagKind, person, organization]
        id:
          type: integer
          format: int64
        name:
          type: string
    PeerSmartRule:
      type: object
      required: [favorite]
      additionalProperties: false
      description: "Requests with the paired VVMDM's credential only, whatever the audience: what the paired VVMDM needs to add its own videos to this folder."
      properties:
        favorite:
          type: boolean
          description: "Whether this folder's or an ancestor's rule has favorite; the paired VVMDM then lists its own favorites matching the rule instead of this node's videos."
        match:
          $ref: "#/components/schemas/SmartRuleByName"
        sort:
          $ref: "#/components/schemas/VideoSort"
        names:
          type: array
          description: "getSmartFolder only, with sort: the entities of this folder's own rule with their names; a missing one is left out."
          items:
            $ref: "#/components/schemas/SmartRuleRefName"
    PeerRuleCountsRequest:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 60
          items:
            $ref: "#/components/schemas/SmartRuleByName"
    PeerRuleCounts:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: "In the order of rules."
          items:
            $ref: "#/components/schemas/PeerRuleCount"
    PeerRuleCount:
      type: object
      required: [videoCount, sizeBytes]
      additionalProperties: false
      properties:
        videoCount:
          type: integer
        durationMs:
          type: integer
          format: int64
          description: "Sum of known durations; omitted when none is known."
        sizeBytes:
          type: integer
          format: int64
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: "Machine-readable error code. This schema is authoritative and task generate produces Go constants; add new codes here first."
          enum:
            - not_found
            - invalid_request
            - internal
            - forbidden
            - conflict
            - invalid_media_directory
            - unsupported_media_directory
            - media_folder_not_found
            - overlapping_media_directories
            - scan_in_progress
            - media_folders_not_configured
            - directory_unavailable
            - probe_not_failed
            - open_unavailable
            - file_missing
            - tag_not_found
            - tag_name_taken
            - tag_merge_required
            - tag_not_tentative
            - unauthenticated
            - invalid_credentials
            - login_throttled
            - account_already_configured
            - provider_failed
            - plugin_too_large
            - plugin_changed
            - plugin_unusable
            - plugin_not_approved
            - plugin_settings_missing
            - plugin_failed
            - plugin_timed_out
            - plugin_busy
            - plugin_kind_mismatch
            - operation_unsupported
            - work_info_fetch_stale
            - person_external_id_missing
            - person_link_ambiguous
            - person_link_unsupported
            - work_info_link_unsupported
            - plugin_builtin
            - link_order_changed
            - invalid_smart_rule
            - smart_folder_not_found
            - smart_folder_cycle
            - activity_not_retryable
            - activity_not_undoable
            - ollama_unreachable
            - proposal_not_pending
            - assistant_not_ready
            - assistant_unavailable
            - service_unavailable
        message:
          type: string
          description: "English explanation for API clients and unknown-code fallback; the UI derives text from code and reason."
        reason:
          $ref: "#/components/schemas/ErrorReason"
        limit:
          type: integer
          description: "Reason limit, included only for reasons whose contract specifies a limit."
        field:
          type: string
          description: "JSON property path using dots and array indices, such as aliases[0].language, externalIds[1] or parentId; only for work_info_*, person_not_found, organization_not_found or external_id_taken."
        tagName:
          type: string
          description: "Conflicting tag's original name as untranslated user data; only for tag_name_taken and tag_merge_required."
        pluginMessage:
          type: string
          description: "First 300 characters of the plugin's untranslated error message; may appear only for plugin_failed."
        host:
          type: string
          description: "Host that rejected or could not receive a plugin request; only for blocked_address or network_error reasons."
        settingKeys:
          type: array
          description: "Required setting keys without values, in declaration order; only for plugin_settings_missing."
          items:
            type: string
        fingerprint:
          type: string
          description: "Base64 SHA-256 of the certificate's SPKI; for certificate_untrusted and fingerprint_changed."
        links:
          type: array
          description: "The person's links the plugin handles, with links that differ only in scheme, host case or a trailing slash kept once, in stored order; only for person_link_ambiguous."
          items:
            type: string
        proposal:
          $ref: "#/components/schemas/AssistantProposal"
