# vv の API 契約。このファイルが唯一の真実であり、Go（oapi-codegen）と
# TypeScript（openapi-typescript）の双方をここから生成する。
# 生成物（internal/httpapi/gen/、web/src/api/gen/）は手編集しない。
# 型を変えるときはこのファイルを直し、make generate を実行すること。
openapi: 3.1.0

info:
  title: MDM API
  version: 0.1.0
  summary: セルフホストの動画管理システム API
  description: |
    Phase 0（骨組み）の時点で公開する経路は稼働確認の1本だけである。
    動画の一覧・配信は Phase 1 以降で追加する。

servers:
  - url: /
    description: アプリケーション自身が配信する

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 稼働状態とビルド情報を返す
      description: |
        認証を必要としない。外形監視とコンテナのヘルスチェックから参照される。
        データベースへ疎通できない場合も応答自体は返し、`status` で区別する。
      responses:
        "200":
          description: 稼働中。依存する保存層にも疎通できている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
                    version: dev
                    commit: 9f1c2ab3d4e5f60718293a4b5c6d7e8f90a1b2c3
                    builtAt: 2026-09-12T04:21:07Z
        "503":
          description: 起動はしているが保存層に疎通できていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                degraded:
                  value:
                    status: degraded
                    version: dev

components:
  schemas:
    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok = 保存層まで疎通、degraded = プロセスのみ生存
        version:
          type: string
          description: リリース名。ビルド時に指定されなければ dev
          examples: [dev, "0.1.0"]
        commit:
          type: string
          description: ビルド元のコミット。取得できない場合は省略される
        builtAt:
          type: string
          format: date-time
          description: ビルド時刻。取得できない場合は省略される

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 機械可読なエラー種別
          examples: [not_found, invalid_request, internal]
        message:
          type: string
          description: 人が読むための説明。利用者にそのまま提示してよい文言にする
