# Generate Go bindings from external-v1.yaml using the version in tools/go.mod.
# Edit the schema, never generated files; the UI does not use this API, so no TypeScript is generated.
package: extgen
output: internal/httpapi/extgen/api.gen.go
output-options:
  skip-prune: true
generate:
  models: true
  std-http-server: true
