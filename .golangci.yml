  exclusions:
    generated: lax
    rules:
      # Allow Japanese test names, expected values and user data.
      - path: _test\.go$
        linters:
          - gosmopolitan
      # Developer scripts do not emit distributed service output.
      - path: ^scripts/
        linters:
          - gosmopolitan
      # Exclude generated files, which must not be hand-edited.
      - path: internal/httpapi/(ext)?gen/
        linters:
          - depguard
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - rowserrcheck
          - sqlclosecheck
          - errorlint
          - contextcheck

formatters:
  enable:
    - gofmt
