                依存は cmd → internal/{app,httpapi,store,media,mediafs,artifacts,opener,scanner,jobs,eventbus,password,desktop,watcher,ollama,comfyui,wasmplugin} →
                internal/domain の一方向だけである（ARCHITECTURE.md）。
            - pkg: github.com/syudead/vv/internal/opener
