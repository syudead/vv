# golangci-lint v2 format; tools/go.mod pins the version.
version: "2"

linters:
  default: standard
  enable:
    # Enforce dependency direction from ARCHITECTURE.md.
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Reject silent partial success when row iteration fails.
    - rowserrcheck
    # Require row cleanup across early returns.
    - sqlclosecheck
    # Preserve wrapped causes for errors.Is.
    - errorlint
    # Require context propagation; scripts/nolintguard rejects suppression directives.
    - contextcheck

    # Keep service errors, logs and operational output in English; AST string checks exclude comments.
    - gosmopolitan

    # Require t.Helper so failures point to the caller.
    - thelper
    # Use testing cleanup helpers. Keep context replacements disabled: t.Context cancels before t.Cleanup and would change tests whose cleanup still uses that context.
    - usetesting
    # Do not require t.Parallel: tests share environment and package state, while Go already runs packages in separate parallel processes.

  settings:
    gosmopolitan:
      watch-for-scripts:
        - Han
        - Hiragana
        - Katakana
      allow-time-local: true
    depguard:
      rules:
        # purego makes a binary ask for glibc's loader, and mdm must start on Alpine; only the face helper may load native code.
        only-the-face-helper-loads-native-code:
          files:
            - $all
            - "!**/cmd/mdm-face/*.go"
            - "!**/internal/faceinfer/*.go"
          deny:
            - pkg: github.com/ebitengine/purego
              desc: >-
                purego を import できるのは cmd/mdm-face と internal/faceinfer だけである。
                purego を含むバイナリは glibc の動的ローダーを要求し、Alpine の Docker イメージで
                mdm が起動しなくなる（docs/design-docs/face-recognition.md）。
            - pkg: github.com/syudead/vv/internal/faceinfer
              desc: >-
                internal/faceinfer を import できるのは cmd/mdm-face だけである。推論は補助プロセスで
                行い、mdm は internal/faceproto で補助プロセスと話す（docs/design-docs/face-recognition.md）。

        # Domain is the dependency leaf: no external I/O or sibling internal packages. Violations report the deny description below.
        domain-is-the-end-of-the-dependency-chain:
          files:
            - "**/internal/domain/*.go"
          deny:
            - pkg: net/http
              desc: >-
                internal/domain から net/http を import してはならない。ドメインモデルは
                転送方式を知らない。HTTP に関わる処理は internal/httpapi に置くこと
                （ARCHITECTURE.md "Intended dependency direction"）。
            - pkg: database/sql
              desc: >-
                internal/domain から database/sql を import してはならない。ドメインモデルは
                永続化の手段を知らない。SQL は internal/store に置くこと
                （ARCHITECTURE.md "Intended dependency direction"）。
            - pkg: os$
              desc: >-
                internal/domain から os を import してはならない。ファイルシステムに
                触れる確かめは internal/mediafs などのアダプタに置き、domain にはパスの
                包含のような純粋な判定だけを置くこと（ARCHITECTURE.md "Intended dependency direction"）。
            - pkg: os/exec
              desc: >-
                internal/domain から os/exec を import してはならない。外部コマンドの実行は
                internal/media（ffmpeg／ffprobe）と internal/opener（OS の既定アプリ）に
                閉じ込めること（ARCHITECTURE.md "Intended dependency direction"）。
            - pkg: modernc.org/sqlite
              desc: >-
                internal/domain から SQLite ドライバを import してはならない。特定の
                データベースへの依存は internal/store に閉じ込めること
                （ARCHITECTURE.md "Intended dependency direction"）。
            - pkg: github.com/syudead/vv/internal/httpapi
              desc: >-
                internal/domain から他の internal パッケージを import してはならない。
                依存は cmd → internal/{app,httpapi,store,media,mediafs,artifacts,opener,scanner,jobs,eventbus,password,desktop,watcher,ollama,comfyui,wasmplugin} →
                internal/domain の一方向だけである（ARCHITECTURE.md）。
            - pkg: github.com/syudead/vv/internal/store
              desc: >-
                internal/domain から他の internal パッケージを import してはならない。
                依存は cmd → internal/{app,httpapi,store,media,mediafs,artifacts,opener,scanner,jobs,eventbus,password,desktop,watcher,ollama,comfyui,wasmplugin} →
                internal/domain の一方向だけである（ARCHITECTURE.md）。
            - pkg: github.com/syudead/vv/internal/media
              desc: >-
