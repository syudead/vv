version: "3"

# 込み入った処理は scripts/ の Go プログラムに置く。Go と Node は全員が既に
# 持っているので、検査のためだけに別のランタイムを足さない。
tasks:
  default:
    cmds:
      - task: help

  help:
    desc: List available developer commands.
    cmds:
      - task --list
    silent: true

  doctor:
    desc: Check the local development environment.
    cmds:
      - go run ./scripts/doctor

  setup:
    desc: Download dependencies and warm local tool caches.
    cmds:
      - go mod download
      - go -C tools mod download
      # web-deps 越しではなく直接呼ぶ。setup は「入れ直す」入口なので、
      # 最新かどうかの判定で飛ばしてはいけない。
      - npm --prefix web ci
      - npm --prefix tools ci
      - task: golangci
        vars: { GOLANGCI_ARGS: "--version" }
      - go -C tools tool air -v
      - go -C tools tool oapi-codegen -version
      - go build ./...

  up:
    desc: Build and run the Docker Compose app.
    cmds:
      - docker compose up --build

  down:
    desc: Stop the Docker Compose app.
    cmds:
      - docker compose down --remove-orphans

  dev:
    desc: Run the Go server with hot reload and the Vite development server.
    cmds:
      - go run ./scripts/dev

  preview:
    desc: Build vv and run it with generated sample videos (used by Codespaces).
    cmds:
      - go run ./scripts/preview

  build:
    desc: Build the SPA and the single Go binary.
    cmds:
      - go run ./scripts/build

  generate:
    desc: Generate Go and TypeScript types from OpenAPI.
    cmds:
      - go run ./scripts/generate

  fmt:
    desc: Format Go and Web sources.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "fmt" }
      - npm --prefix web run format

  lint:
    desc: Run all static analysis.
    cmds:
      - task: lint-go
      - task: lint-web

  test:
    desc: Run Go and Web tests.
    cmds:
      - task: test-go
      - task: test-web

  check:
    desc: Run every check that does not require a browser.
    cmds:
      - task: fmt-check
      - task: lint
      - task: test
      - task: generate-check
      - task: migrations-check
      - task: build-windows-check
      - 'echo "check: all checks passed (browser checks are in task test-e2e)"'

  check-docs:
    desc: Check documentation links and repository artifact rules.
    cmds:
      # 文書一覧は git ls-files から得るため、Go の成功キャッシュを再利用しない。
      - go test -count=1 ./scripts/sddguard

  fmt-check:
    desc: Check Go and Web formatting without changing files.
    cmds:
      - task: fmt-check-go
      - task: fmt-check-web

  fmt-check-go:
    desc: Check Go formatting.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "fmt --diff" }

  fmt-check-web:
    desc: Check Web formatting.
    cmds:
      - npm --prefix web run format:check

  lint-go:
    desc: Run golangci-lint, including dependency rules.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "run" }

  lint-web:
    desc: Run Web static analysis.
    cmds:
      - npm --prefix web run lint

  test-go:
    desc: Run Go tests.
    cmds:
      - go test ./...

  test-web:
    desc: Run the Web build check and unit tests.
    cmds:
      - npm --prefix web run test

  test-e2e:
    desc: Run browser end-to-end tests through Go and Vite.
    cmds:
      - npm --prefix web run test:e2e

  generate-check:
    desc: Check that committed generated files match OpenAPI.
    cmds:
      - go run ./scripts/generate -check

  migrations-check:
    desc: Check that applied migrations have not been changed.
    cmds:
      - bash scripts/migrations-immutable.sh

  # Windows でしか使わないコード（scripts/dev/procgroup_windows.go）は、
  # 手元の GOOS では型検査すらされない。壊れたことに気付く口をここに置く。
  build-windows-check:
    desc: Check that the sources still build for Windows.
    env:
      GOOS: windows
      CGO_ENABLED: 0
    cmds:
      - go build ./...

  # golangci-lint は run と fmt の両方で使う。版は tools/go.mod が
  # 単一の出どころなので、呼び出しもここ1か所に寄せる。
  golangci:
    internal: true
    vars:
      GOLANGCI:
        sh: go -C tools tool -n golangci-lint
    cmds:
      - '"{{.GOLANGCI}}" {{.GOLANGCI_ARGS}}'
