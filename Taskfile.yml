version: "3"

# Keep complex commands in scripts/; reuse Go and Node instead of adding runtimes.
vars:
  GO_PACKAGES: '{{.GO_PACKAGES | default "./..."}}'
  WEB_FILES: '{{.WEB_FILES | default "."}}'
  WEB_TESTS: '{{.WEB_TESTS | default ""}}'

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: List available developer commands.
    cmds:
      - task --list
    silent: true

  doctor:
    desc: Check the local development environment.
    cmds:
      - go run ./scripts/doctor

  setup:
    desc: Download dependencies and warm local tool caches.
    # Keep .claude/hooks/session-start.sh in sync with these setup steps.
    cmds:
      - go mod download
      - go -C tools mod download
      # Setup explicitly reinstalls dependencies, even when caches are warm.
      - npm --prefix web ci
      - npm --prefix tools ci
      - npm --prefix docs-site ci
      - task: golangci
        vars: { GOLANGCI_ARGS: "--version" }
      - go -C tools tool air -v
      - go -C tools tool oapi-codegen -version
      - go build ./...

  up:
    desc: Build and run the Docker Compose app.
    # The image excludes .git; pass the same revision and timestamp that Go embeds locally.
    env:
      VV_COMMIT:
        sh: git rev-parse HEAD 2>/dev/null || true
      VV_BUILT_AT:
        sh: git log -1 --format=%cI 2>/dev/null || true
    cmds:
      - docker compose up --build

  down:
    desc: Stop the Docker Compose app.
    cmds:
      - docker compose down --remove-orphans

  dev:
    desc: Run the Go server with hot reload and the Vite development server.
    cmds:
      - go run ./scripts/dev

  preview:
    desc: Build VVMDM and run it with generated sample videos (used by Codespaces).
    cmds:
      - go run ./scripts/preview

  build:
    desc: Build the SPA and the single Go binary.
    cmds:
      - go run ./scripts/build

  build-windows-app:
    desc: Build the Windows app zip (dist/VVMDM-<version>-windows-amd64.zip) with the bundled FFmpeg.
    # VERSION overrides the default sha-<12 digits>.
    cmds:
      - go run ./scripts/build -windows-app

  docs:
    desc: Serve the documentation site (docs/ and ARCHITECTURE.md) locally with live reload.
    cmds:
      - npm --prefix docs-site run dev

  docs-build:
    desc: Build the documentation site into docs-site/.vitepress/dist, as CI does.
    cmds:
      - npm --prefix docs-site run build

  generate:
    desc: Generate Go and TypeScript types from OpenAPI.
    cmds:
      - go run ./scripts/generate

  fmt:
    desc: Format Go and Web sources.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "fmt" }
      - npm --prefix web run format

  lint:
    desc: Run all static analysis.
    cmds:
      - task: lint-go
      - task: lint-web

  test:
    desc: Run Go and Web tests.
    cmds:
      - task: test-go
      - task: test-web

  check:
    desc: Run local formatting, lint and tests (SCOPE=all|go|web|docs).
    vars:
      SCOPE: '{{.SCOPE | default "all"}}'
    requires:
      vars:
        - name: SCOPE
          enum: [all, go, web, docs]
    cmds:
      - task: check-{{.SCOPE}}

  check-all:
    desc: Run local Go and Web checks; CI runs repository and build checks separately.
    cmds:
      - task: check-go
      - task: check-web

  check-go:
    desc: Check Go formatting, lint and tests (GO_PACKAGES defaults to ./...).
    cmds:
      - task: fmt-check-go
      - task: lint-go
      - task: test-go

  check-web:
    desc: Check Web formatting, types, lint and tests (WEB_FILES and WEB_TESTS narrow the scope).
    cmds:
      - task: fmt-check-web
      - task: lint-web
      - task: test-web-unit

  check-ci:
    desc: Reproduce the repository and build checks normally left to CI.
    cmds:
      - task: generate-check
      - task: migrations-check
      - task: e2e-groups-check
      - task: lint-go-windows-desktop
      - task: build-windows-check
      - task: static-binary-check
      - task: build-check-web

  check-docs:
    desc: Check documentation links and repository artifact rules.
    cmds:
      # Document discovery uses git ls-files, which the Go test cache does not track.
      - go test -count=1 ./scripts/sddguard

  fmt-check:
    desc: Check Go and Web formatting without changing files.
    cmds:
      - task: fmt-check-go
      - task: fmt-check-web

  fmt-check-go:
    desc: Check Go formatting.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "fmt --diff {{.GO_PACKAGES}}" }

  fmt-check-web:
    desc: Check Web formatting (WEB_FILES is relative to web/).
    dir: web
    cmds:
      - npm exec -- prettier --check {{.WEB_FILES}}

  lint-go:
    desc: Run golangci-lint, including dependency rules, and reject //nolint.
    cmds:
      - task: golangci
        vars: { GOLANGCI_ARGS: "run {{.GO_PACKAGES}}" }
      - go run ./scripts/nolintguard

  lint-go-windows-desktop:
    desc: Run golangci-lint on the Windows desktop build (VVMDM.exe).
    # Host lint cannot see Windows-only or desktop-tagged sources.
    cmds:
      - task: golangci
        vars:
          # Resolve the host linter binary before setting the target OS.
          GOLANGCI_ENV: "GOOS=windows CGO_ENABLED=0"
          GOLANGCI_ARGS: "run --build-tags desktop"

  lint-web:
    desc: Check all Web types and lint WEB_FILES (relative to web/).
    dir: web
    cmds:
      - npm run typecheck
      - npm exec -- tsc --noEmit -p tsconfig.e2e.json
      - npm exec -- eslint --max-warnings 0 --no-warn-ignored {{.WEB_FILES}}

  test-go:
    desc: Run Go tests.
    cmds:
      - go test {{.GO_PACKAGES}}

  test-go-report:
    desc: Run Go tests and write coverage and JUnit reports under reports/ (CI sends them to Codecov).
    vars:
      GOTESTSUM:
        sh: go -C tools tool -n gotestsum
    cmds:
      - mkdir -p reports
      - '"{{.GOTESTSUM}}" --junitfile reports/go-junit.xml --format pkgname -- -coverprofile=reports/go-coverage.out ./...'

  test-web:
    desc: Run the Web build check and unit tests.
    # CI builds once and shards Vitest separately.
    cmds:
      - task: build-check-web
      - task: test-web-unit

  build-check-web:
    desc: Check that the SPA builds.
    cmds:
      - npm --prefix web run build:check

  test-web-unit:
    desc: Run the Web unit tests without the build check.
    cmds:
      - npm --prefix web run test:unit -- {{.WEB_TESTS}} {{.CLI_ARGS}}

  test-web-report:
    desc: Run the Web unit tests and write coverage and JUnit reports under reports/ (CI sends them to Codecov).
    cmds:
      - npm --prefix web run test:unit -- --coverage --coverage.reportsDirectory=../reports/web-coverage --reporter=default --reporter=junit --outputFile.junit=../reports/web-junit.xml {{.CLI_ARGS}}

  quality-metrics:
    desc: Write the complexity of every function and the duplicated code under reports/quality/.
    deps: [complexity-go, complexity-web, duplication]

  complexity-go:
    desc: Write the cyclomatic complexity of every Go function (gocyclo) to reports/quality/complexity-go/.
    vars:
      GOCYCLO:
        sh: go -C tools tool -n gocyclo
    cmds:
      - mkdir -p reports/quality/complexity-go
      - '"{{.GOCYCLO}}" -avg -ignore "(^|/)(gen|extgen|node_modules|worktrees|reports|testdata|\.claude|\.local)/|_test\.go$" . > reports/quality/complexity-go/gocyclo.txt'

  complexity-web:
    desc: Write the cyclomatic complexity of every Web function (the ESLint complexity rule) to reports/quality/complexity-web/.
    cmds:
      - mkdir -p reports/quality/complexity-web
      # A zero threshold reports the complexity of every function.
      - 'cd web && npx eslint --rule "complexity: [warn, 0]" --format json --output-file ../reports/quality/complexity-web/eslint.json src'

  duplication:
    desc: Write the duplicated Go and Web code (jscpd) to reports/quality/duplication/.
    cmds:
      - >-
        node tools/node_modules/jscpd/bin/jscpd .
        --format go,typescript,tsx,javascript
        --ignore "**/node_modules/**,**/dist/**,**/gen/**,**/extgen/**,docs-site/**,worktrees/**,.claude/**,web/registry/**,media/**,**/testdata/**,**/*.d.ts,reports/**,tools/**"
        --gitignore --reporters json --output reports/quality/duplication --silent

  # Web mutation testing awaits the fix for stryker-mutator/stryker-js#6210.
  mutation:
    desc: Run mutation testing and write reports under reports/mutation/ (CI runs it monthly).
    cmds:
      - task: mutation-go

  mutation-go:
    desc: Run gremlins on the Go domain packages and write reports/mutation/go/gremlins.json.
    # Gremlins accepts one package root per run; consider CI duration before expanding it.
    vars:
      GREMLINS:
        sh: go -C tools tool -n gremlins
      MUTATION_GO_DIR: '{{.MUTATION_GO_DIR | default "./internal/domain"}}'
    # Disable cached baseline timing and allow compilation time for each mutant.
    env:
      GOFLAGS: -count=1
    cmds:
      - mkdir -p reports/mutation/go
      - '"{{.GREMLINS}}" unleash --timeout-coefficient 10 --output reports/mutation/go/gremlins.json {{.CLI_ARGS}} {{.MUTATION_GO_DIR}}'

  test-e2e:
    desc: Run browser end-to-end tests through Go and Vite.
    cmds:
      # Arguments after -- go to Playwright, e.g. task test-e2e -- e2e/tags.e2e.ts.
      - npm --prefix web run test:e2e -- {{.CLI_ARGS}}

  generate-check:
    desc: Check that committed generated files match OpenAPI.
    cmds:
      - go run ./scripts/generate -check

  migrations-check:
    desc: Check that applied migrations have not been changed.
    cmds:
      - bash scripts/migrations-immutable.sh

  e2e-groups-check:
    desc: Check that every e2e file is in exactly one CI e2e group.
    cmds:
      - bash scripts/e2e-groups.sh

  build-windows-check:
    desc: Check that the sources still build for Windows.
    env:
      GOOS: windows
      CGO_ENABLED: 0
    cmds:
      - go build ./...
      - go build -tags desktop -ldflags "-H=windowsgui" -o {{if eq OS "windows"}}NUL{{else}}/dev/null{{end}} ./cmd/mdm

  static-binary-check:
    desc: Check that the Linux mdm has no INTERP header, so it starts in the Alpine image.
    cmds:
      - go run ./scripts/build -check-static

  # Resolve the pinned linter from tools/go.mod for both run and fmt.
  golangci:
    internal: true
    vars:
      GOLANGCI:
        sh: go -C tools tool -n golangci-lint
    cmds:
      - '{{.GOLANGCI_ENV}} "{{.GOLANGCI}}" {{.GOLANGCI_ARGS}}'
